name: Clean up merged branches

# Manual only, dry run by default. Deletes branches whose PR was merged and whose tip is exactly the merged
# commit. Branches with an open PR, that an open PR targets as its base (stacked PRs), closed-unmerged or
# with no PR, main and social-ledger are always kept. Rules: scripts/lib/branch-cleanup.mjs.
# Deleted branches can be restored from their merged PR ("Restore branch").
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to actually delete (otherwise dry run)'
        required: false
        default: "no"
      scope:
        description: "incoming = editorial incoming/** branches only; all = every merged branch"
        type: choice
        options: [incoming, all]
        default: incoming

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/cleanup-merged-branches.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONFIRM_DELETE: ${{ inputs.confirm }}
          CLEANUP_SCOPE: ${{ inputs.scope }}
