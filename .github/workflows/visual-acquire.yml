name: Acquire editorial visual

# Every incoming story gets one conservative real-image pass before it can auto-publish.
# A high-confidence, openly licensed Wikimedia photo may replace the newsroom AI SVG.
# If no candidate clears the threshold, the existing illustration remains the safe fallback.
on:
  push:
    branches:
      - "incoming/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: visual-acquire-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Find this branch's article
        id: article
        shell: bash
        run: |
          git fetch origin main --depth=1
          mapfile -t files < <(git diff --name-only --diff-filter=A origin/main...HEAD | grep -E '^src/content/articles/[a-z0-9-]+\.md$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No article added yet; this can be the branch/image-first push."
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Incoming branch must add exactly one article; found ${#files[@]}."
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"
      - name: Acquire licensed real image when safe
        if: steps.article.outputs.path != ''
        run: node scripts/visual/acquire.mjs --apply "${{ steps.article.outputs.path }}"
      - name: Commit visual upgrade
        id: commit
        if: steps.article.outputs.path != ''
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No visual replacement: existing illustration/fallback remains."
            echo "changed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "Nuvellum Visual Engine"
          git config user.email "actions@users.noreply.github.com"
          git add "${{ steps.article.outputs.path }}" public/uploads/articles public/generated/ai 2>/dev/null || true
          git commit -m "visual: acquire licensed editorial image"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: Dispatch required checks for the new visual commit
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          for workflow in visual-acquire.yml build.yml security.yml codeql.yml editorial-duplicate-guard.yml; do
            echo "Dispatching $workflow on $REF"
            curl --fail-with-body -sS               -X POST               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPO/actions/workflows/$workflow/dispatches"               -d "{"ref":"$REF"}"
          done
