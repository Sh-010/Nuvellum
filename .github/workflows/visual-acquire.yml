name: Acquire editorial visual

# Every incoming story gets one conservative real-image pass before it can auto-publish.
# A high-confidence, openly licensed Wikimedia photo may replace newsroom fallback art.
# If no photo clears the threshold, ordinary News becomes text-led; eligible analysis/opinion may retain illustration.
on:
  push:
    branches:
      - "incoming/**"
  workflow_dispatch:
    inputs:
      refresh_checks:
        description: "Push an empty commit (deploy key) so required checks re-run and attach to the PR"
        type: boolean
        default: false

# Why a deploy key: a commit pushed with GITHUB_TOKEN fires no push workflows, and checks started by
# workflow_dispatch are never linked to the pull request, so branch protection on main kept every story
# with a new photo blocked (seen in the 2026-10-01 rehearsal: PRs #204-#207). A push made with the
# repository deploy key (secret NUVELLUM_DEPLOY_KEY) is an ordinary push: Build, Security, CodeQL and the
# duplicate guard run on it and attach to the PR. Without the key the old dispatch fallback is kept.

permissions:
  contents: write
  actions: write

concurrency:
  group: visual-acquire-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # Secrets cannot appear in step conditions; expose only whether the key exists.
      HAS_DEPLOY_KEY: ${{ secrets.NUVELLUM_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          ssh-key: ${{ secrets.NUVELLUM_DEPLOY_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Find this branch's article
        id: article
        shell: bash
        run: |
          # An editor reviewed this story in the admin dashboard (commit subject "editor: ..."). The visual
          # decision in that commit is the editor's, so the automated image pass must not overwrite it.
          if git log -1 --format=%s | grep -q '^editor: '; then
            echo "Editor-reviewed commit: keeping the editor's visual decision."
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main --depth=1
          mapfile -t files < <(git diff --name-only --diff-filter=A origin/main...HEAD | grep -E '^src/content/articles/[a-z0-9-]+\.md$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No article added yet; this can be the branch/image-first push."
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Incoming branch must add exactly one article; found ${#files[@]}."
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"
      - name: Acquire licensed real image when safe
        if: steps.article.outputs.path != ''
        run: node scripts/visual/acquire.mjs --apply "${{ steps.article.outputs.path }}"
      - name: Commit visual upgrade
        id: commit
        if: steps.article.outputs.path != ''
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No visual file change required after acquisition/text-led policy pass."
            echo "changed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "Nuvellum Visual Engine"
          git config user.email "actions@users.noreply.github.com"
          git add "${{ steps.article.outputs.path }}" public/uploads/articles public/generated/ai 2>/dev/null || true
          git commit -m "visual: acquire licensed editorial image"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: Re-run required checks on demand (deploy key)
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_checks && steps.commit.outputs.changed != '1'
        shell: bash
        run: |
          [ "$HAS_DEPLOY_KEY" = "true" ] || { echo "::error::NUVELLUM_DEPLOY_KEY is not configured"; exit 1; }
          git config user.name "Nuvellum Visual Engine"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "ci: re-run required checks for publication"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Dispatch required checks for the new visual commit (no deploy key)
        if: steps.commit.outputs.changed == '1' && env.HAS_DEPLOY_KEY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          for workflow in visual-acquire.yml build.yml security.yml codeql.yml editorial-duplicate-guard.yml; do
            echo "Dispatching $workflow on $REF"
            payload=$(printf '{"ref":"%s"}' "$REF")
            curl --fail-with-body -sS -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -d "$payload" "https://api.github.com/repos/$REPO/actions/workflows/$workflow/dispatches"
          done
