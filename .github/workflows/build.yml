name: Build Nuvellum
on:
  # incoming/** pushes come from n8n with its own credential, so they trigger
  # workflows normally. PRs opened with GITHUB_TOKEN do not trigger
  # pull_request workflows, so checks must not depend on pull_request alone.
  push:
    branches:
      - main
      - "incoming/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Build must not modify tracked files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::The build changed or created files outside ignored build folders."
            exit 1
          fi
