name: Auto-open editorial PR

on:
  push:
    branches:
      - "incoming/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    if: startsWith(github.ref, 'refs/heads/incoming/')
    runs-on: ubuntu-latest
    steps:
      - name: Open PR for committed article
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');

            const files = [
              ...(context.payload.head_commit?.added || []),
              ...(context.payload.head_commit?.modified || [])
            ];
            const articlePath = files.find((p) => /^src\/content\/articles\/.*\.md$/.test(p));

            // Image-only commit in the same incoming branch: wait for the article commit.
            if (!articlePath) {
              core.info('No article file in this push; nothing to open yet.');
              return;
            }

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: owner + ':' + branch,
              base: 'main'
            });
            if (existing.data.length) {
              core.info('PR already exists for ' + branch);
              return;
            }

            const file = await github.rest.repos.getContent({
              owner,
              repo,
              path: articlePath,
              ref: context.sha
            });

            const markdown = Buffer.from(file.data.content, 'base64').toString('utf8');
            const frontmatter = markdown.split('---')[1] || '';

            const value = (key) => {
              const m = frontmatter.match(new RegExp('^' + key + ':\\s*"?(.*?)"?\\s*$', 'm'));
              return m ? m[1].replace(/^"|"$/g, '') : '';
            };
            const sourceMatch = frontmatter.match(/^sourceUrls:\s*\["([^"]+)"/m);

            const title = value('title') || articlePath.split('/').pop().replace(/\.md$/, '').replace(/-/g, ' ');
            const risk = value('risk') || 'low';
            const status = value('status') || 'review';
            const source = sourceMatch ? sourceMatch[1] : '';

            const sensitive = risk === 'sensitive' || status === 'review';
            const reviewNote = sensitive
              ? '⚠️ Sensitive story: keep this PR unmerged until a human editor verifies the sourcing and approves publication.'
              : 'Low-risk candidate: merging this PR publishes the article after repository checks pass.';

            await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base: 'main',
              title: 'Editorial: ' + title,
              body: [
                'Automated Nuvellum editorial candidate.',
                '',
                '**Risk:** ' + risk,
                '**Proposed status:** ' + status,
                '**Source:** ' + source,
                '',
                reviewNote,
                '',
                'This PR was opened by Nuvellum repository automation after n8n committed the article branch.'
              ].join('\n')
            });
