name: Auto-open editorial PR

# Opens, or corrects, the editorial PR for an incoming/** branch.
# Title and body come from the article the branch adds relative to main,
# read at the pushed commit (scripts/open-editorial-pr.mjs). The script runs
# from the default branch, never from branch code.

on:
  push:
    branches:
      - "incoming/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: open-editorial-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pr:
    if: startsWith(github.ref, 'refs/heads/incoming/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Open or correct the PR from this branch's article
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/open-editorial-pr.mjs
