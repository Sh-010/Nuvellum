name: Security checks

on:
  push:
    branches:
      - main
      - "incoming/**"
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # incoming/** pushes are grouped per commit: n8n pushes art and article within a second,
  # and a per-branch group could cancel the article commit's checks (the gate needs them).
  group: security-${{ github.event_name }}-${{ startsWith(github.ref, 'refs/heads/incoming/') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependency-and-content-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-fund
      - run: npm audit --audit-level=high
      - run: npm run validate
      - run: npm run build
      - name: Build must not modify tracked files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::The build changed or created files outside ignored build folders."
            exit 1
          fi
