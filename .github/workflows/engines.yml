name: Engines tests

# Distribution + Shorts engines. Separate from the site: not a required
# publication check, and engine failures can never block an article.
on:
  push:
    branches: [main]
    paths: ["engines/**", ".github/workflows/engines.yml"]
  pull_request:
    branches: [main]
    paths: ["engines/**", ".github/workflows/engines.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng
      - run: npm ci --no-audit --no-fund
      - run: npx playwright-core install chromium
      - run: npm test
