name: Distribute published story

# Runs AFTER a story is on main. Completely separate from publication:
# failures here are reported but never affect the site.
# - push to main that adds articles (human merges)
# - workflow_dispatch from the publication gate (its GITHUB_TOKEN merges do
#   not trigger push workflows) or by hand
# Dry run unless the repository variable DISTRIBUTION_LIVE is "on".
on:
  push:
    branches: [main]
    paths: ["src/content/articles/**"]
  workflow_dispatch:
    inputs:
      slug:
        description: "Article slug to distribute"
        required: true
      render_short:
        description: "Render a Short for video platforms"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: distribution
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find new stories
        id: stories
        env:
          SLUG_INPUT: ${{ inputs.slug }}
        run: |
          if [ -n "$SLUG_INPUT" ]; then
            if ! printf '%s' "$SLUG_INPUT" | grep -Eq '^[a-z0-9]+(-[a-z0-9]+)*$'; then echo "::error::invalid slug"; exit 1; fi
            echo "slugs=$SLUG_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "slugs=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- src/content/articles | sed 's#.*/##;s#\.md$##' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi
      - name: Install engines
        if: steps.stories.outputs.slugs != ''
        working-directory: engines
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng
          npm ci --no-audit --no-fund
          npx playwright-core install chromium
      - name: Render Shorts and distribute
        if: steps.stories.outputs.slugs != ''
        working-directory: engines
        env:
          DISTRIBUTION_LIVE: ${{ vars.DISTRIBUTION_LIVE == 'on' && '1' || '0' }}
          NUVELLUM_TTS: ${{ vars.NUVELLUM_TTS || 'elevenlabs,openai,google,espeak,silent' }}
          NUVELLUM_ROLE_SOCIAL: ${{ vars.NUVELLUM_ROLE_SOCIAL }}
          NUVELLUM_ROLE_SHORTS_SCRIPT: ${{ vars.NUVELLUM_ROLE_SHORTS_SCRIPT }}
          NUVELLUM_ROLE_SHORTS_VERIFY: ${{ vars.NUVELLUM_ROLE_SHORTS_VERIFY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          X_USER_ACCESS_TOKEN: ${{ secrets.X_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ vars.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          RENDER_SHORT: ${{ inputs.render_short == false && '0' || '1' }}
          SLUGS: ${{ steps.stories.outputs.slugs }}
        run: |
          for slug in $SLUGS; do
            video=""
            if [ "$RENDER_SHORT" = "1" ] && node shorts/cli.mjs --slug "$slug" > /dev/null; then
              video="out/shorts/$slug/short.mp4"
            fi
            node distribution/cli.mjs --slug "$slug" ${video:+--video "$video"} || echo "::warning::distribution failed for $slug"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distribution-${{ github.run_id }}
          path: |
            engines/out/
            engines/.state/
          if-no-files-found: ignore
          retention-days: 30
