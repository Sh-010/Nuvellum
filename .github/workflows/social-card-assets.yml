name: Publish social card assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/social-card-assets.yml"
      - "ops/social-card-request.txt"
      - "src/content/articles/*.md"
  # The publication gate dispatches this after every automatic merge (GITHUB_TOKEN merges fire no push
  # workflows). Every run also sweeps recent stories without cards, so a dropped dispatch heals itself.
  workflow_dispatch:
    inputs:
      slugs:
        description: "Slugs to render (space/comma separated). Empty: the request file plus the recent-story sweep."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: social-card-assets
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve article slugs
        id: slugs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          INPUT_SLUGS: ${{ github.event_name == 'workflow_dispatch' && inputs.slugs || '' }}
        run: |
          set -euo pipefail
          : > /tmp/requested.txt
          : > /tmp/changed.txt

          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > /tmp/changed.txt
            sed -n 's#^src/content/articles/\([a-z0-9][a-z0-9-]*\)\.md$#\1#p' /tmp/changed.txt >> /tmp/requested.txt
          fi
          printf '%s\n' "$INPUT_SLUGS" | tr ', ' '\n\n' | sed '/^[[:space:]]*$/d' >> /tmp/requested.txt
          if { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$INPUT_SLUGS" ]; } || grep -Eq '^(ops/social-card-request\.txt|\.github/workflows/social-card-assets\.yml)$' /tmp/changed.txt; then
            if [ -f ops/social-card-request.txt ]; then
              tr -d '\r' < ops/social-card-request.txt | sed '/^[[:space:]]*$/d' >> /tmp/requested.txt
            fi
          fi

          # Recent stories that already carry cards on social-assets are not re-rendered by the sweep.
          : > /tmp/assets-tree.txt
          if git ls-remote --exit-code --heads origin social-assets >/dev/null; then
            git fetch --depth=1 origin social-assets
            git ls-tree -r --name-only FETCH_HEAD > /tmp/assets-tree.txt
          fi
          REQUESTED="$(tr '\n' ' ' < /tmp/requested.txt)" HAVE_CARDS=/tmp/assets-tree.txt node scripts/social-card-slugs.mjs > /tmp/slugs.txt

          while IFS= read -r SLUG; do
            printf '%s' "$SLUG" | grep -Eq '^[a-z0-9]+(-[a-z0-9]+)*$' || { echo "::error::invalid social-card slug: $SLUG"; exit 1; }
            test -f "src/content/articles/$SLUG.md" || { echo "::error::article not found for $SLUG"; exit 1; }
          done < /tmp/slugs.txt

          if [ -s /tmp/slugs.txt ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "Rendering:"; cat /tmp/slugs.txt
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "Every recent story already has cards; nothing to render."
          fi

      - name: Install renderer
        if: steps.slugs.outputs.any == 'true'
        shell: bash
        run: |
          cd engines
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium

      - name: Render and verify Nuvellum social cards
        if: steps.slugs.outputs.any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r SLUG; do
            node engines/cards/cli.mjs --slug "$SLUG" --png --no-quote
          done < /tmp/slugs.txt

      - name: Publish cards to social-assets branch
        if: steps.slugs.outputs.any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nuvellum Social Assets"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin social-assets >/dev/null; then
            git fetch --depth=1 origin social-assets
            git worktree add -B social-assets .social-assets origin/social-assets
          else
            git worktree add --orphan -b social-assets .social-assets
          fi

          while IFS= read -r SLUG; do
            SRC="engines/out/social-cards/$SLUG"
            DST=".social-assets/cards/$SLUG"
            mkdir -p "$DST"
            cp "$SRC"/square.png "$DST"/
            cp "$SRC"/portrait.png "$DST"/
            cp "$SRC"/landscape.png "$DST"/
            cp "$SRC"/story.png "$DST"/
            cp "$SRC"/manifest.json "$DST"/
          done < /tmp/slugs.txt

          cd .social-assets
          git add cards
          if git diff --cached --quiet; then
            echo "social cards unchanged"
            exit 0
          fi

          COUNT="$(git diff --cached --name-only | awk -F/ '$1=="cards"{print $2}' | sort -u | wc -l | tr -d ' ')"
          git commit -q -m "social cards: $COUNT story set(s)"
          git push origin HEAD:social-assets
