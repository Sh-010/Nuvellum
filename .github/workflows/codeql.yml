name: CodeQL

on:
  push:
    branches:
      - main
      - "incoming/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 3"

permissions:
  contents: read
  security-events: write

concurrency:
  # incoming/** pushes are grouped per commit: n8n pushes art and article within a second,
  # and a per-branch group could cancel the article commit's checks (the gate needs them).
  group: codeql-${{ github.event_name }}-${{ startsWith(github.ref, 'refs/heads/incoming/') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
