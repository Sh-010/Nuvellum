<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="40%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#07090c"/>
    </linearGradient>

    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4500" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#8b00ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0b0e14" stop-opacity="0"/>
    </radialGradient>

    
    <linearGradient id="monolithGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b4252"/>
      <stop offset="30%" stop-color="#4c566a"/>
      <stop offset="70%" stop-color="#2e3440"/>
      <stop offset="100%" stop-color="#1f232a"/>
    </linearGradient>

    <linearGradient id="sealGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#aa771c"/>
      <stop offset="100%" stop-color="#55380c"/>
    </linearGradient>

    
    <linearGradient id="forgeEnergy" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff5500"/>
      <stop offset="40%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#ffffaa"/>
    </linearGradient>

    <linearGradient id="codeBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4c566a" stroke-width="0.75" stroke-opacity="0.15"/>
    </pattern>

    <pattern id="hexagons" width="30" height="52" patternUnits="userSpaceOnUse" patternTransform="scale(0.8)">
      <path d="M15 0 L30 8.66 L30 25.98 L15 34.64 L0 25.98 L0 8.66 Z" fill="none" stroke="#00ffff" stroke-width="0.5" stroke-opacity="0.1"/>
    </pattern>

    
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  
  <rect width="1200" height="675" fill="url(#grid)"/>

  
  <g opacity="0.4">
    <circle cx="900" cy="300" r="350" fill="url(#portalGlow)"/>
    <path d="M0 500 Q 300 450, 600 500 T 1200 480 L 1200 675 L 0 675 Z" fill="#05070a"/>
  </g>

  

  
  <g id="official-vault" transform="translate(80, 80)">
    
    <path d="M 50 80 L 350 40 L 350 520 L 50 500 Z" fill="url(#monolithGrad)" stroke="#4c566a" stroke-width="2"/>
    
    <path d="M 0 100 L 50 80 L 50 500 L 0 520 Z" fill="#1e222b"/>
    
    
    <rect x="120" y="160" width="160" height="280" fill="#181b22" stroke="#4c566a" stroke-width="3"/>
    
    
    <g transform="translate(200, 280)" filter="url(#softGlow)">
      <polygon points="0,-45 39,-22 39,22 0,45 -39,22 -39,-22" fill="none" stroke="url(#sealGold)" stroke-width="4"/>
      <polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12" fill="#2e220e" stroke="url(#sealGold)" stroke-width="2"/>
      <path d="M -15 0 L 15 0 M 0 -15 L 0 15" stroke="url(#sealGold)" stroke-width="3"/>
    </g>

    
    <line x1="140" y1="120" x2="260" y2="120" stroke="#ff5555" stroke-width="3" stroke-opacity="0.8"/>
    
  </g>

  
  <g id="toolkit-breach" transform="translate(420, 80)">
    
    <path d="M 0 40 L 80 20 L 120 100 L 40 140 Z" fill="#252c38" stroke="#00ffff" stroke-width="1" stroke-opacity="0.5"/>
    <polygon points="150,200 180,180 190,220" fill="#ff5500" opacity="0.7" filter="url(#neonGlow)"/>
    
    
    <path d="M 0 0 L 180 500" stroke="#00ffff" stroke-width="2" stroke-dasharray="8 4" filter="url(#neonGlow)"/>
    <path d="M 50 0 L 230 500" stroke="#ff5500" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.8"/>
  </g>

  
  <g id="community-expansion" transform="translate(620, 50)">
    
    
    <rect x="0" y="20" width="480" height="520" fill="url(#hexagons)" opacity="0.8"/>

    
    
    
    <g transform="translate(80, 80)" filter="url(#softGlow)">
      <path d="M 60 20 L 100 80 L 100 220 L 20 220 L 20 80 Z" fill="#111622" stroke="#ff8800" stroke-width="2"/>
      
      <rect x="40" y="100" width="10" height="20" fill="#ffaa00" filter="url(#neonGlow)"/>
      <rect x="70" y="100" width="10" height="20" fill="#ffaa00" filter="url(#neonGlow)"/>
      <rect x="40" y="150" width="10" height="20" fill="#ffaa00" filter="url(#neonGlow)"/>
      <rect x="70" y="150" width="10" height="20" fill="#ffaa00" filter="url(#neonGlow)"/>
      <polygon points="60,0 110,20 10,20" fill="#222b3c" stroke="#ff8800" stroke-width="2"/>
    </g>

    
    <g transform="translate(240, 40)" filter="url(#softGlow)">
      
      <path d="M 120 280 L 120 120 L 200 80 L 40 80 Z" fill="#1a1226" stroke="#bf00ff" stroke-width="2"/>
      <ellipse cx="120" cy="80" rx="90" ry="25" fill="#2d1b4e" stroke="#bf00ff" stroke-width="2"/>
      <path d="M 90 60 Q 120 20 150 60 Z" fill="none" stroke="#00ffff" stroke-width="3" filter="url(#neonGlow)"/>
    </g>

    
    <g transform="translate(30, 320)">
      <rect x="0" y="0" width="220" height="180" rx="8" fill="#0d1117" stroke="#00ffff" stroke-width="1.5" stroke-opacity="0.6"/>
      
      <rect x="0" y="0" width="220" height="30" rx="8" fill="#161b22"/>
      <circle cx="15" cy="15" r="5" fill="#ff5555"/>
      <circle cx="30" cy="15" r="5" fill="#ffaa55"/>
      <circle cx="45" cy="15" r="5" fill="#55ff55"/>
      
      
      <path d="M 20 50 L 80 50 L 100 80 L 180 80" fill="none" stroke="#00ffff" stroke-width="2" filter="url(#neonGlow)"/>
      <circle cx="20" cy="50" r="4" fill="#00ffff"/>
      <circle cx="100" cy="80" r="4" fill="#ff5500"/>
      
      <path d="M 20 100 L 60 100 L 90 140 L 160 140" fill="none" stroke="#ff5500" stroke-width="2"/>
      <rect x="120" y="125" width="40" height="30" fill="#221100" stroke="#ffaa00" stroke-width="1"/>
    </g>

    
    <g transform="translate(180, 0)">
      <path d="M 0 450 L 0 0" stroke="url(#forgeEnergy)" stroke-width="6" filter="url(#neonGlow)" stroke-linecap="round"/>
      <path d="M 30 480 L 30 80" stroke="url(#codeBeam)" stroke-width="3" filter="url(#neonGlow)" stroke-linecap="round"/>
      <path d="M -40 500 L -40 150" stroke="#00ffff" stroke-width="2" stroke-dasharray="10 5" opacity="0.6"/>
    </g>

    
    <g transform="translate(360, 220)" filter="url(#neonGlow)">
      <polygon points="0,-60 52,-20 32,45 -32,45 -52,-20" fill="url(#forgeEnergy)" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
      <polygon points="0,-60 52,-20 0,10 -52,-20" fill="#ffeedd" opacity="0.5"/>
      <line x1="0" y1="-60" x2="0" y2="45" stroke="#ffffff" stroke-width="1"/>
      <line x1="-52" y1="-20" x2="52" y2="-20" stroke="#ffffff" stroke-width="1"/>
    </g>

    
    <g fill="#00ffff" filter="url(#neonGlow)">
      <circle cx="20" cy="280" r="4"/>
      <circle cx="60" cy="240" r="3"/>
      <circle cx="140" cy="30" r="5"/>
      <circle cx="280" cy="10" r="3"/>
      <circle cx="420" cy="180" r="4"/>
      <circle cx="460" cy="350" r="6"/>
      <circle cx="390" cy="480" r="3"/>
    </g>
    <g fill="#ff5500">
      <circle cx="100" cy="340" r="5"/>
      <circle cx="210" cy="200" r="4"/>
      <circle cx="340" cy="120" r="6"/>
      <circle cx="440" cy="280" r="3"/>
    </g>

  </g>

  
  
  <rect width="1200" height="675" fill="none" stroke="#000000" stroke-width="30" opacity="0.6"/>
  
  
  <path d="M 0 625 L 1200 625 L 1200 675 L 0 675 Z" fill="#030406"/>

  
  <line x1="560" y1="80" x2="560" y2="580" stroke="#4c566a" stroke-width="1" stroke-dasharray="5 15" opacity="0.4"/>
</svg>