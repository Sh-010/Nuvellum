  <g stroke="#2a221c" stroke-width="1" opacity="0.6">
    
    <line x1="55" y1="65" x2="85" y2="65"/>
    <line x1="65" y1="55" x2="65" y2="85"/>
    
    
    <line x1="1115" y1="65" x2="1145" y2="65"/>
