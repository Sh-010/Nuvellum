<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <pattern id="paper-grain" width="100" height="100" patternUnits="userSpaceOnUse">
      <filter id="noise" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" result="noiseOut"/>
        <feColorMatrix type="matrix" values="0 0 0 0 0.93  0 0 0 0 0.91  0 0 0 0 0.86  0 0 0 0.08 0" in="noiseOut" result="coloredNoise"/>
      </filter>
      <rect width="100" height="100" filter="url(#noise)" opacity="0.6"/>
    </pattern>

    
    <pattern id="hatch-soil" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#2a221c" stroke-width="0.8" opacity="0.35"/>
    </pattern>
    <pattern id="hatch-deep" width="6" height="6" patternTransform="rotate(135 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#661227" stroke-width="1.2" opacity="0.4"/>
    </pattern>
    <pattern id="hatch-water" width="12" height="12" patternTransform="rotate(0 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="3" x2="12" y2="3" stroke="#4a5c66" stroke-width="0.7" opacity="0.3"/>
      <line x1="0" y1="9" x2="12" y2="9" stroke="#4a5c66" stroke-width="0.4" opacity="0.2"/>
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="#f3ecdf"/>
  <rect width="1200" height="675" fill="url(#paper-grain)"/>

  
  <rect x="36" y="36" width="1128" height="603" fill="none" stroke="#2a221c" stroke-width="1.5" opacity="0.25"/>
  <rect x="42" y="42" width="1116" height="591" fill="none" stroke="#2a221c" stroke-width="0.5" opacity="0.15"/>

  
  <g opacity="0.7">
    
    <path d="M 80 440 Q 250 410 400 435 T 720 420 Q 950 390 1120 430 L 1120 540 L 80 540 Z" fill="#e5dbcc" stroke="#2a221c" stroke-width="1"/>
    
    
    <path d="M 850 425 L 870 330 L 880 330 L 900 425 Z" fill="none" stroke="#2a221c" stroke-width="1.5" opacity="0.5"/>
