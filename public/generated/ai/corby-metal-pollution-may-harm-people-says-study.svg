    <ellipse cx="495" cy="360" rx="1.5" ry="6" fill="#2a221c"/>
    <ellipse cx="525" cy="330" rx="2" ry="9" fill="#2a221c"/>

    
    <path d="M 735 450 Q 740 390 760 350 M 730 450 Q 732 410 745 370 M 725 450 Q 720 385 710 340" fill="none" stroke="#2a221c" stroke-width="1.5"/>
    <ellipse cx="760" cy="350" rx="2" ry="7" fill="#2a221c"/>
    <ellipse cx="710" cy="340" rx="2" ry="8" fill="#2a221c"/>
