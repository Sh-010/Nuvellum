    <line x1="863" y1="365" x2="887" y2="365" stroke="#2a221c" stroke-width="1" opacity="0.5"/>
    <line x1="867" y1="345" x2="883" y2="345" stroke="#2a221c" stroke-width="1" opacity="0.5"/>
    
    <path d="M 940 430 L 965 310 L 975 310 L 1000 430 Z" fill="none" stroke="#2a221c" stroke-width="1.5" opacity="0.4"/>
