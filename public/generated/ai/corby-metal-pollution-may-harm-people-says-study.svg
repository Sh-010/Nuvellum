    <line x1="954" y1="355" x2="986" y2="355" stroke="#2a221c" stroke-width="1" opacity="0.4"/>
  </g>

  
  
  <g id="strata-section">
    
    <path d="M 120 440 C 300 420 600 430 1080 430 L 1080 470 C 600 470 300 460 120 480 Z" fill="url(#hatch-soil)" stroke="#2a221c" stroke-width="1.5"/>
    
    
    <path d="M 120 480 C 300 460 600 470 1080 470 L 1080 540 C 600 550 300 540 120 530 Z" fill="#dfd3c3" stroke="#2a221c" stroke-width="1.5"/>
    <path d="M 120 495 Q 350 515 650 500 T 1080 515" fill="none" stroke="#2a221c" stroke-width="0.8" stroke-dasharray="6,4" opacity="0.6"/>

    
