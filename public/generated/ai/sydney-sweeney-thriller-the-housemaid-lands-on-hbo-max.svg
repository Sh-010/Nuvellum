<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  
  <defs>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5efe6" />
      <stop offset="50%" stop-color="#efe8db" />
      <stop offset="100%" stop-color="#e5ded0" />
    </linearGradient>

    
    <pattern id="hatchDark" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#2a221c" stroke-width="1.2" opacity="0.85" />
    </pattern>

    <pattern id="hatchMid" width="8" height="8" patternTransform="rotate(-30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.8" opacity="0.6" />
    </pattern>

    <pattern id="hatchBurgundy" width="12" height="12" patternTransform="rotate(60 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#661227" stroke-width="1.5" opacity="0.75" />
    </pattern>

    <pattern id="roofSlate" width="16" height="16" patternTransform="rotate(0 0 0)" patternUnits="userSpaceOnUse">
      <path d="M0 8 H16 M8 0 V16" stroke="#2a221c" stroke-width="0.6" opacity="0.4" />
      <path d="M0 0 L16 16 M16 0 L0 16" stroke="#2a221c" stroke-width="0.3" opacity="0.2" />
    </pattern>

    
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#2a221c" stop-opacity="0.15" />
    </radialGradient>
  </defs>

  
  <rect width="1200" height="675" fill="url(#paperGrad)" />
  <rect width="1200" height="675" fill="url(#vignette)" />

  
  <rect x="40" y="40" width="1120" height="595" fill="none" stroke="#2a221c" stroke-width="1.5" opacity="0.3" />
