    <rect x="610" y="320" width="30" height="60" fill="url(#hatchDark)" stroke="#2a221c" stroke-width="1.5" />

    
    <rect x="830" y="320" width="15" height="40" fill="url(#hatchDark)" stroke="#2a221c" stroke-width="1.5" />
    <rect x="830" y="380" width="15" height="40" fill="url(#hatchDark)" stroke="#2a221c" stroke-width="1.5" />
    <rect x="830" y="440" width="15" height="40" fill="url(#hatchDark)" stroke="#2a221c" stroke-width="1.5" />

    
