<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  
  <defs>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f2ea"/>
      <stop offset="50%" stop-color="#efe8db"/>
      <stop offset="100%" stop-color="#e4dacb"/>
    </linearGradient>
    
    <linearGradient id="ringMat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a221c"/>
      <stop offset="50%" stop-color="#4a3b32"/>
      <stop offset="100%" stop-color="#2a221c"/>
    </linearGradient>

    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7d172e"/>
      <stop offset="100%" stop-color="#540f1e"/>
    </linearGradient>

    
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>

    <pattern id="crosshatch" width="6" height="6" patternTransform="rotate(30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#661227" stroke-width="0.6" stroke-opacity="0.2"/>
      <line x1="0" y1="0" x2="6" y2="0" stroke="#661227" stroke-width="0.6" stroke-opacity="0.2"/>
    </pattern>

    <filter id="inkBleed" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="url(#paperGrad)" />

  
  <g stroke="#2a221c" stroke-opacity="0.15" fill="none" stroke-width="1">
    
    <path d="M 150 550 L 150 250 C 150 150, 350 150, 350 250 L 350 550" />
    <path d="M 120 580 L 120 230 C 120 120, 380 120, 380 230 L 380 580" stroke-dasharray="4 4"/>
    <path d="M 850 550 L 850 250 C 850 150, 1050 150, 1050 250 L 1050 550" />
    <path d="M 820 580 L 820 230 C 820 120, 1080 120, 1080 230 L 1080 580" stroke-dasharray="4 4"/>
    
    
    <line x1="60" y1="60" x2="1140" y2="60" stroke-width="1.5" stroke="#661227" stroke-opacity="0.4"/>
    <line x1="60" y1="615" x2="1140" y2="615" stroke-width="1.5" stroke="#661227" stroke-opacity="0.4"/>
    <line x1="60" y1="60" x2="60" y2="615" stroke-width="1.5" stroke="#661227" stroke-opacity="0.4"/>
    <line x1="1140" y1="60" x2="1140" y2="615" stroke-width="1.5" stroke="#661227" stroke-opacity="0.4"/>
  </g>

  
  <g transform="translate(600, 360)">
    
    <polygon points="-320,120 320,120 420,240 -420,240" fill="#e0d4c1" stroke="#2a221c" stroke-width="2"/>
    
    <line x1="-320" y1="120" x2="420" y2="240" stroke="#2a221c" stroke-opacity="0.1" stroke-width="1"/>
    <line x1="320" y1="120" x2="-420" y2="240" stroke="#2a221c" stroke-opacity="0.1" stroke-width="1"/>

    
    
    <rect x="-330" y="-120" width="14" height="245" fill="url(#ringMat)" stroke="#2a221c" stroke-width="1.5"/>
    
    <rect x="316" y="-120" width="14" height="245" fill="url(#ringMat)" stroke="#2a221c" stroke-width="1.5"/>
    
    <rect x="-435" y="10" width="16" height="235" fill="url(#ringMat)" stroke="#2a221c" stroke-width="1.5"/>
    
    <rect x="419" y="10" width="16" height="235" fill="url(#ringMat)" stroke="#2a221c" stroke-width="1.5"/>

    
    
    <line x1="-435" y1="60" x2="-330" y2="-40" stroke="#661227" stroke-width="4"/>
    <line x1="-330" y1="-40" x2="316" y2="-40" stroke="#661227" stroke-width="4"/>
    <line x1="316" y1="-40" x2="419" y2="60" stroke="#661227" stroke-width="4"/>
    <line x1="-435" y1="60" x2="419" y2="60" stroke="#661227" stroke-width="4"/>

    
    <line x1="-435" y1="30" x2="-330" y2="-70" stroke="#2a221c" stroke-width="3.5"/>
    <line x1="-330" y1="-70" x2="316" y2="-70" stroke="#2a221c" stroke-width="3.5"/>
    <line x1="316" y1="-70" x2="419" y2="30" stroke="#2a221c" stroke-width="3.5"/>
    <line x1="-435" y1="30" x2="419" y2="30" stroke="#2a221c" stroke-width="3.5"/>

    
    <line x1="-435" y1="0" x2="-330" y2="-100" stroke="#661227" stroke-width="3"/>
    <line x1="-330" y1="-100" x2="316" y2="-100" stroke="#661227" stroke-width="3"/>
    <line x1="316" y1="-100" x2="419" y2="0" stroke="#661227" stroke-width="3"/>
    <line x1="-435" y1="0" x2="419" y2="0" stroke="#661227" stroke-width="3"/>

    
    <line x1="-435" y1="-30" x2="-330" y2="-130" stroke="#2a221c" stroke-width="2.5"/>
    <line x1="-330" y1="-130" x2="316" y2="-130" stroke="#2a221c" stroke-width="2.5"/>
    <line x1="316" y1="-130" x2="419" y2="-30" stroke="#2a221c" stroke-width="2.5"/>
    <line x1="-435" y1="-30" x2="419" y2="-30" stroke="#2a221c" stroke-width="2.5"/>
  </g>

  
  <g transform="translate(600, 360)">
    
    
    <g transform="translate(-130, 20)">
      
      <ellipse cx="0" cy="140" rx="70" ry="20" fill="#2a221c" opacity="0.2"/>
      
      
      <path d="M -30 20 L 20 10 L 35 100 L -20 110 Z" fill="url(#crosshatch)" stroke="#2a221c" stroke-width="2"/>
      <path d="M -30 20 L 20 10 L 35 100 L -20 110 Z" fill="#2a221c" opacity="0.1"/>

      
      <path d="M -20 110 L -60 135 L -50 145 L -10 120 Z" fill="#2a221c" stroke="#2a221c" stroke-width="1.5"/>
      <path d="M 10 105 L 50 130 L 65 120 L 25 95 Z" fill="#2a221c" stroke="#2a221c" stroke-width="1.5"/>

      
      <circle cx="-15" cy="-25" r="22" fill="#efe8db" stroke="#2a221c" stroke-width="2"/>
      
      <path d="M -50 -10 C -70 -10, -60 30, -35 25 C -25 20, -30 0, -40 -5 Z" fill="#661227" stroke="#2a221c" stroke-width="2"/>
      
      <path d="M 20 30 C 70 15, 90 20, 110 10 C 95 35, 75 40, 30 50 Z" fill="#661227" stroke="#2a221c" stroke-width="2"/>
      
      <path d="M 15 20 L 65 25" stroke="#2a221c" stroke-width="12" stroke-linecap="round"/>
      <path d="M -25 10 L -45 -5" stroke="#2a221c" stroke-width="10" stroke-linecap="round"/>
    </g>

    
    <g transform="translate(130, 20) scale(-1, 1)">
      
      <ellipse cx="0" cy="140" rx="70" ry="20" fill="#2a221c" opacity="0.2"/>
      
      
      <path d="M -25 25 L 25 15 L 30 105 L -15 110 Z" fill="url(#hatch)" stroke="#2a221c" stroke-width="2"/>
      <path d="M -25 25 L 25 15 L 30 105 L -15 110 Z" fill="#2a221c" opacity="0.15"/>

      
      <path d="M -15 110 L -55 135 L -40 145 L -5 120 Z" fill="#2a221c" stroke="#2a221c" stroke-width="1.5"/>
      <path d="M 15 105 L 45 135 L 60 125 L 25 95 Z" fill="#2a221c" stroke="#2a221c" stroke-width="1.5"/>

      
      <circle cx="-10" cy="-20" r="21" fill="#efe8db" stroke="#2a221c" stroke-width="2"/>
      
      <path d="M -35 -30 C -55 -25, -45 5, -25 0 C -15 -5, -20 -25, -25 -30 Z" fill="#2a221c" stroke="#661227" stroke-width="2"/>
      <path d="M 10 0 C 45 -10, 55 10, 40 30 C 30 35, 15 20, 10 10 Z" fill="#2a221c" stroke="#661227" stroke-width="2"/>
      
      <path d="M -20 15 L -30 -10" stroke="#2a221c" stroke-width="10" stroke-linecap="round"/>
      <path d="M 15 20 L 30 10" stroke="#2a221c" stroke-width="10" stroke-linecap="round"/>
    </g>

  </g>

  
  
  <g transform="translate(180, 130)">
    <rect x="-40" y="-20" width="80" height="40" rx="4" fill="url(#burgundyGrad)" stroke="#2a221c" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#efe8db" stroke="#2a221c" stroke-width="2"/>
    <path d="M -8 -4 L 0 -12 L 8 -4 L 4 8 L -4 8 Z" fill="#661227"/>
    
    <path d="M -30 20 L -45 50 L -25 40 L -15 45 Z" fill="url(#burgundyGrad)" stroke="#2a221c" stroke-width="1.5"/>
    <path d="M 30 20 L 45 50 L 25 40 L 15 45 Z" fill="url(#burgundyGrad)" stroke="#2a221c" stroke-width="1.5"/>
  </g>

  
  <g transform="translate(1020, 130)">
    <rect x="-40" y="-20" width="80" height="40" rx="4" fill="url(#burgundyGrad)" stroke="#2a221c" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#efe8db" stroke="#2a221c" stroke-width="2"/>
    <rect x="-6" y="-6" width="12" height="12" fill="#661227" transform="rotate(45 0 0)"/>
    
    <path d="M -30 20 L -45 50 L -25 40 L -15 45 Z" fill="url(#burgundyGrad)" stroke="#2a221c" stroke-width="1.5"/>
    <path d="M 30 20 L 45 50 L 25 40 L 15 45 Z" fill="url(#burgundyGrad)" stroke="#2a221c" stroke-width="1.5"/>
  </g>

  
  <g fill="#2a221c" stroke="#2a221c">
    
    <path d="M 60 90 L 90 60 L 60 60 Z" opacity="0.3"/>
    <line x1="60" y1="90" x2="120" y2="90" stroke-width="1.5"/>
    <line x1="90" y1="60" x2="90" y2="120" stroke-width="1.5"/>

    
    <path d="M 1140 90 L 1110 60 L 1140 60 Z" opacity="0.3"/>
    <line x1="1140" y1="90" x2="1080" y2="90" stroke-width="1.5"/>
    <line x1="1110" y1="60" x2="1110" y2="120" stroke-width="1.5"/>

    
    <path d="M 60 585 L 90 615 L 60 615 Z" opacity="0.3"/>
    <line x1="60" y1="585" x2="120" y2="585" stroke-width="1.5"/>
    <line x1="90" y1="615" x2="90" y2="555" stroke-width="1.5"/>

    
    <path d="M 1140 585 L 1110 615 L 1140 615 Z" opacity="0.3"/>
    <line x1="1140" y1="585" x2="1080" y2="585" stroke-width="1.5"/>
    <line x1="1110" y1="615" x2="1110" y2="555" stroke-width="1.5"/>
  </g>

  
  <line x1="180" y1="600" x2="1020" y2="600" stroke="#2a221c" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="608" x2="960" y2="608" stroke="#661227" stroke-width="1.5" stroke-linecap="round"/>

  
  <rect x="60" y="60" width="1080" height="555" fill="none" stroke="#2a221c" stroke-width="0.75" opacity="0.4"/>
