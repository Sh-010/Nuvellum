<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  
  <defs>
    
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      <feColorMatrix type="matrix" values="0.3 0 0 0 0.65  0 0.3 0 0 0.63  0 0 0.3 0 0.60  0 0 0 0.08 0" in="noise" result="coloredNoise" />
      <feComposite operator="in" in2="SourceGraphic" result="monoNoise" />
      <feBlend mode="multiply" in="SourceGraphic" in2="monoNoise" />
    </filter>

    
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.5" stroke-opacity="0.15" />
    </pattern>

    <pattern id="cross-hatch" width="6" height="6" patternTransform="rotate(30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#661227" stroke-width="0.6" stroke-opacity="0.2" />
      <line x1="0" y1="0" x2="6" y2="0" stroke="#661227" stroke-width="0.6" stroke-opacity="0.2" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="#f3ecdf" />
  <rect width="1200" height="675" fill="#efe8db" filter="url(#paper-texture)" opacity="0.8" />

  
  <g stroke="#2a221c" stroke-opacity="0.2" stroke-width="1">
    <line x1="100" y1="80" x2="1100" y2="80" />
    <line x1="100" y1="595" x2="1100" y2="595" />
    <rect x="110" y="90" width="980" height="495" fill="none" stroke-width="0.5" />
  </g>

  
  
  <g transform="translate(0, 0)">
    
    <g transform="translate(220, 200) rotate(-4)">
      <rect x="0" y="0" width="220" height="280" fill="#fcf9f2" stroke="#2a221c" stroke-width="1.5" />
      <line x1="25" y1="35" x2="195" y2="35" stroke="#661227" stroke-width="2" />
      
      <line x1="25" y1="65" x2="180" y2="65" stroke="#2a221c" stroke-width="0.75" stroke-opacity="0.6" />
      <line x1="25" y1="85" x2="140" y2="85" stroke="#2a221c" stroke-width="0.75" stroke-opacity="0.6" />
      <line x1="25" y1="105" x2="190" y2="105" stroke="#2a221c" stroke-width="0.75" stroke-opacity="0.6" />
      <line x1="25" y1="125" x2="160" y2="125" stroke="#2a221c" stroke-width="0.75" stroke-opacity="0.6" />
      <line x1="25" y1="145" x2="175" y2="145" stroke="#2a221c" stroke-width="0.75" stroke-opacity="0.6" />
      <line x1="25" y1="165" x2="120" y2="165" stroke="#2a221c" stroke-width="0.75" stroke-opacity="0.6" />
      
      <circle cx="180" cy="230" r="18" fill="#661227" />
      
    </g>

    
    <g transform="translate(200, 220) rotate(2)">
      <rect x="0" y="0" width="220" height="280" fill="#e8dfd0" stroke="#2a221c" stroke-width="1.5" />
      <path d="M 0 0 L 220 15 L 220 295 L 0 280 Z" fill="#dfd5c5" stroke="#2a221c" stroke-width="1" opacity="0.5" />
      
      <path d="M 30 220 Q 50 190 70 220 T 110 220 T 150 220 T 190 220" fill="none" stroke="#661227" stroke-width="2" />
    </g>
  </g>

  
  <g transform="translate(600, 310)">
    
    <rect x="-6" y="-130" width="12" height="250" fill="#2a221c" />
    <rect x="-2" y="-130" width="4" height="250" fill="#6d6159" opacity="0.4" />

    
    <path d="M -35 -40 C -35 30 35 30 35 -40 Z" fill="url(#hatch)" stroke="#2a221c" stroke-width="2" />
    <ellipse cx="0" cy="-40" rx="35" ry="12" fill="#d4c9b8" stroke="#2a221c" stroke-width="2" />

    
    <rect x="-30" y="-150" width="60" height="110" rx="12" fill="#2a221c" stroke="#661227" stroke-width="1.5" />
    
    <line x1="-20" y1="-135" x2="20" y2="-135" stroke="#efe8db" stroke-width="1" />
    <line x1="-20" y1="-120" x2="20" y2="-120" stroke="#efe8db" stroke-width="1" />
    <line x1="-20" y1="-105" x2="20" y2="-105" stroke="#efe8db" stroke-width="1" />
    <line x1="-20" y1="-90" x2="20" y2="-90" stroke="#efe8db" stroke-width="1" />
    <line x1="-20" y1="-75" x2="20" y2="-75" stroke="#efe8db" stroke-width="1" />
    <line x1="-20" y1="-60" x2="20" y2="-60" stroke="#efe8db" stroke-width="1" />
    
    <line x1="-10" y1="-140" x2="-10" y2="-55" stroke="#6d6159" stroke-width="1" />
    <line x1="0" y1="-140" x2="0" y2="-55" stroke="#6d6159" stroke-width="1" />
    <line x1="10" y1="-140" x2="10" y2="-55" stroke="#6d6159" stroke-width="1" />

    
    <rect x="-31" y="-97" width="62" height="6" fill="#661227" />
  </g>

  
  <g transform="translate(800, 260)">
    
    <circle cx="130" cy="90" r="85" fill="none" stroke="#2a221c" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="130" cy="90" r="70" fill="url(#cross-hatch)" stroke="#2a221c" stroke-width="1.5" />
    <circle cx="130" cy="90" r="50" fill="#f3ecdf" stroke="#661227" stroke-width="2" />
    
    
    <path d="M 30 90 C 30 50 70 30 130 30" fill="none" stroke="#2a221c" stroke-width="2" stroke-linecap="round" />
    <path d="M 15 90 C 15 35 70 10 130 10" fill="none" stroke="#661227" stroke-width="1.5" stroke-dasharray="6 3" stroke-linecap="round" />
    <path d="M 45 130 C 70 155 100 160 130 160" fill="none" stroke="#2a221c" stroke-width="2" stroke-linecap="round" />

    
    <line x1="130" y1="140" x2="110" y2="50" stroke="#661227" stroke-width="2.5" />
    <circle cx="130" cy="90" r="6" fill="#2a221c" />
  </g>

  
  <g fill="none" stroke="#2a221c" stroke-width="1.25">
    <path d="M 150 490 C 350 540, 500 440, 650 490 C 800 540, 950 440, 1050 490" />
    <path d="M 180 515 C 380 565, 530 465, 680 515 C 830 565, 980 465, 1080 515" stroke-opacity="0.4" stroke-width="0.75" />
    <path d="M 120 465 C 320 515, 470 415, 620 465 C 770 515, 920 415, 1020 465" stroke="#661227" stroke-opacity="0.6" stroke-width="1" />
  </g>

  
  <g stroke="#661227" stroke-width="1.5" fill="none">
    
    <path d="M 120 110 L 140 110 M 120 110 L 120 130" />
    
    <path d="M 1080 110 L 1060 110 M 1080 110 L 1080 130" />
    
    <path d="M 120 565 L 140 565 M 120 565 L 120 545" />
    
    <path d="M 1080 565 L 1060 565 M 1080 565 L 1080 545" />
  </g>

  
  <rect x="100" y="80" width="1000" height="515" fill="none" stroke="#2a221c" stroke-width="0.5" opacity="0.3" />
</svg>