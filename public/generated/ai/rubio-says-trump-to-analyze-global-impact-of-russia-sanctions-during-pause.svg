      .light-stone { fill: #e5dfd3; }
      .line-dark { stroke: #2a221c; stroke-linecap: round; stroke-linejoin: round; }
      .line-burgundy { stroke: #661227; stroke-linecap: round; stroke-linejoin: round; }
