<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <rect id="bg" width="1200" height="675" fill="#f3ecdf"/>
    
    
    <pattern id="hatch-charcoal" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.8" opacity="0.25"/>
    </pattern>
    <pattern id="hatch-burgundy" width="6" height="6" patternTransform="rotate(-30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#661227" stroke-width="1" opacity="0.35"/>
    </pattern>
    <pattern id="dots-stone" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8c7e72" opacity="0.4"/>
      <circle cx="8" cy="8" r="1" fill="#8c7e72" opacity="0.4"/>
    </pattern>
    
    
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#2a221c" flood-opacity="0.12"/>
    </filter>
  </defs>

  
  

  
  <g opacity="0.7">
    
    <polygon points="150,550 1050,550 900,280 300,280" fill="#e6dcd0" stroke="#8c7e72" stroke-width="1.5"/>
    
    <line x1="600" y1="280" x2="600" y2="550" stroke="#8c7e72" stroke-width="1" stroke-dasharray="6,4"/>
    
    <line x1="450" y1="280" x2="390" y2="550" stroke="#8c7e72" stroke-width="1" opacity="0.5"/>
    <line x1="750" y1="280" x2="810" y2="550" stroke="#8c7e72" stroke-width="1" opacity="0.5"/>
    
    <path d="M 300,280 Q 600,240 900,280" fill="none" stroke="#8c7e72" stroke-width="1.5" stroke-dasharray="4,4"/>
    <path d="M 150,550 Q 600,480 1050,550" fill="none" stroke="#8c7e72" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  
  <g opacity="0.08" fill="#2a221c">
    <path d="M600,80 L630,140 L690,145 L645,185 L660,245 L600,210 L540,245 L555,185 L510,145 L570,140 Z"/>
    <rect x="200" y="200" width="800" height="2" />
  </g>

  
  
  
  <g transform="translate(0, -20)">
    
    <g stroke="#8c7e72" stroke-width="2" fill="none" opacity="0.6">
      <line x1="180" y1="360" x2="280" y2="360" stroke-dasharray="8,6"/>
      <line x1="310" y1="360" x2="410" y2="360" stroke-dasharray="8,6"/>
      <line x1="440" y1="360" x2="540" y2="360" stroke-dasharray="8,6"/>
      <line x1="570" y1="360" x2="670" y2="360" stroke-dasharray="8,6"/>
    </g>

    
    <path d="M 680,310 L 710,410" stroke="#661227" stroke-width="4" stroke-linecap="round"/>
    <path d="M 695,315 L 725,415" stroke="#661227" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

    
    <path d="M 700,360 L 820,360" stroke="#2a221c" stroke-width="2.5" stroke-dasharray="4,4"/>

    
    <path d="M 720,360 C 800,360 880,300 970,260" fill="none" stroke="#661227" stroke-width="3" stroke-dasharray="12,6" stroke-linecap="round"/>
  </g>

  
  
  <g filter="url(#shadow)" transform="translate(60, 20)">
    
    <ellipse cx="600" cy="460" rx="160" ry="35" fill="#8c7e72" opacity="0.25"/>

    
    <g transform="translate(600, 370) rotate(-25)">
      
      <ellipse cx="0" cy="0" rx="90" ry="55" fill="#efe8db" stroke="#2a221c" stroke-width="3"/>
      
      
      <path d="M -90,0 C -40,-35 40,-35 90,0 C 40,35 -40,35 -90,0 Z" fill="url(#hatch-charcoal)" stroke="#2a221c" stroke-width="1.5"/>
      <path d="M -50,-24 C -20,-38 20,-38 50,-24" fill="none" stroke="#2a221c" stroke-width="2"/>
      <path d="M -50,24 C -20,38 20,38 50,24" fill="none" stroke="#2a221c" stroke-width="2"/>

      
      <line x1="-25" y1="0" x2="25" y2="0" stroke="#2a221c" stroke-width="3" stroke-linecap="round"/>
      <line x1="-15" y1="-6" x2="-15" y2="6" stroke="#2a221c" stroke-width="2"/>
      <line x1="-5" y1="-7" x2="-5" y2="7" stroke="#2a221c" stroke-width="2"/>
      <line x1="5" y1="-7" x2="5" y2="7" stroke="#2a221c" stroke-width="2"/>
      <line x1="15" y1="-6" x2="15" y2="6" stroke="#2a221c" stroke-width="2"/>

      
      <path d="M -20,-50 C 0,-52 20,-50 35,-44 C 20,-30 -10,-28 -20,-50 Z" fill="#661227" opacity="0.85"/>
    </g>

    
    <g stroke="#2a221c" stroke-width="3" stroke-linecap="square">
      
      <line x1="400" y1="420" x2="400" y2="150"/>
      
      <line x1="800" y1="420" x2="800" y2="150"/>
      
      <line x1="400" y1="240" x2="800" y2="240"/>
      
      <line x1="390" y1="420" x2="410" y2="420"/>
      <line x1="790" y1="420" x2="810" y2="420"/>
    </g>

    
    <g stroke="#8c7e72" stroke-width="0.75" opacity="0.4">
      <line x1="450" y1="240" x2="430" y2="180"/>
      <line x1="500" y1="240" x2="480" y2="180"/>
      <line x1="550" y1="240" x2="530" y2="180"/>
      <line x1="600" y1="240" x2="600" y2="180"/>
      <line x1="650" y1="240" x2="670" y2="180"/>
      <line x1="700" y1="240" x2="720" y2="180"/>
      <line x1="750" y1="240" x2="770" y2="180"/>
      <line x1="415" y1="200" x2="785" y2="200"/>
      <line x1="407" y1="220" x2="793" y2="220"/>
    </g>
  </g>

  
  
  <g transform="translate(120, 480)">
    <rect x="0" y="0" width="960" height="90" fill="#efe8db" stroke="#2a221c" stroke-width="2"/>
    
    
    <line x1="480" y1="0" x2="480" y2="90" stroke="#2a221c" stroke-width="2"/>
    
    
    <rect x="30" y="20" width="420" height="50" fill="url(#hatch-burgundy)" stroke="#661227" stroke-width="1.5"/>
    
    
    
    <rect x="510" y="20" width="420" height="50" fill="#2a221c" stroke="#2a221c" stroke-width="1.5"/>
    <rect x="515" y="25" width="410" height="40" fill="none" stroke="#efe8db" stroke-width="1" stroke-dasharray="4,4"/>
    
  </g>

  
  <g stroke="#2a221c" stroke-width="1.5">
    
    <line x1="40" y1="40" x2="90" y2="40"/>
    <line x1="40" y1="40" x2="40" y2="90"/>
    
    
    <line x1="1160" y1="40" x2="1110" y2="40"/>
    <line x1="1160" y1="40" x2="1160" y2="90"/>
    
    
    <line x1="40" y1="635" x2="90" y2="635"/>
    <line x1="40" y1="635" x2="40" y2="585"/>
    
    
    <line x1="1160" y1="635" x2="1110" y2="635"/>
    <line x1="1160" y1="635" x2="1160" y2="585"/>
  </g>

  
  <rect x="55" y="55" width="1090" height="565" fill="none" stroke="#8c7e72" stroke-width="0.5" stroke-dasharray="2,12" opacity="0.4"/>
</svg>