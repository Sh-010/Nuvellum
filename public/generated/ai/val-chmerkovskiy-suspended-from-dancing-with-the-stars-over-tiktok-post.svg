<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <style>
      .bg { fill: #f3ecdf; }
      .charcoal { fill: #2a221c; stroke: #2a221c; }
      .burgundy { fill: #661227; stroke: #661227; }
      .stone { fill: #d6ccbe; stroke: #d6ccbe; }
      .accent-blue { fill: #4a6b82; stroke: #4a6b82; }
      .line-fine { stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .line-med { stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .line-bold { stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .hatch { stroke: #2a221c; stroke-width: 0.75; opacity: 0.4; }
    </style>
    
    
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.95   0 0 0 0 0.92   0 0 0 0 0.87  0 0 0 0.08 0" in="noise" result="coloredNoise"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  
  <rect width="1200" height="675" class="bg"/>
  <rect width="1200" height="675" filter="url(#grain)" opacity="0.6"/>

  
  <rect x="60" y="50" width="1080" height="575" fill="none" stroke="#2a221c" stroke-width="0.75" opacity="0.3"/>
  <line x1="60" y1="75" x2="1140" y2="75" stroke="#2a221c" stroke-width="0.5" opacity="0.2"/>
  <line x1="60" y1="600" x2="1140" y2="600" stroke="#2a221c" stroke-width="0.5" opacity="0.2"/>

  
  
  <path d="M 60 75 L 300 75 L 240 600 L 60 600 Z" fill="#e8dfd1" opacity="0.7"/>
  <path d="M 1140 75 L 900 75 L 960 600 L 1140 600 Z" fill="#e8dfd1" opacity="0.7"/>

  
  <g class="hatch">
    <line x1="100" y1="75" x2="120" y2="600"/>
    <line x1="140" y1="75" x2="155" y2="600"/>
    <line x1="180" y1="75" x2="190" y2="600"/>
    <line x1="220" y1="75" x2="225" y2="600"/>
    <line x1="1100" y1="75" x2="1080" y2="600"/>
    <line x1="1060" y1="75" x2="1045" y2="600"/>
    <line x1="1020" y1="75" x2="1010" y2="600"/>
    <line x1="980" y1="75" x2="975" y2="600"/>
  </g>

  
  <polygon points="450,75 750,75 900,600 300,600" fill="#e2d6c4" opacity="0.3"/>

  
  

  
  <line x1="200" y1="520" x2="1000" y2="520" class="charcoal" stroke-width="2"/>
  <line x1="250" y1="530" x2="950" y2="530" class="charcoal" stroke-width="0.75"/>

  
  <line x1="600" y1="75" x2="600" y2="200" class="charcoal" stroke-width="2"/>
  
  
  <rect x="585" y="190" width="30" height="20" class="burgundy"/>
  <line x1="600" y1="210" x2="600" y2="250" class="charcoal" stroke-width="2"/>

  
  
  <ellipse cx="600" cy="515" rx="40" ry="10" class="stone" stroke="#2a221c" stroke-width="1.5"/>
  <path d="M 595 515 L 595 320 L 605 320 L 605 515 Z" class="charcoal"/>

  
  <g transform="translate(600, 290)">
    
    <rect x="-35" y="-55" width="70" height="90" rx="12" fill="#f3ecdf" stroke="#2a221c" stroke-width="3"/>
    
    
    <line x1="-25" y1="-35" x2="25" y2="-35" class="charcoal" stroke-width="1.5"/>
    <line x1="-25" y1="-20" x2="25" y2="-20" class="charcoal" stroke-width="1.5"/>
    <line x1="-25" y1="-5" x2="25" y2="-5" class="charcoal" stroke-width="1.5"/>
    <line x1="-25" y1="10" x2="25" y2="10" class="charcoal" stroke-width="1.5"/>
    <line x1="-25" y1="25" x2="25" y2="25" class="charcoal" stroke-width="1.5"/>
    
    <path d="M -35 -15 L 35 -15" class="burgundy" stroke-width="2"/>
    
    
    <path d="M -45 -35 C -45 10 -45 20 -35 30 L -35 45 L -25 45 L -25 35 C -25 35 -20 20 -20 0" class="line-med"/>
    <path d="M 45 -35 C 45 10 45 20 35 30 L 35 45 L 25 45 L 25 35 C 25 35 20 20 20 0" class="line-med"/>
  </g>

  
  
  <g transform="translate(400, 380) scale(0.8)" class="charcoal">
    
    <path d="M 0 100 Q 50 105 100 95 Q 120 90 140 120 Q 135 135 125 140 Q 115 115 90 110 Q 40 115 0 115 Z" fill="#2a221c"/>
    
    <path d="M 40 100 Q 50 60 70 50 Q 80 70 85 102" class="line-med" fill="none"/>
    <path d="M 60 65 Q 75 60 90 75" class="line-med" fill="none"/>
    
    <path d="M 20 95 Q 40 70 70 75" class="line-med" fill="none"/>
  </g>

  
  <path d="M 320 320 Q 360 270 420 300" class="line-fine burgundy" stroke-dasharray="4 4"/>
  <path d="M 300 350 Q 350 300 400 330" class="line-fine charcoal" stroke-dasharray="4 4"/>

  
  <g transform="translate(800, 380) scale(0.8)" opacity="0.35">
    
    <path d="M 0 100 Q 50 105 100 95 Q 120 90 140 120 Q 135 135 125 140 Q 115 115 90 110 Q 40 115 0 115 Z" fill="none" stroke="#661227" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M 40 100 Q 50 60 70 50 Q 80 70 85 102" fill="none" stroke="#661227" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M 60 65 Q 75 60 90 75" fill="none" stroke="#661227" stroke-width="2" stroke-dasharray="6 4"/>
  </g>

  
  <g transform="translate(1080, 110)">
    <circle cx="0" cy="0" r="22" fill="none" class="burgundy" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="18" fill="none" class="burgundy" stroke-width="0.75"/>
    <line x1="-10" y1="0" x2="10" y2="0" class="burgundy" stroke-width="1.5"/>
    <line x1="0" y1="-10" x2="0" y2="10" class="burgundy" stroke-width="1.5"/>
  </g>

  
  <g transform="translate(100, 560)">
    <line x1="0" y1="0" x2="40" y2="0" class="burgundy" stroke-width="3"/>
    <line x1="0" y1="6" x2="25" y2="6" class="charcoal" stroke-width="1.5"/>
    <line x1="0" y1="12" x2="55" y2="12" class="charcoal" stroke-width="0.75"/>
  </g>

  
  <line x1="250" y1="150" x2="950" y2="150" class="charcoal" stroke-width="0.5" opacity="0.2"/>
  <circle cx="600" cy="150" r="3" class="burgundy"/>
  
  
  <line x1="520" y1="240" x2="680" y2="350" class="burgundy" stroke-width="1.5" opacity="0.4"/>
</svg>