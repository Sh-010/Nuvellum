      <feColorMatrix type="matrix" values="0.3 0 0 0 0  0 0.3 0 0 0  0 0 0.3 0 0  0 0 0 0.05 0" in="noise" result="coloredNoise" />
      <feComposite operator="in" in2="SourceGraphic" in="coloredNoise" result="subtleNoise" />
      <feBlend mode="multiply" in="SourceGraphic" in2="subtleNoise" />
    </filter>
    <clipPath id="frame-clip">
      <rect x="60" y="60" width="1080" height="555" />
    </clipPath>
