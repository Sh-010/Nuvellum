<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      
        
      
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.9" />
        <feFuncG type="linear" slope="0.88" />
        <feFuncB type="linear" slope="0.85" />
      </feComponentTransfer>
      <feBlend mode="multiply" in="SourceGraphic" result="blend" />
    </filter>
    
    <pattern id="canvas-weave" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 4L4 0ZM-1 1L1 -1Z" stroke="#2a221c" stroke-width="0.05" opacity="0.15"/>
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="#f3ecdf" />
  <rect width="1200" height="675" fill="url(#canvas-weave)" />

  <g id="editorial-composition">
    
    <g stroke="#2a221c" stroke-width="0.75" opacity="0.12" fill="none">
      <path d="M 600,600 C 300,600 150,450 150,300 C 150,150 400,80 600,80 C 800,80 1050,150 1050,300 C 1050,450 900,600 600,600 Z" stroke-dasharray="4,6" />
      <path d="M 600,630 C 250,630 100,450 100,270 C 100,90 380,40 600,40 C 820,40 1100,90 1100,270 C 1100,450 950,630 600,630 Z" stroke-dasharray="2,8" />
      <line x1="600" y1="40" x2="600" y2="630" />
      <line x1="100" y1="300" x2="1100" y2="300" />
      <line x1="200" y1="150" x2="1000" y2="450" />
      <line x1="200" y1="450" x2="1000" y2="150" />
    </g>

    
    <g id="boxing-ring">
      
      <polygon points="200,480 1000,480 1100,580 100,580" fill="#2a221c" opacity="0.06" />
      
      
      <polygon points="220,460 980,460 1080,550 120,550" fill="#e5ded2" stroke="#2a221c" stroke-width="2" />
      
      
      <g stroke="#2a221c" stroke-width="0.5" opacity="0.2">
        <line x1="220" y1="460" x2="120" y2="550" />
        <line x1="315" y1="460" x2="215" y2="550" />
        <line x1="410" y1="460" x2="310" y2="550" />
        <line x1="505" y1="460" x2="405" y2="550" />
        <line x1="600" y1="460" x2="500" y2="550" />
        <line x1="695" y1="460" x2="595" y2="550" />
        <line x1="790" y1="460" x2="690" y2="550" />
        <line x1="885" y1="460" x2="785" y2="550" />
        <line x1="980" y1="460" x2="880" y2="550" />
      </g>

      
      <rect x="110" y="240" width="14" height="315" fill="#2a221c" />
      <rect x="1076" y="240" width="14" height="315" fill="#2a221c" />

      
      <g fill="none" stroke-linecap="round">
        
        <path d="M 117,320 Q 600,345 1083,320" stroke="#661227" stroke-width="4" />
        <path d="M 117,320 Q 600,345 1083,320" stroke="#2a221c" stroke-width="1.5" />
        
        
        <path d="M 117,285 Q 600,310 1083,285" stroke="#661227" stroke-width="5" />
        <path d="M 117,285 Q 600,310 1083,285" stroke="#2a221c" stroke-width="2" />
        
        
        <path d="M 117,250 Q 600,275 1083,250" stroke="#661227" stroke-width="6" />
        <path d="M 117,250 Q 600,275 1083,250" stroke="#2a221c" stroke-width="2" />
      </g>
    </g>

    
    <g id="focal-subject">
      
      <g stroke="#661227" stroke-width="1.5" fill="none" opacity="0.6">
        <path d="M 580,260 C 560,240 560,210 580,190" />
        <path d="M 595,250 C 580,235 580,215 595,200" />
        <path d="M 610,240 C 600,225 600,215 610,205" />
      </g>

      
      <g id="striking-arm">
        
        <path d="M 350,280 L 510,240 L 560,265 L 400,320 Z" fill="#2a221c" />
        
        <path d="M 510,240 L 590,230 L 605,250 L 530,265 Z" fill="#661227" stroke="#2a221c" stroke-width="2" />
        
        <line x1="535" y1="243" x2="550" y2="260" stroke="#f3ecdf" stroke-width="2" />
        <line x1="555" y1="239" x2="570" y2="256" stroke="#f3ecdf" stroke-width="2" />
      </g>

      
      <g id="falling-figure" transform="translate(680, 220)">
        
        <path d="M 40,60 C 20,40 20,10 50,0 C 70,-10 90,10 80,40 Z" fill="#2a221c" />
        
        <path d="M 50,30 L 30,120 L 70,140 L 80,60 Z" fill="#2a221c" />
        
        <path d="M 70,20 L 110,50 L 100,70 L 60,40 Z" fill="#661227" stroke="#2a221c" stroke-width="1.5" />
        
        <line x1="20" y1="20" x2="-20" y2="40" stroke="#2a221c" stroke-width="1" stroke-dasharray="3,3" />
        <line x1="30" y1="80" x2="-10" y2="110" stroke="#2a221c" stroke-width="1" stroke-dasharray="3,3" />
      </g>

      
      <g id="corner-towel" transform="translate(950, 180)">
        
        <path d="M 0,0 L -20,20 L -20,150 L 0,130 Z" fill="#2a221c" opacity="0.1" />
        
        <path d="M -10,40 C 0,50 15,40 20,70 C 25,100 0,140 10,180 C 15,200 5,230 -10,240 C -15,220 0,190 -10,150 C -20,110 -5,80 -10,40 Z" fill="#e5ded2" stroke="#2a221c" stroke-width="1.5" />
        
        <path d="M -5,60 Q 5,70 10,90 M -8,110 Q 0,120 5,140 M -12,170 Q -5,180 -2,200" stroke="#661227" stroke-width="1" fill="none" opacity="0.5" />
      </g>
    </g>

    
    <g id="print-frame-and-details">
      
      <rect x="35" y="35" width="1130" height="605" fill="none" stroke="#2a221c" stroke-width="1" opacity="0.4" />
      <rect x="43" y="43" width="1114" height="589" fill="none" stroke="#2a221c" stroke-width="0.5" opacity="0.3" />

      
      <g stroke="#2a221c" stroke-width="1" opacity="0.6">
        <line x1="25" y1="35" x2="45" y2="35" />
        <line x1="35" y1="25" x2="35" y2="45" />
        
        <line x1="1175" y1="35" x2="1155" y2="35" />
        <line x1="1165" y1="25" x2="1165" y2="45" />
        
        <line x1="25" y1="640" x2="45" y2="640" />
        <line x1="35" y1="630" x2="35" y2="650" />
        
        <line x1="1175" y1="640" x2="1155" y2="640" />
        <line x1="1165" y1="630" x2="1165" y2="650" />
      </g>

      
      <g stroke="#2a221c" stroke-width="0.75" opacity="0.3">
        <line x1="150" y1="580" x2="180" y2="600" />
        <line x1="200" y1="580" x2="240" y2="610" />
        <line x1="250" y1="580" x2="280" y2="600" />
        <line x1="320" y1="580" x2="350" y2="605" />
        <line x1="380" y1="580" x2="400" y2="595" />
        
        <line x1="800" y1="580" x2="820" y2="595" />
        <line x1="850" y1="580" x2="880" y2="605" />
        <line x1="920" y1="580" x2="950" y2="610" />
        <line x1="980" y1="580" x2="1010" y2="600" />
        <line x1="1050" y1="580" x2="1070" y2="595" />
      </g>
    </g>

    
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#2a221c" stop-opacity="0" />
      <stop offset="100%" stop-color="#2a221c" stop-opacity="0.12" />
    </radialGradient>
    <rect width="1200" height="675" fill="url(#vignette)" pointer-events="none" />
  </g>
</svg>