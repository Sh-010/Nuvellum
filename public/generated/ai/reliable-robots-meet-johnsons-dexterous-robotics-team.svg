<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14" />
      <stop offset="45%" stop-color="#121829" />
      <stop offset="100%" stop-color="#1c253d" />
    </linearGradient>

    
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24304c" />
      <stop offset="15%" stop-color="#182033" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    
    <linearGradient id="holoBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#0088ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0044ff" stop-opacity="0.0" />
    </linearGradient>

    
    <linearGradient id="humanLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb74d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f57c00" stop-opacity="0.7" />
    </linearGradient>

    
    <linearGradient id="robotBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    
    <radialGradient id="facilityGlow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  
  
  <rect width="1200" height="675" fill="url(#facilityGlow)" />

  
  <g opacity="0.25">
    
    <path d="M0 120 L1200 120 M0 200 L1200 200" stroke="#38bdf8" stroke-width="1" stroke-dasharray="10 20" />
    <path d="M 950 0 L 950 500 M 850 0 L 850 500 M 1050 0 L 1050 500" stroke="#64748b" stroke-width="1" />
    <polygon points="900,0 1000,0 1050,120 850,120" fill="#334155" opacity="0.4" />
    
    <circle cx="1020" cy="180" r="70" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <path d="M 975 150 Q 1000 130 1040 160 T 1070 210 Q 1020 240 980 200 Z" fill="#1e3a8a" opacity="0.6" />
  </g>

  
  <path d="M 0 520 L 1200 480 L 1200 675 L 0 675 Z" fill="url(#groundGrad)" />
  
  
  <g opacity="0.2">
    <path d="M 0 520 L 1200 480 M 0 550 L 1200 505 M 0 590 L 1200 535 M 0 635 L 1200 570 M 0 675 L 1200 610" stroke="#38bdf8" stroke-width="1" />
    <line x1="600" y1="520" x2="200" y2="675" stroke="#38bdf8" stroke-width="1" />
    <line x1="600" y1="520" x2="400" y2="675" stroke="#38bdf8" stroke-width="1" />
    <line x1="600" y1="520" x2="600" y2="675" stroke="#38bdf8" stroke-width="1" />
    <line x1="600" y1="520" x2="800" y2="675" stroke="#38bdf8" stroke-width="1" />
    <line x1="600" y1="520" x2="1000" y2="675" stroke="#38bdf8" stroke-width="1" />
  </g>

  
  <polygon points="650,220 500,530 800,530" fill="url(#holoBeam)" />
  <ellipse cx="650" cy="530" rx="150" ry="25" fill="none" stroke="#00ffff" stroke-width="2" opacity="0.5" filter="url(#glow)" />
  <ellipse cx="650" cy="450" rx="100" ry="18" fill="none" stroke="#00ffff" stroke-width="1.5" opacity="0.3" />
  <ellipse cx="650" cy="350" rx="50" ry="10" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.4" />

  
  <g id="robot" filter="url(#softShadow)" transform="translate(100, 30)">
    
    <path d="M 520 220 L 580 220 L 600 350 L 500 350 Z" fill="url(#robotBody)" stroke="#cbd5e1" stroke-width="2" />
    
    <path d="M 535 220 L 545 220 L 530 350 L 520 350 Z" fill="#ef4444" />
    <path d="M 550 220 L 560 220 L 555 350 L 540 350 Z" fill="#3b82f6" />
    <circle cx="550" cy="280" r="18" fill="#0f172a" stroke="#94a3b8" stroke-width="2" />
    <circle cx="550" cy="280" r="8" fill="#38bdf8" filter="url(#glow)" />

    
    <circle cx="490" cy="235" r="16" fill="#475569" />
    <path d="M 490 235 L 430 310 L 450 330 L 505 270 Z" fill="url(#robotBody)" stroke="#94a3b8" stroke-width="1.5" />
    
    <circle cx="610" cy="235" r="16" fill="#475569" />
    <path d="M 610 235 L 670 300 L 650 320 L 595 260 Z" fill="url(#robotBody)" stroke="#94a3b8" stroke-width="1.5" />

    
    <rect x="535" y="180" width="30" height="40" fill="#334155" />
    
    <path d="M 525 130 C 525 100 575 100 575 130 L 585 180 C 585 185 515 185 515 180 Z" fill="url(#robotBody)" stroke="#cbd5e1" stroke-width="2" />
    
    <path d="M 528 140 Q 550 155 572 140 L 575 165 Q 550 175 525 165 Z" fill="url(#visorGrad)" filter="url(#glow)" />

    
    <rect x="510" y="355" width="80" height="20" rx="5" fill="#334155" stroke="#64748b" stroke-width="2" />
  </g>

  
  
  <g id="human-engineer" filter="url(#softShadow)">
    
    <path d="M 0 520 L 150 420 L 250 450 L 100 600 Z" fill="#1e293b" />
    <path d="M 120 440 L 140 430 L 180 490 L 150 510 Z" fill="#dc2626" opacity="0.8" /> 
    
    
    <path d="M 180 440 Q 240 400 320 370 L 335 390 Q 260 430 200 470 Z" fill="#d97706" /> 
    <path d="M 310 365 C 330 355 350 350 370 345 L 375 360 C 355 365 335 370 320 380 Z" fill="url(#humanLight)" />
  </g>

  
  <g id="focus-hands" filter="url(#glow)">
    
    <path d="M 430 325 C 400 330 370 340 355 345" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <path d="M 435 340 C 410 345 385 355 370 365" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
    
    
    <circle cx="362" cy="355" r="12" fill="#ffffff" opacity="0.9" />
    <circle cx="362" cy="355" r="28" fill="#38bdf8" opacity="0.4" />
    <circle cx="362" cy="355" r="50" fill="#38bdf8" opacity="0.15" />
  </g>

  
  <g id="telemetry-graphics" opacity="0.8">
    
    <path d="M 620 120 L 640 120 M 640 120 L 640 140" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M 480 120 L 460 120 M 460 120 L 460 140" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="550" cy="140" r="60" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" opacity="0.5" />

    
    <g transform="translate(750, 180)">
      <line x1="0" y1="0" x2="80" y2="-40" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="80" cy="-40" r="4" fill="#38bdf8" />
      <rect x="90" y="-60" width="120" height="35" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.8" />
      
      <line x1="100" y1="-48" x2="180" y2="-48" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.7" />
      <line x1="100" y1="-38" x2="150" y2="-38" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    </g>

    <g transform="translate(250, 250)">
      <line x1="0" y1="0" x2="-70" y2="-30" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="-70" cy="-30" r="4" fill="#38bdf8" />
      <rect x="-180" y="-55" width="100" height="30" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.8" />
      <line x1="-170" y1="-45" x2="-110" y2="-45" stroke="#10b981" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    </g>

    
    <g transform="translate(820, 320)" opacity="0.6">
      <path d="M 0 0 L 40 -20 L 80 0 L 40 20 Z" fill="none" stroke="#00e5ff" stroke-width="1" />
      <path d="M 0 0 L 0 40 L 40 60 L 40 20 Z" fill="none" stroke="#00e5ff" stroke-width="1" />
      <path d="M 80 0 L 80 40 L 40 60 Z" fill="none" stroke="#00e5ff" stroke-width="1" />
      <circle cx="40" cy="20" r="3" fill="#ffffff" />
    </g>
  </g>

  
  <g fill="#ffffff" opacity="0.4">
    <circle cx="300" cy="200" r="1.5" />
    <circle cx="450" cy="150" r="2" />
    <circle cx="700" cy="250" r="1" />
    <circle cx="850" cy="180" r="2.5" />
    <circle cx="200" cy="350" r="1" />
    <circle cx="600" cy="480" r="1.5" />
    <circle cx="780" cy="420" r="2" />
  </g>

  
  <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0" />
    <stop offset="100%" stop-color="#050811" stop-opacity="0.65" />
  </radialGradient>
  <rect width="1200" height="675" fill="url(#vignette)" pointer-events="none" />
</svg>