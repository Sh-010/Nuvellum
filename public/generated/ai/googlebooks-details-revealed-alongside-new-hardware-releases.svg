<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="50% " stop-color="#141c2c"/>
      <stop offset="100%" stop-color="#1e1828"/>
    </linearGradient>

    
    <linearGradient id="lid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="40%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>

    
    <linearGradient id="screen-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2234"/>
      <stop offset="100%" stop-color="#0f1520"/>
    </linearGradient>

    
    <radialGradient id="android-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34a853" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#34a853" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="hardware-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4285f4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4285f4" stop-opacity="0"/>
    </radialGradient>

    
    <radialGradient id="decade-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbc05" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbc05" stop-opacity="0"/>
    </radialGradient>

    
    <linearGradient id="phone-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a344a"/>
      <stop offset="100%" stop-color="#151b26"/>
    </linearGradient>

    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="url(#bg-grad)"/>

  
  <circle cx="300" cy="300" r="350" fill="url(#android-glow)" />
  <circle cx="900" cy="350" r="400" fill="url(#hardware-glow)" />
  <circle cx="600" cy="200" r="300" fill="url(#decade-glow)" />

  
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="550" x2="1200" y2="550" />
    <line x1="200" y1="0" x2="200" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="1000" y1="0" x2="1000" y2="675" />
  </g>

  
  <g transform="translate(0, 30)">

    
    <ellipse cx="600" cy="530" rx="360" ry="40" fill="#000000" opacity="0.7" filter="url(#soft-shadow)" />

    
    <g>
      
      <path d="M 220 480 L 980 480 L 1020 520 L 180 520 Z" fill="#0b0f17" />
      
      
      <path d="M 180 520 L 1020 520 L 1030 525 L 170 525 Z" fill="#4a5568" opacity="0.8" />

      
      <path d="M 200 450 L 1000 450 L 980 480 L 220 480 Z" fill="url(#lid-grad)" />

      
      <rect x="520" y="458" width="160" height="18" rx="4" fill="#1a202c" stroke="#4a5568" stroke-width="1.5" opacity="0.9" />

      
      <path d="M 260 415 L 940 415 L 960 450 L 240 450 Z" fill="#151a23" />
      
      
      <line x1="275" y1="422" x2="925" y2="422" stroke="#2d3748" stroke-width="3" stroke-linecap="round" />
      <line x1="270" y1="431" x2="930" y2="431" stroke="#2d3748" stroke-width="3" stroke-linecap="round" />
      <line x1="265" y1="440" x2="935" y2="440" stroke="#2d3748" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <rect x="350" y="445" width="500" height="8" rx="3" fill="#0f141d" />

    
    <g>
      
      <path d="M 220 150 L 980 150 L 1000 450 L 200 450 Z" fill="url(#lid-grad)" filter="url(#soft-shadow)" />

      
      <rect x="215" y="145" width="770" height="310" rx="12" fill="#0a0e14" />
      
      
      <rect x="225" y="155" width="750" height="290" rx="6" fill="url(#screen-bg)" />

      
      
      <circle cx="250" cy="175" r="4" fill="#ff5f56" />
      <circle cx="265" cy="175" r="4" fill="#ffbd2e" />
      <circle cx="280" cy="175" r="4" fill="#27c93f" />

      
      <g transform="translate(600, 300)">
        
        <circle cx="0" cy="0" r="95" fill="none" stroke="#fbbc05" stroke-width="2" stroke-dasharray="8 4" opacity="0.4" />
        <circle cx="0" cy="0" r="85" fill="none" stroke="#34a853" stroke-width="3" opacity="0.6" />
        
        
        <rect x="-140" y="-55" width="280" height="110" rx="12" fill="#141a26" stroke="#34a853" stroke-width="1.5" opacity="0.95" filter="url(#soft-shadow)" />

        
        <g transform="translate(-110, -25)">
          <rect x="0" y="0" width="10" height="50" rx="3" fill="#34a853" />
          <rect x="15" y="-10" width="10" height="60" rx="3" fill="#4285f4" />
          <rect x="30" y="-20" width="10" height="70" rx="3" fill="#fbbc05" />
          <rect x="45" y="-30" width="10" height="80" rx="3" fill="#ea4335" />
        </g>

        
        <path d="M -30 0 Q 0 -25 30 0 T 90 0" fill="none" stroke="#34a853" stroke-width="4" stroke-linecap="round" />
        
        
        <circle cx="-30" cy="0" r="6" fill="#34a853" />
        <circle cx="30" cy="0" r="6" fill="#4285f4" />
        <circle cx="90" cy="0" r="6" fill="#fbbc05" />
      </g>

      
      <circle cx="600" cy="150" r="3" fill="#2d3748" />
    </g>

    
    <g transform="translate(920, 260) rotate(12)" filter="url(#soft-shadow)">
      
      <rect x="-45" y="-90" width="90" height="180" rx="16" fill="url(#phone-body)" stroke="#4a5568" stroke-width="2" />
      
      <rect x="-39" y="-82" width="78" height="164" rx="12" fill="#0c1017" />
      
      
      <circle cx="0" cy="-15" r="22" fill="#34a853" opacity="0.2" filter="url(#glow)" />
      <path d="M -10 -5 L -10 15 M 10 -5 L 10 15 M -15 -10 L 15 -10" stroke="#34a853" stroke-width="3" stroke-linecap="round" />
      <circle cx="-6" cy="-18" r="2" fill="#34a853" />
      <circle cx="6" cy="-18" r="2" fill="#34a853" />

      
      <path d="M -50 0 C -120 -20 -180 50 -240 80" fill="none" stroke="url(#android-glow)" stroke-width="4" stroke-dasharray="6 6" />
    </g>

    
    
    <g transform="translate(0, -10)" opacity="0.8">
      
      <rect x="110" y="320" width="45" height="45" rx="8" fill="#1a2234" stroke="#4285f4" stroke-width="1.5" transform="rotate(15 132 342)" />
      

      
      <rect x="140" y="420" width="40" height="40" rx="8" fill="#1a2234" stroke="#ea4335" stroke-width="1.5" transform="rotate(-10 160 440)" />
      
      
      <rect x="1050" y="280" width="45" height="45" rx="8" fill="#1a2234" stroke="#fbbc05" stroke-width="1.5" transform="rotate(-20 1072 302)" />

      
      <rect x="1020" y="380" width="40" height="40" rx="8" fill="#1a2234" stroke="#34a853" stroke-width="1.5" transform="rotate(25 1040 400)" />
    </g>

    
    <g fill="#ffffff" opacity="0.6">
      <circle cx="350" cy="180" r="2" />
      <circle cx="850" cy="140" r="1.5" />
      <circle cx="780" cy="460" r="2.5" />
      <circle cx="420" cy="490" r="1.5" />
      <circle cx="960" cy="220" r="2" />
      <circle cx="240" cy="280" r="3" fill="#fbbc05" opacity="0.8" />
      <circle cx="880" cy="400" r="2" fill="#34a853" opacity="0.8" />
    </g>

  </g>
</svg>