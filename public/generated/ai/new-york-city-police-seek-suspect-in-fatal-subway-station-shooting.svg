<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  
  <defs>
    
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      
        
      
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.92" />
        <feFuncG type="linear" slope="0.90" />
        <feFuncB type="linear" slope="0.86" />
      </feComponentTransfer>
      <feBlend mode="multiply" in="SourceGraphic" result="blend" />
    </filter>

    
    <pattern id="tile-hatch" width="20" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#2a221c" stroke-width="0.5" stroke-opacity="0.15" />
      <line x1="0" y1="0" x2="0" y2="10" stroke="#2a221c" stroke-width="0.5" stroke-opacity="0.15" />
    </pattern>

    
    <pattern id="cross-hatch" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="6" y2="6" stroke="#2a221c" stroke-width="0.75" stroke-opacity="0.3" />
      <line x1="6" y1="0" x2="0" y2="6" stroke="#2a221c" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="#efe8db" />

  
  <rect width="1200" height="675" filter="url(#paper-texture)" opacity="0.4" />

  
  
