<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  
  <defs>
    
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0.3 0 0 0 0.2  0 0.3 0 0 0.2  0 0 0.3 0 0.2  0 0 0 0.08 0" in="noise" result="coloredNoise"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>

    
    <pattern id="hatch-dense" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.8" opacity="0.15"/>
    </pattern>
    <pattern id="hatch-sparse" width="16" height="16" patternTransform="rotate(-30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#2a221c" stroke-width="0.8" opacity="0.1"/>
    </pattern>

    
    <pattern id="pitch-stripes" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <rect x="0" y="0" width="30" height="60" fill="#e5dfd3"/>
      <rect x="30" y="0" width="30" height="60" fill="#d9d2c4"/>
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="#efe8db"/>
  
  
  <rect width="1200" height="675" filter="url(#paper-texture)" opacity="0.6"/>

  
