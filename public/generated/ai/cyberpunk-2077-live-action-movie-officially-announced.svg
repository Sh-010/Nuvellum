<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  
  <defs>
    
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      
        
      
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.92" />
        <feFuncG type="linear" slope="0.90" />
        <feFuncB type="linear" slope="0.86" />
      </feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic" />
    </filter>

    
    <pattern id="dot-grid" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1" fill="#2a221c" opacity="0.15" />
    </pattern>

    <pattern id="hatch-fine" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#2a221c" stroke-width="1" opacity="0.2" />
    </pattern>

    <pattern id="hatch-burgundy" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#661227" stroke-width="1.5" opacity="0.3" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="#f3ecdf" />
  <rect width="1200" height="675" filter="url(#paper-texture)" opacity="0.7" />

  
  <g stroke="#2a221c" stroke-width="1.5" opacity="0.4">
    <line x1="80" y1="60" x2="1120" y2="60" />
    <line x1="80" y1="615" x2="1120" y2="615" />
    <line x1="80" y1="60" x2="80" y2="615" />
    <line x1="1120" y1="60" x2="1120" y2="615" />
  </g>
  <g stroke="#661227" stroke-width="3" opacity="0.8">
    <line x1="84" y1="64" x2="1116" y2="64" />
    <line x1="84" y1="611" x2="1116" y2="611" />
  </g>

  
  <g opacity="0.25">
    
    <rect x="150" y="200" width="70" height="411" fill="#2a221c" />
    <rect x="230" y="280" width="55" height="331" fill="#2a221c" />
    <rect x="300" y="160" width="90" height="451" fill="#2a221c" />
    <rect x="410" y="240" width="60" height="371" fill="#2a221c" />
    
    <rect x="730" y="220" width="80" height="391" fill="#2a221c" />
    <rect x="830" y="150" width="100" height="461" fill="#2a221c" />
    <rect x="950" y="260" width="65" height="351" fill="#2a221c" />
  </g>

  
  <g stroke="#2a221c" stroke-width="0.5" opacity="0.3">
    <line x1="310" y1="180" x2="380" y2="180" />
    <line x1="310" y1="210" x2="380" y2="210" />
    <line x1="310" y1="240" x2="380" y2="240" />
    <line x1="310" y1="270" x2="380" y2="270" />
    
    <line x1="840" y1="180" x2="920" y2="180" />
    <line x1="840" y1="210" x2="920" y2="210" />
    <line x1="840" y1="240" x2="920" y2="240" />
    <line x1="840" y1="270" x2="920" y2="270" />
    <line x1="840" y1="300" x2="920" y2="300" />
