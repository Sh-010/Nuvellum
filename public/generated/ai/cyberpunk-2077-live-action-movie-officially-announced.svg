    <line x1="200" y1="603" x2="200" y2="611" />
    <line x1="400" y1="603" x2="400" y2="611" />
    <line x1="600" y1="599" x2="600" y2="611" stroke-width="1.5" />
    <line x1="800" y1="603" x2="800" y2="611" />
    <line x1="1000" y1="603" x2="1000" y2="611" />
  </g>

  
  <rect x="112" y="64" width="976" height="547" fill="none" stroke="#2a221c" stroke-width="1" opacity="0.2" />
</svg>