  <g transform="translate(600, 337)">
    
    <circle cx="0" cy="0" r="180" fill="none" stroke="#2a221c" stroke-width="2" opacity="0.6" />
    <circle cx="0" cy="0" r="172" fill="none" stroke="#661227" stroke-width="1" stroke-dasharray="8 4" opacity="0.7" />
