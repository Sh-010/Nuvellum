    <g transform="translate(-110, -110)">
      
      <rect x="0" y="45" width="220" height="150" rx="4" fill="#2a221c" stroke="#661227" stroke-width="2" />
      <rect x="15" y="60" width="190" height="120" fill="url(#dot-grid)" />
      
      
      <path d="M-5,38 L225,12 L225,42 L-5,68 Z" fill="#661227" stroke="#2a221c" stroke-width="2" />
      
      
      <path d="M20,32 L35,28 L35,54 L20,58 Z" fill="#f3ecdf" />
      <path d="M60,27 L75,23 L75,49 L60,53 Z" fill="#f3ecdf" />
      <path d="M100,22 L115,18 L115,44 L100,48 Z" fill="#f3ecdf" />
