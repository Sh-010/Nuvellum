  <g fill="#2a221c">
    
    <rect x="80" y="60" width="24" height="555" opacity="0.9" />
    <rect x="104" y="60" width="8" height="555" fill="#661227" opacity="0.8" />
    <rect x="80" y="60" width="32" height="555" fill="url(#hatch-fine)" />

    
