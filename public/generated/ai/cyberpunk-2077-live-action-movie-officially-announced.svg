      <line x1="30" y1="110" x2="140" y2="110" stroke="#f3ecdf" stroke-width="1" opacity="0.5" />
      <line x1="30" y1="130" x2="80" y2="130" stroke="#f3ecdf" stroke-width="1" opacity="0.5" />
      
      
      <path d="M170,120 L190,120 M180,110 L180,130" stroke="#661227" stroke-width="1.5" />
    </g>

    
    <path d="M-210,0 L-190,0 M190,0 L210,0 M0,-210 L0,-190 M0,190 L0,210" stroke="#661227" stroke-width="2" opacity="0.8" />
    
    
    <path d="M-150,-130 L-170,-130 L-170,-110" fill="none" stroke="#2a221c" stroke-width="2" />
    <path d="M150,-130 L170,-130 L170,-110" fill="none" stroke="#2a221c" stroke-width="2" />
    <path d="M-150,130 L-170,130 L-170,110" fill="none" stroke="#2a221c" stroke-width="2" />
    <path d="M150,130 L170,130 L170,110" fill="none" stroke="#2a221c" stroke-width="2" />
