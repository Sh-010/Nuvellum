  <g stroke="#2a221c" stroke-width="1" opacity="0.5">
    
    <line x1="200" y1="64" x2="200" y2="72" />
    <line x1="400" y1="64" x2="400" y2="72" />
    <line x1="600" y1="64" x2="600" y2="76" stroke-width="1.5" />
