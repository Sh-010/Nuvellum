<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <radialGradient id="paper-grad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#f8f4ec"/>
      <stop offset="60%" stop-color="#f3ecdf"/>
      <stop offset="100%" stop-color="#e8decb"/>
    </radialGradient>
    
    
    <pattern id="hatch-fine" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.6" stroke-opacity="0.25"/>
    </pattern>
    <pattern id="hatch-dense" width="4" height="4" patternTransform="rotate(30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#661227" stroke-width="0.8" stroke-opacity="0.3"/>
    </pattern>
    <pattern id="crosshatch" width="6" height="6" patternTransform="rotate(60 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2a221c" stroke-width="0.5" stroke-opacity="0.2"/>
      <line x1="0" y1="0" x2="6" y2="0" stroke="#2a221c" stroke-width="0.5" stroke-opacity="0.2"/>
    </pattern>

    
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
