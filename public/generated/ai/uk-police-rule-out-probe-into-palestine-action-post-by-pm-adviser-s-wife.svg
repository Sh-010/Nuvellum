<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  
  <defs>
    <radialGradient id="paper-vignette" cx="600" cy="337.5" r="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7f2ea"/>
      <stop offset="60%" stop-color="#f3ecdf"/>
      <stop offset="100%" stop-color="#e8decb"/>
    </radialGradient>
    
    <pattern id="fine-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.75" stroke-opacity="0.15"/>
    </pattern>

    <pattern id="cross-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#661227" stroke-width="0.6" stroke-opacity="0.2"/>
      <line x1="0" y1="0" x2="6" y2="0" stroke="#661227" stroke-width="0.6" stroke-opacity="0.2"/>
    </pattern>

    <filter id="ink-bleed" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="url(#paper-vignette)"/>

  
  <g stroke="#2a221c" stroke-opacity="0.08" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="575" x2="1200" y2="575"/>
  </g>

  
  

  
  <g id="legal-framework" transform="translate(260, 150)">
    
    <path d="M 100,320 L 100,80" fill="none" stroke="#2a221c" stroke-width="3" stroke-linecap="round"/>
    <polygon points="80,320 120,320 135,340 65,340" fill="#2a221c" stroke="#2a221c" stroke-width="2"/>
    
    
    <path d="M 20,110 L 180,110" fill="none" stroke="#2a221c" stroke-width="3"/>
    <circle cx="100" cy="110" r="8" fill="#661227"/>

    
    <path d="M 20,110 L 5,200 L 35,200 Z" fill="none" stroke="#2a221c" stroke-width="1.5"/>
    <path d="M 5,200 Q 20,225 35,200 Z" fill="#d9d0c1" stroke="#2a221c" stroke-width="1.5"/>
    <line x1="20" y1="110" x2="20" y2="200" stroke="#2a221c" stroke-width="1"/>

    
    <path d="M 180,110 L 165,230 L 195,230 Z" fill="none" stroke="#2a221c" stroke-width="1.5"/>
    <path d="M 165,230 Q 180,255 195,230 Z" fill="#661227" fill-opacity="0.15" stroke="#661227" stroke-width="1.5"/>
    <line x1="180" y1="110" x2="180" y2="230" stroke="#2a221c" stroke-width="1"/>
  </g>

  
  <g id="publishing-motif" transform="translate(680, 180)">
    
    
    <g transform="translate(0, 180)">
      <path d="M 0,20 L 240,0 L 280,40 L 40,60 Z" fill="#e8decb" stroke="#2a221c" stroke-width="2"/>
      <path d="M 0,20 L 40,60 L 40,80 L 0,40 Z" fill="#2a221c" fill-opacity="0.1"/>
      <path d="M 240,0 L 280,40 L 280,60 L 240,20 Z" fill="#2a221c" fill-opacity="0.2"/>
    </g>

    
    <g transform="translate(20, 110)">
      <path d="M 0,20 L 240,0 L 280,40 L 40,60 Z" fill="#f3ecdf" stroke="#2a221c" stroke-width="2"/>
      <path d="M 0,20 L 40,60 L 40,80 L 0,40 Z" fill="#2a221c" fill-opacity="0.15"/>
      <path d="M 240,0 L 280,40 L 280,60 L 240,20 Z" fill="#2a221c" fill-opacity="0.25"/>
      
      <rect x="60" y="25" width="160" height="20" fill="url(#fine-hatch)"/>
    </g>

    
    <g transform="translate(40, 30)">
      
      <path d="M 0,20 Q 100,0 120,10 L 120,120 Q 100,110 0,120 Z" fill="#fcf9f2" stroke="#2a221c" stroke-width="2"/>
      
      <path d="M 130,10 Q 150,0 250,20 L 250,120 Q 150,110 130,120 Z" fill="#fcf9f2" stroke="#2a221c" stroke-width="2"/>
      
      <line x1="125" y1="5" x2="125" y2="115" stroke="#2a221c" stroke-width="3" stroke-opacity="0.3"/>
      
      
      <g stroke="#2a221c" stroke-width="1.5" stroke-opacity="0.4">
        <line x1="20" y1="35" x2="95" y2="30"/>
        <line x1="20" y1="50" x2="100" y2="45"/>
        <line x1="20" y1="65" x2="85" y2="60"/>
        <line x1="20" y1="80" x2="90" y2="75"/>
        
        <line x1="155" y1="30" x2="230" y2="35"/>
        <line x1="155" y1="45" x2="235" y2="50"/>
        <line x1="155" y1="60" x2="220" y2="65"/>
        <line x1="155" y1="75" x2="225" y2="80"/>
      </g>
    </g>

    
    <path d="M 150,140 L 150,240 L 170,270 L 190,240 L 190,140 Z" fill="#661227" stroke="#2a221c" stroke-width="1.5"/>
    <path d="M 150,240 L 170,270 L 190,240 Z" fill="url(#cross-hatch)"/>
  </g>

  
  
  <g transform="translate(0, 0)">
    
    <line x1="150" y1="480" x2="1050" y2="480" stroke="#661227" stroke-width="2.5" stroke-dasharray="12 6" filter="url(#ink-bleed)"/>
    
    
    <path d="M 150,465 L 150,495" stroke="#661227" stroke-width="3"/>
    <path d="M 1050,465 L 1050,495" stroke="#661227" stroke-width="3"/>
    
    
    <line x1="120" y1="530" x2="1080" y2="530" stroke="#2a221c" stroke-width="1.5"/>
    <line x1="200" y1="535" x2="1000" y2="535" stroke="#2a221c" stroke-width="0.75"/>
  </g>

  
  <g transform="translate(560, 310) rotate(-25)">
    
    <path d="M 20,0 L 60,0 L 45,120 L 35,120 Z" fill="#2a221c"/>
    
    <path d="M 35,120 L 45,120 L 40,145 Z" fill="#661227"/>
    
    <circle cx="40" cy="50" r="4" fill="#f3ecdf"/>
    
    <line x1="40" y1="54" x2="40" y2="120" stroke="#f3ecdf" stroke-width="1.5"/>
    
    <rect x="25" y="15" width="30" height="6" fill="#661227"/>
  </g>

  
  <g stroke="#2a221c" stroke-width="1.5" fill="none" opacity="0.6">
    
    <path d="M 50,80 L 50,50 L 80,50"/>
    <circle cx="50" cy="50" r="3" fill="#2a221c"/>
    
    
    <path d="M 1150,80 L 1150,50 L 1120,50"/>
    <circle cx="1150" cy="50" r="3" fill="#2a221c"/>
    
    
    <path d="M 50,595 L 50,625 L 80,625"/>
    <circle cx="50" cy="625" r="3" fill="#2a221c"/>
    
    
    <path d="M 1150,595 L 1150,625 L 1120,625"/>
    <circle cx="1150" cy="625" r="3" fill="#2a221c"/>
  </g>

  
  <g opacity="0.4">
    
    <ellipse cx="360" cy="492" rx="70" ry="8" fill="#2a221c" opacity="0.25"/>
    
    <ellipse cx="820" cy="410" rx="110" ry="12" fill="#2a221c" opacity="0.25"/>
  </g>

</svg>