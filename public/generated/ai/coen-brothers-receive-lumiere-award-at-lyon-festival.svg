<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  
  <defs>
    
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f0e6"/>
      <stop offset="50%" stop-color="#f1eae0"/>
      <stop offset="100%" stop-color="#e9e0d2"/>
    </linearGradient>

    
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000000" stop-color-opacity="0"/>
      <stop offset="100%" stop-color="#3d2c22" stop-color-opacity="0.12"/>
    </radialGradient>

    
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.17  0 0 0 0 0.14  0 0 0 0.05 0" in="noise" result="coloredNoise"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>

    
    <pattern id="hatchBurgundy" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#661227" stroke-width="1.5"/>
    </pattern>
    <pattern id="hatchCharcoal" width="8" height="8" patternTransform="rotate(-30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="1"/>
    </pattern>
    <pattern id="dotShading" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.8" fill="#544438"/>
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="url(#paperGrad)"/>
  <rect width="1200" height="675" filter="url(#paperGrain)" opacity="0.6"/>

  
  <rect x="35" y="35" width="1130" height="605" fill="none" stroke="#2a221c" stroke-width="1.5"/>
