    <circle cx="0" cy="0" r="130" fill="none" stroke="#661227" stroke-width="1" stroke-dasharray="8 4" opacity="0.4"/>
    
    
    <circle cx="0" cy="0" r="105" fill="#f3ecdf" stroke="#2a221c" stroke-width="2" filter="url(#soft-shadow)"/>
    <circle cx="0" cy="0" r="95" fill="#661227"/>

    
    <circle cx="0" cy="0" r="95" fill="url(#dense-hatch)" opacity="0.5"/>

    
    <circle cx="0" cy="0" r="75" fill="#f3ecdf" stroke="#2a221c" stroke-width="1.5"/>

    
    
    <g transform="translate(0, -10)">
      
      <path d="M 0 -45 C 25 -45 35 -20 40 10 C 45 40 60 70 75 85 L -75 85 C -60 70 -45 40 -40 10 C -35 -20 -25 -45 0 -45 Z" fill="#661227" stroke="#2a221c" stroke-width="1.5"/>
      
      
