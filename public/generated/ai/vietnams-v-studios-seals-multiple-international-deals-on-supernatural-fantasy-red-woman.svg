      <rect x="-77" y="-6" width="6" height="12" rx="1"/>
      
      <rect x="71" y="-6" width="6" height="12" rx="1"/>
    </g>
  </g>

  
  
  <g fill="none" stroke="#2a221c" stroke-width="1.5">
    <path d="M 80 560 C 150 560 180 480 250 480 C 320 480 380 540 460 520 C 510 507 550 430 570 380" stroke-dasharray="12 4 4 4"/>
    <path d="M 86 566 C 156 566 186 486 256 486 C 326 486 386 546 466 526 C 516 513 556 436 576 386" opacity="0.4"/>
  </g>

  
