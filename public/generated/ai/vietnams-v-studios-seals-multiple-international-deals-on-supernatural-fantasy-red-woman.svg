  </g>

  
  <line x1="60" y1="60" x2="1140" y2="60" stroke="#2a221c" stroke-width="0.75" opacity="0.4"/>
  <line x1="60" y1="615" x2="1140" y2="615" stroke="#2a221c" stroke-width="0.75" opacity="0.4"/>
  
  
  <path d="M 50 70 L 70 50 M 1150 70 L 1130 50 M 50 605 L 70 625 M 1150 605 L 1130 625" stroke="#2a221c" stroke-width="1.5" fill="none"/>
</svg>