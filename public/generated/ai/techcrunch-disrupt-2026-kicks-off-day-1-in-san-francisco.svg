<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  
  <defs>
    
    <radialGradient id="paperGrad" cx="600" cy="337" r="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8f4ec"/>
      <stop offset="60%" stop-color="#f3ecdf"/>
      <stop offset="100%" stop-color="#eae2d2"/>
    </radialGradient>
    
    
    <pattern id="blueprintGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a221c" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>

    
    <pattern id="hatchBurgundy" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#661227" stroke-width="1.5" stroke-opacity="0.15"/>
    </pattern>
    <pattern id="hatchInk" width="6" height="6" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2a221c" stroke-width="1" stroke-opacity="0.12"/>
    </pattern>

    
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#2a221c" flood-opacity="0.1"/>
    </filter>
    <filter id="crispShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#2a221c" flood-opacity="0.15"/>
    </filter>
  </defs>

  
