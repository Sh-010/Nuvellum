<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  
  <defs>
    
    <radialGradient id="bgGradient" cx="60%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#f7f2ea" />
      <stop offset="60%" stop-color="#efe8db" />
      <stop offset="100%" stop-color="#e3dac9" />
    </radialGradient>

    
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="70%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#2a221c" stop-opacity="0.12" />
    </radialGradient>

    
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a162f" />
      <stop offset="100%" stop-color="#540e1f" />
    </linearGradient>

    
    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#382e27" />
      <stop offset="100%" stop-color="#201a15" />
    </linearGradient>

    
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b5ab9e" />
      <stop offset="100%" stop-color="#c8bfb3" />
    </linearGradient>

    
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#2a221c" flood-opacity="0.15" />
    </filter>
    
    <filter id="deepShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#2a221c" flood-opacity="0.25" />
    </filter>

    
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.8" stroke-opacity="0.15" />
    </pattern>
    <pattern id="hatchDense" width="4" height="4" patternTransform="rotate(30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#661227" stroke-width="0.8" stroke-opacity="0.2" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="url(#bgGradient)" />
  <rect width="1200" height="675" fill="url(#vignette)" />

  
  <g opacity="0.35">
    
