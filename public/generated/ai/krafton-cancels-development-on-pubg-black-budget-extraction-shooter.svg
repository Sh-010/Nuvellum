<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <rect id="bg" width="1200" height="675" fill="#f3ecdf"/>
    
    
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e3d8c5" stroke-width="0.75"/>
    </pattern>

    
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.8" stroke-opacity="0.25"/>
    </pattern>

    <pattern id="hatch-burgundy" width="6" height="6" patternTransform="rotate(-30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#661227" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>

    
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#2a221c" flood-opacity="0.12"/>
    </filter>
  </defs>

  
  
  <rect width="1200" height="675" fill="url(#grid)"/>

  
  <line x1="80" y1="60" x2="1120" y2="60" stroke="#2a221c" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="80" y1="615" x2="1120" y2="615" stroke="#2a221c" stroke-width="1.5" stroke-opacity="0.3"/>

  

  <g transform="translate(150, 90)">
    
    <g filter="url(#shadow)">
      
      <polygon points="50,40 850,20 880,480 70,510" fill="#ede3d2" stroke="#2a221c" stroke-width="2"/>
      
      
      <path d="M 120,120 Q 300,80 500,150 T 800,100" fill="none" stroke="#2a221c" stroke-width="1" stroke-dasharray="4,4"/>
      <path d="M 100,220 Q 350,150 550,280 T 820,200" fill="none" stroke="#2a221c" stroke-width="1.5"/>
      <path d="M 130,350 Q 280,300 480,380 T 850,300" fill="none" stroke="#2a221c" stroke-width="1" stroke-dasharray="2,4"/>
      <path d="M 90,430 Q 320,400 520,450 T 830,420" fill="none" stroke="#2a221c" stroke-width="1.2"/>

      
      <circle cx="320" cy="210" r="18" fill="none" stroke="#661227" stroke-width="2"/>
      <line x1="305" y1="195" x2="335" y2="225" stroke="#661227" stroke-width="2"/>
      <line x1="305" y1="225" x2="335" y2="195" stroke="#661227" stroke-width="2"/>

      <circle cx="680" cy="320" r="14" fill="none" stroke="#661227" stroke-width="2"/>
      <line x1="669" y1="309" x2="691" y2="331" stroke="#661227" stroke-width="2"/>
      <line x1="669" y1="331" x2="691" y2="309" stroke="#661227" stroke-width="2"/>
    </g>

    
    <g filter="url(#shadow)">
      <polygon points="30,180 890,140 890,220 30,260" fill="#661227" opacity="0.9"/>
      <polygon points="30,180 890,140 890,148 30,188" fill="#400b18" opacity="0.95"/>
      
      
      <polygon points="100,172 400,154 400,194 100,212" fill="url(#hatch-burgundy)"/>
      <polygon points="500,148 800,130 800,170 500,188" fill="url(#hatch-burgundy)"/>
    </g>

    
    <g transform="translate(600, 350) rotate(-25)" filter="url(#shadow)">
      
      <line x1="0" y1="0" x2="-40" y2="180" stroke="#2a221c" stroke-width="4" stroke-linecap="round"/>
      
      <line x1="0" y1="0" x2="40" y2="180" stroke="#2a221c" stroke-width="4" stroke-linecap="round"/>
      
      <circle cx="0" cy="0" r="8" fill="#2a221c"/>
      <circle cx="0" cy="0" r="4" fill="#f3ecdf"/>
      
      <line x1="-15" y1="-5" x2="15" y2="-5" stroke="#2a221c" stroke-width="3"/>
    </g>

    
    <g filter="url(#shadow)">
      <polygon points="740,60 820,30 850,90 770,110" fill="#dfd3be" stroke="#2a221c" stroke-width="1.5"/>
      <line x1="755" y1="75" x2="835" y2="60" stroke="#661227" stroke-width="1.5"/>
    </g>

    <g filter="url(#shadow)">
      <polygon points="120,400 190,370 210,430 140,460" fill="#dfd3be" stroke="#2a221c" stroke-width="1.5"/>
      <line x1="130" y1="420" x2="190" y2="405" stroke="#661227" stroke-width="1.5"/>
    </g>

    
    <g stroke="#2a221c" stroke-width="1" opacity="0.6">
      
      <line x1="35" y1="40" x2="45" y2="40"/>
      <line x1="40" y1="40" x2="40" y2="510"/>
      <line x1="35" y1="150" x2="45" y2="150"/>
      <line x1="35" y1="260" x2="45" y2="260"/>
      <line x1="35" y1="370" x2="45" y2="370"/>
      <line x1="35" y1="510" x2="45" y2="510"/>

      
      <line x1="50" y1="520" x2="50" y2="530"/>
      <line x1="50" y1="525" x2="880" y2="525"/>
      <line x1="250" y1="520" x2="250" y2="530"/>
      <line x1="465" y1="520" x2="465" y2="530"/>
      <line x1="680" y1="520" x2="680" y2="530"/>
      <line x1="880" y1="520" x2="880" y2="530"/>
    </g>

    
    <g transform="translate(200, 280) rotate(15)" filter="url(#shadow)">
      <rect x="-35" y="-20" width="70" height="40" rx="3" fill="#2a221c"/>
      <circle cx="0" cy="-20" r="4" fill="none" stroke="#f3ecdf" stroke-width="1.5"/>
      <line x1="-25" y1="0" x2="25" y2="0" stroke="#661227" stroke-width="3"/>
      
      <path d="M 5,-20 L 2, -7 L 8, 7 L -1, 20" fill="none" stroke="#f3ecdf" stroke-width="1.5"/>
    </g>

  </g>
</svg>