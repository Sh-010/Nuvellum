<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121824"/>
      <stop offset="40%" stop-color="#1c2536"/>
      <stop offset="80%" stop-color="#2a3245"/>
      <stop offset="100%" stop-color="#3b4255"/>
    </linearGradient>

    
    <linearGradient id="rainMist" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7e8c9d" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#5a6878" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#323d4c" stop-opacity="0.8"/>
    </linearGradient>

    
    <linearGradient id="distantMts" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3748"/>
      <stop offset="100%" stop-color="#1a222d"/>
    </linearGradient>
    <linearGradient id="midMts" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d4c5e"/>
      <stop offset="100%" stop-color="#212a36"/>
    </linearGradient>
    <linearGradient id="nearMts" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f5f73"/>
      <stop offset="100%" stop-color="#28323f"/>
    </linearGradient>

    
    <linearGradient id="floodWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#203342" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#182736" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f1922" stop-opacity="1.0"/>
    </linearGradient>

    
    <linearGradient id="concreteTower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4e5865"/>
      <stop offset="50%" stop-color="#6a7786"/>
      <stop offset="100%" stop-color="#3a4450"/>
    </linearGradient>

    
    <radialGradient id="moodGlow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0%" stop-color="#546d87" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#121824" stop-opacity="0"/>
    </radialGradient>

    
    <pattern id="rainPattern" width="40" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(-15)">
      <line x1="10" y1="0" x2="10" y2="40" stroke="#a0b4c8" stroke-width="1.2" stroke-opacity="0.4"/>
      <line x1="30" y1="60" x2="30" y2="100" stroke="#899cb0" stroke-width="0.8" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="url(#skyGrad)"/>

  
  <rect width="1200" height="675" fill="url(#moodGlow)"/>

  
  <path d="M-50 380 L80 260 L180 320 L290 220 L400 290 L520 190 L650 280 L780 210 L900 300 L1020 230 L1150 310 L1250 270 L1250 500 L-50 500 Z" fill="url(#distantMts)"/>

  
  <path d="M-50 420 L120 310 L250 380 L370 290 L480 360 L620 270 L750 350 L890 280 L1040 370 L1180 300 L1250 340 L1250 550 L-50 550 Z" fill="url(#midMts)"/>

  
  <path d="M480 360 L520 440 L500 450 L460 380 Z" fill="#28323f" opacity="0.9"/>
  <path d="M890 280 L920 370 L900 380 L870 300 Z" fill="#28323f" opacity="0.95"/>

  
  <path d="M-50 470 L150 390 L320 460 L450 390 L590 470 L730 410 L910 480 L1080 400 L1250 450 L1250 675 L-50 675 Z" fill="url(#nearMts)"/>

  
  <path d="M70 430 Q120 425 180 440 M90 445 Q140 440 200 455 M110 460 Q160 455 220 470" stroke="#354252" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M980 430 Q1030 420 1090 445 M1000 445 Q1050 435 1110 460" stroke="#354252" stroke-width="3" fill="none" opacity="0.5"/>

  
  <g transform="translate(680, 310)">
    
    <path d="M-40 120 L120 120 L100 200 L-20 200 Z" fill="url(#concreteTower)"/>
    
    <path d="M 0 120 Q 40 150 20 210 Q 50 230 40 250" stroke="#72899f" stroke-width="12" fill="none" stroke-opacity="0.8" stroke-linecap="round"/>
    <path d="M 30 120 Q 70 150 50 210 Q 80 230 70 260" stroke="#8fa6bc" stroke-width="8" fill="none" stroke-opacity="0.9" stroke-linecap="round"/>

    
    <rect x="20" y="80" width="60" height="40" fill="#323b47" stroke="#5a6878" stroke-width="2"/>
    <rect x="35" y="95" width="12" height="15" fill="#72899f" opacity="0.6"/>
    <rect x="55" y="95" width="12" height="15" fill="#72899f" opacity="0.6"/>

    
    <g transform="translate(140, 40) rotate(12)">
      <line x1="0" y1="0" x2="0" y2="110" stroke="#5a6878" stroke-width="5"/>
      <line x1="-15" y1="20" x2="15" y2="20" stroke="#5a6878" stroke-width="3"/>
      <line x1="-25" y1="50" x2="25" y2="50" stroke="#5a6878" stroke-width="3"/>
      <line x1="-35" y1="90" x2="35" y2="90" stroke="#5a6878" stroke-width="3"/>
      
      <line x1="-15" y1="20" x2="25" y2="50" stroke="#5a6878" stroke-width="2"/>
      <line x1="15" y1="20" x2="-25" y2="50" stroke="#5a6878" stroke-width="2"/>
      <line x1="-25" y1="50" x2="35" y2="90" stroke="#5a6878" stroke-width="2"/>
      
      <path d="M 0 0 Q 70 70 150 140" stroke="#1c2530" stroke-width="3" fill="none"/>
      <path d="M 0 0 Q 110 90 220 170" stroke="#1c2530" stroke-width="2" fill="none"/>
    </g>
  </g>

  
  <path d="M -50 510 
           Q 250 480 500 520 
           Q 750 560 1000 510 
           Q 1150 490 1250 520 
           L 1250 675 
           L -50 675 Z" fill="url(#floodWater)"/>

  
  <path d="M0 550 C 200 530, 350 570, 550 540 C 750 510, 950 560, 1250 535" stroke="#35485c" stroke-width="4" fill="none" opacity="0.7"/>
  <path d="M-50 590 C 180 570, 420 610, 680 575 C 920 540, 1100 600, 1300 570" stroke="#2a3b4c" stroke-width="6" fill="none" opacity="0.8"/>
  <path d="M 100 630 Q 450 590 850 620 T 1250 600" stroke="#182736" stroke-width="10" fill="none" opacity="0.9"/>

  
  <g transform="translate(180, 470)">
    
    <path d="M0 50 L40 20 L80 50 Z" fill="#2d3748" stroke="#4a5568" stroke-width="2"/>
    <rect x="10" y="50" width="60" height="40" fill="#212a36"/>
    
    <rect x="30" y="65" width="20" height="25" fill="#0f171e"/>
    
    <rect x="-10" y="80" width="100" height="20" fill="#182736" opacity="0.9"/>
  </g>

  <g transform="translate(380, 490)">
    <rect x="0" y="20" width="45" height="35" fill="#28323f"/>
    <path d="M-5 20 L22 0 L50 20 Z" fill="#3a4450"/>
    <rect x="12" y="30" width="10" height="15" fill="#121820"/>
  </g>

  
  <rect x="0" y="470" width="1200" height="120" fill="url(#rainMist)" opacity="0.5" style="mix-blend-mode: screen;"/>

  
  <rect width="1200" height="675" fill="url(#rainPattern)" pointer-events="none"/>
  
  
  <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
    <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="90%" stop-color="#0b0f17" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#05080c" stop-opacity="0.85"/>
  </radialGradient>
  <rect width="1200" height="675" fill="url(#vignette)" pointer-events="none"/>

</svg>