    <rect x="10" y="10" width="120" height="160" fill="none" stroke="#661227" stroke-width="1" opacity="0.5" />
    
    <path d="M 70 45 C 50 70, 50 110, 70 140 C 90 110, 90 70, 70 45 Z" fill="url(#hatch-burgundy)" stroke="#661227" stroke-width="1.5" />
