    <line x1="1105" y1="585" x2="1135" y2="585" />
    <line x1="1120" y1="570" x2="1120" y2="600" />
  </g>

  
  <rect width="1200" height="675" filter="url(#paper-grain)" opacity="0.6" pointer-events="none" />

</svg>