    <line x1="600" y1="95" x2="600" y2="585" stroke-dasharray="4 4" />
    <line x1="1000" y1="95" x2="1000" y2="585" stroke-dasharray="4 4" />
  </g>

  
  <path d="M 380 150 
           Q 600 150, 600 240 
           T 820 330
           Q 600 330, 600 420
           T 380 510" 
        fill="none" stroke="#efe8db" stroke-width="72" stroke-linecap="square" />
  
  <path d="M 380 150 
           Q 600 150, 600 240 
           T 820 330
           Q 600 330, 600 420
           T 380 510" 
        fill="none" stroke="#2a221c" stroke-width="3" stroke-linecap="square" />

  
  <path d="M 380 154 
           Q 600 154, 600 244 
