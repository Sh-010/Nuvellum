  <rect x="80" y="55" width="1040" height="565" fill="none" stroke="#2a221c" stroke-width="3" />
  
  
  <g stroke="#2a221c" stroke-width="1.5">
    
    <line x1="65" y1="55" x2="95" y2="55" />
    <line x1="80" y1="40" x2="80" y2="70" />
    
    <line x1="1105" y1="55" x2="1135" y2="55" />
