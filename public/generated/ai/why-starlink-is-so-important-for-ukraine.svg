<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  
  <defs>
    
    <linearGradient id="paperBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f2ea" />
      <stop offset="50%" stop-color="#f3ecdf" />
      <stop offset="100%" stop-color="#eae2d2" />
    </linearGradient>

    
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#2a221c" stop-opacity="0.08" />
    </radialGradient>

    
    
    
    
    

    
    <pattern id="contourHatch" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
