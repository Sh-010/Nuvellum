    </pattern>

    
    <pattern id="skyGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.75" fill="#8c8275" opacity="0.25" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="url(#paperBg)" />
