      <line x1="10" y1="70" x2="70" y2="80" stroke="#2a221c" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="8" y1="90" x2="82" y2="102" stroke="#661227" stroke-width="1.5"/>
      
