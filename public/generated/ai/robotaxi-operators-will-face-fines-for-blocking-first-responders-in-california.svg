<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <radialGradient id="paperGrad" cx="600" cy="337.5" r="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8f4ec"/>
      <stop offset="100%" stop-color="#e8dfd0"/>
    </radialGradient>

    
    <pattern id="hatchBurgundy" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#661227" stroke-width="1.5" opacity="0.3"/>
    </pattern>
    <pattern id="hatchCharcoal" width="10" height="10" patternTransform="rotate(-30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#2a221c" stroke-width="1" opacity="0.2"/>
    </pattern>
    
    
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#2a221c" flood-opacity="0.12"/>
    </filter>
    <filter id="sharpShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="4" dy="6" stdDeviation="2" flood-color="#2a221c" flood-opacity="0.25"/>
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="url(#paperGrad)" />

  
  <g stroke="#2a221c" stroke-width="0.5" opacity="0.15">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="1100" y1="0" x2="1100" y2="675"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="575" x2="1200" y2="575"/>
  </g>

  
  <g id="street-plane">
    
    <polygon points="150,550 1050,550 950,380 250,380" fill="#ded4c5" stroke="#2a221c" stroke-width="2" filter="url(#subtleShadow)"/>
    
    
    <line x1="600" y1="380" x2="600" y2="550" stroke="#661227" stroke-width="3" stroke-dasharray="12,12" opacity="0.7"/>
    <line x1="425" y1="380" x2="350" y2="550" stroke="#2a221c" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.4"/>
    <line x1="775" y1="380" x2="850" y2="550" stroke="#2a221c" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.4"/>
    
    
    <polygon points="250,380 950,380 930,365 270,365" fill="#cbbfae" stroke="#2a221c" stroke-width="1.5"/>
  </g>

  
  <g id="barriers">
    
    <g transform="translate(320, 420)" filter="url(#subtleShadow)">
      <rect x="0" y="0" width="90" height="20" fill="#f8f4ec" stroke="#2a221c" stroke-width="2" rx="2"/>
      
      <path d="M15,0 L25,20 M35,0 L45,20 M55,0 L65,20 M75,0 L85,20" stroke="#661227" stroke-width="6"/>
      <line x1="15" y1="20" x2="25" y2="45" stroke="#2a221c" stroke-width="3"/>
      <line x1="75" y1="20" x2="65" y2="45" stroke="#2a221c" stroke-width="3"/>
    </g>

    <g transform="translate(780, 420)" filter="url(#subtleShadow)">
      <rect x="0" y="0" width="90" height="20" fill="#f8f4ec" stroke="#2a221c" stroke-width="2" rx="2"/>
      <path d="M15,0 L25,20 M35,0 L45,20 M55,0 L65,20 M75,0 L85,20" stroke="#661227" stroke-width="6"/>
      <line x1="15" y1="20" x2="25" y2="45" stroke="#2a221c" stroke-width="3"/>
      <line x1="75" y1="20" x2="65" y2="45" stroke="#2a221c" stroke-width="3"/>
    </g>
  </g>

  
  <g id="robotaxi" filter="url(#sharpShadow)">
    
    <path d="M380,330 L780,330 L870,420 L290,420 Z" fill="#2a221c"/>
    
    
    <path d="M420,330 L740,330 L790,260 L390,260 Z" fill="#e2d9cc" stroke="#2a221c" stroke-width="2"/>
    
    
    <path d="M300,380 L860,380 L870,420 L290,420 Z" fill="#d4c9bc" stroke="#2a221c" stroke-width="2"/>
    <path d="M300,330 L420,330 L390,260 L290,380 Z" fill="#c2b8a9" stroke="#2a221c" stroke-width="2"/>
    <path d="M740,330 L860,330 L870,380 L790,260 Z" fill="#b5ab9c" stroke="#2a221c" stroke-width="2"/>

    
    <polygon points="410,270 435,325 725,325 750,270" fill="#2a221c"/>
    <polygon points="415,272 438,323 550,323 540,272" fill="url(#hatchCharcoal)"/>
    <polygon points="610,272 722,323 745,272 610,272" fill="url(#hatchCharcoal)"/>

    
    <g transform="translate(570, 245)">
      <rect x="-15" y="0" width="30" height="15" rx="4" fill="#661227" stroke="#2a221c" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="15" ry="6" fill="#8a1a35" stroke="#2a221c" stroke-width="1.5"/>
      <line x1="0" y1="-6" x2="0" y2="-15" stroke="#2a221c" stroke-width="2"/>
      <circle cx="0" cy="-15" r="3" fill="#2a221c"/>
    </g>

    
    <g id="wheels">
      
      <ellipse cx="340" cy="405" rx="18" ry="25" fill="#1a1412" stroke="#2a221c" stroke-width="2"/>
      <ellipse cx="340" cy="405" rx="10" ry="15" fill="#661227"/>
      
      <ellipse cx="810" cy="405" rx="18" ry="25" fill="#1a1412" stroke="#2a221c" stroke-width="2"/>
      <ellipse cx="810" cy="405" rx="10" ry="15" fill="#661227"/>
    </g>

    
    <g transform="translate(565, 305)">
      <rect x="0" y="0" width="40" height="12" fill="url(#hatchBurgundy)" stroke="#661227" stroke-width="1.5"/>
    </g>
  </g>

  
  <g id="emergency-responder" transform="translate(100, 150)" opacity="0.95" filter="url(#subtleShadow)">
    
    <rect x="50" y="120" width="220" height="110" fill="#661227" stroke="#2a221c" stroke-width="2" rx="4"/>
    
    <polygon points="270,140 340,140 340,230 270,230" fill="#661227" stroke="#2a221c" stroke-width="2"/>
    
    <polygon points="290,155 330,155 330,195 290,195" fill="#e2d9cc" stroke="#2a221c" stroke-width="1.5"/>
    
    <line x1="70" y1="140" x2="250" y2="140" stroke="#f8f4ec" stroke-width="3"/>
    <line x1="70" y1="150" x2="250" y2="150" stroke="#f8f4ec" stroke-width="1.5"/>
    <line x1="80" y1="140" x2="80" y2="150" stroke="#2a221c" stroke-width="1.5"/>
    <line x1="110" y1="140" x2="110" y2="150" stroke="#2a221c" stroke-width="1.5"/>
    <line x1="140" y1="140" x2="140" y2="150" stroke="#2a221c" stroke-width="1.5"/>
    <line x1="170" y1="140" x2="170" y2="150" stroke="#2a221c" stroke-width="1.5"/>
    <line x1="200" y1="140" x2="200" y2="150" stroke="#2a221c" stroke-width="1.5"/>
    <line x1="230" y1="140" x2="230" y2="150" stroke="#2a221c" stroke-width="1.5"/>

    
    <circle cx="100" cy="230" r="22" fill="#2a221c"/>
    <circle cx="100" cy="230" r="10" fill="#e2d9cc"/>
    <circle cx="280" cy="230" r="22" fill="#2a221c"/>
    <circle cx="280" cy="230" r="10" fill="#e2d9cc"/>

    
    <rect x="290" y="125" width="30" height="12" fill="url(#hatchBurgundy)" stroke="#2a221c" stroke-width="1.5" rx="2"/>
  </g>

  
  <g id="city-backdrop" fill="none" stroke="#2a221c" stroke-width="1.5" opacity="0.4">
    
    <polygon points="50,380 50,80 220,120 220,380" fill="#e8dfd0"/>
    <line x1="80" y1="140" x2="110" y2="146" stroke-width="1"/>
    <line x1="140" y1="152" x2="170" y2="158" stroke-width="1"/>
    <line x1="80" y1="180" x2="110" y2="186" stroke-width="1"/>
    <line x1="140" y1="192" x2="170" y2="198" stroke-width="1"/>
    <line x1="80" y1="220" x2="110" y2="226" stroke-width="1"/>
    <line x1="140" y1="232" x2="170" y2="238" stroke-width="1"/>

    
    <polygon points="980,380 980,60 1150,90 1150,380" fill="#e8dfd0"/>
    <line x1="1010" y1="120" x2="1050" y2="127" stroke-width="1"/>
    <line x1="1080" y1="133" x2="1120" y2="140" stroke-width="1"/>
    <line x1="1010" y1="170" x2="1050" y2="177" stroke-width="1"/>
    <line x1="1080" y1="183" x2="1120" y2="190" stroke-width="1"/>
    <line x1="1010" y1="220" x2="1050" y2="227" stroke-width="1"/>
    <line x1="1080" y1="233" x2="1120" y2="240" stroke-width="1"/>
  </g>

  
  <g id="editorial-callout" transform="translate(640, 110)">
    
    <path d="M -300, 130 L -300, 100 L 160, 100 L 160, 130" fill="none" stroke="#661227" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="-300" cy="100" r="3" fill="#661227"/>
    <circle cx="160" cy="100" r="3" fill="#661227"/>
    
    
    <line x1="-70" y1="100" x2="-70" y2="140" stroke="#661227" stroke-width="1.5"/>
    <polygon points="-70,145 -75,135 -65,135" fill="#661227"/>
  </g>

  
  <rect x="25" y="25" width="1150" height="625" fill="none" stroke="#2a221c" stroke-width="1" opacity="0.3"/>
  <rect x="31" y="31" width="1138" height="613" fill="none" stroke="#661227" stroke-width="2" opacity="0.7"/>

  
  <g stroke="#2a221c" stroke-width="1.5" opacity="0.6">
    <line x1="20" y1="25" x2="40" y2="25"/>
    <line x1="25" y1="20" x2="25" y2="40"/>
    
    <line x1="1180" y1="25" x2="1160" y2="25"/>
    <line x1="1175" y1="20" x2="1175" y2="40"/>
    
    <line x1="20" y1="650" x2="40" y2="650"/>
    <line x1="25" y1="655" x2="25" y2="635"/>
    
    <line x1="1180" y1="650" x2="1160" y2="650"/>
    <line x1="1175" y1="655" x2="1175" y2="635"/>
  </g>
</svg>