<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  
  <defs>
    
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>
    <pattern id="hatch-dense" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#661227" stroke-width="0.6" stroke-opacity="0.3" />
    </pattern>
    
    <filter id="paper-noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      
        
      
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.9" />
        <feFuncG type="linear" slope="0.9" />
        <feFuncB type="linear" slope="0.85" />
      </feComponentTransfer>
      <feBlend mode="multiply" in="SourceGraphic" result="blend" />
    </filter>
  </defs>

  
