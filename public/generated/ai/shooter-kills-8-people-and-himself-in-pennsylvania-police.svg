    <line x1="123" y1="520" x2="121" y2="395"/>
    <line x1="220" y1="520" x2="220" y2="360"/>
    <line x1="280" y1="520" x2="280" y2="400"/>
    <line x1="950" y1="520" x2="950" y2="370"/>
    <line x1="1020" y1="520" x2="1020" y2="390"/>
    <line x1="1024" y1="520" x2="1025" y2="410"/>
  </g>

  
  <g filter="url(#editorialShadow)">
    
