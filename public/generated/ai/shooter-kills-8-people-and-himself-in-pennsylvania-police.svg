<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <radialGradient id="paperGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#f7f3ec"/>
      <stop offset="100%" stop-color="#e8dec8"/>
    </radialGradient>
    
    
    <pattern id="hatchBurgundy" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#661227" stroke-width="1.2" stroke-opacity="0.25"/>
    </pattern>
    <pattern id="hatchCharcoal" width="6" height="6" patternTransform="rotate(-30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2a221c" stroke-width="0.8" stroke-opacity="0.18"/>
    </pattern>
    <pattern id="roofSlate" width="10" height="10" patternTransform="rotate(15 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="10" y2="0" stroke="#4a423c" stroke-width="1.5" stroke-opacity="0.3"/>
      <line x1="0" y1="5" x2="10" y2="5" stroke="#4a423c" stroke-width="0.8" stroke-opacity="0.2"/>
    </pattern>
    
    
    <filter id="editorialShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="6" stdDeviation="4" flood-color="#2a221c" flood-opacity="0.12"/>
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="url(#paperGrad)"/>

  
  <path d="M0,520 Q400,515 800,522 T1200,518 L1200,675 L0,675 Z" fill="#d9cebc" opacity="0.4"/>
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#2a221c" stroke-width="1" stroke-opacity="0.2"/>

  
  <g stroke="#2a221c" stroke-opacity="0.15" stroke-width="1.5">
