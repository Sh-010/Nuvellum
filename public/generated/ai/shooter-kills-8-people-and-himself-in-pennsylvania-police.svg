    <g stroke="#661227" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.5">
      <line x1="480" y1="270" x2="480" y2="310"/>
      <line x1="530" y1="230" x2="530" y2="280"/>
      <line x1="580" y1="260" x2="580" y2="315"/>
      <line x1="620" y1="220" x2="620" y2="280"/>
      <line x1="670" y1="250" x2="670" y2="305"/>
      <line x1="710" y1="210" x2="710" y2="285"/>
      <line x1="750" y1="240" x2="750" y2="320"/>
      <line x1="790" y1="205" x2="790" y2="310"/>
    </g>
  </g>

  
  <rect x="36" y="36" width="1128" height="603" fill="none" stroke="#2a221c" stroke-width="1.5" stroke-opacity="0.3"/>
  <rect x="42" y="42" width="1116" height="591" fill="none" stroke="#2a221c" stroke-width="0.5" stroke-opacity="0.2"/>

  
  <g stroke="#2a221c" stroke-width="1" stroke-opacity="0.4">
    <line x1="30" y1="42" x2="42" y2="42"/>
    <line x1="42" y1="30" x2="42" y2="42"/>
    
    <line x1="1158" y1="42" x2="1170" y2="42"/>
    <line x1="1158" y1="30" x2="1158" y2="42"/>
    
    <line x1="30" y1="633" x2="42" y2="633"/>
    <line x1="42" y1="633" x2="42" y2="645"/>
    
    <line x1="1158" y1="633" x2="1170" y2="633"/>
    <line x1="1158" y1="633" x2="1158" y2="645"/>
