    <polygon points="400,320 600,180 800,320 800,520 400,520" fill="#e5dfd3" stroke="#2a221c" stroke-width="3"/>

    
    <polygon points="375,330 600,160 825,330 800,350 600,195 400,350" fill="url(#roofSlate)" stroke="#2a221c" stroke-width="3"/>
    
    
    <line x1="600" y1="160" x2="600" y2="350" stroke="#2a221c" stroke-width="2" stroke-dasharray="6,4"/>

    
    <polygon points="408,352 792,352 792,512 408,512" fill="url(#hatchCharcoal)"/>

    
    
    <rect x="450" y="380" width="60" height="80" fill="#2a221c" stroke="#2a221c" stroke-width="2"/>
    <line x1="480" y1="380" x2="480" y2="460" stroke="#e5dfd3" stroke-width="1.5"/>
    <line x1="450" y1="420" x2="510" y2="420" stroke="#e5dfd3" stroke-width="1.5"/>

    
    <rect x="690" y="380" width="60" height="80" fill="#2a221c" stroke="#2a221c" stroke-width="2"/>
    <line x1="720" y1="380" x2="720" y2="460" stroke="#e5dfd3" stroke-width="1.5"/>
    <line x1="690" y1="420" x2="750" y2="420" stroke="#e5dfd3" stroke-width="1.5"/>

    
    <path d="M560,520 L560,440 Q600,410 640,440 L640,520 Z" fill="#2a221c" stroke="#2a221c" stroke-width="2"/>
