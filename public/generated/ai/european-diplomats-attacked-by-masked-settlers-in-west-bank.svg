<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      
        
      
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.93" />
        <feFuncG type="linear" slope="0.93" />
        <feFuncB type="linear" slope="0.90" />
      </feComponentTransfer>
      <feBlend mode="multiply" in="SourceGraphic" result="blend" />
    </filter>

    
    <pattern id="hatch-stone" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#661227" stroke-width="0.75" opacity="0.35" />
    </pattern>
    <pattern id="hatch-olive" width="8" height="8" patternTransform="rotate(60 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3d4f3c" stroke-width="0.8" opacity="0.4" />
    </pattern>
    <pattern id="hatch-ground" width="16" height="16" patternTransform="rotate(30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#2a221c" stroke-width="0.6" opacity="0.2" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="#f3ecdf" filter="url(#paper-texture)" />

  
