<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <radialGradient id="floorGlow" cx="50%" cy="85%" r="60%" fx="50%" fy="85%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="metalPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="meshGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.95"/>
    </linearGradient>

    
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    
    <linearGradient id="airflowClean" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="odorParticles" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.1"/>
    </linearGradient>

    
    <linearGradient id="furGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="furGradient2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="dotGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#334155" fill-opacity="0.3"/>
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#dotGrid)"/>
  <rect width="1200" height="675" fill="url(#floorGlow)"/>

  
  <g opacity="0.4">
    
    <line x1="0" y1="560" x2="1200" y2="560" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="562" x2="1200" y2="562" stroke="#0ea5e9" stroke-width="0.5" opacity="0.5"/>
    
    
    <path d="M 850 560 L 950 150 L 1200 150 L 1200 560 Z" fill="#1e293b" opacity="0.3"/>
    <path d="M 150 560 L 50 200 L 0 200 L 0 560 Z" fill="#1e293b" opacity="0.2"/>
  </g>

  
  <g opacity="0.6">
    
    <path d="M 120 250 Q 150 280 130 320 T 170 380" fill="none" stroke="url(#furGradient1)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 280 180 Q 240 220 260 250 T 220 300" fill="none" stroke="url(#furGradient1)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 380 320 Q 420 310 400 360 T 450 400" fill="none" stroke="url(#furGradient2)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 200 420 Q 250 400 230 450 T 280 480" fill="none" stroke="url(#furGradient1)" stroke-width="3.5" stroke-linecap="round"/>
    
    
    <circle cx="180" cy="200" r="4" fill="#fb7185" opacity="0.7"/>
    <circle cx="320" cy="260" r="6" fill="#f43f5e" opacity="0.5"/>
    <circle cx="250" cy="350" r="5" fill="#fb7185" opacity="0.6"/>
    <circle cx="390" cy="210" r="3" fill="#f43f5e" opacity="0.8"/>
    <circle cx="140" cy="420" r="5" fill="#fb7185" opacity="0.5"/>
    <circle cx="430" cy="450" r="7" fill="#fb7185" opacity="0.4"/>
  </g>

  
  <g>
    
    <path d="M 180 460 C 280 460, 350 430, 480 380" fill="none" stroke="url(#airflowClean)" stroke-width="3" stroke-dasharray="8 6"/>
    <path d="M 150 380 C 260 380, 340 370, 480 350" fill="none" stroke="url(#airflowClean)" stroke-width="4"/>
    <path d="M 200 300 C 300 300, 380 320, 480 320" fill="none" stroke="url(#airflowClean)" stroke-width="3" stroke-dasharray="12 6"/>
    <path d="M 180 220 C 280 230, 380 280, 480 290" fill="none" stroke="url(#airflowClean)" stroke-width="3.5"/>

    
    <path d="M 550 140 C 550 90, 570 60, 580 30" fill="none" stroke="url(#airflowClean)" stroke-width="6" stroke-linecap="round" filter="url(#softGlow)"/>
    <path d="M 600 130 C 600 80, 610 50, 620 20" fill="none" stroke="url(#airflowClean)" stroke-width="5" stroke-linecap="round" filter="url(#softGlow)"/>
    <path d="M 650 140 C 650 90, 630 60, 620 30" fill="none" stroke="url(#airflowClean)" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)"/>
  </g>

  
  <g filter="url(#dropShadow)">
    
    
    <ellipse cx="600" cy="560" rx="110" ry="25" fill="#000000" opacity="0.7"/>

    
    <rect x="490" y="150" width="220" height="410" rx="40" fill="url(#metalBody)"/>
    
    
    <path d="M 495 165 C 495 157, 502 150, 510 150 L 530 150 C 522 150, 495 170, 495 190 Z" fill="#ffffff" opacity="0.6"/>

    
    <rect x="515" y="210" width="170" height="310" rx="30" fill="url(#metalPanel)"/>
    
    
    <g fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.7">
      
      <path d="M 535 240 H 665 M 535 260 H 665 M 535 280 H 665 M 535 300 H 665 M 535 320 H 665 M 535 340 H 665 M 535 360 H 665 M 535 380 H 665 M 535 400 H 665 M 535 420 H 665 M 535 440 H 665 M 535 460 H 665 M 535 480 H 665" stroke-dasharray="3 4"/>
    </g>

    
    <path d="M 530 200 V 460 C 530 495, 545 505, 570 505 H 630 C 655 505, 670 495, 670 460 V 200" fill="none" stroke="#94a3b8" stroke-width="4" opacity="0.8"/>

    
    <g opacity="0.9">
      <path d="M 560 470 Q 580 490 600 475 T 640 480" fill="none" stroke="url(#furGradient1)" stroke-width="5" stroke-linecap="round"/>
      <path d="M 550 480 Q 580 500 610 485 T 650 490" fill="none" stroke="url(#furGradient1)" stroke-width="4" stroke-linecap="round"/>
      <path d="M 570 490 Q 600 510 630 495" fill="none" stroke="url(#furGradient2)" stroke-width="4.5" stroke-linecap="round"/>
    </g>

    
    <rect x="505" y="505" width="190" height="40" rx="15" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <line x1="570" y1="525" x2="630" y2="525" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

    
    <ellipse cx="600" cy="150" rx="110" ry="18" fill="#334155" stroke="#64748b" stroke-width="2"/>
    
    
    <ellipse cx="600" cy="150" rx="85" ry="12" fill="url(#cyanGlow)" filter="url(#softGlow)"/>
    <ellipse cx="600" cy="150" rx="75" ry="10" fill="#22d3ee" opacity="0.9"/>
    
    
    <circle cx="600" cy="150" r="5" fill="#ffffff" opacity="0.9"/>

    
    <line x1="540" y1="145" x2="660" y2="145" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <line x1="550" y1="149" x2="650" y2="149" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <line x1="560" y1="153" x2="640" y2="153" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

  </g>

  
  <g transform="translate(760, 180)">
    
    <path d="M -60 160 H -30" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <path d="M -60 220 H -30" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <path d="M -60 280 H -30" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>

    
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="180" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#dropShadow)"/>
      <rect x="10" y="10" width="160" height="30" rx="4" fill="#0f172a"/>
      
      <path d="M 20 25 H 160 M 40 10 V 40 M 70 10 V 40 M 100 10 V 40 M 130 10 V 40 M 150 10 V 40" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
      
      <path d="M 30 25 Q 45 15 60 30 T 90 20" fill="none" stroke="url(#furGradient1)" stroke-width="3" stroke-linecap="round"/>
    </g>

    
    <g transform="translate(20, 190)">
      <rect x="0" y="0" width="180" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#dropShadow)"/>
      <rect x="10" y="10" width="160" height="30" rx="4" fill="#0f172a"/>
      
      <path d="M 15 40 L 25 15 L 35 40 L 45 15 L 55 40 L 65 15 L 75 40 L 85 15 L 95 40 L 105 15 L 115 40 L 125 15 L 135 40 L 145 15 L 155 40 L 165 15" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.8"/>
    </g>

    
    <g transform="translate(40, 270)">
      <rect x="0" y="0" width="180" height="50" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" filter="url(#dropShadow)"/>
      <rect x="10" y="10" width="160" height="30" rx="4" fill="#0f172a"/>
      
      <g fill="#f43f5e" opacity="0.8">
        <circle cx="25" cy="25" r="3"/><circle cx="45" cy="20" r="2.5"/><circle cx="65" cy="30" r="3"/><circle cx="85" cy="22" r="3.5"/><circle cx="105" cy="28" r="2.5"/><circle cx="125" cy="20" r="3"/><circle cx="145" cy="26" r="3"/>
        <circle cx="35" cy="32" r="2"/><circle cx="55" cy="18" r="2"/><circle cx="75" cy="35" r="2.5"/><circle cx="95" cy="18" r="2"/><circle cx="115" cy="32" r="3"/><circle cx="135" cy="18" r="2.5"/>
      </g>
    </g>

    
    <path d="M -15 135 H -40 V 295 H -15" fill="none" stroke="#64748b" stroke-width="2" opacity="0.5"/>
    <circle cx="-40" cy="215" r="4" fill="#38bdf8"/>
  </g>

  
  <g opacity="0.8">
    <circle cx="720" cy="250" r="3" fill="#22d3ee" filter="url(#softGlow)"/>
    <circle cx="780" cy="150" r="2" fill="#22d3ee" filter="url(#softGlow)"/>
    <circle cx="850" cy="320" r="4" fill="#38bdf8" filter="url(#softGlow)"/>
    <circle cx="950" cy="220" r="3" fill="#22d3ee" filter="url(#softGlow)"/>
    <circle cx="900" cy="450" r="2" fill="#38bdf8" filter="url(#softGlow)"/>
    <circle cx="1050" cy="350" r="4" fill="#22d3ee" filter="url(#softGlow)"/>
  </g>

</svg>