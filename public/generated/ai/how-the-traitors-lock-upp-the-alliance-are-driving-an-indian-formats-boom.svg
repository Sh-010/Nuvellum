<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  
  <defs>
    
    <linearGradient id="paperBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f2ea" />
      <stop offset="50%" stop-color="#f3ecdf" />
      <stop offset="100%" stop-color="#ebdcc9" />
    </linearGradient>

    
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#2a221c" stop-opacity="0.08" />
    </radialGradient>

    
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a162f" />
      <stop offset="50%" stop-color="#661227" />
      <stop offset="100%" stop-color="#4a0b1b" />
    </linearGradient>

    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#8c6708" />
    </linearGradient>

    
    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028" />
      <stop offset="100%" stop-color="#2a221c" />
    </linearGradient>

    
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe8cc" />
      <stop offset="100%" stop-color="#e6c29c" />
    </linearGradient>

    
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.8" stroke-opacity="0.15" />
    </pattern>
    <pattern id="denseHatch" width="4" height="4" patternTransform="rotate(-30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#661227" stroke-width="0.6" stroke-opacity="0.2" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="url(#paperBg)" />
  <rect width="1200" height="675" fill="url(#vignette)" />

  
  
  <rect x="100" y="75" width="1000" height="460" fill="#eae1d2" stroke="#2a221c" stroke-width="2" />
  
  
