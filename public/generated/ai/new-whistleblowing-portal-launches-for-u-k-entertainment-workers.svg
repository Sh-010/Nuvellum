  <rect x="24" y="24" width="1152" height="627" fill="none" stroke="#2a221c" stroke-width="1.5" opacity="0.7" />
  <rect x="30" y="30" width="1140" height="615" fill="none" stroke="#2a221c" stroke-width="0.75" opacity="0.4" />

  
  <g stroke="#2a221c" stroke-width="1" opacity="0.5">
    <line x1="15" y1="24" x2="35" y2="24" />
    <line x1="24" y1="15" x2="24" y2="35" />

    <line x1="1165" y1="24" x2="1185" y2="24" />
    <line x1="1176" y1="15" x2="1176" y2="35" />

    <line x1="15" y1="651" x2="35" y2="651" />
    <line x1="24" y1="640" x2="24" y2="660" />

    <line x1="1165" y1="651" x2="1185" y2="651" />
    <line x1="1176" y1="640" x2="1176" y2="660" />
