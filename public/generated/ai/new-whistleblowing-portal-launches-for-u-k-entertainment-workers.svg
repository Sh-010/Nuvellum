<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5efe6" />
      <stop offset="50%" stop-color="#eee6db" />
      <stop offset="100%" stop-color="#e8ded0" />
    </linearGradient>

    
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#2a221c" stop-opacity="0.08" />
    </radialGradient>

    
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.75" stroke-opacity="0.15" />
    </pattern>

    <pattern id="hatchDense" width="4" height="4" patternTransform="rotate(-30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#661227" stroke-width="0.6" stroke-opacity="0.2" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="url(#paperGrad)" />
  <rect width="1200" height="675" fill="url(#vignette)" />

  
  <g opacity="0.4">
    <line x1="120" y1="80" x2="120" y2="595" stroke="#2a221c" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="1080" y1="80" x2="1080" y2="595" stroke="#2a221c" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="120" y1="80" x2="1080" y2="80" stroke="#2a221c" stroke-width="1.5" />
    <line x1="120" y1="595" x2="1080" y2="595" stroke="#2a221c" stroke-width="1.5" />
  </g>

  
  
  
  <g id="architecture">
    
