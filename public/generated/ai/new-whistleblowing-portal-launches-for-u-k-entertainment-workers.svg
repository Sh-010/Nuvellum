  <g opacity="0.3" stroke="#2a221c" stroke-width="1">
    <line x1="0" y1="630" x2="1200" y2="630" stroke-width="2" />
    <line x1="200" y1="630" x2="100" y2="675" />
    <line x1="400" y1="630" x2="350" y2="675" />
    <line x1="600" y1="630" x2="600" y2="675" />
    <line x1="800" y1="630" x2="850" y2="675" />
    <line x1="1000" y1="630" x2="1100" y2="675" />
