    <rect x="365" y="165" width="20" height="370" fill="url(#hatch)" />
    <rect x="815" y="165" width="20" height="370" fill="url(#hatch)" />

    
    <rect x="340" y="530" width="70" height="30" fill="#2a221c" />
    <rect x="790" y="530" width="70" height="30" fill="#2a221c" />
    <rect x="330" y="560" width="90" height="15" fill="#661227" />
