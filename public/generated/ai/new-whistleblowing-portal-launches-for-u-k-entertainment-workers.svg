    <line x1="500" y1="370" x2="630" y2="370" stroke="#2a221c" stroke-width="2" stroke-opacity="0.4" />
    <line x1="500" y1="390" x2="660" y2="390" stroke="#2a221c" stroke-width="2" stroke-opacity="0.4" />
    <line x1="500" y1="410" x2="580" y2="410" stroke="#2a221c" stroke-width="2" stroke-opacity="0.4" />

    
    <polygon points="460,145 600,285 740,145" fill="#f0e8dc" stroke="#2a221c" stroke-width="2" />
    <polygon points="460,145 600,285 740,145" fill="url(#hatch)" opacity="0.5" />

    
    <g transform="translate(600, 310)">
      <circle cx="0" cy="0" r="38" fill="#661227" stroke="#2a221c" stroke-width="2.5" />
      <circle cx="0" cy="0" r="31" fill="none" stroke="#f5efe6" stroke-width="1" stroke-dasharray="3 3" />
      
      <path d="M -10 -14 L 10 -14 L 10 4 C 10 14, 0 20, 0 20 C 0 20, -10 14, -10 4 Z" fill="#f5efe6" />
      <line x1="0" y1="-8" x2="0" y2="12" stroke="#661227" stroke-width="2" />
      <line x1="-6" y1="-2" x2="6" y2="-2" stroke="#661227" stroke-width="2" />
    </g>
  </g>

  
  <g id="rigging-scales">
    
