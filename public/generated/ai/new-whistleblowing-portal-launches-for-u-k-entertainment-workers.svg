    <rect x="500" y="245" width="190" height="4" fill="#2a221c" opacity="0.3" />
    <rect x="500" y="260" width="130" height="4" fill="#2a221c" opacity="0.3" />

    
    
    <rect x="500" y="290" width="200" height="28" fill="#dfd4c5" stroke="#2a221c" stroke-width="1.5" />
    <circle cx="520" cy="304" r="4" fill="#2a221c" />
    <circle cx="550" cy="304" r="4" fill="#2a221c" />
    <circle cx="580" cy="304" r="4" fill="#2a221c" />
    <circle cx="610" cy="304" r="4" fill="#2a221c" />
    <circle cx="640" cy="304" r="4" fill="#2a221c" />
    <circle cx="670" cy="304" r="4" fill="#2a221c" />

    
