    <path d="M 370 160 C 370 70, 830 70, 830 160" fill="none" stroke="#2a221c" stroke-width="4" />
    <path d="M 385 160 C 385 85, 815 85, 815 160" fill="none" stroke="#661227" stroke-width="2" />
  </g>

  
  
  
  <g id="curtains">
    
    <path d="M 120 80 Q 240 250 200 595 L 120 595 Z" fill="#661227" stroke="#2a221c" stroke-width="2" />
    <path d="M 150 80 Q 270 250 230 595" fill="none" stroke="#2a221c" stroke-width="1.5" opacity="0.6" />
    <path d="M 180 80 Q 300 250 260 595" fill="none" stroke="#2a221c" stroke-width="1.5" opacity="0.4" />
    <path d="M 120 80 Q 240 250 200 595 L 120 595 Z" fill="url(#hatchDense)" />

    
    <path d="M 1080 80 Q 960 250 1000 595 L 1080 595 Z" fill="#661227" stroke="#2a221c" stroke-width="2" />
    <path d="M 1050 80 Q 930 250 970 595" fill="none" stroke="#2a221c" stroke-width="1.5" opacity="0.6" />
    <path d="M 1020 80 Q 900 250 940 595" fill="none" stroke="#2a221c" stroke-width="1.5" opacity="0.4" />
    <path d="M 1080 80 Q 960 250 1000 595 L 1080 595 Z" fill="url(#hatchDense)" />
