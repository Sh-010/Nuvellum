      <rect x="-6" y="60" width="12" height="30" rx="3" fill="#dfd4c5" stroke="#2a221c" stroke-width="2" />
      <line x1="0" y1="60" x2="0" y2="90" stroke="#661227" stroke-width="1.5" />
