<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      
        
      
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.95" />
        <feFuncG type="linear" slope="0.93" />
        <feFuncB type="linear" slope="0.89" />
      </feComponentTransfer>
      <feBlend mode="multiply" in="SourceGraphic" result="blend" />
    </filter>

    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#2a221c" stroke-width="0.6" opacity="0.15" />
    </pattern>

    <pattern id="crosshatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#661227" stroke-width="0.5" opacity="0.25" />
      <line x1="0" y1="0" x2="8" y2="0" stroke="#661227" stroke-width="0.5" opacity="0.25" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="#f3ecdf" />
  <rect width="1200" height="675" filter="url(#paper-texture)" opacity="0.6" />

  
  <g opacity="0.4" stroke="#2a221c" stroke-width="1.5" fill="none">
    <line x1="950" y1="80" x2="950" y2="580" stroke-width="2" />
    <line x1="910" y1="180" x2="990" y2="180" />
    <line x1="880" y1="280" x2="1020" y2="280" />
    <line x1="840" y1="400" x2="1060" y2="400" />
    <line x1="800" y1="520" x2="1100" y2="520" />
    
    
    <polyline points="950,80 910,180 950,220 990,180 950,80" />
    <polyline points="950,180 880,280 950,340 1020,280 950,180" />
    <polyline points="950,280 840,400 950,460 1060,400 950,280" />
    <polyline points="950,400 800,520 950,580 1100,520 950,400" />

    
    <path d="M 950,130 A 150,150 0 0,1 1100,280" stroke-dasharray="6,6" />
    <path d="M 950,100 A 220,220 0 0,1 1170,320" stroke-dasharray="4,8" />
    <path d="M 950,160 A 90,90 0 0,1 1040,250" stroke-dasharray="4,4" />
  </g>

  
  <g fill="#dfd3c3" stroke="#2a221c" stroke-width="1.5">
    <polygon points="50,580 180,380 320,580" />
    <polygon points="250,580 390,310 550,580" />
    <polygon points="480,580 620,420 750,580" />
  </g>
  
  
  <g stroke="#2a221c" stroke-width="0.75" opacity="0.4">
    <line x1="180" y1="380" x2="220" y2="580" />
    <line x1="180" y1="380" x2="140" y2="580" />
    <line x1="390" y1="310" x2="430" y2="580" />
    <line x1="390" y1="310" x2="330" y2="580" />
    <line x1="620" y1="420" x2="680" y2="580" />
    <line x1="620" y1="420" x2="550" y2="580" />
  </g>

  
  <rect x="0" y="580" width="1200" height="95" fill="#e6dbcc" stroke="#2a221c" stroke-width="2" />
  <rect x="0" y="590" width="1200" height="85" fill="url(#hatch)" />

  
  <g transform="translate(420, 210)">
    
    <polygon points="110,0 220,135 110,270 0,135" fill="#661227" opacity="0.1" />
    
    
    <polygon points="130,20 240,155 130,290 20,155" fill="none" stroke="#661227" stroke-width="1" stroke-dasharray="5,5" />

    
    <polygon points="110,10 210,135 110,260 10,135" fill="#f3ecdf" stroke="#2a221c" stroke-width="3" />
    <polygon points="110,30 190,135 110,240 30,135" fill="url(#crosshatch)" stroke="#661227" stroke-width="1.5" />

    
    <line x1="110" y1="10" x2="110" y2="260" stroke="#2a221c" stroke-width="2" />
    <line x1="10" y1="135" x2="210" y2="135" stroke="#2a221c" stroke-width="2" />

    
    
    <g transform="translate(-70, 80) rotate(-15)">
      <rect x="0" y="0" width="45" height="45" fill="#e6dbcc" stroke="#2a221c" stroke-width="2" />
      <line x1="0" y1="0" x2="45" y2="45" stroke="#2a221c" stroke-width="1" />
      <line x1="45" y1="0" x2="0" y2="45" stroke="#2a221c" stroke-width="1" />
    </g>

    
    <g transform="translate(230, 40) rotate(22)">
      <rect x="0" y="0" width="55" height="55" fill="#661227" stroke="#2a221c" stroke-width="2" />
      <line x1="0" y1="0" x2="55" y2="55" stroke="#f3ecdf" stroke-width="1" />
    </g>

    <g transform="translate(190, 190) rotate(10)">
      <rect x="0" y="0" width="35" height="35" fill="#dfd3c3" stroke="#2a221c" stroke-width="1.5" />
    </g>
  </g>

  
  
  <g fill="#2a221c" stroke="#2a221c">
    
    <g transform="translate(300, 430)">
      
      <path d="M 40,30 L 60,150 L 15,150 L 25,70 Z" fill="#2a221c" />
      
      <circle cx="35" cy="15" r="12" />
      
      <path d="M 30,50 L 5,80 L 20,95 L 40,65" fill="none" stroke-width="6" stroke-linejoin="round" />
      
      <path d="M -10,150 L 15,110 L 35,150 Z" fill="#661227" stroke="#661227" />
      <path d="M -25,150 L -5,125 L 10,150 Z" fill="#2a221c" />
    </g>

    
    <g transform="translate(790, 430)">
      
      <path d="M 30,30 L 50,150 L 5,150 L 20,70 Z" fill="#2a221c" />
      
      <circle cx="30" cy="15" r="12" />
      
      <path d="M 35,50 L 70,75 L 55,90 L 30,70" fill="none" stroke-width="6" stroke-linejoin="round" />
      
      <polygon points="75,60 95,70 85,90 65,80" fill="#661227" stroke="#661227" />
      <line x1="75" y1="60" x2="85" y2="90" stroke="#f3ecdf" stroke-width="1.5" />
    </g>
  </g>

  
  
  <line x1="60" y1="35" x2="1140" y2="35" stroke="#661227" stroke-width="2" />
  <line x1="60" y1="42" x2="1140" y2="42" stroke="#2a221c" stroke-width="1" />

  <line x1="60" y1="633" x2="1140" y2="633" stroke="#2a221c" stroke-width="1" />
  <line x1="60" y1="640" x2="1140" y2="640" stroke="#661227" stroke-width="2" />

  
  <g stroke="#2a221c" stroke-width="0.75" fill="none">
    
    <path d="M 40,55 L 40,40 L 55,40" />
    
    <path d="M 1160,55 L 1160,40 L 1145,40" />
    
    <path d="M 40,620 L 40,635 L 55,635" />
    
    <path d="M 1160,620 L 1160,635 L 1145,635" />
  </g>

</svg>