    </pattern>
    <pattern id="hatch-wide" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#661227" stroke-width="0.8" opacity="0.4" />
    </pattern>
    <pattern id="dot-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7a7065" opacity="0.25" />
    </pattern>
  </defs>

  
