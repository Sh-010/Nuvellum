<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="40%" stop-color="#182438"/>
      <stop offset="80%" stop-color="#263852"/>
      <stop offset="100%" stop-color="#3b4d66"/>
    </linearGradient>
    
    <linearGradient id="mountainsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a273b"/>
      <stop offset="100%" stop-color="#2d3f58"/>
    </linearGradient>

    
    <radialGradient id="auroraGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#3b5998" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1622"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>

    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c2838"/>
      <stop offset="30%" stop-color="#32455e"/>
      <stop offset="70%" stop-color="#213042"/>
      <stop offset="100%" stop-color="#131c28"/>
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3e5ab"/>
      <stop offset="100%" stop-color="#c59b27"/>
    </linearGradient>

    
    <linearGradient id="vignette" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="675" fill="url(#skyGrad)"/>
  <rect width="1200" height="675" fill="url(#auroraGlow)" mix-blend-mode="screen"/>

  
  <path d="M0 400 L120 370 L250 410 L380 350 L500 390 L650 320 L780 380 L920 340 L1050 385 L1200 330 L1200 500 L0 500 Z" fill="url(#mountainsGrad)" opacity="0.6"/>

  
  <g fill="#141c28" opacity="0.85">
    
    <path d="M540 380 Q600 310 660 380 L650 500 L550 500 Z"/>
    <path d="M585 300 Q600 240 615 300 Z" fill="#d4af37" opacity="0.3"/>
    <rect x="470" y="350" width="40" height="150"/>
    <polygon points="465,350 490,300 515,350"/>
    <rect x="690" y="350" width="40" height="150"/>
    <polygon points="685,350 710,300 735,350"/>
