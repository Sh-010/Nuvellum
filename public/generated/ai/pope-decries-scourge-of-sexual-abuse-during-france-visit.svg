  <rect x="0" y="500" width="1200" height="175" fill="url(#groundGrad)"/>
  
  
  <rect x="0" y="0" width="90" height="580" fill="url(#pillarGrad)"/>
  <rect x="90" y="0" width="20" height="580" fill="#0b1017"/>
  <rect x="1110" y="0" width="90" height="580" fill="url(#pillarGrad)"/>
