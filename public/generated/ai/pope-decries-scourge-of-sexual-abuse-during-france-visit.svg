  <ellipse cx="600" cy="540" rx="180" ry="25" fill="#f3e5ab" opacity="0.15" filter="blur(10px)"/>

  
  <g opacity="0.25" mix-blend-mode="screen">
    <rect x="520" y="0" width="30" height="150" fill="#1d4ed8" filter="blur(20px)"/>
    <rect x="585" y="0" width="30" height="150" fill="#ffffff" filter="blur(20px)"/>
    <rect x="650" y="0" width="30" height="150" fill="#dc2626" filter="blur(20px)"/>
