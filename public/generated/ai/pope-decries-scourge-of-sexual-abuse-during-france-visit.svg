      <line x1="-135" y1="0" x2="-135" y2="40"/>
      <line x1="-45" y1="0" x2="-45" y2="40"/>
      <line x1="45" y1="0" x2="45" y2="40"/>
      <line x1="135" y1="0" x2="135" y2="40"/>

      <line x1="-90" y1="40" x2="-90" y2="80"/>
      <line x1="0" y1="40" x2="0" y2="80"/>
      <line x1="90" y1="40" x2="90" y2="80"/>

      <line x1="-135" y1="80" x2="-135" y2="120"/>
      <line x1="-45" y1="80" x2="-45" y2="120"/>
      <line x1="45" y1="80" x2="45" y2="120"/>
      <line x1="135" y1="80" x2="135" y2="120"/>
    </g>

    
    <path d="M -12 -130 Q 5 -50 -5 20 Q -15 90 2 190 L 15 190 Q -2 90 10 20 Q 20 -50 0 -130 Z" fill="url(#goldLight)" filter="drop-shadow(0px 0px 12px rgba(212,175,55,0.6))"/>

    
    <g stroke="#d4af37" stroke-width="2" fill="none" opacity="0.6">
