    <circle cx="400" cy="550" r="14"/>
    <path d="M 365 675 L 385 610 L 435 610 L 450 675 Z"/>

    <path d="M 440 675 L 440 600 Q 440 580 455 580 Q 470 580 470 600 L 470 675 Z"/>
    <circle cx="455" cy="565" r="12"/>

    
    <path d="M 760 675 L 760 585 Q 760 560 780 560 Q 800 560 800 585 L 800 675 Z"/>
    <circle cx="780" cy="542" r="14"/>

    <path d="M 820 675 L 820 575 Q 820 550 840 550 Q 860 550 860 575 L 860 675 Z"/>
    <circle cx="840" cy="532" r="15"/>

    <path d="M 730 675 L 745 610 L 795 610 L 815 675 Z"/>
    <path d="M 800 675 L 820 595 L 880 595 L 900 675 Z"/>
