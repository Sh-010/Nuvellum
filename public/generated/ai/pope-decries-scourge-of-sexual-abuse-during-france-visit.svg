      <line x1="90" y1="-120" x2="90" y2="-80"/>
      
      <line x1="-135" y1="-80" x2="-135" y2="-40"/>
      <line x1="-45" y1="-80" x2="-45" y2="-40"/>
      <line x1="45" y1="-80" x2="45" y2="-40"/>
      <line x1="135" y1="-80" x2="135" y2="-40"/>

      <line x1="-90" y1="-40" x2="-90" y2="0"/>
