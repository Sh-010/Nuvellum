<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="45%" stop-color="#142345"/>
      <stop offset="100%" stop-color="#1a1c29"/>
    </linearGradient>

    
    <radialGradient id="floodlight-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e2f1ff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#7ab2e8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b1329" stop-opacity="0"/>
    </radialGradient>

    
    <linearGradient id="pitch-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b4226"/>
      <stop offset="50%" stop-color="#14321d"/>
      <stop offset="100%" stop-color="#0d2113"/>
    </linearGradient>

    
    <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="50%" stop-color="#e09f00"/>
      <stop offset="100%" stop-color="#b37400"/>
    </linearGradient>

    
    <linearGradient id="green-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b4a2c"/>
      <stop offset="50%" stop-color="#06321d"/>
      <stop offset="100%" stop-color="#031a0e"/>
    </linearGradient>

    
    <linearGradient id="ball-grad" x1="0.2" y1="0.2" x2="0.8" y2="0.8">
      <stop offset="0%" stop-color="#fff4d9"/>
      <stop offset="50%" stop-color="#d6b370"/>
      <stop offset="100%" stop-color="#8c6a28"/>
    </linearGradient>

    
    <linearGradient id="yellow-card-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="100%" stop-color="#cc9900"/>
    </linearGradient>
    
    <linearGradient id="card-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcc00" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="0"/>
    </linearGradient>

    
    <linearGradient id="mist-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7ab2e8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    
    
    <filter id="cinematic-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="url(#bg-grad)"/>

  
  <g opacity="0.4">
    
    <polygon points="150,0 0,675 250,675" fill="url(#floodlight-glow)"/>
    
    <polygon points="1050,0 950,675 1200,675" fill="url(#floodlight-glow)"/>
    
    
    <path d="M0,180 Q300,140 600,160 Q900,140 1200,180 L1200,240 Q900,200 600,220 Q300,200 0,240 Z" fill="#0f1930"/>
    <path d="M0,220 Q300,180 600,200 Q900,180 1200,220 L1200,250 Q900,210 600,230 Q300,210 0,250 Z" fill="#080e1a"/>
    
    
    <line x1="150" y1="0" x2="150" y2="200" stroke="#22365c" stroke-width="4"/>
    <line x1="1050" y1="0" x2="1050" y2="200" stroke="#22365c" stroke-width="4"/>
    <circle cx="150" cy="40" r="15" fill="#e2f1ff" filter="url(#glow-filter)" opacity="0.8"/>
    <circle cx="1050" cy="40" r="15" fill="#e2f1ff" filter="url(#glow-filter)" opacity="0.8"/>
  </g>

  
  <rect width="1200" height="675" fill="url(#mist-grad)"/>

  
  <path d="M-100,675 L300,320 L900,320 L1300,675 Z" fill="url(#pitch-grad)"/>
  
  
  <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="3" fill="none">
    <path d="M200,320 L -50,675"/>
    <path d="M400,320 L 200,675"/>
    <path d="M600,320 L 600,675"/>
    <path d="M800,320 L 1000,675"/>
    <path d="M1000,320 L 1250,675"/>
    
    <path d="M200,420 Q600,380 1000,420" stroke-opacity="0.3" stroke-width="4"/>
    <path d="M150,500 Q600,450 1050,500" stroke-opacity="0.2" stroke-width="3"/>
  </g>

  
  <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="6" stroke-linecap="round">
    <line x1="600" y1="320" x2="600" y2="180"/>
    <line x1="530" y1="210" x2="670" y2="210"/>
    <line x1="530" y1="210" x2="530" y2="320"/>
    <line x1="670" y1="210" x2="670" y2="320"/>
  </g>

  
  

  
  <g filter="url(#cinematic-shadow)" transform="translate(600, 390)">
    
    <ellipse cx="-80" cy="-20" rx="35" ry="20" fill="url(#ball-grad)" opacity="0.2" transform="rotate(-15 -80 -20)"/>
    <ellipse cx="-40" cy="-10" rx="40" ry="22" fill="url(#ball-grad)" opacity="0.5" transform="rotate(-10 -40 -10)"/>
    
    
    <g transform="rotate(25)">
      <ellipse cx="0" cy="0" rx="45" ry="26" fill="url(#ball-grad)"/>
      
      <path d="M-35,-12 Q0,-2 35,-12" fill="none" stroke="#6b4c16" stroke-width="2" opacity="0.7"/>
      <path d="M-35,12 Q0,2 35,12" fill="none" stroke="#6b4c16" stroke-width="2" opacity="0.7"/>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#6b4c16" stroke-width="2" opacity="0.7"/>
      
      <line x1="-10" y1="-5" x2="10" y2="-5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-6" y1="-8" x2="-6" y2="-2" stroke="#ffffff" stroke-width="2"/>
      <line x1="0" y1="-8" x2="0" y2="-2" stroke="#ffffff" stroke-width="2"/>
      <line x1="6" y1="-8" x2="6" y2="-2" stroke="#ffffff" stroke-width="2"/>
    </g>
  </g>

  
  
  <g filter="url(#cinematic-shadow)" opacity="0.85" transform="translate(0, 30)">
    
    <path d="M280,360 C290,320 310,290 340,270 C360,285 380,310 370,350 L390,440 L330,460 L310,390 Z" fill="url(#green-grad)"/>
    
    <circle cx="335" cy="250" r="18" fill="#d4a373"/>
    <path d="M320,245 C320,230 350,230 350,245 Z" fill="#ffffff" opacity="0.9"/> 
    
    <path d="M350,280 C390,270 430,290 460,320 L440,335 C420,310 390,295 350,300 Z" fill="url(#green-grad)"/>

    
    <path d="M180,390 C200,350 230,330 260,310 C275,325 290,350 280,390 L290,480 L230,500 L210,420 Z" fill="url(#green-grad)" opacity="0.9"/>
    <circle cx="245" cy="290" r="16" fill="#c49363"/>
  </g>

  
  <g filter="url(#cinematic-shadow)" transform="translate(100, 20)">
    
    <path d="M720,350 C710,310 680,285 650,265 C630,280 610,305 620,345 L600,435 L660,455 L680,385 Z" fill="url(#gold-grad)"/>
    
    <circle cx="665" cy="245" r="17" fill="#c49363"/>
    
    <path d="M635,275 C580,270 530,300 480,330 L495,350 C540,320 585,295 635,295 Z" fill="url(#gold-grad)"/>
  </g>

  
  
  
  <g filter="url(#cinematic-shadow)">
    
    <g transform="translate(250, 220) rotate(-25) scale(0.7)">
      <rect x="-35" y="-50" width="70" height="100" rx="8" fill="url(#yellow-card-grad)" stroke="#fff" stroke-width="2"/>
      <rect x="-35" y="-50" width="70" height="100" rx="8" fill="url(#card-glow)"/>
    </g>

    
    <g transform="translate(420, 160) rotate(-10) scale(0.85)">
      <rect x="-35" y="-50" width="70" height="100" rx="8" fill="url(#yellow-card-grad)" stroke="#fff" stroke-width="2"/>
      <rect x="-35" y="-50" width="70" height="100" rx="8" fill="url(#card-glow)"/>
      <path d="M-15,-10 L-5,10 L20,-20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
    </g>

    
    <g transform="translate(780, 160) rotate(12) scale(0.9)">
      <rect x="-35" y="-50" width="70" height="100" rx="8" fill="url(#yellow-card-grad)" stroke="#fff" stroke-width="2"/>
      <rect x="-35" y="-50" width="70" height="100" rx="8" fill="url(#card-glow)"/>
    </g>

    
    <g transform="translate(950, 215) rotate(28) scale(0.75)">
      <rect x="-35" y="-50" width="70" height="100" rx="8" fill="url(#yellow-card-grad)" stroke="#fff" stroke-width="2"/>
      <rect x="-35" y="-50" width="70" height="100" rx="8" fill="url(#card-glow)"/>
    </g>
  </g>

  
  
  <g filter="url(#cinematic-shadow)" transform="translate(0, 40)">
    <path d="M480,510 C530,470 600,450 670,460 C720,467 760,490 800,530 L850,600 C730,620 590,610 470,580 Z" fill="url(#gold-grad)"/>
    
    <circle cx="505" cy="485" r="20" fill="#b37400"/>
    <path d="M490,475 C490,460 520,460 520,475 Z" fill="#0b1329" opacity="0.8"/>
    
    <path d="M520,500 C580,510 640,540 700,560 L690,585 C630,565 570,535 515,525 Z" fill="url(#gold-grad)"/>
  </g>

  
  <g opacity="0.6">
    
    <circle cx="600" cy="390" r="120" fill="url(#floodlight-glow)" filter="url(#glow-filter)" mix-blend-mode="screen"/>
  </g>

  
  <g fill="#ffcc00" opacity="0.6">
    <circle cx="350" cy="280" r="3" filter="url(#glow-filter)"/>
    <circle cx="480" cy="220" r="2" filter="url(#glow-filter)"/>
    <circle cx="710" cy="200" r="3.5" filter="url(#glow-filter)"/>
    <circle cx="850" cy="270" r="2" filter="url(#glow-filter)"/>
    <circle cx="590" cy="150" r="2.5" filter="url(#glow-filter)"/>
    <circle cx="630" cy="180" r="1.5"/>
    <circle cx="280" cy="350" r="2"/>
    <circle cx="920" cy="330" r="2.5"/>
  </g>

  
  <rect width="1200" height="675" fill="none" stroke="#1a2b4c" stroke-width="12" opacity="0.3"/>
  <rect width="1200" height="675" fill="none" stroke="#000000" stroke-width="4" opacity="0.6"/>
</svg>