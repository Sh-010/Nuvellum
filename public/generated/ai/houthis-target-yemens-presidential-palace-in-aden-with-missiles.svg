<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <style>
      .bg { fill: #f3ecdf; }
      .ink { fill: #2a221c; }
      .stroke-ink { stroke: #2a221c; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .stone { fill: #d5c8b8; }
      .stone-dark { fill: #b8a692; }
      .burgundy { fill: #661227; }
      .burgundy-trans { fill: #661227; opacity: 0.15; }
      .sand { fill: #e5dbc9; }
      .line-thin { stroke: #2a221c; stroke-width: 1; fill: none; }
      .line-dash { stroke: #2a221c; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      .hatch { stroke: #2a221c; stroke-width: 0.75; opacity: 0.4; }
    </style>
    <pattern id="dotgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#2a221c" opacity="0.15"/>
    </pattern>
    <pattern id="hatch-pat" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" class="hatch" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" class="bg" />
