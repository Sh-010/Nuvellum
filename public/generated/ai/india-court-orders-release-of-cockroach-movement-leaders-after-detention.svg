<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.95   0 0 0 0 0.92   0 0 0 0 0.88  0 0 0 0.12 0" in="noise" result="coloredNoise"/>
      <feComposite operator="in" in2="SourceGraphic" in="coloredNoise" result="composite"/>
      <feBlend mode="multiply" in="SourceGraphic" in2="composite" result="blend"/>
    </filter>
    
    
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.8" opacity="0.18"/>
    </pattern>

    <pattern id="dense-hatch" width="4" height="4" patternTransform="rotate(30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#661227" stroke-width="0.6" opacity="0.25"/>
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="#f3ecdf"/>
