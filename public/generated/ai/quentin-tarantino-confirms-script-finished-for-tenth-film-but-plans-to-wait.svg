<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      
        
      
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.95" />
        <feFuncG type="linear" slope="0.93" />
        <feFuncB type="linear" slope="0.89" />
      </feComponentTransfer>
      <feBlend mode="multiply" in="SourceGraphic" result="blend" />
    </filter>

    
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#2a221c" flood-opacity="0.12" />
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="#efe8db" filter="url(#paper-texture)" />

  
