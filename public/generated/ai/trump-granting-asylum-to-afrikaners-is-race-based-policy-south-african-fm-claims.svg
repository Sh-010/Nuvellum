<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="50%" stop-color="#141c3a"/>
      <stop offset="100%" stop-color="#0c1021"/>
    </linearGradient>

    
    <linearGradient id="unAtmosphere" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002b49" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#1b4965" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#002b49" stop-opacity="0.5"/>
    </linearGradient>

    
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#020307"/>
    </linearGradient>

    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f3e5ab"/>
      <stop offset="100%" stop-color="#997a15"/>
    </linearGradient>

    
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ea8de" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4ea8de" stop-opacity="0"/>
    </linearGradient>

    
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0a96d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e0a96d" stop-opacity="0"/>
    </linearGradient>

    
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  
  <g opacity="0.6">
    
    <path d="M0 0 L150 675 M300 0 L375 675 M600 0 L600 675 M900 0 L825 675 M1200 0 L1050 675" stroke="#1f2c4c" stroke-width="1" opacity="0.3"/>
    
    
    <path d="M -100 450 Q 600 200 1300 450 L 1300 675 L -100 675 Z" fill="url(#unAtmosphere)"/>
    <path d="M -100 300 Q 600 80 1300 300 L 1300 450 Q 600 200 -100 450 Z" fill="#0d1b2a" opacity="0.4"/>
  </g>

  
  <polygon points="400,0 800,0 950,675 250,675" fill="url(#lightBeam)"/>
  <ellipse cx="600" cy="150" rx="300" ry="100" fill="url(#accentGlow)" filter="url(#subtleGlow)"/>

  
  <rect x="0" y="520" width="1200" height="155" fill="url(#floorGrad)"/>
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#2a3c66" stroke-width="2" opacity="0.8"/>
  <line x1="0" y1="522" x2="1200" y2="522" stroke="#4ea8de" stroke-width="1" opacity="0.3"/>

  
  <g transform="translate(600, 360)">
    
    <ellipse cx="0" cy="170" rx="140" ry="30" fill="url(#shadowGrad)"/>

    
    <path d="M -80 60 L 80 60 L 60 170 L -60 170 Z" fill="#111827" stroke="#2a3c56" stroke-width="2"/>
    
    <path d="M -83 55 L 83 55 L 80 60 L -80 60 Z" fill="url(#goldGrad)"/>
    <path d="M -60 170 L 60 170 L 65 178 L -65 178 Z" fill="url(#goldGrad)"/>
    <rect x="-30" y="80" width="60" height="70" fill="#0b0f19" rx="4" stroke="#1f2c42" stroke-width="1"/>

    
    <path d="M -70 45 L 70 45 L 60 10 L -60 10 Z" fill="url(#glassGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>

    
    <path d="M -15 10 L -15 -30 M -15 -30 C -15 -45 0 -45 0 -55" fill="none" stroke="#99aabf" stroke-width="3" stroke-linecap="round"/>
    <rect x="-5" y="-62" width="10" height="14" rx="3" fill="url(#goldGrad)"/>

    <path d="M 0 10 L 0 -40 M 0 -40 C 0 -55 0 -55 0 -65" fill="none" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="-6" y="-74" width="12" height="16" rx="4" fill="url(#goldGrad)"/>

    <path d="M 15 10 L 15 -30 M 15 -30 C 15 -45 0 -45 0 -55" fill="none" stroke="#99aabf" stroke-width="3" stroke-linecap="round"/>
    <rect x="-5" y="-62" width="10" height="14" rx="3" fill="url(#goldGrad)"/>
  </g>

  
  
  
  <g transform="translate(600, 190)" opacity="0.85">
    
    <rect x="-3" y="-30" width="6" height="140" fill="url(#goldGrad)"/>
    
    <circle cx="0" cy="-35" r="8" fill="url(#goldGrad)"/>
    
    <path d="M -120 -20 Q 0 -35 120 -20 L 120 -15 Q 0 -30 -120 -15 Z" fill="url(#goldGrad)"/>
    
    
    <path d="M -120 -17 L -120 40" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M -155 40 Q -120 60 -85 40 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M -155 40 L -85 40" stroke="url(#goldGrad)" stroke-width="1"/>
    
    <rect x="-130" y="20" width="20" height="15" fill="#4ea8de" opacity="0.4" rx="1"/>

    
    <path d="M 120 -17 L 120 20" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M 85 20 Q 120 40 155 20 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M 85 20 L 155 20" stroke="url(#goldGrad)" stroke-width="1"/>
    
    <circle cx="120" cy="10" r="4" fill="#e0a96d"/>
  </g>

  
  <g opacity="0.35">
    
    <path d="M 1200 250 C 900 200, 800 350, 600 320 C 400 290, 300 400, 0 380" fill="none" stroke="#4ea8de" stroke-width="2" stroke-dasharray="8 6"/>
    <path d="M 1200 320 C 950 280, 850 420, 600 380 C 350 340, 250 480, 0 450" fill="none" stroke="#e0a96d" stroke-width="1.5"/>
    <path d="M 1200 400 C 1000 350, 750 480, 600 440 C 450 400, 200 520, 0 500" fill="none" stroke="#4ea8de" stroke-width="1" opacity="0.6"/>
  </g>

  
  <g transform="translate(600, 385)">
    
    <path d="M -75 140 C -75 90 -45 75 0 75 C 45 75 75 90 75 140 Z" fill="#0c1220" stroke="#1f2c42" stroke-width="1.5"/>
    
    <path d="M -25 75 L 0 120 L 25 75" fill="none" stroke="#2a3c56" stroke-width="2"/>
    <polygon points="-4,90 4,90 2,135 -2,135" fill="#c59b27" opacity="0.9"/> 
    <path d="M -45 105 L -75 140 L -60 140 Z" fill="#141c33"/>
    <path d="M 45 105 L 75 140 L 60 140 Z" fill="#141c33"/>

    
    <path d="M -8 28 C -18 28 -24 38 -22 50 C -20 62 -12 72 0 72 C 12 72 18 62 16 50 C 18 38 12 28 2 28 Z" fill="#1b263b"/>
    
    <rect x="-8" y="65" width="16" height="20" fill="#1b263b"/>
    
    <path d="M -10 25 C -15 10 -5 0 8 5 C 18 10 22 22 18 38 C 12 45 2 45 -10 38 Z" fill="#1b263b"/>
    
    <path d="M -6 5 C -2 -2 10 -2 16 5 C 18 12 12 15 4 12 Z" fill="#0a101d"/>
  </g>

  
  
  <path d="M 0 0 L 80 0 L 30 675 L 0 675 Z" fill="#04060b" opacity="0.7"/>
  
  <path d="M 1200 0 L 1120 0 L 1170 675 L 1200 675 Z" fill="#04060b" opacity="0.7"/>

  
  <rect x="0" y="0" width="1200" height="40" fill="url(#bgGrad)" opacity="0.8"/>

  
  <g fill="#4ea8de" opacity="0.4">
    <circle cx="350" cy="180" r="1.5"/>
    <circle cx="380" cy="220" r="1"/>
    <circle cx="850" cy="150" r="2"/>
    <circle cx="900" cy="240" r="1.5"/>
    <circle cx="250" cy="300" r="1"/>
    <circle cx="980" cy="280" r="1"/>
  </g>
  <g fill="#e0a96d" opacity="0.5">
    <circle cx="450" cy="120" r="2"/>
    <circle cx="780" cy="190" r="1.5"/>
    <circle cx="300" cy="250" r="1"/>
    <circle cx="820" cy="310" r="2"/>
  </g>
</svg>