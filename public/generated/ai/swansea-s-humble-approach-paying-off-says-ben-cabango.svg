    <circle cx="60" cy="-10" r="7" fill="#2a221c" stroke="#faf6ef" stroke-width="1.5"/>
    <circle cx="-30" cy="10" r="7" fill="#2a221c" stroke="#faf6ef" stroke-width="1.5"/>
    <circle cx="40" cy="-80" r="9" fill="#661227" stroke="#faf6ef" stroke-width="1.5"/>
    
    
    <path d="M -60 -60 L -30 10 L 60 -10 L 40 -80 Z" fill="none" stroke="#661227" stroke-width="1.5" stroke-opacity="0.8"/>

    
    <path d="M 0 130 C -25 90 -45 30 -35 -30 C -30 -60 -10 -100 0 -130 C 10 -100 30 -60 35 -30 C 45 30 25 90 0 130 Z" fill="#efe8db" stroke="#2a221c" stroke-width="1.5"/>
    
    <line x1="0" y1="-120" x2="0" y2="110" stroke="#2a221c" stroke-width="1"/>
    
    <path d="M 0 -100 L -18 -85 M 0 -80 L -25 -65 M 0 -60 L -30 -45 M 0 -40 L -32 -25 M 0 -20 L -30 -5 M 0 0 L -28 15 M 0 20 L -24 35 M 0 40 L -18 55 M 0 60 L -12 75 M 0 80 L -6 95" fill="none" stroke="#2a221c" stroke-width="0.75" stroke-opacity="0.7"/>
    <path d="M 0 -100 L 18 -85 M 0 -80 L 25 -65 M 0 -60 L 30 -45 M 0 -40 L 32 -25 M 0 -20 L 30 -5 M 0 0 L 28 15 M 0 20 L 24 35 M 0 40 L 18 55 M 0 60 L 12 75 M 0 80 L 6 95" fill="none" stroke="#2a221c" stroke-width="0.75" stroke-opacity="0.7"/>

    
    <g transform="translate(0, 70)" stroke="#2a221c" stroke-width="1.5" stroke-opacity="0.5">
      <line x1="-120" y1="0" x2="120" y2="0"/>
      <line x1="-120" y1="16" x2="80" y2="16"/>
      <line x1="-120" y1="32" x2="100" y2="32"/>
      <line x1="-120" y1="48" x2="40" y2="48"/>
    </g>
  </g>

  
  <g transform="translate(120, 200)">
    
    <rect x="0" y="0" width="80" height="260" fill="#faf6ef" stroke="#2a221c" stroke-width="1.5"/>
    
    <rect x="0" y="0" width="12" height="260" fill="#661227"/>
    
    
    <line x1="25" y1="30" x2="65" y2="30" stroke="#2a221c" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="50" x2="55" y2="50" stroke="#2a221c" stroke-width="1.5" stroke-linecap="round"/>
    
    <line x1="25" y1="90" x2="65" y2="90" stroke="#2a221c" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="110" x2="50" y2="110" stroke="#2a221c" stroke-width="1.5" stroke-linecap="round"/>

    <line x1="25" y1="150" x2="65" y2="150" stroke="#2a221c" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="170" x2="55" y2="170" stroke="#2a221c" stroke-width="1.5" stroke-linecap="round"/>

