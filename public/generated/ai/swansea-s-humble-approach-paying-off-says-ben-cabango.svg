    <rect x="68" y="0" width="12" height="260" fill="#661227"/>

    
    <polyline points="20,210 35,170 50,130 65,80" fill="none" stroke="#661227" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <circle cx="20" cy="210" r="4" fill="#2a221c"/>
    <circle cx="35" cy="170" r="4" fill="#2a221c"/>
    <circle cx="50" cy="130" r="4" fill="#2a221c"/>
    <circle cx="65" cy="80" r="5" fill="#661227"/>
  </g>

  
  <g stroke="#2a221c" stroke-width="1" stroke-opacity="0.5">
    
    <line x1="68" y1="58" x2="92" y2="58"/>
    <line x1="68" y1="58" x2="68" y2="82"/>
    
    
    <line x1="1108" y1="58" x2="1132" y2="58"/>
    <line x1="1132" y1="58" x2="1132" y2="82"/>

    
    <line x1="68" y1="617" x2="92" y2="617"/>
    <line x1="68" y1="593" x2="68" y2="617"/>

    
    <line x1="1108" y1="617" x2="1132" y2="617"/>
    <line x1="1132" y1="593" x2="1132" y2="617"/>
  </g>

</svg>