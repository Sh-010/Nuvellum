<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <rect id="bg" width="1200" height="675" fill="#f3ecdf" />
    
    
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a221c" stroke-width="0.3" opacity="0.1" />
    </pattern>

    
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#661227" stroke-width="1.5" opacity="0.3" />
    </pattern>

    <pattern id="hatch-stone" width="6" height="6" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8c8275" stroke-width="1" opacity="0.4" />
    </pattern>
  </defs>

  
  
  <rect width="1200" height="675" fill="url(#grid)" />

  
  <rect x="40" y="40" width="1120" height="595" fill="none" stroke="#2a221c" stroke-width="1.5" opacity="0.8" />
  <rect x="48" y="48" width="1104" height="579" fill="none" stroke="#2a221c" stroke-width="0.5" opacity="0.5" />

  
  <g opacity="0.25" stroke="#2a221c" stroke-width="0.75" fill="none">
    
