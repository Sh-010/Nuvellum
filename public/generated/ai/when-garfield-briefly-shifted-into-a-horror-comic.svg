  <path d="M 0 0 L 1200 0 L 1200 675 L 0 675 Z" fill="none" stroke="#2a221c" stroke-width="16" opacity="0.15" />
  <path d="M 0 0 L 1200 0 L 1200 675 L 0 675 Z" fill="none" stroke="#661227" stroke-width="6" opacity="0.08" />

  
  <g stroke="#2a221c" stroke-width="1" opacity="0.5">
    
