<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <style>
      .bg { fill: #f3ecdf; }
      .ink-dark { fill: #2a221c; }
      .ink-light { fill: #5c4f45; }
      .burgundy { fill: #661227; }
      .burgundy-light { fill: #8a223a; }
      .accent-blue { fill: #3b525c; }
      .paper-grid { stroke: #e3d7c8; stroke-width: 1; }
      .fine-line { stroke: #2a221c; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .dashed-line { stroke: #661227; stroke-width: 1.5; stroke-dasharray: 4,6; stroke-linecap: round; fill: none; }
      .dotted-line { stroke: #5c4f45; stroke-width: 1.5; stroke-dasharray: 2,6; stroke-linecap: round; fill: none; }
      .hatch { stroke: #2a221c; stroke-width: 0.8; opacity: 0.6; }
      .hatch-burgundy { stroke: #661227; stroke-width: 0.8; opacity: 0.7; }
    </style>
    
    
    <pattern id="engraving" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" class="hatch" />
    </pattern>
    <pattern id="engraving-dense" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="4" class="hatch" />
    </pattern>
