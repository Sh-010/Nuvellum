<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <style>
      .bg { fill: #f3ecdf; }
      .paper-grain { opacity: 0.04; mix-blend-mode: multiply; }
      .ink-dark { fill: #2a221c; stroke: #2a221c; }
      .ink-burgundy { fill: #661227; stroke: #661227; }
      .ink-stone { fill: #8c8275; stroke: #8c8275; }
      .ink-blue { fill: #2b4555; stroke: #2b4555; }
      .line-fine { stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .line-med { stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .line-bold { stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .hatch { stroke: #2a221c; stroke-width: 0.75; opacity: 0.35; }
      .hatch-burgundy { stroke: #661227; stroke-width: 0.75; opacity: 0.35; }
      .hatch-stone { stroke: #8c8275; stroke-width: 0.75; opacity: 0.25; }
      .stamp-box { fill: none; stroke: #661227; stroke-width: 1; stroke-dasharray: 4,4; }
    </style>

    
    <pattern id="doc-texture" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" class="hatch" />
    </pattern>
    <pattern id="doc-texture-dense" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="6" class="hatch-burgundy" />
    </pattern>
    <pattern id="stone-texture" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="8" class="hatch-stone" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" class="bg" />

  
  <g class="paper-grain">
    <rect width="1200" height="675" fill="url(#stone-texture)" />
  </g>

  
  <line x1="80" y1="50" x2="1120" y2="50" class="line-fine" stroke="#8c8275" stroke-opacity="0.5" />
  <line x1="80" y1="625" x2="1120" y2="625" class="line-fine" stroke="#8c8275" stroke-opacity="0.5" />
  <circle cx="80" cy="50" r="3" class="ink-stone" />
  <circle cx="1120" cy="50" r="3" class="ink-stone" />
  <circle cx="80" cy="625" r="3" class="ink-stone" />
  <circle cx="1120" cy="625" r="3" class="ink-stone" />

  

  
  <g transform="translate(240, 120)">
    
    <polygon points="0,20 380,0 400,420 20,440" fill="#e4dbcc" stroke="#2a221c" stroke-width="2" />
    
    
    <polygon points="15,35 375,17 390,405 30,423" fill="#faf6ed" stroke="#2a221c" stroke-width="2" />
    
    
    <line x1="60" y1="70" x2="220" y2="60" class="line-bold" stroke="#661227" />
    <line x1="60" y1="85" x2="140" y2="80" class="line-fine" />
    
    
    <line x1="60" y1="120" x2="340" y2="108" class="line-fine" />
    <line x1="60" y1="145" x2="310" y2="133" class="line-fine" />
    <line x1="60" y1="170" x2="350" y2="158" class="line-fine" />
    <line x1="60" y1="195" x2="280" y2="183" class="line-fine" />
    
    <line x1="60" y1="235" x2="330" y2="223" class="line-fine" />
    <line x1="60" y1="260" x2="300" y2="248" class="line-fine" />
    <line x1="60" y1="285" x2="340" y2="273" class="line-fine" />

    
    <rect x="60" y="310" width="130" height="70" fill="none" stroke="#2a221c" stroke-width="1.5" />
    <path d="M 75 355 Q 100 320 125 340 T 175 325" class="line-med" stroke="#661227" />
    <circle cx="75" cy="355" r="3" class="ink-burgundy" />
    <circle cx="175" cy="325" r="3" class="ink-burgundy" />

    
    <rect x="210" y="325" width="130" height="18" fill="#2a221c" />
    <rect x="210" y="353" width="90" height="18" fill="#2a221c" />
  </g>

  
  <g transform="translate(560, 95)">
    
    <polygon points="30,0 410,35 385,455 5,420" fill="#e4dbcc" stroke="#2a221c" stroke-width="2" />
    
    
    <polygon points="45,15 395,47 372,437 22,405" fill="#faf6ed" stroke="#2a221c" stroke-width="2" />
    
    
    <line x1="90" y1="65" x2="270" y2="78" class="line-bold" stroke="#2b4555" />
    <line x1="90" y1="85" x2="170" y2="92" class="line-fine" />

    
    <line x1="90" y1="125" x2="340" y2="140" class="line-fine" />
    <line x1="90" y1="150" x2="320" y2="165" class="line-fine" />
    <line x1="90" y1="175" x2="350" y2="190" class="line-fine" />
    <line x1="90" y1="200" x2="270" y2="215" class="line-fine" />

    <line x1="90" y1="240" x2="330" y2="255" class="line-fine" />
    <line x1="90" y1="265" x2="310" y2="280" class="line-fine" />

    
    <rect x="250" y="310" width="95" height="75" class="stamp-box" />
    <circle cx="297" cy="347" r="28" fill="none" stroke="#661227" stroke-width="2" />
    <path d="M 280 347 L 314 347 M 297 330 L 297 364" stroke="#661227" stroke-width="1.5" />
  </g>

  
  <g>
    
    <path d="M 300 480 Q 500 550 720 440" fill="none" stroke="#2a221c" stroke-width="24" opacity="0.15" />
    
    <path d="M 300 470 Q 500 540 720 430" fill="none" stroke="#661227" stroke-width="36" stroke-linecap="butt" />
    
    <path d="M 300 460 Q 500 530 720 420" fill="none" stroke="#faf6ed" stroke-width="2" opacity="0.4" />
    <path d="M 300 480 Q 500 550 720 440" fill="none" stroke="#faf6ed" stroke-width="2" opacity="0.4" />
    <path d="M 300 470 Q 500 540 720 430" fill="none" stroke="#2a221c" stroke-width="1" stroke-dasharray="12,8" opacity="0.5" />
  </g>

  
  <g transform="translate(0, -10)">
    
    <g transform="translate(320, 360) rotate(-25)">
      <polygon points="-10,0 10,0 5,140 -5,140" fill="#2a221c" />
      <path d="M -5 140 L 0 170 L 5 140 Z" fill="#8c8275" stroke="#2a221c" stroke-width="1" />
      <line x1="0" y1="140" x2="0" y2="165" class="line-fine" stroke="#faf6ed" />
      
      <rect x="-10" y="30" width="20" height="6" fill="#8c8275" />
    </g>

    
    <g transform="translate(760, 310) rotate(35)">
      <polygon points="-10,0 10,0 5,140 -5,140" fill="#2b4555" />
      <path d="M -5 140 L 0 170 L 5 140 Z" fill="#8c8275" stroke="#2a221c" stroke-width="1" />
      <line x1="0" y1="140" x2="0" y2="165" class="line-fine" stroke="#faf6ed" />
      
      <rect x="-10" y="30" width="20" height="6" fill="#e4dbcc" />
    </g>
  </g>

  
  <g transform="translate(500, 395)">
    
    <path d="M 0 -35 C 25 -35 40 -15 35 10 C 30 35 15 45 -5 40 C -25 35 -40 15 -35 -10 C -30 -32 -15 -35 0 -35 Z" fill="#661227" stroke="#2a221c" stroke-width="2" />
    
    <circle cx="0" cy="2" r="22" fill="none" stroke="#faf6ed" stroke-width="1.5" stroke-dasharray="4,2" />
    
    <path d="M -15 -18 L 12 18" stroke="#faf6ed" stroke-width="3" stroke-linecap="round" />
    <path d="M -12 15 L 15 -15" stroke="#661227" stroke-width="4" />
    <path d="M -12 15 L 15 -15" stroke="#faf6ed" stroke-width="1.5" stroke-linecap="round" />
  </g>

  
  <g opacity="0.4" transform="translate(60, 80)">
    <line x1="0" y1="0" x2="25" y2="0" class="line-fine" />
    <line x1="0" y1="0" x2="0" y2="25" class="line-fine" />
  </g>
  <g opacity="0.4" transform="translate(1140, 80)">
    <line x1="0" y1="0" x2="-25" y2="0" class="line-fine" />
    <line x1="0" y1="0" x2="0" y2="25" class="line-fine" />
  </g>
  <g opacity="0.4" transform="translate(60, 595)">
    <line x1="0" y1="0" x2="25" y2="0" class="line-fine" />
    <line x1="0" y1="0" x2="0" y2="-25" class="line-fine" />
  </g>
  <g opacity="0.4" transform="translate(1140, 595)">
    <line x1="0" y1="0" x2="-25" y2="0" class="line-fine" />
    <line x1="0" y1="0" x2="0" y2="-25" class="line-fine" />
  </g>

</svg>