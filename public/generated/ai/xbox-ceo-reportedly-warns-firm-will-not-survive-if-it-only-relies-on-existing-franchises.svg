    <circle cx="750" cy="140" r="3.5" fill="#661227"/>
    <line x1="710" y1="170" x2="750" y2="140" stroke="#661227" stroke-width="1.5"/>

    
    <g stroke="#2a221c" stroke-width="0.5" opacity="0.6">
      <line x1="485" y1="325" x2="515" y2="325"/>
      <line x1="485" y1="330" x2="525" y2="330"/>
      <line x1="485" y1="335" x2="520" y2="335"/>
      <line x1="485" y1="340" x2="530" y2="340"/>
