  </g>

  
  <g stroke="#661227" stroke-width="1" opacity="0.4">
    <line x1="120" y1="75" x2="220" y2="75"/>
    <line x1="120" y1="78" x2="160" y2="78"/>
  </g>

  
  <g stroke="#2a221c" stroke-width="0.75" opacity="0.4">
