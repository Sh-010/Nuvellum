    <line x1="60" y1="337" x2="1140" y2="337" stroke="#7a6f63" stroke-width="0.5" stroke-dasharray="3,6" />

    
    <rect x="220" y="140" width="120" height="80" rx="4" fill="none" stroke="#2a221c" stroke-width="1.5" />
