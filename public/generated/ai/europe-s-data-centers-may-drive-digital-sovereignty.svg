<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#3A506B" />
    </linearGradient>

    
    <linearGradient id="datacenterGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#4361EE" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#7209B7" stop-opacity="0.3" />
    </linearGradient>

    
    <linearGradient id="fieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B4332" />
      <stop offset="50%" stop-color="#081C15" />
      <stop offset="100%" stop-color="#041511" />
    </linearGradient>

    
    <linearGradient id="waterGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#48CAE4" stop-opacity="0" />
      <stop offset="50%" stop-color="#00B4D8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#90E0EF" stop-opacity="0.2" />
    </linearGradient>

    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#070A13" stop-opacity="0.7" />
    </radialGradient>
  </defs>

  
  <rect width="1200" height="675" fill="url(#skyGrad)" />

  
  <path d="M-100,100 C200,50 400,250 700,120 C1000,-10 1100,80 1300,50 L1300,400 L-100,400 Z" fill="url(#datacenterGlow)" opacity="0.15" />
