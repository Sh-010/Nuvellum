      <line x1="915" y1="400" x2="965" y2="400" />
      <line x1="915" y1="440" x2="965" y2="440" />
    </g>
  </g>

  
  <g transform="translate(600, 310)">
    
    <ellipse cx="0" cy="160" rx="45" ry="12" fill="#2a221c" opacity="0.15" />

    
    <g transform="rotate(-25)">
      
      <path d="M 0 -110 C 65 -70 85 0 85 0 C 85 0 65 70 0 110 C -65 70 -85 0 -85 0 C -85 0 -65 -70 0 -110 Z" 
            fill="#e5dccb" stroke="#2a221c" stroke-width="2.5" />

      
      <path d="M 0 -110 C -30 -70 -50 0 -50 0 C -50 0 -30 70 0 110 Z" fill="url(#hatch)" />

      
