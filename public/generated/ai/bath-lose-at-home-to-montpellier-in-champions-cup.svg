      <line x1="-12" y1="-10" x2="12" y2="-10" stroke="#2a221c" stroke-width="2" />
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#2a221c" stroke-width="2" />
      <line x1="-12" y1="10" x2="12" y2="10" stroke="#2a221c" stroke-width="2" />
      <line x1="0" y1="-16" x2="0" y2="16" stroke="#2a221c" stroke-width="2" />
    </g>

    
    <g fill="none" stroke-linecap="round">
      
      <path d="M -140 -60 Q -40 -100 120 -40" stroke="#661227" stroke-width="2.5" stroke-dasharray="8,6" />
      
      <path d="M 105 -50 L 120 -40 L 108 -28" stroke="#661227" stroke-width="2.5" />

      
      <line x1="-100" y1="80" x2="-60" y2="50" stroke="#2a221c" stroke-width="1.5" />
      <line x1="-115" y1="50" x2="-75" y2="25" stroke="#2a221c" stroke-width="1.5" />
      <line x1="-130" y1="20" x2="-90" y2="0" stroke="#2a221c" stroke-width="1.5" />
    </g>
  </g>

  
  <g fill="none" stroke="#2a221c" stroke-width="0.75" opacity="0.35">
    
    <line x1="300" y1="240" x2="300" y2="500" />
    <line x1="295" y1="240" x2="305" y2="240" />
    <line x1="295" y1="500" x2="305" y2="500" />
    
    
    <line x1="600" y1="480" x2="600" y2="495" stroke-width="1.5" />
    <circle cx="600" cy="480" r="2" fill="#2a221c" />

    
    <path d="M 220 310 L 220 300 L 300 300 L 300 310" />
    
