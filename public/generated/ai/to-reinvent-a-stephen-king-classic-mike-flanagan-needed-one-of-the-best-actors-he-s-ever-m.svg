      <line x1="100" y1="80" x2="100" y2="120" />
      <line x1="105" y1="85" x2="135" y2="85" />
      <line x1="105" y1="85" x2="105" y2="115" />

      
      <line x1="1100" y1="80" x2="1060" y2="80" />
      <line x1="1100" y1="80" x2="1100" y2="120" />
      <line x1="1095" y1="85" x2="1065" y2="85" />
      <line x1="1095" y1="85" x2="1095" y2="115" />

      
