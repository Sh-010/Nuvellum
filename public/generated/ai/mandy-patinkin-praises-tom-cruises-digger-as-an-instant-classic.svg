<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <style>
      .bg { fill: #f3ecdf; }
      .paper-grain { opacity: 0.04; mix-blend-mode: multiply; }
      .ink-base { fill: #2a221c; }
      .burgundy { fill: #661227; }
      .stone-grey { fill: #8c8275; }
      .light-stone { fill: #d4cbbd; }
      .earth-ochre { fill: #a6633b; }
      .line-ink { stroke: #2a221c; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .line-fine { stroke: #2a221c; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .line-burgundy { stroke: #661227; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .line-stone { stroke: #8c8275; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .hatch { stroke: #2a221c; stroke-width: 0.75; stroke-linecap: round; }
    </style>
    
    
    <pattern id="hatch-pat" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" class="hatch" />
    </pattern>
    <pattern id="dot-pat" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" class="stone-grey" opacity="0.3" />
      <circle cx="10" cy="10" r="1" class="stone-grey" opacity="0.3" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" class="bg" />
  <rect width="1200" height="675" fill="url(#dot-pat)" />

  
  <path d="M 60 50 L 1140 50" class="line-burgundy" stroke-width="3" />
