<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <rect id="bg" width="1200" height="675" fill="#f4ede2" />
    
    
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.75" stroke-opacity="0.18" />
    </pattern>

    
    <pattern id="crosshatch" width="6" height="6" patternTransform="rotate(30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2a221c" stroke-width="0.8" stroke-opacity="0.22" />
      <line x1="0" y1="0" x2="6" y2="0" stroke="#2a221c" stroke-width="0.4" stroke-opacity="0.12" />
    </pattern>

    <style>
      .charcoal { fill: #2a221c; }
      .stroke-charcoal { stroke: #2a221c; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .thin-charcoal { stroke: #2a221c; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
      .burgundy { fill: #661227; }
      .stone { fill: #d4c9b8; }
      .warm-white { fill: #fcf8f2; }
      .accent-blue { fill: #3b525c; }
    </style>
  </defs>

  
  

  
  <line x1="80" y1="60" x2="1120" y2="60" stroke="#2a221c" stroke-width="1.5" stroke-opacity="0.3" />
  <line x1="80" y1="615" x2="1120" y2="615" stroke="#2a221c" stroke-width="1.5" stroke-opacity="0.3" />

  
  <g stroke="#2a221c" stroke-opacity="0.08" stroke-width="1">
    <line x1="200" y1="60" x2="200" y2="615" />
    <line x1="400" y1="60" x2="400" y2="615" />
    <line x1="600" y1="60" x2="600" y2="615" />
    <line x1="800" y1="60" x2="800" y2="615" />
    <line x1="1000" y1="60" x2="1000" y2="615" />
    <line x1="80" y1="180" x2="1120" y2="180" />
    <line x1="80" y1="337" x2="1120" y2="337" />
    <line x1="80" y1="495" x2="1120" y2="495" />
  </g>

  

  
  <g transform="translate(260, 240)">
    
    <path d="M -80 240 L 160 260 L 220 200 L -20 180 Z" fill="#2a221c" fill-opacity="0.1" />

    
    <path d="M -100 200 L 80 200 L 80 140 Z" fill="#d4c9b8" class="stroke-charcoal" />
    <path d="M -100 200 L 80 200 L 80 140 Z" fill="url(#hatch)" />

    
    <rect x="-90" y="80" width="90" height="60" class="warm-white stroke-charcoal" />
    <line x1="-90" y1="110" x2="0" y2="110" class="thin-charcoal" />
    <circle cx="-45" cy="95" r="4" class="charcoal" />

    
    <path d="M 10 140 L 130 140 L 130 80 L 10 80 Z" class="stone stroke-charcoal" />
    <path d="M 10 140 L 130 140 L 130 80 L 10 80 Z" fill="url(#crosshatch)" opacity="0.5" />
    <line x1="70" y1="80" x2="70" y2="140" class="thin-charcoal" />

    
    <g transform="translate(-40, 0)">
      <ellipse cx="25" cy="20" rx="25" ry="10" class="warm-white stroke-charcoal" />
      <path d="M 0 20 L 0 80 C 0 90, 50 90, 50 80 L 50 20 Z" class="warm-white stroke-charcoal" />
      <path d="M 0 20 L 0 80 C 0 90, 50 90, 50 80 L 50 20 Z" fill="url(#hatch)" />
      <ellipse cx="25" cy="80" rx="25" ry="10" class="stone stroke-charcoal" />
    </g>

    
    <path d="M -60 -10 L 150 -30 L 150 -15 L -60 5 Z" class="burgundy stroke-charcoal" />
    
    
    <g stroke="#661227" stroke-width="1" stroke-dasharray="3,3">
      <line x1="-90" y1="65" x2="150" y2="65" />
      <line x1="-90" y1="60" x2="-90" y2="70" />
      <line x1="150" y1="60" x2="150" y2="70" />
    </g>
  </g>

  
  <g transform="translate(680, 280) rotate(12)">
    
    
    <path d="M 20 20 L 140 -20 L 150 10 L 30 50 Z" class="stone stroke-charcoal" />
    
    
    <rect x="60" y="-110" width="50" height="80" class="warm-white stroke-charcoal" transform="rotate(-15 85 -70)" />
    <line x1="60" y1="-70" x2="110" y2="-70" class="thin-charcoal" transform="rotate(-15 85 -70)" />

    
    <circle cx="160" cy="-60" r="28" class="burgundy stroke-charcoal" />
    <path d="M 140 -75 C 150 -85, 170 -85, 180 -75" fill="none" stroke="#fcf8f2" stroke-width="2" stroke-linecap="round" />
    <path d="M 160 -60 L 160 -32" class="thin-charcoal" stroke-dasharray="2,2" />

    
    <g class="thin-charcoal" transform="translate(110, -140)">
      <circle cx="0" cy="0" r="12" fill="none" />
      <line x1="-16" y1="0" x2="16" y2="0" />
      <line x1="0" y1="-16" x2="0" y2="16" />
    </g>
  </g>

  
  <g transform="translate(860, 180) rotate(-25)">
    <polygon points="0,0 30,10 15,40 -10,25" class="stone stroke-charcoal" />
    <path d="M 0 0 L 30 10 L 15 40 L -10 25 Z" fill="url(#hatch)" />
  </g>
  <g transform="translate(540, 120) rotate(40)">
    <rect x="0" y="0" width="22" height="22" class="warm-white stroke-charcoal" />
    <line x1="0" y1="0" x2="22" y2="22" class="thin-charcoal" />
  </g>

  
  <g transform="translate(0, 480)">
    
    <path d="M 120 0 L 1080 0 L 1040 35 L 160 35 Z" class="charcoal" />
    <path d="M 160 35 L 1040 35 L 1040 50 L 160 50 Z" class="stone" class-stroke="charcoal" stroke="#2a221c" stroke-width="2" />
    
    
    <rect x="160" y="35" width="880" height="15" fill="url(#crosshatch)" />

    
    <line x1="250" y1="0" x2="250" y2="35" stroke="#f4ede2" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="600" y1="0" x2="600" y2="35" stroke="#f4ede2" stroke-width="2" />
    <line x1="950" y1="0" x2="950" y2="35" stroke="#f4ede2" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  
  <g class="charcoal" transform="translate(130, 160)">
    
    <circle cx="0" cy="0" r="18" fill="none" stroke="#2a221c" stroke-width="1.5" />
    <line x1="0" y1="-22" x2="0" y2="22" stroke="#2a221c" stroke-width="1" />
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#2a221c" stroke-width="1" />
    <polygon points="0,-22 4,-14 -4,-14" fill="#2a221c" />
  </g>

  
  <g transform="translate(600, 205)">
    
    <line x1="0" y1="-115" x2="0" y2="120" stroke="#661227" stroke-width="2" stroke-dasharray="6,4" />
    
    
    <polygon points="0,150 -12,120 12,120" class="burgundy" />
    <circle cx="0" cy="115" r="4" fill="#f4ede2" />

    
    <path d="M -20 -115 L 20 -115" stroke="#661227" stroke-width="3" />
    <circle cx="0" cy="-115" r="6" class="burgundy" />
  </g>

  
  <g transform="translate(1010, 140)" stroke="#2a221c" stroke-width="1.25" fill="none">
    <line x1="0" y1="0" x2="40" y2="0" />
    <line x1="20" y1="-20" x2="20" y2="20" />
    <circle cx="20" cy="0" r="25" />
  </g>

  
  <g stroke="#2a221c" stroke-width="1.5">
    <line x1="80" y1="240" x2="95" y2="240" />
    <line x1="80" y1="360" x2="95" y2="360" />
    <line x1="80" y1="480" x2="95" y2="480" />
  </g>
  
  <g stroke="#2a221c" stroke-width="1.5">
    <line x1="1105" y1="240" x2="1120" y2="240" />
    <line x1="1105" y1="360" x2="1120" y2="360" />
    <line x1="1105" y1="480" x2="1120" y2="480" />
  </g>

</svg>