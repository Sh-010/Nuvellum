<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <radialGradient id="paper-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#f8f4ec"/>
      <stop offset="70%" stop-color="#f3ecdf"/>
      <stop offset="100%" stop-color="#e8decb"/>
    </radialGradient>
    
    
    <pattern id="hatch-fine" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2a221c" stroke-width="0.3" stroke-opacity="0.25"/>
    </pattern>
    <pattern id="hatch-dense" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#661227" stroke-width="0.35" stroke-opacity="0.35"/>
    </pattern>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#2a221c" flood-opacity="0.15"/>
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="url(#paper-grad)"/>

  
  <g stroke="#2a221c" stroke-opacity="0.15" stroke-width="1">
    <line x1="80" y1="60" x2="1120" y2="60"/>
    <line x1="80" y1="615" x2="1120" y2="615"/>
    <line x1="80" y1="60" x2="80" y2="615"/>
    <line x1="1120" y1="60" x2="1120" y2="615"/>
  </g>

  
  <g transform="translate(100, 80)">
    
    
