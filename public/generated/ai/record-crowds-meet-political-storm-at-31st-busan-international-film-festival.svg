      <path d="M 60,320 C 250,380 400,220 600,280 C 800,340 950,240 1020,200" fill="none" stroke="#2a221c" stroke-width="64" stroke-linecap="square"/>
      
      <path d="M 60,320 C 250,380 400,220 600,280 C 800,340 950,240 1020,200" fill="none" stroke="#f3ecdf" stroke-width="48" stroke-linecap="square"/>
      
      
      <path d="M 60,296 C 250,356 400,196 600,256 C 800,316 950,216 1020,176" fill="none" stroke="#2a221c" stroke-width="4" stroke-dasharray="12,16"/>
      <path d="M 60,344 C 250,404 400,244 600,304 C 800,364 950,264 1020,224" fill="none" stroke="#2a221c" stroke-width="4" stroke-dasharray="12,16"/>
    </g>

    
    
    <g transform="translate(350, 100)" filter="url(#shadow)">
      
      <polygon points="50,20 320,0 350,280 80,300" fill="#f8f4ec" stroke="#2a221c" stroke-width="2"/>
      
