        <rect x="32" y="80" width="12" height="250" fill="#f8f4ec"/>
        <rect x="48" y="10" width="12" height="320" fill="#661227" opacity="0.2"/>
        <rect x="64" y="40" width="12" height="290" fill="#f8f4ec"/>
        <rect x="80" y="15" width="12" height="315" fill="#f8f4ec"/>
        <rect x="96" y="60" width="12" height="270" fill="#2a221c" opacity="0.1"/>
        <rect x="112" y="30" width="12" height="300" fill="#f8f4ec"/>
      </g>
      
      <path d="M-10,330 C40,310 80,340 140,320" fill="none" stroke="#2a221c" stroke-width="2"/>
      <path d="M-5,340 C45,320 85,350 145,330" fill="none" stroke="#661227" stroke-width="2"/>
    </g>

    
    <g transform="translate(520, 250)" filter="url(#shadow)">
      
      <circle cx="0" cy="0" r="75" fill="#f8f4ec" stroke="#2a221c" stroke-width="4"/>
      <circle cx="0" cy="0" r="62" fill="none" stroke="#661227" stroke-width="2" stroke-dasharray="8,4"/>
      
      
      <circle cx="0" cy="0" r="50" fill="#2a221c"/>
