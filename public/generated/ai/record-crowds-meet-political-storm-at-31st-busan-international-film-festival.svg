      <line x1="40" y1="50" x2="180" y2="60" stroke="#2a221c" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="38" y1="70" x2="160" y2="80" stroke="#2a221c" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="42" y1="90" x2="190" y2="100" stroke="#2a221c" stroke-width="1" stroke-dasharray="4,4"/>
      
