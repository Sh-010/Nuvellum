      .amber { fill: #b85d19; }
      .stone { fill: #bfaea2; }
      .stone-light { fill: #ded3c5; }
      .ink-line { stroke: #2a221c; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
