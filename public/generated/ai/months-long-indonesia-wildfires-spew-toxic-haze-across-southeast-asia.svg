    </pattern>
    <pattern id="dense-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2a221c" stroke-width="1" opacity="0.15" />
    </pattern>
  </defs>

  
