    <rect x="810" y="200" width="140" height="280" />
    <line x1="880" y1="200" x2="880" y2="480" />
    <line x1="810" y1="340" x2="950" y2="340" />
    <path d="M810,270 L880,200 L950,270 L880,340 Z" />
    <path d="M810,410 L880,340 L950,410 L880,480 Z" />
  </g>

  
  <path d="M 400 580 C 450 480, 500 350, 600 350 C 700 350, 750 480, 800 580 Z" fill="#661227" opacity="0.06" />

  
  <g id="altar-structure" fill="#efe8db" stroke="#2a221c" stroke-width="2">
    
