    <line x1="830" y1="510" x2="839" y2="560" />
    <line x1="840" y1="510" x2="849" y2="560" />
    <line x1="850" y1="510" x2="859" y2="560" />
    <line x1="860" y1="510" x2="869" y2="560" />
    <line x1="870" y1="510" x2="879" y2="560" />
  </g>

  
  <line x1="40" y1="600" x2="1160" y2="600" stroke="#2a221c" stroke-width="2" />
  <line x1="40" y1="606" x2="1160" y2="606" stroke="#2a221c" stroke-width="0.75" opacity="0.5" />

</svg>