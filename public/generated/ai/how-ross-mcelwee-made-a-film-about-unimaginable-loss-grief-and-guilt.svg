<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  
  <defs>
    
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      
        
      
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.9" />
        <feFuncG type="linear" slope="0.88" />
        <feFuncB type="linear" slope="0.85" />
      </feComponentTransfer>
      <feBlend mode="multiply" in="SourceGraphic" result="blend" />
    </filter>

    
    <pattern id="hatch-fine" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.6" opacity="0.15" />
    </pattern>
    
    <pattern id="hatch-dense" width="4" height="4" patternTransform="rotate(-30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#661227" stroke-width="0.5" opacity="0.2" />
    </pattern>

    <clipPath id="lens-clip">
      <circle cx="600" cy="300" r="180" />
    </clipPath>
  </defs>

  
  <rect width="1200" height="675" fill="#efe8db" />
  <rect width="1200" height="675" filter="url(#paper-texture)" opacity="0.6" />

  
  <path d="M 0,0 L 1200,0 M 0,675 L 1200,675" stroke="#2a221c" stroke-width="1" opacity="0.1" />
  <line x1="150" y1="80" x2="150" y2="595" stroke="#2a221c" stroke-width="0.5" opacity="0.15" />
  <line x1="1050" y1="80" x2="1050" y2="595" stroke="#2a221c" stroke-width="0.5" opacity="0.15" />

  

  
  <circle cx="600" cy="300" r="195" fill="#661227" opacity="0.08" />

  
  <g opacity="0.85">
    
    <path d="M 420,180 C 350,220 280,300 320,420 C 350,510 400,560 450,610" 
          fill="none" stroke="#2a221c" stroke-width="32" stroke-dasharray="16 8" />
    <path d="M 420,180 C 350,220 280,300 320,420 C 350,510 400,560 450,610" 
          fill="none" stroke="#efe8db" stroke-width="24" />
    
    <path d="M 420,180 C 350,220 280,300 320,420 C 350,510 400,560 450,610" 
          fill="none" stroke="#2a221c" stroke-width="2" stroke-dasharray="4 28" />

    
    <path d="M 780,180 C 850,250 920,340 880,460 C 860,520 800,580 750,630" 
          fill="none" stroke="#2a221c" stroke-width="28" stroke-dasharray="14 7" />
    <path d="M 780,180 C 850,250 920,340 880,460 C 860,520 800,580 750,630" 
          fill="none" stroke="#efe8db" stroke-width="20" />
    <path d="M 780,180 C 850,250 920,340 880,460 C 860,520 800,580 750,630" 
          fill="none" stroke="#2a221c" stroke-width="2" stroke-dasharray="4 24" />
  </g>

  
  <g stroke="#661227" stroke-width="1.5" fill="#f3ecdf" opacity="0.7" transform="rotate(-12 450 320)">
    <rect x="400" y="270" width="80" height="60" />
    <line x1="400" y1="270" x2="480" y2="330" stroke-width="0.5" opacity="0.4"/>
  </g>
  <g stroke="#2a221c" stroke-width="1.5" fill="#efe8db" opacity="0.8" transform="rotate(8 720 260)">
    <rect x="680" y="220" width="90" height="70" />
    <line x1="770" y1="220" x2="680" y2="290" stroke-width="0.5" opacity="0.4"/>
  </g>

  
  <circle cx="600" cy="300" r="180" fill="none" stroke="#2a221c" stroke-width="3" />
  <circle cx="600" cy="300" r="172" fill="none" stroke="#661227" stroke-width="1" stroke-dasharray="6 3" />
  
  
  <g stroke="#2a221c" stroke-width="1.5" fill="none">
    
    <path d="M 600,120 L 727,203 L 681,348 L 519,348 L 473,203 Z" stroke-width="2" fill="#e5ded1" fill-opacity="0.5" />
    
    
    <path d="M 600,120 C 650,180 680,240 681,348" />
    <path d="M 727,203 C 680,230 620,270 519,348" />
    <path d="M 681,348 C 620,340 560,320 473,203" />
    <path d="M 519,348 C 530,290 550,220 600,120" />
    <path d="M 473,203 C 530,220 580,240 727,203" />
  </g>

  
  <g transform="translate(600, 330)">
    
    <path d="M -25,-70 L -25,-120 C -25,-130 -15,-135 0,-135 C 15,-135 25,-130 25,-120 L 25,-70" 
          fill="none" stroke="#2a221c" stroke-width="3" stroke-linecap="round" />
    
    <line x1="-10" y1="-125" x2="-10" y2="-75" stroke="#2a221c" stroke-width="1.5" />
    <line x1="0" y1="-125" x2="0" y2="-75" stroke="#2a221c" stroke-width="1.5" />
