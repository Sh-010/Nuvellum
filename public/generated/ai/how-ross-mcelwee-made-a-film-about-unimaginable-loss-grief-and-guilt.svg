    <line x1="592" y1="47" x2="608" y2="47" />

    
    <line x1="600" y1="620" x2="600" y2="635" />
    <line x1="592" y1="627" x2="608" y2="627" />

    
    <line x1="140" y1="300" x2="155" y2="300" />
    <line x1="147" y1="292" x2="147" y2="308" />

    
    <line x1="1045" y1="300" x2="1060" y2="300" />
    <line x1="1052" y1="292" x2="1052" y2="308" />
  </g>

  
  <circle cx="280" cy="150" r="2" fill="#2a221c" opacity="0.4" />
  <circle cx="920" cy="500" r="1.5" fill="#661227" opacity="0.5" />
  <circle cx="850" cy="130" r="1" fill="#2a221c" opacity="0.3" />
  <circle cx="330" cy="530" r="2.5" fill="#2a221c" opacity="0.3" />

  
  <line x1="120" y1="78" x2="1080" y2="78" stroke="#661227" stroke-width="1.5" opacity="0.6" />
  <line x1="120" y1="597" x2="1080" y2="597" stroke="#661227" stroke-width="1.5" opacity="0.6" />
</svg>