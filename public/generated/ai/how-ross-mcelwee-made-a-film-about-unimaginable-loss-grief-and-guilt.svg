    <polygon points="-35,-75 35,-75 40,-65 -40,-65" fill="#661227" opacity="0.85" stroke="#2a221c" stroke-width="2" />
    <polygon points="-35,-75 35,-75 40,-65 -40,-65" fill="url(#hatch-fine)" />

    
    <line x1="-30" y1="-65" x2="-55" y2="15" stroke="#2a221c" stroke-width="2.5" stroke-linecap="round" />
    <line x1="30" y1="-65" x2="55" y2="15" stroke="#2a221c" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-20" y1="-65" x2="-10" y2="20" stroke="#2a221c" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="-65" x2="10" y2="20" stroke="#2a221c" stroke-width="2" stroke-linecap="round" />

    
    <line x1="-40" y1="-20" x2="40" y2="-20" stroke="#2a221c" stroke-width="1.5" />
    
    
    <ellipse cx="0" cy="22" rx="45" ry="8" fill="#2a221c" opacity="0.2" />
  </g>

  
  <g transform="translate(480, 480) rotate(-15) scale(0.7)">
    <rect x="0" y="0" width="70" height="45" rx="6" fill="#efe8db" stroke="#2a221c" stroke-width="3" />
    <circle cx="35" cy="22" r="16" fill="#efe8db" stroke="#2a221c" stroke-width="2.5" />
    <circle cx="35" cy="22" r="10" fill="#661227" opacity="0.4" />
    <rect x="22" y="-6" width="14" height="8" rx="2" fill="#efe8db" stroke="#2a221c" stroke-width="2" />
    <line x1="55" y1="12" x2="62" y2="12" stroke="#2a221c" stroke-width="2" />
  </g>

  
  <path d="M 600,100 C 710,100 800,190 800,300 C 800,410 710,500 600,500" fill="none" stroke="url(#hatch-dense)" stroke-width="12" clip-path="url(#lens-clip)" opacity="0.5" />

  
  <g stroke="#2a221c" stroke-width="1" opacity="0.5">
    
