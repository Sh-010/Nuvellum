<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <style>
      .bg { fill: #f3ecdf; }
      .ink-dark { fill: #2a221c; }
      .ink-charcoal { fill: #3d342d; }
      .burgundy { fill: #661227; }
      .burgundy-trans { fill: #661227; fill-opacity: 0.12; }
      .stone-grey { fill: #b8b0a2; }
      .stone-light { fill: #dcd6cd; }
      .paper-white { fill: #f9f6f0; }
      .line-dark { stroke: #2a221c; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .line-fine { stroke: #2a221c; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .line-burgundy { stroke: #661227; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .line-grey { stroke: #8c8275; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .dashed-line { stroke: #661227; stroke-width: 2; stroke-dasharray: 6,6; stroke-linecap: round; fill: none; }
    </style>
    
    
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.8" stroke-opacity="0.15" />
    </pattern>
    <pattern id="dotgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2a221c" fill-opacity="0.08" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" class="bg" />
  <rect width="1200" height="675" fill="url(#dotgrid)" />

  
  <rect x="40" y="40" width="1120" height="595" fill="none" stroke="#2a221c" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="48" y="48" width="1104" height="579" fill="none" stroke="#2a221c" stroke-width="0.75" stroke-opacity="0.2" />

  
  <g id="architecture" opacity="0.85">
    
    <rect x="150" y="120" width="80" height="435" class="stone-light" />
    <rect x="970" y="120" width="80" height="435" class="stone-light" />
    
    
    <line x1="170" y1="120" x2="170" y2="555" class="line-grey" stroke-opacity="0.3" />
    <line x1="190" y1="120" x2="190" y2="555" class="line-grey" stroke-opacity="0.3" />
    <line x1="210" y1="120" x2="210" y2="555" class="line-grey" stroke-opacity="0.3" />
    
    <line x1="990" y1="120" x2="990" y2="555" class="line-grey" stroke-opacity="0.3" />
    <line x1="1010" y1="120" x2="1010" y2="555" class="line-grey" stroke-opacity="0.3" />
    <line x1="1030" y1="120" x2="1030" y2="555" class="line-grey" stroke-opacity="0.3" />

    
    <polygon points="130,120 250,120 230,95 150,95" class="stone-grey" />
    <polygon points="950,120 1070,120 1050,95 970,95" class="stone-grey" />
    <rect x="130" y="85" width="120" height="10" class="ink-dark" />
    <rect x="950" y="85" width="120" height="10" class="ink-dark" />
  </g>

  
  <g id="central-scene" transform="translate(0, 0)">
    
    
    <polygon points="320,480 880,480 960,340 240,340" class="stone-grey" stroke="#2a221c" stroke-width="2" />
    <polygon points="340,490 860,490 930,360 270,360" class="paper-white" />
    <polygon points="340,490 860,490 930,360 270,360" fill="url(#hatch)" />

    
    <rect x="320" y="480" width="20" height="100" class="ink-dark" />
    <rect x="860" y="480" width="20" height="100" class="ink-dark" />
    <rect x="260" y="340" width="15" height="100" class="stone-grey" />
    <rect x="925" y="340" width="15" height="100" class="stone-grey" />

    
    
    <polygon points="380,440 600,415 580,380 360,405" class="paper-white" stroke="#2a221c" stroke-width="1.5" />
    <line x1="390" y1="415" x2="450" y2="408" class="line-fine" />
    <line x1="395" y1="425" x2="520" y2="410" class="line-fine" />
    <line x1="400" y1="435" x2="490" y2="423" class="line-fine" />

    
    <polygon points="560,455 780,430 760,390 540,415" class="paper-white" stroke="#2a221c" stroke-width="1.5" />
    <line x1="580" y1="432" x2="680" y2="420" class="line-fine" />
    <line x1="585" y1="442" x2="720" y2="427" class="line-fine" />
    
    <circle cx="730" cy="410" r="12" class="burgundy" />
    <circle cx="730" cy="410" r="12" fill="none" stroke="#2a221c" stroke-width="1" />

    
    
    <path d="M 520,310 L 600,310 L 590,190 L 530,190 Z" class="ink-dark" />
    
    <polygon points="500,320 620,320 640,340 480,340" class="ink-charcoal" />
    
    
    <path d="M 560,320 L 575,230" class="line-dark" stroke-width="4" />
    
    <ellipse cx="578" cy="220" rx="8" ry="12" class="stone-grey" stroke="#2a221c" stroke-width="2" transform="rotate(15 578 220)" />
    <line x1="570" y1="320" x2="590" y2="320" class="line-dark" stroke-width="4" />

    
    
    <path d="M 575,325 C 575,325 530,460 380,530 C 260,580 150,560 100,530" class="dashed-line" />
    
    
    <g transform="translate(180, 500) rotate(-15)">
      
      <path d="M 0,0 C 15,-5 35,5 45,25 C 55,45 35,50 15,45 C -5,40 -15,10 0,0 Z" class="ink-dark" />
      <path d="M 45,20 C 60,15 75,25 80,40 C 85,55 70,65 55,60 C 40,55 35,35 45,20 Z" class="stone-grey" stroke="#2a221c" stroke-width="1.5" />
    </g>
    <g transform="translate(280, 520) rotate(-10)">
      <path d="M 0,0 C 15,-5 35,5 45,25 C 55,45 35,50 15,45 C -5,40 -15,10 0,0 Z" class="ink-dark" />
    </g>

    
    
    <g transform="translate(950, 180)">
      <rect x="0" y="0" width="85" height="260" class="burgundy-trans" stroke="#661227" stroke-width="1.5" />
      
      <line x1="20" y1="40" x2="65" y2="40" class="line-burgundy" />
      <line x1="20" y1="70" x2="65" y2="70" class="line-burgundy" />
      <line x1="20" y1="100" x2="45" y2="100" class="line-burgundy" />
      
      
      <circle cx="42" cy="170" r="24" class="burgundy" />
      <circle cx="42" cy="170" r="28" fill="none" stroke="#661227" stroke-width="1.5" stroke-dasharray="3,3" />
      
      <line x1="42" y1="170" x2="42" y2="155" stroke="#f3ecdf" stroke-width="2.5" stroke-linecap="round" />
      <line x1="42" y1="170" x2="55" y2="175" stroke="#f3ecdf" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  
  <g id="forensic-objects">
    
    <g transform="translate(640, 420) rotate(-25)">
      <rect x="0" y="0" width="90" height="8" rx="4" class="ink-dark" />
      
      <polygon points="90,0 105,4 90,8" class="stone-grey" stroke="#2a221c" stroke-width="0.5" />
      <line x1="90" y1="4" x2="98" y2="4" class="line-dark" stroke-width="1" />
      
      <rect x="-25" y="-2" width="20" height="12" rx="3" class="burgundy" />
      <rect x="-25" y="2" width="20" height="4" fill="#2a221c" opacity="0.4" />
    </g>

    
    <polygon points="720,490 890,460 910,500 740,530" class="stone-light" stroke="#2a221c" stroke-width="1" />
    <line x1="750" y1="495" x2="850" y2="475" class="line-grey" />
    <line x1="760" y1="505" x2="830" y2="490" class="line-grey" />
  </g>

  
  <g id="editorial-frame">
    
    <path d="M 55,75 L 55,55 L 75,55" class="line-dark" />
    
    <path d="M 1145,75 L 1145,55 L 1125,55" class="line-dark" />
    
    <path d="M 55,600 L 55,620 L 75,620" class="line-dark" />
    
    <path d="M 1145,600 L 1145,620 L 1125,620" class="line-dark" />

    
    <line x1="240" y1="60" x2="240" y2="615" class="line-grey" stroke-opacity="0.15" stroke-dasharray="4,8" />
    <line x1="960" y1="60" x2="960" y2="615" class="line-grey" stroke-opacity="0.15" stroke-dasharray="4,8" />
  </g>

</svg>