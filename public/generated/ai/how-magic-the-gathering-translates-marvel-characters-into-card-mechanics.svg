<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      
        
      
      <feBlend mode="multiply" in="SourceGraphic" in2="light" result="blend" />
    </filter>
    
    <style>
      .bg { fill: #efe8db; }
      .ink-dark { fill: #2a221c; }
      .ink-stroke { stroke: #2a221c; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .burgundy { fill: #661227; }
      .burgundy-stroke { stroke: #661227; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .stone-grey { fill: #b8b0a2; }
      .stone-stroke { stroke: #8c8275; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .parchment { fill: #f7f2ea; }
      .faint-line { stroke: #d4ccbe; stroke-width: 1; stroke-dasharray: 4 4; }
      .etching { stroke: #2a221c; stroke-width: 0.75; opacity: 0.6; }
    </style>
  </defs>

  
  <rect width="1200" height="675" class="bg" />
  
  
  <rect x="35" y="35" width="1130" height="605" fill="none" stroke="#2a221c" stroke-width="1.5" opacity="0.3" />
  <rect x="43" y="43" width="1114" height="589" fill="none" stroke="#2a221c" stroke-width="0.5" opacity="0.2" />

  
  <g transform="translate(600, 337.5)">
    
    <rect x="-170" y="-240" width="340" height="480" rx="16" class="parchment" />
