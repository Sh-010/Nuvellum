      <line x1="-8" y1="30" x2="8" y2="30" class="etching" />
      <line x1="-8" y1="50" x2="8" y2="50" class="etching" />
      <line x1="-8" y1="70" x2="8" y2="70" class="etching" />
      <line x1="-8" y1="90" x2="8" y2="90" class="etching" />

      
      <rect x="-65" y="-75" width="130" height="65" rx="6" class="ink-dark" />
      <rect x="-55" y="-65" width="110" height="45" rx="3" fill="#efe8db" />
      
      
      <line x1="-35" y1="-42" x2="-20" y2="-42" class="burgundy-stroke" stroke-width="3" />
      <line x1="-27" y1="-55" x2="-27" y2="-30" class="burgundy-stroke" stroke-width="3" />

      <line x1="20" y1="-42" x2="35" y2="-42" class="burgundy-stroke" stroke-width="3" />
      <line x1="27" y1="-55" x2="27" y2="-30" class="burgundy-stroke" stroke-width="3" />

