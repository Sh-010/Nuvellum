    <rect x="-150" y="-220" width="300" height="440" rx="8" fill="none" class="stone-stroke" />

    
    <rect x="-135" y="-190" width="270" height="210" fill="#e5ded2" class="stone-stroke" />

    
    <circle cx="120" cy="-205" r="12" class="burgundy" />
    <circle cx="95" cy="-205" r="12" class="stone-grey" />
    
    
    <line x1="-135" y1="45" x2="135" y2="45" class="etching" />
    <line x1="-135" y1="65" x2="80" y2="65" class="etching" />
    <line x1="-135" y1="85" x2="110" y2="85" class="etching" />
    <line x1="-135" y1="105" x2="40" y2="105" class="etching" />
    
    <line x1="-135" y1="140" x2="135" y2="140" class="etching" />
