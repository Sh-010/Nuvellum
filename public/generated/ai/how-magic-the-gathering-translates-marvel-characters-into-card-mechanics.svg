  <circle cx="60" cy="60" r="2" class="burgundy" />

  
  <path d="M 1140 75 L 1140 60 L 1125 60" fill="none" class="burgundy-stroke" />
  <circle cx="1140" cy="60" r="2" class="burgundy" />

  
  <path d="M 60 600 L 60 615 L 75 615" fill="none" class="burgundy-stroke" />
  <circle cx="60" cy="615" r="2" class="burgundy" />

  
  <path d="M 1140 600 L 1140 615 L 1125 615" fill="none" class="burgundy-stroke" />
