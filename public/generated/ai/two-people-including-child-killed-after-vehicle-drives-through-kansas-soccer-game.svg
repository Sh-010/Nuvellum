    <g opacity="0.4" stroke="#661227" stroke-width="2" fill="none">
      <path d="M 150 560 Q 380 470 600 460 T 1050 360" stroke-dasharray="4 8"/>
      <path d="M 153 564 Q 383 474 603 464 T 1053 364" stroke-dasharray="4 8"/>
    </g>

  </g>

  
  <g>
    
