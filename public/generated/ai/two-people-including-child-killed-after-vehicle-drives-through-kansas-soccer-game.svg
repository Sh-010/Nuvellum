    <path d="M 280 340 L 320 340 M 280 360 L 320 360 M 280 380 L 320 380 M 280 400 L 320 400" fill="none" stroke="#2a221c" stroke-width="0.75" opacity="0.6"/>

    <path d="M 880 420 L 880 320 L 920 320 L 920 420" fill="none" stroke="#2a221c" stroke-width="1.5"/>
    <path d="M 880 340 L 920 340 M 880 360 L 920 360 M 880 380 L 920 380 M 880 400 L 920 400" fill="none" stroke="#2a221c" stroke-width="0.75" opacity="0.6"/>
  </g>

  
  <g stroke="#2a221c" stroke-width="1" opacity="0.25" fill="none">
    <ellipse cx="600" cy="420" rx="450" ry="120"/>
    <line x1="600" y1="300" x2="600" y2="540"/>
  </g>

  
  
  <g filter="url(#soft-shadow)">
    
    <ellipse cx="600" cy="510" rx="320" ry="35" fill="#2a221c" opacity="0.12"/>

    
    <g transform="translate(600, 470)">
      
      <circle cx="0" cy="0" r="55" fill="#fdfbf7" stroke="#2a221c" stroke-width="2.5"/>
      
      
      <polygon points="0,-22 18,-8 11,14 -11,14 -18,-8" fill="#2a221c" opacity="0.85"/>
