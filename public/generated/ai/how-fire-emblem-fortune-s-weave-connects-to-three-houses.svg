<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  
  <defs>
    
    <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0.3 0 0 0 0.93  0 0.3 0 0 0.91  0 0 0.3 0 0.86  0 0 0 0.08 0" in="noise" result="coloredNoise" />
      <feComposite operator="in" in2="SourceGraphic" in="coloredNoise" result="composite" />
      <feBlend mode="multiply" in="SourceGraphic" in2="composite" />
    </filter>

    
    <pattern id="hatch-fine" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.8" opacity="0.35" />
    </pattern>

    
    <pattern id="hatch-dense" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#661227" stroke-width="0.9" opacity="0.45" />
    </pattern>
    
    
    <pattern id="stone-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(60)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#5a5047" stroke-width="0.6" opacity="0.25" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="#f3ecdf" />
  
  
  <rect width="1200" height="675" fill="#efe8db" filter="url(#paper-grain)" opacity="0.7" />

  
  <g id="chronology-background">
    
    <line x1="600" y1="70" x2="600" y2="605" stroke="#2a221c" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4" />
    
    
    <path d="M 220 120 L 380 120 L 380 550 L 220 550 Z" fill="#efe8db" stroke="#2a221c" stroke-width="2" opacity="0.7" />
    <path d="M 235 135 L 365 135 L 365 535 L 235 535 Z" fill="none" stroke="#2a221c" stroke-width="1" opacity="0.4" />
    <line x1="300" y1="135" x2="300" y2="535" stroke="#2a221c" stroke-width="0.8" opacity="0.3" />

    
    <path d="M 820 120 L 980 120 L 980 550 L 820 550 Z" fill="#efe8db" stroke="#2a221c" stroke-width="2" opacity="0.7" />
    <path d="M 835 135 L 965 135 L 965 535 L 835 535 Z" fill="none" stroke="#2a221c" stroke-width="1" opacity="0.4" />
    <line x1="900" y1="135" x2="900" y2="535" stroke="#2a221c" stroke-width="0.8" opacity="0.3" />
  </g>

  
  
  <g id="temporal-threads">
    
    <path d="M 380 200 C 480 160, 720 380, 820 300" fill="none" stroke="#661227" stroke-width="2.5" opacity="0.75" />
    <path d="M 380 320 C 500 450, 700 180, 820 240" fill="none" stroke="#2a221c" stroke-width="1.5" opacity="0.5" />
    <path d="M 380 440 C 490 300, 710 480, 820 420" fill="none" stroke="#661227" stroke-width="2" opacity="0.6" />
    <path d="M 380 270 C 490 270, 710 320, 820 320" fill="none" stroke="#2a221c" stroke-width="3" opacity="0.8" />
  </g>

  
  <g id="left-subject-prik-monolith">
    
    <path d="M 280 220 L 320 220 L 330 460 L 270 460 Z" fill="url(#stone-hatch)" stroke="#2a221c" stroke-width="2.5" />
    <path d="M 300 220 L 300 460" stroke="#2a221c" stroke-width="1" opacity="0.6" />

    
    <g transform="translate(300, 310)">
      
      <polygon points="0,-45 32,-15 20,35 -20,35 -32,-15" fill="#efe8db" stroke="#661227" stroke-width="2" />
      <polygon points="0,-35 24,-10 15,25 -15,25 -24,-10" fill="url(#hatch-dense)" stroke="#2a221c" stroke-width="1.5" />
      
      <circle cx="0" cy="0" r="10" fill="#661227" />
      <circle cx="0" cy="0" r="4" fill="#efe8db" />
      
      <line x1="0" y1="-45" x2="0" y2="-60" stroke="#661227" stroke-width="1.5" />
      <line x1="32" y1="-15" x2="48" y2="-22" stroke="#661227" stroke-width="1.5" />
      <line x1="-32" y1="-15" x2="-48" y2="-22" stroke="#661227" stroke-width="1.5" />
    </g>

    
    <path d="M 260 490 L 340 490" stroke="#2a221c" stroke-width="1.5" stroke-dasharray="3,3" />
    <path d="M 250 510 L 350 510" stroke="#2a221c" stroke-width="1" stroke-dasharray="2,2" />
  </g>

  
  <g id="right-subject-monastery">
    
    <path d="M 880 200 L 920 200 L 930 480 L 870 480 Z" fill="url(#stone-hatch)" stroke="#2a221c" stroke-width="2.5" />
    
    <path d="M 885 240 C 885 220, 915 220, 915 240 L 915 300 L 885 300 Z" fill="#efe8db" stroke="#2a221c" stroke-width="1.5" />
    <path d="M 885 330 C 885 310, 915 310, 915 330 L 915 390 L 885 390 Z" fill="#efe8db" stroke="#2a221c" stroke-width="1.5" />

    
    <g transform="translate(900, 270)">
      <circle cx="0" cy="0" r="22" fill="#efe8db" stroke="#661227" stroke-width="2" />
      <path d="M 0 -16 L 12 8 L -12 8 Z" fill="#661227" />
      <circle cx="0" cy="3" r="5" fill="#efe8db" />
    </g>

    
    <rect x="850" y="480" loc="" width="100" height="12" fill="#efe8db" stroke="#2a221c" stroke-width="2" />
    <rect x="835" y="492" width="130" height="10" fill="#efe8db" stroke="#2a221c" stroke-width="2" />
  </g>

  
  <g id="centerpiece-loom">
    
    <circle cx="600" cy="337" r="85" fill="#efe8db" stroke="#2a221c" stroke-width="2" />
    <circle cx="600" cy="337" r="75" fill="none" stroke="#661227" stroke-width="1" stroke-dasharray="4,4" />
    
    
    <circle cx="600" cy="337" r="55" fill="url(#hatch-fine)" stroke="#2a221c" stroke-width="1.5" />
    <circle cx="600" cy="337" r="30" fill="#efe8db" stroke="#661227" stroke-width="2" />

    
    <path d="M 600 302 L 608 327 L 633 337 L 608 347 L 600 372 L 592 347 L 567 337 L 592 327 Z" fill="#661227" stroke="#2a221c" stroke-width="1.5" />
    <circle cx="600" cy="337" r="6" fill="#efe8db" />

    
    <circle cx="600" cy="180" r="4" fill="#661227" />
    <line x1="600" y1="184" x2="600" y2="252" stroke="#2a221c" stroke-width="1.5" />

    <circle cx="600" cy="494" r="4" fill="#661227" />
    <line x1="600" y1="422" x2="600" y2="490" stroke="#2a221c" stroke-width="1.5" />
  </g>

  
  <g id="editorial-borders" stroke="#2a221c" stroke-width="1.5" fill="none">
    
    <line x1="80" y1="70" x2="1120" y2="70" stroke-width="2" />
    <line x1="90" y1="76" x2="1110" y2="76" />

    
    <line x1="80" y1="605" x2="1120" y2="605" stroke-width="2" />
    <line x1="90" y1="599" x2="1110" y2="599" />

    
    <rect x="78" y="67" width="6" height="12" fill="#661227" stroke="none" />
    <rect x="1116" y="67" width="6" height="12" fill="#661227" stroke="none" />
    <rect x="78" y="601" width="6" height="12" fill="#661227" stroke="none" />
    <rect x="1116" y="601" width="6" height="12" fill="#661227" stroke="none" />

    
    <path d="M 70 85 L 70 70 L 85 70" />
    <path d="M 1130 85 L 1130 70 L 1115 70" />
    <path d="M 70 590 L 70 605 L 85 605" />
    <path d="M 1130 590 L 1130 605 L 1115 605" />
  </g>

  
  <g id="engraving-shadows">
    
    <path d="M 320 220 L 330 460 L 330 480 L 320 220 Z" fill="url(#hatch-fine)" opacity="0.7" />
    
    <path d="M 920 200 L 930 480 L 930 492 L 920 200 Z" fill="url(#hatch-fine)" opacity="0.7" />
  </g>
</svg>