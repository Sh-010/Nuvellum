      <feColorMatrix type="matrix" values="0.3 0 0 0 0  0 0.3 0 0 0  0 0 0.3 0 0  0 0 0 0.05 0" in="noise" result="coloredNoise" />
      <feComposite operator="in" in2="SourceGraphic" in="coloredNoise" result="withNoise" />
      <feBlend mode="multiply" in="SourceGraphic" in2="withNoise" />
    </filter>

    
    <pattern id="hatchBurgundy" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
