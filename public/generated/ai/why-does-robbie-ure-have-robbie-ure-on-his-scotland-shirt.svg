<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <radialGradient id="bg-glow" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#162b4c" />
      <stop offset="50%" stop-color="#0b1322" />
      <stop offset="100%" stop-color="#05080f" />
    </radialGradient>

    
    <linearGradient id="pitch-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a4d2e" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0f2b1a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#07120a" stop-opacity="0.9" />
    </linearGradient>

    
    <radialGradient id="light-beam" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="40%" stop-color="#aadaff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#162b4c" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="jersey-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183661" />
      <stop offset="50%" stop-color="#0e2341" />
      <stop offset="100%" stop-color="#071324" />
    </linearGradient>

    
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#f3e5ab" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>
    
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="url(#bg-glow)" />

  
  <path d="M0 0 L1200 0 L1200 450 L0 300 Z" fill="url(#light-beam)" />
  <circle cx="600" cy="-100" r="400" fill="#ffffff" opacity="0.04" filter="url(#glow)" />
  <circle cx="200" cy="-50" r="300" fill="#6ba4ff" opacity="0.03" filter="url(#glow)" />
  <circle cx="1000" cy="-50" r="300" fill="#6ba4ff" opacity="0.03" filter="url(#glow)" />

  
  <path d="M -100 450 L 1300 380 L 1300 700 L -100 700 Z" fill="url(#pitch-light)" />
  
  <path d="M 0 440 L 1200 400 L 1200 430 L 0 470 Z" fill="#ffffff" opacity="0.03" />
  <path d="M 0 500 L 1200 450 L 1200 490 L 0 540 Z" fill="#ffffff" opacity="0.03" />
  <path d="M 0 580 L 1200 520 L 1200 570 L 0 640 Z" fill="#ffffff" opacity="0.03" />

  
  <g opacity="0.25">
    <path d="M0 380 L150 360 L300 375 L450 350 L600 365 L750 345 L900 360 L1050 340 L1200 355 L1200 450 L0 450 Z" fill="#03070d" />
    <line x1="150" y1="200" x2="150" y2="360" stroke="#162b4c" stroke-width="2" />
    <line x1="450" y1="180" x2="450" y2="350" stroke="#162b4c" stroke-width="2" />
    <line x1="750" y1="190" x2="750" y2="345" stroke="#162b4c" stroke-width="2" />
    <line x1="1050" y1="170" x2="1050" y2="340" stroke="#162b4c" stroke-width="2" />
  </g>

  
  
  <g transform="translate(600, 320)" filter="url(#shadow)">
    
    
    <ellipse cx="0" cy="0" rx="180" ry="220" fill="#1e4d8c" opacity="0.3" filter="url(#glow)" />

    
    <path d="M -160 -180 
             L -80 -210 
             Q 0 -225 80 -210 
             L 160 -180 
             L 240 -90 
             L 180 -30 
             L 140 -60 
             L 140 220 
             Q 140 240 120 240 
             L -120 240 
             Q -140 240 -140 220 
             L -140 -60 
             L -180 -30 
             L -240 -90 
             Z" 
          fill="url(#jersey-grad)" 
          stroke="#2a4f85" 
          stroke-width="3" />

    
    <path d="M -70 -200 L -70 240" stroke="#ffffff" stroke-width="2" opacity="0.05" />
    <path d="M -30 -210 L -30 240" stroke="#ffffff" stroke-width="2" opacity="0.08" />
    <path d="M 30 -210 L 30 240" stroke="#ffffff" stroke-width="2" opacity="0.08" />
    <path d="M 70 -200 L 70 240" stroke="#ffffff" stroke-width="2" opacity="0.05" />

    
    <path d="M -80 -210 Q 0 -170 80 -210 Q 0 -130 -80 -210 Z" fill="#ffffff" opacity="0.9" />
    <path d="M -50 -195 Q 0 -160 50 -195 Q 0 -140 -50 -195 Z" fill="#d4af37" />

    
    <g transform="translate(-90, -110) scale(0.8)">
      <path d="M0 -25 L20 -10 L15, 20 L0, 30 L-15, 20 L-20, -10 Z" fill="#1b2a4a" stroke="#d4af37" stroke-width="2" />
      <path d="M0 -18 L12 -8 L8, 14 L0, 20 L-8, 14 L-12, -8 Z" fill="#0e1b30" />
      <circle cx="0" cy="2" r="6" fill="#d4af37" />
    </g>

    
    <g transform="translate(90, -110)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#ffffff" stroke-width="2.5" />
      <path d="M-6 0 L6 0" stroke="#ffffff" stroke-width="2" />
    </g>

    
    
    
    
    
    <path id="arch-top" d="M -105 -50 Q 0 -85 105 -50" fill="none" />
    

    
    

    
    <g transform="translate(0, 135)">
      
      <path d="M -45 -65 L -25 -75 L -25 35 L -45 35 Z" fill="url(#gold-grad)" opacity="0.95" />
      <rect x="-45" y="35" width="30" height="8" rx="2" fill="url(#gold-grad)" opacity="0.95" />
      <path d="M -45 -65 L -25 -75 L -25 -65 Z" fill="#ffffff" opacity="0.6" />

      
      <path d="M 25 -20 C 25 -55 5 -55 5 -20 C 5 15 25 15 25 -20 Z" fill="none" stroke="url(#gold-grad)" stroke-width="20" opacity="0.95" />
    </g>

    
    <line x1="-120" y1="70" x2="120" y2="70" stroke="#d4af37" stroke-width="1.5" opacity="0.4" />
    
  </g>

  
  <g opacity="0.6">
    <circle cx="300" cy="150" r="1.5" fill="#ffffff" />
    <circle cx="850" cy="120" r="2" fill="#aadaff" />
    <circle cx="950" cy="280" r="1" fill="#ffffff" />
    <circle cx="250" cy="320" r="2.5" fill="#aadaff" />
    <circle cx="450" cy="100" r="1" fill="#ffffff" />
    <circle cx="750" cy="80" r="2" fill="#ffffff" />
  </g>

  
  <g opacity="0.2" stroke="#ffffff" stroke-width="2" fill="none">
    <path d="M 0 650 Q 300 550 600 675" />
    <circle cx="1200" cy="600" r="400" />
  </g>

  
  <rect width="1200" height="675" fill="none" stroke="#000000" stroke-width="20" opacity="0.3" />
</svg>