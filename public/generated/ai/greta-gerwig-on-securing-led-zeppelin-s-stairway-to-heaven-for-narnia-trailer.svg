    </pattern>
    <pattern id="hatch-burgundy" width="10" height="10" patternTransform="rotate(60 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#661227" stroke-width="1" />
