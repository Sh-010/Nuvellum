      <line x1="0" y1="0" x2="6" y2="0" stroke="#661227" stroke-width="0.5" stroke-opacity="0.2"/>
    </pattern>
    
    
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
