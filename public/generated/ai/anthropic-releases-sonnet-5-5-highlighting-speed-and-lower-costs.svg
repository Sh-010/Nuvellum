<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#141a2e" />
      <stop offset="60%" stop-color="#0a0d16" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>
    
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b3b" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    
    <linearGradient id="monolithBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2a3556" />
      <stop offset="40%" stop-color="#151b2b" />
      <stop offset="100%" stop-color="#0b0e17" />
    </linearGradient>

    <linearGradient id="coreEnergy" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff4500" />
      <stop offset="50%" stop-color="#ff7b3b" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7b3b" stop-opacity="0" />
      <stop offset="50%" stop-color="#ff7b3b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080c14" stop-opacity="0" />
      <stop offset="100%" stop-color="#040609" stop-opacity="1" />
    </linearGradient>
    
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="url(#bgGlow)" />
  
  
  <g opacity="0.6">
    <rect width="1200" height="675" fill="url(#gridPattern)" mask="url(#floorFade)" />
    <path d="M0 450 L1200 450" stroke="#ff7b3b" stroke-width="1" stroke-opacity="0.3" />
    <ellipse cx="600" cy="450" rx="550" ry="120" fill="none" stroke="#ff7b3b" stroke-width="0.5" stroke-opacity="0.2" />
  </g>

  
  <path d="M 200,0 L 450,675 L 350,675 L 100,0 Z" fill="url(#beamGrad)" />
  <path d="M 900,0 L 750,675 L 850,675 L 1100,0 Z" fill="url(#beamGrad)" />

  
  <g opacity="0.25">
    <line x1="250" y1="200" x2="450" y2="280" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="250" cy="200" r="3" fill="#38bdf8" />
    <circle cx="450" cy="280" r="4" fill="#38bdf8" />
    
    <line x1="950" y1="180" x2="750" y2="250" stroke="#ff7b3b" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="950" cy="180" r="3" fill="#ff7b3b" />
    <circle cx="750" cy="250" r="4" fill="#ff7b3b" />

    <line x1="300" y1="400" x2="420" y2="430" stroke="#818cf8" stroke-width="1" />
    <circle cx="300" cy="400" r="2" fill="#818cf8" />
    <line x1="900" y1="380" x2="780" y2="420" stroke="#818cf8" stroke-width="1" />
    <circle cx="900" cy="380" r="2" fill="#818cf8" />
  </g>

  
  
  <g transform="translate(600, 350)">
    
    
    <ellipse cx="0" cy="140" rx="180" ry="35" fill="#000000" opacity="0.8" />
    <ellipse cx="0" cy="135" rx="140" ry="20" fill="#ff7b3b" opacity="0.3" filter="url(#glow)" />

    
    <path d="M -130,-120 L -60,-160 L -60,120 L -130,90 Z" fill="url(#monolithBody)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    
    
    <path d="M 130,-120 L 60,-160 L 60,120 L 130,90 Z" fill="url(#monolithBody)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />

    
    <path d="M -70,-180 L 70,-180 L 70,130 L -70,130 Z" fill="url(#monolithBody)" stroke="#4f46e5" stroke-width="2" />
    
    
    <path d="M -69,-179 L 0,-195 L 0,115 L -69,130 Z" fill="#ffffff" fill-opacity="0.04" />
    <path d="M 0,-195 L 69,-179 L 69,130 L 0,115 Z" fill="#000000" fill-opacity="0.3" />

    
    <g opacity="0.6">
      <line x1="-40" y1="-140" x2="40" y2="-140" stroke="#38bdf8" stroke-width="1" />
      <line x1="-50" y1="-100" x2="50" y2="-100" stroke="#38bdf8" stroke-width="1" />
      <line x1="-50" y1="-60" x2="50" y2="-60" stroke="#38bdf8" stroke-width="1" />
      <line x1="-40" y1="-20" x2="40" y2="-20" stroke="#38bdf8" stroke-width="1" />
      <line x1="-50" y1="20" x2="50" y2="20" stroke="#ff7b3b" stroke-width="1" />
      <line x1="-50" y1="60" x2="50" y2="60" stroke="#ff7b3b" stroke-width="1" />
      <line x1="-40" y1="100" x2="40" y2="100" stroke="#ff7b3b" stroke-width="1" />
    </g>

    
    <rect x="-12" y="-160" width="24" height="260" rx="4" fill="#05080f" stroke="#ff7b3b" stroke-width="1.5" />
    <rect x="-6" y="-140" width="12" height="220" rx="2" fill="url(#coreEnergy)" filter="url(#intenseGlow)" />
    
    
    <g filter="url(#glow)">
      
      <ellipse cx="0" cy="-40" rx="95" ry="25" fill="none" stroke="url(#streamGrad1)" stroke-width="3" />
      <circle cx="-95" cy="-40" r="4" fill="#ff7b3b" />
      
      
      <ellipse cx="0" cy="20" rx="115" ry="30" fill="none" stroke="url(#streamGrad2)" stroke-width="3" />
      <circle cx="115" cy="20" r="4" fill="#38bdf8" />

      
      <ellipse cx="0" cy="80" rx="80" ry="20" fill="none" stroke="url(#streamGrad1)" stroke-width="2" />
    </g>

    
    <g>
      
      <circle cx="-160" cy="-80" r="6" fill="#38bdf8" filter="url(#glow)" />
      <path d="M-160,-80 L-110,-60" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2" />
      <circle cx="-110" cy="-60" r="3" fill="#ffffff" />

      
      <circle cx="170" cy="-20" r="5" fill="#ff7b3b" filter="url(#glow)" />
      <path d="M170,-20 L115,0" stroke="#ff7b3b" stroke-width="1" stroke-dasharray="2,2" />
      <circle cx="115" cy="0" r="3" fill="#ffffff" />

      
      <circle cx="0" cy="-230" r="7" fill="#ffffff" filter="url(#intenseGlow)" />
      <path d="M0,-230 L0,-195" stroke="#ff7b3b" stroke-width="2" />
    </g>

    
    <path d="M -320, 50 C -250, 40 -180, 20 -130, 10" fill="none" stroke="url(#streamGrad1)" stroke-width="2" filter="url(#glow)" />
    <path d="M 130, -30 C 180, -40 250, -60 320, -70" fill="none" stroke="url(#streamGrad2)" stroke-width="2" filter="url(#glow)" />
    <path d="M -280, 110 C -200, 90 -140, 70 -90, 60" fill="none" stroke="url(#streamGrad2)" stroke-width="1.5" />
    <path d="M 90, 40 C 140, 50 200, 70 280, 90" fill="none" stroke="url(#streamGrad1)" stroke-width="1.5" />

  </g>
  

  
  <g opacity="0.4" pointer-events="none">
    <circle cx="150" cy="150" r="1.5" fill="#ffffff" />
    <circle cx="350" cy="80" r="1" fill="#38bdf8" />
    <circle cx="980" cy="120" r="2" fill="#ff7b3b" />
    <circle cx="1050" cy="500" r="1.5" fill="#ffffff" />
    <circle cx="100" cy="550" r="2" fill="#38bdf8" />
  </g>

  
  <rect x="0" y="550" width="1200" height="125" fill="url(#floorGrad)" pointer-events="none" />
  
  
  <rect x="24" y="24" width="1152" height="627" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" pointer-events="none" />
</svg>