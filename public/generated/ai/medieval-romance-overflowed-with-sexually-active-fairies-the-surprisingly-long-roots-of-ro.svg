<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  
  <defs>
    
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6efe4"/>
      <stop offset="50%" stop-color="#f0e7da"/>
      <stop offset="100%" stop-color="#e8dec9"/>
    </linearGradient>

    
    <pattern id="engraving" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.4" stroke-opacity="0.15"/>
    </pattern>

    
    <linearGradient id="burgundy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a172e"/>
      <stop offset="100%" stop-color="#550f1f"/>
    </linearGradient>

    
    <linearGradient id="stone-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a8d82"/>
      <stop offset="100%" stop-color="#6f6359"/>
    </linearGradient>

    
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2a221c" stop-opacity="0.12"/>
    </radialGradient>
  </defs>

  
  <rect width="1200" height="675" fill="url(#paper-grad)"/>
  
  
  <rect width="1200" height="675" fill="url(#engraving)" opacity="0.6"/>

  
  <rect width="1200" height="675" fill="url(#vignette)"/>

  
  
  

  
