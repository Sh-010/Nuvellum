<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <radialGradient id="paper-grad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#f8f4ec"/>
      <stop offset="60%" stop-color="#efe8db"/>
      <stop offset="100%" stop-color="#e2d8c5"/>
    </radialGradient>
    
    
    <pattern id="etching" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.5" opacity="0.15"/>
    </pattern>

    <pattern id="crosshatch" width="6" height="6" patternTransform="rotate(30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#661227" stroke-width="0.4" opacity="0.2"/>
      <line x1="0" y1="0" x2="6" y2="0" stroke="#661227" stroke-width="0.4" opacity="0.2"/>
    </pattern>

    
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="url(#paper-grad)"/>

  
  <g stroke="#2a221c" stroke-width="0.75" opacity="0.12">
