    <path d="M 60 575 L 60 615 L 100 615"/>
    <path d="M 1140 575 L 1140 615 L 1100 615"/>
  </g>

  
  
  
  <g transform="translate(0, 20)" filter="url(#subtle-shadow)">
    
    
