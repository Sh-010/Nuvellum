    <line x1="1100" y1="0" x2="1100" y2="675"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="595" x2="1200" y2="595"/>
    
    <line x1="600" y1="120" x2="600" y2="550" stroke-dasharray="4,8"/>
  </g>

  
  <g stroke="#2a221c" stroke-width="1" opacity="0.3" fill="none">
