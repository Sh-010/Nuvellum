<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <style>
      .bg { fill: #f3ecdf; }
      .charcoal { fill: #2a221c; }
      .charcoal-stroke { stroke: #2a221c; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .burgundy { fill: #661227; }
      .burgundy-stroke { stroke: #661227; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .stone { fill: #d6ccbe; }
      .stone-stroke { stroke: #b5a898; stroke-width: 1.5; }
      .paper-white { fill: #faf6f0; }
    </style>
    
    
    <pattern id="hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#b5a898" stroke-width="1" opacity="0.6"/>
    </pattern>
    <pattern id="dense-hatch" width="6" height="6" patternTransform="rotate(30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2a221c" stroke-width="1" opacity="0.15"/>
    </pattern>
  </defs>

  
  <rect width="1200" height="675" class="bg"/>

  
  <g opacity="0.4">
    <line x1="100" y1="550" x2="1100" y2="550" stroke="#b5a898" stroke-width="2"/>
    <line x1="150" y1="120" x2="150" y2="550" stroke="#b5a898" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="350" y1="120" x2="350" y2="550" stroke="#b5a898" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="600" y1="120" x2="600" y2="550" stroke="#b5a898" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="850" y1="120" x2="850" y2="550" stroke="#b5a898" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="1050" y1="120" x2="1050" y2="550" stroke="#b5a898" stroke-width="1" stroke-dasharray="6 6"/>
  </g>

  
  <g transform="translate(180, 220)">
    <polygon points="0,150 160,90 160,330 0,330" fill="#d6ccbe" class="charcoal-stroke"/>
    <polygon points="160,90 320,150 320,330 160,330" fill="#e5ded3" class="charcoal-stroke"/>
    <polygon points="0,150 160,90 320,150 160,210" fill="#faf6f0" class="charcoal-stroke"/>
    
    <rect x="40" y="220" width="40" height="70" class="charcoal"/>
    <rect x="220" y="190" width="50" height="30" class="paper-white" stroke="#2a221c" stroke-width="2"/>
    
  </g>

  
  <g transform="translate(720, 180)">
    <polygon points="0,180 140,120 140,370 0,370" fill="#e5ded3" class="charcoal-stroke"/>
    <polygon points="140,120 300,180 300,370 140,370" fill="#d6ccbe" class="charcoal-stroke"/>
    <polygon points="0,180 140,120 300,180 160,240" fill="#faf6f0" class="charcoal-stroke"/>
    
    <rect x="180" y="240" width="80" height="90" fill="#faf6f0" class="charcoal-stroke"/>
    <path d="M 190 220 L 250 220 L 260 240 L 180 240 Z" class="burgundy"/>
    
  </g>

  
  
  <g transform="translate(350, 310)">
    
    <polygon points="0,120 250,30 500,120 250,210" fill="#faf6f0" class="charcoal-stroke"/>
    <polygon points="0,120 250,210 250,250 0,160" fill="#d6ccbe" class="charcoal-stroke"/>
    <polygon points="250,210 500,120 500,160 250,250" fill="#b5a898" class="charcoal-stroke"/>

    
    <line x1="125" y1="165" x2="375" y2="75" stroke="#2a221c" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
    <line x1="250" y1="75" x2="250" y2="185" stroke="#2a221c" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

    
    <g transform="translate(120, 110)">
      <polygon points="0,-30 40,-45 80,-30 80,0 0,0" fill="#661227"/>
      <rect x="10" y="-30" width="60" height="30" fill="#faf6f0" class="charcoal-stroke"/>
      <rect x="25" y="-15" width="30" height="15" fill="#2a221c"/>
    </g>

    
    <g transform="translate(320, 90)">
      <line x1="0" y1="0" x2="40" y2="-50" class="charcoal-stroke"/>
      <line x1="20" y1="-25" x2="60" y2="-25" class="burgundy-stroke"/>
      <circle cx="0" cy="0" r="8" class="charcoal"/>
      <rect x="55" y="-32" width="16" height="12" fill="#2a221c"/>
    </g>

    
    <g transform="translate(210, 140)">
      <rect x="0" y="-40" width="50" height="40" fill="#d6ccbe" class="charcoal-stroke"/>
      <polygon points="-5,-40 25,-60 55,-40" fill="#661227" class="charcoal-stroke"/>
      <rect x="15" y="-20" width="20" height="20" fill="#faf6f0"/>
    </g>
  </g>

  
  
  <g transform="translate(100, 420)">
    <line x1="40" y1="-150" x2="0" y2="100" class="charcoal-stroke" stroke-width="4"/>
    <line x1="40" y1="-150" x2="80" y2="100" class="charcoal-stroke" stroke-width="4"/>
    <circle cx="40" cy="-150" r="10" fill="#661227" class="charcoal-stroke"/>
    <path d="M 20 0 Q 40 -20 60 0" fill="none" class="charcoal-stroke"/>
  </g>

  
  <rect x="80" y="580" width="1040" height="6" class="burgundy"/>
  <rect x="80" y="590" width="1040" height="2" class="charcoal"/>

  
  <g transform="translate(980, 80)" class="charcoal-stroke" fill="none" stroke-width="3">
    <path d="M 0 60 L 0 0 L 60 0"/>
    <path d="M 140 60 L 140 0 L 80 0"/>
    <path d="M 0 100 L 0 160 L 60 160"/>
    <path d="M 140 100 L 140 160 L 80 160"/>
    <circle cx="70" cy="80" r="4" fill="#661227"/>
  </g>

  
  <g transform="translate(850, 470)">
    <rect x="0" y="0" width="180" height="50" fill="#faf6f0" class="charcoal-stroke"/>
    <line x1="15" y1="25" x2="165" y2="25" stroke="#661227" stroke-width="3"/>
    <circle cx="40" cy="25" r="5" class="burgundy"/>
    <circle cx="90" cy="25" r="5" class="burgundy"/>
    <circle cx="140" cy="25" r="5" class="burgundy"/>
  </g>

  
  <path d="M 0 675 L 1200 675 L 1200 650 L 0 650 Z" fill="#2a221c" opacity="0.1"/>
</svg>