    </pattern>
    <pattern id="hatchCharcoal" width="6" height="6" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2a221c" stroke-width="1" stroke-opacity="0.15" />
