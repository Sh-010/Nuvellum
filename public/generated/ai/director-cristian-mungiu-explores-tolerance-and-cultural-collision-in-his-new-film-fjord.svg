      .burgundy-trans { fill: #661227; fill-opacity: 0.15; }
      .nordic-blue { fill: #334d5c; }
      .nordic-blue-trans { fill: #334d5c; fill-opacity: 0.2; }
      .paper-white { fill: #fcf8f2; }
      .line-dark { stroke: #2a221c; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .line-fine { stroke: #2a221c; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .line-burgundy { stroke: #661227; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .hatch { stroke: #2a221c; stroke-width: 0.75; stroke-linecap: round; opacity: 0.35; }
    </style>
    
    
    <pattern id="engrave" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
