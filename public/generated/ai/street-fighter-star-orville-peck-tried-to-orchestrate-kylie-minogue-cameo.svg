  <line x1="120" y1="80" x2="1080" y2="80" stroke="#661227" stroke-width="1.5" opacity="0.6" />
  <line x1="120" y1="595" x2="1080" y2="595" stroke="#661227" stroke-width="1.5" opacity="0.6" />

</svg>