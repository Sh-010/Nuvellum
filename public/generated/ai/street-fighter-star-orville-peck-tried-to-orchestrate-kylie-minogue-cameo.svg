      <line x1="-15" y1="50" x2="15" y2="50" stroke="#2a221c" stroke-width="1.5" />
      <line x1="-15" y1="60" x2="15" y2="60" stroke="#2a221c" stroke-width="1.5" />
      <line x1="-15" y1="70" x2="15" y2="70" stroke="#2a221c" stroke-width="1.5" />
    </g>

    
    <g transform="translate(130, -90)">
      <circle cx="0" cy="0" r="32" fill="#efe8db" stroke="#2a221c" stroke-width="2.5" />
      <circle cx="0" cy="0" r="28" fill="url(#hatchDense)" opacity="0.4" />
      <line x1="0" y1="0" x2="0" y2="-18" stroke="#661227" stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="0" x2="14" y2="8" stroke="#2a221c" stroke-width="3" stroke-linecap="round" />
