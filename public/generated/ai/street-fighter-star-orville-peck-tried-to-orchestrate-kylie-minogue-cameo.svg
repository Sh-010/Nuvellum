      <path d="M0,-85 L0,20" stroke="#2a221c" stroke-width="2.5" />
      <path d="M-15,10 C-5,25 5,25 15,10" fill="none" stroke="#2a221c" stroke-width="2.5" />

      
      <path d="M-70,-20 L-30,40 M-50,-40 L-10,20" stroke="#661227" stroke-width="3" stroke-linecap="round" />
      <path d="M30,40 L70,-20 M10,20 L50,-40" stroke="#661227" stroke-width="3" stroke-linecap="round" />
      
      
      <path d="M-35,70 C-15,85 15,85 35,70" fill="none" stroke="#2a221c" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <g transform="translate(0, 110)">
      
      <path d="M-80,-20 C-80,40 -40,70 0,70 C40,70 80,40 80,-20" fill="none" stroke="#661227" stroke-width="5" stroke-linecap="round" />
