    </g>

    <g transform="translate(-140, -90)">
      <circle cx="0" cy="0" r="32" fill="#efe8db" stroke="#2a221c" stroke-width="2.5" />
      <circle cx="0" cy="0" r="28" fill="url(#hatchDense)" opacity="0.4" />
      <line x1="0" y1="0" x2="-10" y2="-14" stroke="#661227" stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="0" x2="16" y2="-4" stroke="#2a221c" stroke-width="3" stroke-linecap="round" />
      <circle cx="0" cy="0" r="3.5" fill="#2a221c" />
    </g>

