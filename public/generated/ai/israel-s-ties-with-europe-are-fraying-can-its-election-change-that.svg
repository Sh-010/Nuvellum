<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  
  <defs>
    
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f2ea" />
      <stop offset="50%" stop-color="#f3ecdf" />
      <stop offset="100%" stop-color="#ebe3d2" />
    </linearGradient>

    
    <pattern id="hatchVertical" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.6" stroke-opacity="0.12" />
    </pattern>

    
    <pattern id="crossHatch" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="6" y2="6" stroke="#2a221c" stroke-width="0.5" stroke-opacity="0.15" />
      <line x1="6" y1="0" x2="0" y2="6" stroke="#2a221c" stroke-width="0.5" stroke-opacity="0.15" />
    </pattern>

    
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#661227" fill-opacity="0.15" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="url(#paperGrad)" />
  <rect width="1200" height="675" fill="url(#dotGrid)" />

  
  <g stroke="#2a221c" stroke-width="1" stroke-opacity="0.25">
    
    <line x1="80" y1="60" x2="1120" y2="60" />
    <line x1="80" y1="630" x2="1120" y2="630" />
    <circle cx="80" cy="60" r="3" fill="#2a221c" />
    <circle cx="1120" cy="60" r="3" fill="#2a221c" />
    <circle cx="80" cy="630" r="3" fill="#2a221c" />
    <circle cx="1120" cy="630" r="3" fill="#2a221c" />
  </g>

  
  <g id="pillar-fragment" transform="translate(160, 150)">
    
    <polygon points="-40,430 140,430 120,410 -20,410" fill="#ded4c5" stroke="#2a221c" stroke-width="2" />
    <polygon points="-30,410 130,410 110,395 -10,395" fill="#e8dfd1" stroke="#2a221c" stroke-width="1.5" />

    
    <path d="M 0,395 L 0,120 L 20,120 L 20,395 Z" fill="#f3ecdf" stroke="#2a221c" stroke-width="2" />
    
    <line x1="5" y1="120" x2="5" y2="395" stroke="#2a221c" stroke-width="0.8" stroke-opacity="0.5" />
    <line x1="10" y1="120" x2="10" y2="395" stroke="#2a221c" stroke-width="1.5" stroke-opacity="0.7" />
    <line x1="15" y1="120" x2="15" y2="395" stroke="#2a221c" stroke-width="0.8" stroke-opacity="0.5" />

    <path d="M 45,395 L 45,120 L 65,120 L 65,395 Z" fill="#f3ecdf" stroke="#2a221c" stroke-width="2" />
    <line x1="50" y1="120" x2="50" y2="395" stroke="#2a221c" stroke-width="0.8" stroke-opacity="0.5" />
    <line x1="55" y1="120" x2="55" y2="395" stroke="#2a221c" stroke-width="1.5" stroke-opacity="0.7" />
    <line x1="60" y1="120" x2="60" y2="395" stroke="#2a221c" stroke-width="0.8" stroke-opacity="0.5" />

    
    <polygon points="-10,120 75,120 85,100 -20,100" fill="#ded4c5" stroke="#2a221c" stroke-width="2" />
    <polygon points="-20,100 85,100 80,85 -15,85" fill="#e8dfd1" stroke="#2a221c" stroke-width="1.5" />
  </g>

  
  <g id="european-facade" transform="translate(850, 150)">
    
    <rect x="-20" y="80" width="140" height="20" fill="#661227" fill-opacity="0.1" stroke="#661227" stroke-width="1.5" />
    <rect x="-40" y="110" width="160" height="15" fill="#ded4c5" stroke="#2a221c" stroke-width="1.5" />
    
    
    <path d="M 10,125 L 10,380" stroke="#661227" stroke-width="4" stroke-linecap="round" />
    <path d="M 40,125 L 40,350" stroke="#661227" stroke-width="3" stroke-linecap="round" />
    <path d="M 70,125 L 70,390" stroke="#661227" stroke-width="4" stroke-linecap="round" />
    <path d="M 100,125 L 100,340" stroke="#2a221c" stroke-width="2" stroke-dasharray="6,4" />

    
    <polygon points="-50,390 130,390 120,410 -40,410" fill="#ded4c5" stroke="#2a221c" stroke-width="2" />
  </g>

  
  <g id="central-mechanism" transform="translate(600, 360)">
    
    <ellipse cx="0" cy="120" rx="180" ry="25" fill="#2a221c" fill-opacity="0.15" />

    
    <path d="M -250,110 C -100,130 -50,90 0,115 C 80,140 150,100 280,125" fill="none" stroke="#661227" stroke-width="3" stroke-linecap="round" />
    <path d="M -180,115 C -80,100 -20,130 30,110 C 100,90 180,135 220,115" fill="none" stroke="#2a221c" stroke-width="1.5" stroke-dasharray="4,4" />

    
    <g transform="translate(0, 0)">
      
      <polygon points="-110,40 -20,70 -20,120 -110,90" fill="#ded4c5" stroke="#2a221c" stroke-width="2" />
      <path d="M -110,40 L -20,70 L -20,120 L -110,90 Z" fill="url(#hatchVertical)" />

      
      <polygon points="-20,70 70,40 70,90 -20,120" fill="#e8dfd1" stroke="#2a221c" stroke-width="2" />
      <path d="M -20,70 L 70,40 L 70,90 L -20,120 Z" fill="url(#crossHatch)" />

      
      <polygon points="-110,40 -20,10 70,40 -20,70" fill="#f3ecdf" stroke="#2a221c" stroke-width="2.5" />
      
      
      <polygon points="-15,38 15,38 18,44 -18,44" fill="#661227" />

      
      <circle cx="-20" cy="80" r="12" fill="#661227" stroke="#2a221c" stroke-width="1.5" />
      <circle cx="-20" cy="80" r="6" fill="#f3ecdf" />
    </g>

    
    <g transform="translate(0, -50)">
      
      <g transform="rotate(-12, -25, 40)">
        <polygon points="-70,-40 0,-20 -10,60 -80,40" fill="#f7f2ea" stroke="#2a221c" stroke-width="2" />
        
        <line x1="-55" y1="-10" x2="-20" y2="0" stroke="#2a221c" stroke-width="1.5" stroke-linecap="round" />
        <line x1="-60" y1="10" x2="-25" y2="20" stroke="#2a221c" stroke-width="1.5" stroke-linecap="round" />
        <line x1="-65" y1="30" x2="-35" y2="40" stroke="#2a221c" stroke-width="1.5" stroke-linecap="round" />
        
        <rect x="-55" y="-30" width="12" height="12" fill="none" stroke="#661227" stroke-width="2" />
        <path d="M -53,-24 L -49,-20 L -43,-28" fill="none" stroke="#661227" stroke-width="2" stroke-linecap="round" />
      </g>

      
      <g transform="rotate(15, 25, 40)">
        <polygon points="10,-20 80,-40 90,40 20,60" fill="#f3ecdf" stroke="#661227" stroke-width="2" />
        
        <line x1="25" y1="-5" x2="65" y2="-15" stroke="#661227" stroke-width="1.5" stroke-linecap="round" />
        <line x1="25" y1="15" x2="70" y2="5" stroke="#661227" stroke-width="1.5" stroke-linecap="round" />
        <line x1="30" y1="35" x2="75" y2="25" stroke="#661227" stroke-width="1.5" stroke-linecap="round" />
        <line x1="20" y1="-10" x2="80" y2="35" stroke="#661227" stroke-width="1.5" />
      </g>
    </g>
  </g>

  
  <g id="survey-lines" stroke="#661227" stroke-width="1" stroke-dasharray="3,3" opacity="0.7">
    
    <line x1="200" y1="140" x2="200" y2="480" />
    <circle cx="200" cy="480" r="4" fill="#661227" />

    
    <line x1="980" y1="140" x2="980" y2="480" />
    <circle cx="980" cy="480" r="4" fill="#661227" />

    
    <line x1="200" y1="250" x2="520" y2="330" stroke="#2a221c" stroke-width="0.7" stroke-dasharray="2,5" />
    <line x1="980" y1="250" x2="680" y2="330" stroke="#2a221c" stroke-width="0.7" stroke-dasharray="2,5" />
  </g>

  
  <g id="scale-marks" stroke="#2a221c" stroke-width="1.5">
    
    <g transform="translate(90, 500)">
      <line x1="0" y1="0" x2="0" y2="80" />
      <line x1="-5" y1="0" x2="5" y2="0" />
      <line x1="-3" y1="20" x2="3" y2="20" />
      <line x1="-5" y1="40" x2="5" y2="40" />
      <line x1="-3" y1="60" x2="3" y2="60" />
      <line x1="-5" y1="80" x2="5" y2="80" />
    </g>

    
    <g transform="translate(1110, 500)">
      <line x1="0" y1="0" x2="0" y2="80" />
      <line x1="-5" y1="0" x2="5" y2="0" />
      <line x1="-3" y1="20" x2="3" y2="20" />
      <line x1="-5" y1="40" x2="5" y2="40" />
      <line x1="-3" y1="60" x2="3" y2="60" />
      <line x1="-5" y1="80" x2="5" y2="80" />
    </g>
  </g>

  
  <path d="M 0,0 L 1200,0 L 1200,675 L 0,675 Z" fill="none" stroke="#2a221c" stroke-width="12" stroke-opacity="0.08" />
</svg>