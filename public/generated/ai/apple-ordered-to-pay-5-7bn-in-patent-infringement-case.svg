<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      
        
      
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.93" />
        <feFuncG type="linear" slope="0.91" />
        <feFuncB type="linear" slope="0.87" />
      </feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic" />
    </filter>

    
    <pattern id="hatch-fine" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.75" opacity="0.25" />
    </pattern>
    <pattern id="hatch-dense" width="4" height="4" patternTransform="rotate(-30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#661227" stroke-width="0.75" opacity="0.35" />
    </pattern>
    <pattern id="dot-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7a6b5d" opacity="0.2" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="#f3ecdf" />
  <rect width="1200" height="675" filter="url(#paper-texture)" opacity="0.6" />

  
  <line x1="100" y1="60" x2="1100" y2="60" stroke="#7a6b5d" stroke-width="1" opacity="0.3" />
  <line x1="100" y1="615" x2="1100" y2="615" stroke="#7a6b5d" stroke-width="1" opacity="0.3" />

  <g transform="translate(0, 0)">
    

    
    <g transform="translate(220, 337)">
      
      <rect x="-140" y="-180" width="280" height="360" fill="#eae1d2" stroke="#2a221c" stroke-width="1.5" />
      <rect x="-125" y="-165" width="250" height="330" fill="#f3ecdf" stroke="#7a6b5d" stroke-width="0.75" />

      
      
      <path d="M-90 -120 C-60 -150, -30 -90, 0 -120 C30 -150, 60 -90, 90 -120" fill="none" stroke="#2a221c" stroke-width="2" />
      <path d="M-90 -90 C-60 -120, -30 -60, 0 -90 C30 -120, 60 -60, 90 -90" fill="none" stroke="#2a221c" stroke-width="1.5" opacity="0.7" />
      
      
      <rect x="-80" y="-50" width="160" height="100" fill="url(#hatch-fine)" stroke="#2a221c" stroke-width="2" />
      <line x1="-80" y1="0" x2="80" y2="0" stroke="#2a221c" stroke-width="1.5" stroke-dasharray="6,4" />
      <circle cx="0" cy="0" r="18" fill="#f3ecdf" stroke="#2a221c" stroke-width="2" />
      <circle cx="0" cy="0" r="8" fill="#661227" />

      
      <path d="M-80 -20 L-100 -20 L-100 20 L-80 20" fill="none" stroke="#2a221c" stroke-width="1.5" />
      <path d="M80 -20 L100 -20 L100 20 L80 20" fill="none" stroke="#2a221c" stroke-width="1.5" />
      
      <path d="M-70 50 L-70 90 L70 90 L70 50" fill="none" stroke="#2a221c" stroke-width="1.5" />
      <line x1="-40" y1="90" x2="-40" y2="110" stroke="#2a221c" stroke-width="1.5" />
      <line x1="40" y1="90" x2="40" y2="110" stroke="#2a221c" stroke-width="1.5" />
      <line x1="-50" y1="110" x2="50" y2="110" stroke="#2a221c" stroke-width="1.5" />

      
      <line x1="-135" y1="0" x2="-145" y2="0" stroke="#2a221c" stroke-width="1" />
      <line x1="135" y1="0" x2="145" y2="0" stroke="#2a221c" stroke-width="1" />
      
    </g>

    
    <g transform="translate(600, 337)">
      <line x1="0" y1="-200" x2="0" y2="200" stroke="#661227" stroke-width="3" />
      <polygon points="0,-185 12,-165 -12,-165" fill="#661227" />
      <circle cx="0" cy="0" r="16" fill="#f3ecdf" stroke="#661227" stroke-width="3" />
      <circle cx="0" cy="0" r="6" fill="#2a221c" />
    </g>

    
    <g transform="translate(980, 337)">
      
      <rect x="-140" y="-180" width="280" height="360" fill="#eae1d2" stroke="#2a221c" stroke-width="1.5" />
      <rect x="-125" y="-165" width="250" height="330" fill="#f3ecdf" stroke="#7a6b5d" stroke-width="0.75" />

      
      <path d="M-100 -80 L100 -120" stroke="#2a221c" stroke-width="4" fill="none" />
      
      
      <line x1="-80" y1="-84" x2="-80" y2="20" stroke="#2a221c" stroke-width="1.5" />
      <line x1="-50" y1="-90" x2="-50" y2="20" stroke="#2a221c" stroke-width="1.5" />
      <line x1="50" y1="-110" x2="50" y2="-20" stroke="#2a221c" stroke-width="1.5" />
      <line x1="80" y1="-116" x2="80" y2="-20" stroke="#2a221c" stroke-width="1.5" />

      
      <g transform="translate(0, 30)">
        <path d="M-70 -20 L70 -20 L90 70 L-90 70 Z" fill="#661227" opacity="0.9" />
        <path d="M-70 -20 L70 -20 L90 70 L-90 70 Z" fill="url(#hatch-dense)" />
        <rect x="-60" y="10" width="120" height="40" fill="#f3ecdf" stroke="#2a221c" stroke-width="1.5" />
        
        <line x1="-45" y1="30" x2="45" y2="30" stroke="#661227" stroke-width="2" />
        <line x1="-30" y1="22" x2="30" y2="22" stroke="#2a221c" stroke-width="1" />
        <line x1="-30" y1="38" x2="30" y2="38" stroke="#2a221c" stroke-width="1" />
      </g>

      
      <g transform="translate(65, -60)">
        <polygon points="0,-15 20,20 -20,20" fill="#2a221c" />
        <rect x="-15" y="20" width="30" height="15" fill="#f3ecdf" stroke="#2a221c" stroke-width="1" />
      </g>

      
    </g>

    
    <g opacity="0.3">
      <line x1="360" y1="337" x2="584" y2="337" stroke="#2a221c" stroke-width="1" stroke-dasharray="4,4" />
      <line x1="616" y1="337" x2="840" y2="337" stroke="#2a221c" stroke-width="1" stroke-dasharray="4,4" />
    </g>

    
    <g stroke="#2a221c" stroke-width="1.5" fill="none" opacity="0.6">
      
      <path d="M 80 80 L 110 80 M 80 80 L 80 110" />
      
      <path d="M 1120 80 L 1090 80 M 1120 80 L 1120 110" />
      
      <path d="M 80 595 L 110 595 M 80 595 L 80 565" />
      
      <path d="M 1120 595 L 1090 595 M 1120 595 L 1120 565" />
    </g>

  </g>
</svg>