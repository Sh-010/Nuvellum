      <line x1="0" y1="0" x2="0" y2="8" stroke="#661227" stroke-width="0.9" opacity="0.4"/>
    </pattern>
    <pattern id="hatch-dense" width="6" height="6" patternTransform="rotate(60 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2a221c" stroke-width="1.2" opacity="0.45"/>
    </pattern>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7d6b5d" opacity="0.25"/>
    </pattern>
