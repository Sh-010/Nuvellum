<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      
        
      
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.93" />
        <feFuncG type="linear" slope="0.91" />
        <feFuncB type="linear" slope="0.87" />
      </feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic" />
    </filter>
    <style>
      .bg { fill: #f3ecdf; }
      .charcoal { fill: #2a221c; stroke: #2a221c; }
      .charcoal-stroke { stroke: #2a221c; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .burgundy { fill: #661227; stroke: #661227; }
      .burgundy-stroke { stroke: #661227; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .stone { fill: #c8beaf; stroke: #c8beaf; }
      .stone-stroke { stroke: #c8beaf; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .sepia { fill: #a37c5e; }
      .paper-fill { fill: #efe8db; }
    </style>
  </defs>

  
  <rect width="1200" height="675" class="bg" />
  <rect width="1200" height="675" filter="url(#paper-texture)" opacity="0.4" />

  
  <rect x="40" y="35" width="1120" height="605" fill="none" stroke="#2a221c" stroke-width="1.5" />
