    <path d="M 310 340 L 250 480 L 290 540 L 310 440 Z" fill="#1e293b" opacity="0.7" />
    <path d="M 310 340 L 370 480 L 330 540 L 310 440 Z" fill="#1e293b" opacity="0.7" />
    <path d="M 310 340 L 310 440" stroke="#475569" stroke-width="1.5" />

    
    <path d="M 270 280 C 270 250, 285 220, 310 215 C 335 220, 350 250, 350 280 Z" fill="#1a1f2c" />

    
    <path d="M 240 170 C 220 220, 225 300, 250 350 C 240 320, 235 250, 250 200 Z" fill="#0b0d13" />
    <path d="M 380 170 C 400 220, 395 300, 370 350 C 380 320, 385 250, 370 200 Z" fill="#0b0d13" />

    
    <path d="M 275 160 C 275 120, 300 100, 315 100 C 330 100, 355 120, 355 160 C 355 200, 340 230, 315 230 C 290 230, 275 200, 275 160 Z" fill="#161b26" />

    
    <path d="M 120 460 C 140 400, 190 350, 240 330" fill="none" stroke="url(#rim-light)" stroke-width="2" opacity="0.6" />
    <path d="M 500 460 C 480 400, 430 350, 380 330" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.4" />

    
    
    
    <g transform="translate(180, 220) rotate(-15)">
      
      <path d="M 115 160 C 100 160, 85 140, 90 120 C 95 100, 110 90, 125 100 C 135 105, 140 115, 140 115" fill="none" stroke="#1e2533" stroke-width="14" stroke-linecap="round" />
      <path d="M 60 175 C 65 155, 80 145, 95 150 C 110 155, 115 170, 115 170" fill="none" stroke="#161b26" stroke-width="12" stroke-linecap="round" />

      
      <path d="M 65 30 
               C 35 60, 30 110, 45 150 
               C 55 180, 75 210, 95 220 
               C 110 228, 125 228, 140 220 
               C 160 210, 180 180, 190 150 
               C 205 110, 200 60, 170 30 
               C 140 5, 95 5, 65 30 Z" 
            fill="url(#mask-grad)" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)" />

      
      <path d="M 75 75 C 65 75, 60 90, 70 105 C 80 120, 100 120, 105 105 C 110 90, 95 75, 75 75 Z" fill="#07080b" />
      <path d="M 155 75 C 165 75, 170 90, 160 105 C 150 120, 130 120, 125 105 C 120 90, 135 75, 155 75 Z" fill="#07080b" />

      
      <circle cx="85" cy="95" r="2" fill="#38bdf8" opacity="0.6" />
      <circle cx="145" cy="95" r="2" fill="#38bdf8" opacity="0.6" />

      
      <path d="M 115 80 L 105 135 L 125 135 Z" fill="#94a3b8" opacity="0.3" />
      <path d="M 110 135 L 120 135 L 115 145 Z" fill="#07080b" />

      
      <path d="M 100 160 
