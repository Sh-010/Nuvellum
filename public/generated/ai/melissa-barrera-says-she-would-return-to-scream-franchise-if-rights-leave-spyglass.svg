            fill="#07080b" stroke="#334155" stroke-width="1" />
            
      
      <path d="M 65 50 C 95 30, 140 30, 170 50" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4" />
      <path d="M 45 150 C 60 190, 95 220, 115 225" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.5" />
    </g>

    
    <circle cx="280" cy="380" r="120" fill="url(#warm-accent)" style="mix-blend-mode: screen;" />

    
    
    <g transform="translate(380, 20)">
      <path d="M 0 0 L 40 50 L 20 450 L -10 500 Z" fill="#38bdf8" opacity="0.08" />
      <line x1="20" y1="0" x2="-20" y2="520" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
      <line x1="25" y1="0" x2="-15" y2="520" stroke="#ffffff" stroke-width="0.5" opacity="0.6" />
    </g>
  </g>

  
  
  
  <g transform="translate(750, 160)" opacity="0.35">
    
