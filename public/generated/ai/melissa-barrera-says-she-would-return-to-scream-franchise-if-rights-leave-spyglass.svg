    <rect x="100" y="20" width="100" height="380" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="220" y="90" width="60" height="310" fill="#1e293b" stroke="#475569" stroke-width="1" />

    
    <g stroke="#64748b" stroke-width="0.75" opacity="0.4">
      
      <line x1="15" y1="80" x2="65" y2="80" />
      <line x1="15" y1="120" x2="65" y2="120" />
      <line x1="15" y1="160" x2="65" y2="160" />
      <line x1="15" y1="200" x2="65" y2="200" />
      <line x1="15" y1="240" x2="65" y2="240" />
      <line x1="15" y1="280" x2="65" y2="280" />
      <line x1="15" y1="320" x2="65" y2="320" />

      
      <line x1="120" y1="50" x2="180" y2="50" />
      <line x1="120" y1="100" x2="180" y2="100" />
      <line x1="120" y1="150" x2="180" y2="150" />
      <line x1="120" y1="200" x2="180" y2="200" />
      <line x1="120" y1="250" x2="180" y2="250" />
      <line x1="120" y1="300" x2="180" y2="300" />
      <line x1="120" y1="350" x2="180" y2="350" />
    </g>
  </g>

  
  <g fill="#93c5fd" opacity="0.4">
    <circle cx="450" cy="180" r="1.5" />
    <circle cx="480" cy="250" r="2" />
    <circle cx="320" cy="300" r="1" />
    <circle cx="520" cy="120" r="2.5" opacity="0.6" />
    <circle cx="380" cy="420" r="1" />
    <circle cx="720" cy="220" r="1.5" />
    <circle cx="680" cy="350" r="2" />
