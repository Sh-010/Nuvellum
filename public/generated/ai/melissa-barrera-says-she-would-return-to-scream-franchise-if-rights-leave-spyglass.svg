  <ellipse cx="600" cy="520" rx="350" ry="25" fill="#38bdf8" opacity="0.08" filter="url(#shadow)" />

  
  
  
  <g transform="translate(370, 75)" filter="url(#shadow)">
    
    <path d="M 230 460 C 230 460 210 320 230 260 C 250 200 300 150 330 130 C 360 110 400 120 420 140 C 440 160 450 220 440 270 C 430 320 440 460 440 460 Z" fill="#030407" opacity="0.8" />

    
    <path d="M 120 460 
