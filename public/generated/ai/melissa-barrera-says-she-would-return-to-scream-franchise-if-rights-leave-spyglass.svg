<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <radialGradient id="bg-glow" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1a1c29" />
      <stop offset="50%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#07080b" />
    </radialGradient>

    
    <linearGradient id="spotlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3b4d71" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#1a2233" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0b0d12" stop-opacity="0" />
    </linearGradient>

    
    <linearGradient id="rim-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#94a3b8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.2" />
    </linearGradient>

    
    <radialGradient id="warm-accent" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="mask-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    
    <linearGradient id="curtain-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050608" />
      <stop offset="70%" stop-color="#111522" />
      <stop offset="100%" stop-color="#1a2236" />
    </linearGradient>
    <linearGradient id="curtain-right" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#050608" />
      <stop offset="70%" stop-color="#111522" />
      <stop offset="100%" stop-color="#1a2236" />
    </linearGradient>

    
    <linearGradient id="floor-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07080b" stop-opacity="1" />
      <stop offset="100%" stop-color="#020305" stop-opacity="1" />
    </linearGradient>

    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feOffset dx="0" dy="20" result="offset" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="url(#bg-glow)" />

  
  <path d="M 350 0 L 850 0 L 1050 675 L 150 675 Z" fill="url(#spotlight)" />

  
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="450" y1="0" x2="450" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="750" y1="0" x2="750" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
