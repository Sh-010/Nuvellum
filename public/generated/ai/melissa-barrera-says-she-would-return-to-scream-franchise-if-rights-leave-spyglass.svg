  <path d="M0 0 L220 0 L150 675 L0 675 Z" fill="url(#curtain-left)" />
  <path d="M1200 0 L980 0 L1050 675 L1200 675 Z" fill="url(#curtain-right)" />

  
  <rect x="0" y="520" width="1200" height="155" fill="url(#floor-fade)" />
