        <line x1="420" y1="102" x2="780" y2="102" stroke-width="4" />
        
        
        <line x1="420" y1="102" x2="420" y2="190" stroke-width="1.5" stroke-dasharray="3 3" />
        <line x1="420" y1="102" x2="480" y2="190" stroke-width="1.5" stroke-dasharray="3 3" />
        <line x1="360" y1="102" x2="420" y2="190" stroke-width="1.5" stroke-dasharray="3 3" />
        
