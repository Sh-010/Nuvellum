      <line x1="330" y1="495" x2="380" y2="520" />
      <line x1="360" y1="495" x2="410" y2="520" />
      <line x1="390" y1="495" x2="440" y2="520" />
      
      <line x1="820" y1="475" x2="870" y2="500" />
      <line x1="850" y1="475" x2="900" y2="500" />
      <line x1="880" y1="475" x2="930" y2="500" />
      <line x1="910" y1="475" x2="960" y2="500" />
    </g>

    
    <g stroke="#661227" stroke-width="2" fill="none">
      
      <path d="M 60 75 L 60 60 L 75 60" />
      
      <path d="M 1140 75 L 1140 60 L 1125 60" />
      
      <path d="M 60 600 L 60 615 L 75 615" />
      
      <path d="M 1140 600 L 1140 615 L 1125 615" />
    </g>

    
    <g transform="translate(860, 420) rotate(-15)" filter="url(#subtle-shadow)">
      
      <polygon points="-30,30 30,30 20,50 -20,50" fill="#2a221c" stroke="#2a221c" stroke-width="1" />
      <rect x="-35" y="25" width="70" height="8" fill="#661227" stroke="#2a221c" stroke-width="1.5" />
      
      <line x1="0" y1="25" x2="0" y2="-45" stroke="#2a221c" stroke-width="8" stroke-linecap="round" />
      
      <rect x="-35" y="-60" width="70" height="22" rx="4" fill="#661227" stroke="#2a221c" stroke-width="2" />
