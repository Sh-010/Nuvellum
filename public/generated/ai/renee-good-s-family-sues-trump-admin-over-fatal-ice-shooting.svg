<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      <feColorMatrix type="matrix" values="0.3 0 0 0 0  0 0.3 0 0 0  0 0 0.3 0 0  0 0 0 0.15 0" in="noise" result="coloredNoise"/>
      <feComposite operator="in" in2="SourceGraphic" in="coloredNoise" result="composite"/>
      <feBlend mode="multiply" in="SourceGraphic" in2="composite" result="blend"/>
    </filter>

    
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#2a221c" flood-opacity="0.12" />
    </filter>
    <filter id="deep-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#2a221c" flood-opacity="0.2" />
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="#f3ecdf" />

  
  <g stroke="#2a221c" stroke-opacity="0.08" stroke-width="1" fill="none">
    <line x1="100" y1="0" x2="100" y2="675" stroke-dasharray="4 8" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1100" y1="0" x2="1100" y2="675" stroke-dasharray="4 8" />
    
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="575" x2="1200" y2="575" />
  </g>

  
  <rect x="40" y="40" width="1120" height="595" fill="none" stroke="#2a221c" stroke-opacity="0.25" stroke-width="2" />
  <rect x="48" y="48" width="1104" height="579" fill="none" stroke="#661227" stroke-opacity="0.4" stroke-width="1" />

  
  <g filter="url(#paper-texture)">
    
    
    <polygon points="250,540 950,540 1050,615 150,615" fill="#d9d0c1" filter="url(#subtle-shadow)" stroke="#2a221c" stroke-width="2" />
    
    <line x1="600" y1="550" x2="600" y2="605" stroke="#f3ecdf" stroke-width="6" stroke-dasharray="12 12" />

    
    
    <g transform="translate(320, 110) rotate(-6)" filter="url(#subtle-shadow)">
      <rect x="0" y="0" width="280" height="380" fill="#fdfbf7" stroke="#2a221c" stroke-width="2" />
      
      <line x1="30" y1="40" x2="250" y2="40" stroke="#661227" stroke-width="3" />
      <line x1="30" y1="50" x2="180" y2="50" stroke="#2a221c" stroke-width="1" />
      
      <g stroke="#2a221c" stroke-width="2" stroke-linecap="round" opacity="0.7">
        <line x1="30" y1="80" x2="250" y2="80" />
        <line x1="30" y1="105" x2="220" y2="105" />
        <line x1="30" y1="130" x2="240" y2="130" />
        <line x1="30" y1="155" x2="190" y2="155" />
        
        <line x1="30" y1="200" x2="250" y2="200" />
