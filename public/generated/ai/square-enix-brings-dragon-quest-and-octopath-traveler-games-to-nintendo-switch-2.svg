<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <radialGradient id="paper-grad" cx="600" cy="337" r="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7f2ea" />
      <stop offset="60%" stop-color="#f0e7dc" />
      <stop offset="100%" stop-color="#e3d6c6" />
    </radialGradient>
    
    
    <pattern id="hatch-fine" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
