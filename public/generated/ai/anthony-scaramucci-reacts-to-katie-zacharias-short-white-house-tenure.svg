      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#2a221c" flood-opacity="0.12"/>
    </filter>
  </defs>

  
