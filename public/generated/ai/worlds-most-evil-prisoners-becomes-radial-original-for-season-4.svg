    <rect x="12" y="12" width="356" height="411" class="paper-light" />

    
    
    <line x1="12" y1="120" x2="368" y2="120" class="line-stone" stroke-dasharray="4 4" />
    <line x1="12" y1="320" x2="368" y2="320" class="line-stone" stroke-dasharray="4 4" />
    <line x1="190" y1="12" x2="190" y2="423" class="line-stone" stroke-dasharray="4 4" />

    
    
    <rect x="80" y="60" width="14" height="320" class="ink-dark" />
    <rect x="83" y="60" width="4" height="320" fill="#fbf8f3" opacity="0.4" />

    <rect x="130" y="60" width="14" height="320" class="ink-dark" />
    <rect x="133" y="60" width="4" height="320" fill="#fbf8f3" opacity="0.4" />

    <rect x="236" y="60" width="14" height="320" class="ink-dark" />
    <rect x="239" y="60" width="4" height="320" fill="#fbf8f3" opacity="0.4" />

    <rect x="286" y="60" width="14" height="320" class="ink-dark" />
    <rect x="289" y="60" width="4" height="320" fill="#fbf8f3" opacity="0.4" />

    
    <circle cx="190" cy="220" r="75" fill="none" stroke="#661227" stroke-width="4" />
    <circle cx="190" cy="220" r="71" fill="url(#hatch-h)" />
    <circle cx="190" cy="220" r="45" fill="#f3ecdf" stroke="#2a221c" stroke-width="2" />

    
    
    <path d="M 175 190 
             C 185 185, 200 190, 205 205 
             C 210 215, 205 230, 200 240 
             C 195 245, 190 255, 185 260 
             L 170 260 
             C 170 240, 175 220, 175 190 Z" 
          class="ink-dark" />
    
    
    <line x1="190" y1="135" x2="190" y2="165" class="line-burgundy" stroke-width="2" />
    <line x1="190" y1="275" x2="190" y2="305" class="line-burgundy" stroke-width="2" />
    <line x1="105" y1="220" x2="135" y2="220" class="line-burgundy" stroke-width="2" />
    <line x1="245" y1="220" x2="275" y2="220" class="line-burgundy" stroke-width="2" />

    
    <rect x="30" y="25" width="40" height="8" class="ink-burgundy" />
    <rect x="310" y="25" width="40" height="8" class="ink-dark" />
    <rect x="170" y="395" width="40" height="6" class="ink-dark" />
  </g>

  
  
  <rect x="55" y="55" width="40" height="40" fill="url(#hatch-v)" />
  <rect x="1105" y="55" width="40" height="40" fill="url(#hatch-v)" />
  <rect x="55" y="580" width="40" height="40" fill="url(#hatch-v)" />
  <rect x="1105" y="580" width="40" height="40" fill="url(#hatch-v)" />

  
  <line x1="95" y1="595" x2="1105" y2="595" class="line-dark" stroke-width="1.5" />
  <line x1="95" y1="600" x2="1105" y2="600" class="line-burgundy" stroke-width="1" />

  
  <g class="ink-dark">
    <rect x="95" y="586" width="12" height="3" />
    <rect x="115" y="586" width="6" height="3" />
    <rect x="130" y="586" width="24" height="3" />
    <rect x="1045" y="586" width="24" height="3" />
    <rect x="1075" y="586" width="6" height="3" />
    <rect x="1088" y="586" width="17" height="3" />
  </g>
</svg>