<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <style>
      .bg { fill: #f3ecdf; }
      .paper-grain { opacity: 0.03; fill: #2a221c; }
      .ink-dark { fill: #2a221c; }
      .ink-burgundy { fill: #661227; }
      .ink-stone { fill: #8c8275; }
      .paper-light { fill: #fbf8f3; }
      .line-dark { stroke: #2a221c; stroke-width: 2; fill: none; }
      .line-burgundy { stroke: #661227; stroke-width: 2; fill: none; }
      .line-stone { stroke: #8c8275; stroke-width: 1.5; fill: none; }
      .hatch { stroke: #2a221c; stroke-width: 0.75; opacity: 0.3; }
    </style>
    <pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" class="paper-grain" />
      <circle cx="70" cy="40" r="1.5" class="paper-grain" />
      <circle cx="40" cy="80" r="1" class="paper-grain" />
      <circle cx="90" cy="90" r="0.8" class="paper-grain" />
    </pattern>
    <pattern id="hatch-v" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" class="hatch" />
    </pattern>
    <pattern id="hatch-h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
      <line x1="0" y1="0" x2="0" y2="8" class="hatch" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" class="bg" />
  <rect width="1200" height="675" fill="url(#grain)" />

  
  <rect x="40" y="40" width="1120" height="595" fill="none" stroke="#2a221c" stroke-width="1" opacity="0.2" />
  <rect x="48" y="48" width="1104" height="579" fill="none" stroke="#2a221c" stroke-width="3" opacity="0.8" />

  
  
  <path d="M 200 120 L 1000 120 L 1000 555 L 200 555 Z" fill="#e8dfd0" opacity="0.7" />
  
  
  <line x1="200" y1="120" x2="120" y2="70" class="line-stone" opacity="0.5" />
  <line x1="1000" y1="120" x2="1080" y2="70" class="line-stone" opacity="0.5" />
  <line x1="1000" y1="555" x2="1080" y2="605" class="line-stone" opacity="0.5" />
  <line x1="200" y1="555" x2="120" y2="605" class="line-stone" opacity="0.5" />

  
  <g opacity="0.85">
    
    <rect x="180" y="160" width="220" height="355" class="paper-light" stroke="#2a221c" stroke-width="2" />
    <rect x="180" y="160" width="220" height="40" fill="#2a221c" opacity="0.08" />
    
    <line x1="210" y1="220" x2="330" y2="220" class="line-dark" stroke-width="3" />
    <line x1="210" y1="250" x2="370" y2="250" class="line-stone" />
    <line x1="210" y1="275" x2="350" y2="275" class="line-stone" />
    <line x1="210" y1="300" x2="360" y2="300" class="line-stone" />
    <line x1="210" y1="325" x2="300" y2="325" class="line-stone" />
    <line x1="210" y1="375" x2="370" y2="375" class="line-dark" stroke-width="1.5" />
    <line x1="210" y1="400" x2="340" y2="400" class="line-stone" />
    <line x1="210" y1="425" x2="360" y2="425" class="line-stone" />
    
    <circle cx="340" cy="465" r="22" class="ink-burgundy" />
    <circle cx="340" cy="465" r="15" fill="none" stroke="#fbf8f3" stroke-width="1.5" />

    
    <rect x="800" y="160" width="220" height="355" class="paper-light" stroke="#2a221c" stroke-width="2" />
    <rect x="800" y="160" width="220" height="40" fill="#2a221c" opacity="0.08" />
    <line x1="830" y1="220" x2="950" y2="220" class="line-dark" stroke-width="3" />
    <line x1="830" y1="250" x2="990" y2="250" class="line-stone" />
    <line x1="830" y1="275" x2="970" y2="275" class="line-stone" />
    <line x1="830" y1="300" x2="940" y2="300" class="line-stone" />
    <line x1="830" y1="350" x2="990" y2="350" class="line-dark" stroke-width="1.5" />
    <line x1="830" y1="375" x2="910" y2="375" class="line-stone" />
    <line x1="830" y1="400" x2="980" y2="400" class="line-stone" />
    <line x1="830" y1="425" x2="950" y2="425" class="line-stone" />
    
    <rect x="830" y="450" width="160" height="40" fill="url(#hatch-v)" />
