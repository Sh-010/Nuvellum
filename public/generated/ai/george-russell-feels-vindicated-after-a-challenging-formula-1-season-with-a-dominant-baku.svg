    <line x1="300" y1="580" x2="900" y2="580" stroke="url(#speedBlur)" stroke-width="2"/>
    <line x1="50" y1="610" x2="800" y2="610" stroke="url(#speedBlur)" stroke-width="3"/>
  </g>

  
  
  
  <g id="mercedesCar" transform="translate(420, 290)">
    
