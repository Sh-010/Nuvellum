<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="40%" stop-color="#12182b"/>
      <stop offset="80%" stop-color="#1a2038"/>
      <stop offset="100%" stop-color="#241a2e"/>
    </linearGradient>

    
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e39" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#e63946" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#12182b" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bakuHaze" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f4a261" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#e76f51" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a0c16" stop-opacity="0"/>
    </linearGradient>

    
    <linearGradient id="asphalt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1d24"/>
      <stop offset="100%" stop-color="#0d0f14"/>
    </linearGradient>

    
    <linearGradient id="silverBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="30%" stop-color="#ced4da"/>
      <stop offset="60%" stop-color="#adb5bd"/>
      <stop offset="100%" stop-color="#6c757d"/>
    </linearGradient>

    <linearGradient id="silverHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#adb5bd" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="petronasTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="redBullNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2a4a"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>

    <linearGradient id="redBullYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffbe0b"/>
      <stop offset="100%" stop-color="#fb5607"/>
    </linearGradient>

    
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="50%" stop-color="#f77f00"/>
      <stop offset="100%" stop-color="#d62828"/>
    </linearGradient>

    
    <linearGradient id="speedBlur" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="70%" stop-color="#00f2fe" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="sharpGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="url(#skyGrad)"/>

  
  <circle cx="950" cy="280" r="220" fill="url(#sunGlow)" filter="url(#glow)"/>

  
  <g opacity="0.35">
    
    <path d="M0 400 L50 380 L100 410 L180 370 L250 420 L320 360 L400 430 L480 350 L560 410 L640 330 L720 390 L800 300 L880 380 L960 320 L1040 390 L1120 340 L1200 400 L1200 500 L0 500 Z" fill="#0d111a"/>
    
    
    
    <path d="M820 420 C815 320 830 220 850 150 C865 220 875 320 870 420 Z" fill="#141a29"/>
    
    <path d="M885 430 C875 300 895 180 920 100 C945 180 960 300 950 430 Z" fill="#1a2236"/>
    
    <path d="M965 440 C960 340 975 240 990 170 C1005 240 1015 340 1010 440 Z" fill="#141a29"/>
  </g>

  
  <rect x="0" y="300" width="1200" height="200" fill="url(#bakuHaze)"/>

  
  <g opacity="0.5">
