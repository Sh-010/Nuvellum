      <path d="M -8 10 C -2 6, 6 7, 8 11 C 4 11, -2 11, -8 10 Z" fill="#e63946"/>
      
      <path d="M -6 9 C -2 7, 2 7, 6 9 C 5 12, -5 12, -6 9 Z" fill="#111" stroke="#38b000" stroke-width="0.5"/>
