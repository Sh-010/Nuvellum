      <ellipse cx="0" cy="0" rx="22" ry="32" fill="#1f242d"/>
      <ellipse cx="0" cy="0" rx="12" ry="18" fill="#0b0c10"/>
      <path d="M-4 -20 L4 20 M-12 -8 L12 8" stroke="#00f2fe" stroke-width="2" opacity="0.7"/>
      
      <path d="M -35 -25 L -55 -20 M -35 0 L -60 0 M -35 25 L -55 20" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
