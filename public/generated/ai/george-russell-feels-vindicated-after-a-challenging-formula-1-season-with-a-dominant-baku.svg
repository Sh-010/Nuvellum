    <path d="M 90 154 C 150 144, 300 134, 440 150" stroke="url(#petronasTeal)" stroke-width="4" fill="none" filter="url(#sharpGlow)"/>
    <path d="M 140 162 C 220 155, 320 155, 410 163" stroke="url(#petronasTeal)" stroke-width="2.5" fill="none"/>

    
    <path d="M 230 130 C 240 120, 270 120, 285 132 L 275 145 L 235 145 Z" fill="#0b0c10" stroke="#333" stroke-width="1.5"/>
    
