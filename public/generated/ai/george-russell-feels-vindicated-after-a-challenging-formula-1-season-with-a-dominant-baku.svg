    <path d="M40 460 L80 460 M150 465 L200 465 M280 460 L320 460 M400 470 L450 470" stroke="#252233" stroke-width="3"/>
  </g>

  
  <path d="M-100 675 C 200 675, 400 480, 1300 460 L1300 675 Z" fill="url(#asphalt)"/>
  
  
  <path d="M-100 665 C 200 665, 395 470, 1300 450" stroke="#ffffff" stroke-width="12" fill="none" opacity="0.8"/>
  <path d="M-100 665 C 200 665, 395 470, 1300 450" stroke="#e63946" stroke-width="12" stroke-dasharray="35 35" fill="none"/>

  
  <g opacity="0.4">
