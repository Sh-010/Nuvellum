  <g stroke="#2a221c" stroke-width="0.75" opacity="0.5">
    
    <line x1="25" y1="40" x2="35" y2="40" />
    <line x1="40" y1="25" x2="40" y2="35" />
    
    
    <line x1="1165" y1="40" x2="1175" y2="40" />
    <line x1="1160" y1="25" x2="1160" y2="35" />

    
    <line x1="25" y1="635" x2="35" y2="635" />
    <line x1="40" y1="640" x2="40" y2="650" />

    
