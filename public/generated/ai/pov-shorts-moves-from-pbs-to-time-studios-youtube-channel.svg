      </g>

      
      <g transform="translate(170, 310)">
        <circle cx="15" cy="15" r="18" fill="#661227" />
        <path d="M 8 15 L 13 20 L 22 10" fill="none" stroke="#f3ecdf" stroke-width="2" />
