<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      
        
      
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.93" />
        <feFuncG type="linear" slope="0.91" />
        <feFuncB type="linear" slope="0.87" />
      </feComponentTransfer>
      <feBlend mode="multiply" in="SourceGraphic" result="blend" />
    </filter>

    
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.8" opacity="0.18" />
    </pattern>
    
    
    <pattern id="hatch-dense" width="4" height="4" patternTransform="rotate(135 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#661227" stroke-width="0.7" opacity="0.25" />
    </pattern>

    
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#7a6b5d" opacity="0.15" />
    </pattern>
  </defs>

  
