  <path d="M 80 60 Q 200 120 320 60 L 320 615 L 80 615 Z" fill="#2a221c" opacity="0.03"/>
  <path d="M 1120 60 Q 1000 120 880 60 L 880 615 L 1120 615 Z" fill="#2a221c" opacity="0.03"/>

  
  
  
  <rect x="425" y="175" width="350" height="380" rx="6" fill="#2a221c" opacity="0.12"/>

  
  <rect x="420" y="165" width="360" height="390" rx="8" fill="#e8e0d2" stroke="#2a221c" stroke-width="3"/>
