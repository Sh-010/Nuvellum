    <polygon points="40,135 65,110 90,135 95,145 35,145" fill="#2a221c"/>
    <polygon points="65,110 75,125 55,125" fill="#efe8db"/>
  </g>

  
  <g transform="translate(850, 270) rotate(12)">
    
    <rect x="0" y="0" width="110" height="75" fill="#d9cebd" stroke="#2a221c" stroke-width="2"/>
    
    <rect x="-8" y="10" width="110" height="75" fill="#efe8db" stroke="#2a221c" stroke-width="2"/>
    
    <rect x="-15" y="20" width="110" height="75" fill="#fdfbf7" stroke="#2a221c" stroke-width="2"/>
    
    <line x1="-5" y1="35" x2="75" y2="35" stroke="#2a221c" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-5" y1="45" x2="85" y2="45" stroke="#2a221c" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-5" y1="55" x2="55" y2="55" stroke="#2a221c" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-5" y1="65" x2="70" y2="65" stroke="#661227" stroke-width="2" stroke-linecap="round"/>
  </g>

  
  <rect x="25" y="25" width="1150" height="625" fill="none" stroke="#2a221c" stroke-width="1" opacity="0.2"/>
  <rect x="35" y="35" width="1130" height="605" fill="none" stroke="#661227" stroke-width="2" opacity="0.25"/>

</svg>