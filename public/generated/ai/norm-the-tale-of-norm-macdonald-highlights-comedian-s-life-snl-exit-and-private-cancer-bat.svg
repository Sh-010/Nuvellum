    <circle cx="0" cy="215" r="16" fill="#2a221c"/>
    <circle cx="0" cy="215" r="10" fill="#efe8db"/>

    
    <rect x="-8" y="70" width="16" height="20" fill="#2a221c" rx="4"/>
    <circle cx="0" cy="80" r="5" fill="#efe8db"/>

    
    <path d="M -25 35 L -25 55 C -25 70 25 70 25 55 L 25 35" fill="none" stroke="#2a221c" stroke-width="6" stroke-linecap="round"/>
    
    
    
    <rect x="-32" y="-38" width="64" height="94" rx="12" fill="#2a221c" opacity="0.2" transform="translate(5, 5)"/>
    
    
    <rect x="-32" y="-38" width="64" height="94" rx="12" fill="#d9cebd" stroke="#2a221c" stroke-width="4"/>
    <rect x="-26" y="-32" width="52" height="82" rx="8" fill="#fdfbf7" stroke="#2a221c" stroke-width="2"/>

    
    <line x1="-20" y1="-20" x2="20" y2="-20" stroke="#2a221c" stroke-width="2"/>
    <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#2a221c" stroke-width="2"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#2a221c" stroke-width="2"/>
    <line x1="-20" y1="10" x2="20" y2="10" stroke="#2a221c" stroke-width="2"/>
    <line x1="-20" y1="20" x2="20" y2="20" stroke="#2a221c" stroke-width="2"/>
    <line x1="-20" y1="30" x2="20" y2="30" stroke="#2a221c" stroke-width="2"/>

    
    <rect x="-3" y="-32" width="6" height="82" fill="#661227" opacity="0.8"/>

    
    <circle cx="0" cy="-5" r="5" fill="#661227"/>
