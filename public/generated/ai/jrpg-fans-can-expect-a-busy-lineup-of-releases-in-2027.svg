    </pattern>

    
    <pattern id="denseHatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#550e1e" stroke-width="0.8" stroke-opacity="0.25" />
    </pattern>
    
    
    <pattern id="gridDots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#322923" fill-opacity="0.12" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="url(#paperBg)" />
