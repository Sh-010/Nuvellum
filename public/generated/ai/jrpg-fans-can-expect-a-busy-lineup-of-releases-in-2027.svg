<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  
  <defs>
    
    <linearGradient id="paperBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6efe4" />
      <stop offset="50%" stop-color="#f1eae0" />
      <stop offset="100%" stop-color="#ebe2d5" />
    </linearGradient>

    
    <linearGradient id="charcoalInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#221b17" />
      <stop offset="100%" stop-color="#322923" />
    </linearGradient>

    
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a172e" />
      <stop offset="100%" stop-color="#550e1e" />
