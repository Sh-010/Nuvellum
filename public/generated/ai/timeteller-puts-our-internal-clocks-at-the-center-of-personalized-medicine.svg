<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      
        
      
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.95" />
        <feFuncG type="linear" slope="0.93" />
        <feFuncB type="linear" slope="0.89" />
      </feComponentTransfer>
      <feBlend mode="multiply" in="SourceGraphic" />
    </filter>

    
    <pattern id="hatch-fine" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.75" opacity="0.2" />
    </pattern>
    <pattern id="hatch-dense" width="4" height="4" patternTransform="rotate(-30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#661227" stroke-width="1" opacity="0.3" />
    </pattern>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#7a7067" opacity="0.25" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="#f3ecdf" />
  <rect width="1200" height="675" filter="url(#paper-texture)" opacity="0.6" />

  
  <rect x="80" y="60" width="1040" height="555" fill="url(#dot-grid)" opacity="0.7" />
  
  
  <line x1="80" y1="60" x2="1120" y2="60" stroke="#2a221c" stroke-width="1" opacity="0.3" />
  <line x1="80" y1="615" x2="1120" y2="615" stroke="#2a221c" stroke-width="1" opacity="0.3" />

  
  
  <g transform="translate(600, 337)">
    
    
    <circle cx="0" cy="0" r="220" fill="none" stroke="#2a221c" stroke-width="1.5" opacity="0.3" />
    <circle cx="0" cy="0" r="212" fill="none" stroke="#2a221c" stroke-width="0.5" stroke-dasharray="3,6" opacity="0.5" />
    <circle cx="0" cy="0" r="170" fill="none" stroke="#661227" stroke-width="1" opacity="0.25" />
    <circle cx="0" cy="0" r="120" fill="none" stroke="#2a221c" stroke-width="1" opacity="0.2" />

    
    <path d="M0,-220 L0,-205 M155,-155 L145,-145 M220,0 L205,0 M155,155 L145,145 M0,220 L0,205 M-155,155 L-145,145 M-220,0 L-205,0 M-155,-155 L-145,-145" stroke="#2a221c" stroke-width="2" opacity="0.6" />
    <path d="
      M55,-212 L52,-198 M110,-190 L102,-177 M190,-110 L177,-102 M212,-55 L198,-52
      M212,55 L198,52 M190,110 L177,102 M110,190 L102,177 M55,212 L52,198
      M-55,212 L-52,198 M-110,190 L-102,177 M-190,110 L-177,102 M-212,55 L-198,52
      M-212,-55 L-198,-52 M-190,-110 L-177,-102 M-110,-190 L-102,-177 M-55,-212 L-52,-198
    " stroke="#2a221c" stroke-width="1" opacity="0.4" />

    
    <path d="
      M -200,0 
      C -150,-120 -100,-120 -50,0 
      C 0,120 50,120 100,0 
      C 150,-120 200,-120 200,0
    " fill="none" stroke="#661227" stroke-width="3.5" opacity="0.85" />

    
    <path d="
      M -200,30 
      C -150,90 -100,90 -50,30 
      C 0,-30 50,-30 100,30 
      C 150,90 200,90 200,30
    " fill="none" stroke="#2a221c" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />

    
    <circle cx="0" cy="0" r="75" fill="#efe8db" stroke="#2a221c" stroke-width="2" />
    <circle cx="0" cy="0" r="75" fill="url(#hatch-fine)" opacity="0.6" />

    
    <path d="M-45,-25 C-30,-60 30,-60 45,-25 C60,-10 60,30 30,50 C0,70 -40,50 -50,15 C-60,-20 -45,-25 -45,-25 Z" fill="none" stroke="#661227" stroke-width="1.5" opacity="0.7" />

    
    <line x1="0" y1="0" x2="35" y2="-55" stroke="#2a221c" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-45" y2="25" stroke="#661227" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="6" fill="#661227" />

    
    <circle cx="-50" cy="0" r="5" fill="#661227" />
    <circle cx="50" cy="0" r="5" fill="#2a221c" />
    <circle cx="0" cy="-75" r="5" fill="#661227" />
    <circle cx="100" cy="0" r="4" fill="#2a221c" />
  </g>

  
  <g transform="translate(180, 337)">
    
    <line x1="-50" y1="-180" x2="-50" y2="180" stroke="#2a221c" stroke-width="1.5" opacity="0.5" />
    <path d="M-55,-180 L-45,-180 M-55,-120 L-45,-120 M-55,-60 L-45,-60 M-55,0 L-45,0 M-55,60 L-45,60 M-55,120 L-45,120 M-55,180 L-45,180" stroke="#2a221c" stroke-width="1.5" opacity="0.6" />
    
    
    <rect x="-65" y="-30" width="30" height="120" fill="#661227" opacity="0.12" rx="4" />
    <rect x="-65" y="-30" width="30" height="120" fill="url(#hatch-dense)" rx="4" />
    <rect x="-65" y="-30" width="30" height="120" fill="none" stroke="#661227" stroke-width="1.5" rx="4" />
    
    
    <path d="M-65,-30 Q-50,-20 -35,-30" fill="none" stroke="#661227" stroke-width="1.5" />

    
    <path d="M-35,30 L220,30" fill="none" stroke="#2a221c" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />
  </g>

  
  <g transform="translate(920, 337)">
    
    <line x1="-80" y1="120" x2="100" y2="120" stroke="#2a221c" stroke-width="1.5" opacity="0.5" />
    <line x1="-80" y1="-120" x2="-80" y2="120" stroke="#2a221c" stroke-width="1.5" opacity="0.5" />

    
    <line x1="-80" y1="40" x2="100" y2="40" stroke="#2a221c" stroke-width="0.5" stroke-dasharray="2,4" opacity="0.3" />
    <line x1="-80" y1="-40" x2="100" y2="-40" stroke="#2a221c" stroke-width="0.5" stroke-dasharray="2,4" opacity="0.3" />
    <line x1="-20" y1="-120" x2="-20" y2="120" stroke="#2a221c" stroke-width="0.5" stroke-dasharray="2,4" opacity="0.3" />
    <line x1="40" y1="-120" x2="40" y2="120" stroke="#2a221c" stroke-width="0.5" stroke-dasharray="2,4" opacity="0.3" />

    
    <path d="M-80,80 C-50,80 -35,-20 0,-70 C35,-120 70,20 100,50" fill="none" stroke="#661227" stroke-width="2.5" />
    <path d="M-80,100 C-50,100 -35,40 0,20 C35,0 70,80 100,90" fill="none" stroke="#2a221c" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />

    
    <circle cx="0" cy="-70" r="4" fill="#661227" />
    <line x1="0" y1="-70" x2="0" y2="120" stroke="#661227" stroke-width="1" stroke-dasharray="2,2" opacity="0.5" />

    
    <path d="M-220,-30 L-80,-30" fill="none" stroke="#2a221c" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />
  </g>

  
  <g stroke="#2a221c" stroke-width="1" opacity="0.4">
    
    <path d="M 100,90 L 100,75 L 115,75" fill="none" />
    
    <path d="M 1100,90 L 1100,75 L 1085,75" fill="none" />
    
    <path d="M 100,585 L 100,600 L 115,600" fill="none" />
    
    <path d="M 1100,585 L 1100,600 L 1085,600" fill="none" />
  </g>

  
  <g opacity="0.15">
    <line x1="80" y1="120" x2="120" y2="80" stroke="#2a221c" stroke-width="1" />
    <line x1="80" y1="140" x2="140" y2="80" stroke="#2a221c" stroke-width="1" />
    <line x1="80" y1="160" x2="160" y2="80" stroke="#2a221c" stroke-width="1" />
    
    <line x1="1120" y1="555" x2="1080" y2="595" stroke="#2a221c" stroke-width="1" />
    <line x1="1120" y1="535" x2="1060" y2="595" stroke="#2a221c" stroke-width="1" />
    <line x1="1120" y1="515" x2="1040" y2="595" stroke="#2a221c" stroke-width="1" />
  </g>
</svg>