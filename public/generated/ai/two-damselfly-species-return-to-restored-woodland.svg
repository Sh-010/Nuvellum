      <path d="M -50,0 L -40,60 Q 0,75 40,60 L 50,0 Z" fill="url(#trunkGrad)" stroke="#2a221c" stroke-width="2.5" />
      
      <g stroke="#3b7a57" stroke-width="2" fill="none" stroke-linecap="round">
