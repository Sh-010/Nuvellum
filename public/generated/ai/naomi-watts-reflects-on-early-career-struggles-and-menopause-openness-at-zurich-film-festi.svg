<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b22"/>
      <stop offset="50%" stop-color="#121826"/>
      <stop offset="100%" stop-color="#07090f"/>
    </linearGradient>

    
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f3d596" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.0"/>
    </linearGradient>

    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaae"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#9a7b1c"/>
      <stop offset="100%" stop-color="#5a450a"/>
    </linearGradient>

    
    <linearGradient id="filmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2430"/>
      <stop offset="50%" stop-color="#2a3648"/>
      <stop offset="100%" stop-color="#11161d"/>
    </linearGradient>

    
    <linearGradient id="profileGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#11161d"/>
      <stop offset="70%" stop-color="#182332"/>
      <stop offset="100%" stop-color="#e8b964" stop-opacity="0.8"/>
    </linearGradient>

    <radialGradient id="spotGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f6e2b3" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>

    
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#020408" stop-opacity="0.85"/>
    </radialGradient>

    
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  
  <polygon points="600,0 200,675 450,675" fill="url(#goldBeam)" />
  <polygon points="600,0 750,675 1000,675" fill="url(#goldBeam)" />
  <circle cx="600" cy="150" r="350" fill="url(#spotGlow)" filter="url(#softGlow)"/>

  
  <path d="M0 550 L180 480 L320 510 L500 440 L680 490 L850 420 L1020 470 L1200 400 L1200 675 L0 675 Z" fill="#0d141c" opacity="0.7"/>
  <path d="M0 590 L250 530 L400 560 L600 500 L820 540 L1050 480 L1200 520 L1200 675 L0 675 Z" fill="#080c12" opacity="0.9"/>

  
  <g opacity="0.35">
    <path d="M -50 150 C 200 50, 400 300, 600 200 C 800 100, 1000 350, 1250 250" fill="none" stroke="url(#filmGrad)" stroke-width="70" stroke-linecap="round"/>
    
    <path d="M -50 120 C 200 20, 400 270, 600 170 C 800 70, 1000 320, 1250 220" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="25 35" opacity="0.4"/>
    <path d="M -50 180 C 200 80, 400 330, 600 230 C 800 130, 1000 380, 1250 280" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="25 35" opacity="0.4"/>
  </g>

  
  <g opacity="0.25">
    <path d="M -50 500 C 300 650, 500 400, 750 550 C 1000 700, 1100 450, 1250 500" fill="none" stroke="url(#filmGrad)" stroke-width="50" stroke-linecap="round"/>
    <path d="M -50 480 C 300 630, 500 380, 750 530 C 1000 680, 1100 430, 1250 480" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="20 30" opacity="0.4"/>
    <path d="M -50 520 C 300 670, 500 420, 750 570 C 1000 720, 1100 470, 1250 520" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="20 30" opacity="0.4"/>
  </g>

  
  <g transform="translate(600, 260)">
    
    <g opacity="0.85">
      <path d="M 0 -110 L 15 -70 L 0 -50 L -15 -70 Z" fill="url(#goldGrad)" />
      <path d="M 77 -77 L 50 -45 L 35 -55 L 55 -75 Z" fill="url(#goldGrad)" />
      <path d="M 110 0 L 70 -15 L 50 0 L 70 15 Z" fill="url(#goldGrad)" />
      <path d="M 77 77 L 55 75 L 35 55 L 50 45 Z" fill="url(#goldGrad)" />
      <path d="M 0 110 L -15 70 L 0 50 L 15 70 Z" fill="url(#goldGrad)" />
      <path d="M -77 77 L -50 45 L -35 55 L -55 75 Z" fill="url(#goldGrad)" />
      <path d="M -110 0 L -70 15 L -50 0 L -70 -15 Z" fill="url(#goldGrad)" />
      <path d="M -77 -77 L -55 -75 L -35 -55 L -50 -45 Z" fill="url(#goldGrad)" />
    </g>

    
    <circle cx="0" cy="0" r="70" fill="none" stroke="url(#goldGrad)" stroke-width="8" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>

    
    <circle cx="0" cy="0" r="45" fill="#0b1118"/>
    <path d="M 0 -45 C 25 -45, 45 -25, 45 0 C 45 25, 25 45, 0 45 C -25 45, -45 25, -45 0 C -45 -25, -25 -45, 0 -45 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
    
    
    <circle cx="0" cy="0" r="22" fill="url(#goldGrad)"/>
    <circle cx="-6" cy="-6" r="6" fill="#ffffff" opacity="0.85"/>
  </g>

  
  <path d="M 450 440 L 750 440 L 790 490 L 410 490 Z" fill="#151d28" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.9"/>
  <path d="M 410 490 L 790 490 L 830 520 L 370 520 Z" fill="#0c1017" stroke="url(#goldGrad)" stroke-width="1" opacity="0.8"/>
  <rect x="350" y="520" width="500" height="15" rx="4" fill="url(#goldGrad)" opacity="0.9"/>

  
  <g transform="translate(180, 180)">
    
    <path d="M 120 120 C 140 80, 180 50, 230 70 C 270 85, 290 130, 280 180 C 270 220, 240 250, 230 290 C 220 330, 240 370, 230 420 L 80 420 L 80 250 Z" fill="url(#profileGrad)" filter="url(#softGlow)" opacity="0.3"/>

    
    <path d="M 140 140 
             C 135 110, 155 80, 185 75 
             C 210 70, 235 90, 245 115 
             C 260 110, 275 120, 280 135 
             C 290 155, 295 180, 285 200 
             C 275 220, 260 230, 255 240 
             C 250 250, 255 265, 245 275 
             C 235 285, 225 280, 220 295 
             C 215 310, 220 340, 210 360 
             C 200 380, 170 410, 140 420 
             L 80 420 
             L 80 260 
             C 95 260, 110 245, 115 230 
             C 120 215, 115 190, 125 170 
             C 130 155, 138 148, 140 140 Z" 
          fill="#101722" stroke="url(#goldGrad)" stroke-width="2"/>

    
    <path d="M 235 115 
             C 240 135, 242 155, 238 170 
             C 234 180, 228 185, 225 190 
             C 222 195, 225 205, 222 210 
             C 218 215, 212 212, 210 215 
             C 208 218, 209 225, 212 230 
             C 215 235, 225 240, 228 250" 
          fill="none" stroke="#f3d596" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    
    <path d="M 80 420 C 130 410, 180 395, 245 425 C 275 440, 310 470, 330 500 L 60 500 Z" fill="#090d13" stroke="url(#goldGrad)" stroke-width="1" opacity="0.95"/>
    <path d="M 120 412 C 160 405, 200 410, 245 425" fill="none" stroke="#f3d596" stroke-width="1.5" opacity="0.6"/>
  </g>

  
  <g fill="#f3d596" opacity="0.6">
    <circle cx="480" cy="220" r="2.5" />
    <circle cx="420" cy="310" r="1.5" />
    <circle cx="530" cy="150" r="3" />
    <circle cx="710" cy="180" r="2" />
    <circle cx="780" cy="280" r="2.5" />
    <circle cx="680" cy="380" r="1.5" />
    <circle cx="350" cy="250" r="2" />
    <circle cx="850" cy="190" r="3" />
    <circle cx="590" cy="90" r="2" />
  </g>
  <g fill="#ffffff" opacity="0.4">
    <circle cx="450" cy="180" r="1.5" />
    <circle cx="740" cy="220" r="1" />
    <circle cx="640" cy="120" r="1.5" />
    <circle cx="380" cy="340" r="1" />
    <circle cx="810" cy="330" r="1.5" />
  </g>

  
  <rect width="1200" height="675" fill="url(#vignette)" pointer-events="none"/>
</svg>