<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  
  <defs>
    
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      
        
      
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.9" />
        <feFuncG type="linear" slope="0.88" />
        <feFuncB type="linear" slope="0.84" />
      </feComponentTransfer>
      <feBlend mode="multiply" in="SourceGraphic" result="blend" />
    </filter>

    
    <pattern id="hatch-dense" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.8" opacity="0.35" />
    </pattern>
    <pattern id="hatch-sparse" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#2a221c" stroke-width="0.6" opacity="0.25" />
    </pattern>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7a7067" opacity="0.3" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="#efe8db" />
  
  
  <g id="map-background" stroke="#7a7067" stroke-width="0.75" opacity="0.3">
    
    <rect width="1200" height="675" fill="url(#dot-grid)" opacity="0.6" />
    
    
    <path d="M-100,200 C200,100 400,350 700,200 C950,80 1100,250 1300,150" fill="none" stroke-dasharray="4,4" />
    <path d="M-100,350 C300,250 500,500 800,300 C1000,180 1150,400 1300,300" fill="none" />
    <path d="M-100,500 C250,450 600,600 850,450 C1050,350 1150,550 1300,480" fill="none" stroke-dasharray="2,6" />
    
    
    <g transform="translate(1080, 100)" opacity="0.6">
      <circle cx="0" cy="0" r="35" fill="none" stroke="#2a221c" stroke-width="1.5" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#2a221c" stroke-width="0.75" />
      <polygon points="0,-35 4,-10 0,0 -4,-10" fill="#661227" />
      <polygon points="0,35 4,10 0,0 -4,10" fill="#2a221c" />
      <polygon points="-35,0 -10,-4 0,0 -10,4" fill="#2a221c" />
      <polygon points="35,0 10,-4 0,0 10,4" fill="#2a221c" />
      
    </g>
  </g>

  
  
  
  <g id="observatory" transform="translate(120, 150)">
    
    <ellipse cx="140" cy="320" rx="130" ry="25" fill="#d5ccbd" opacity="0.7" />
    
    
    <path d="M40,240 L40,310 L240,310 L240,240 Z" fill="#e3dbcc" stroke="#2a221c" stroke-width="2.5" />
    <rect x="60" y="260" width="30" height="40" fill="url(#hatch-dense)" stroke="#2a221c" stroke-width="1.5" />
    <rect x="110" y="260" width="30" height="40" fill="url(#hatch-dense)" stroke="#2a221c" stroke-width="1.5" />
    <rect x="160" y="260" width="50" height="50" fill="#2a221c" opacity="0.1" />

    
    <path d="M40,240 C40,120 100,80 140,80 C180,80 240,120 240,240 Z" fill="#f3ecdf" stroke="#2a221c" stroke-width="3" />
    
    
    <path d="M125,90 L125,200 L155,200 L155,90 Z" fill="#661227" opacity="0.85" />
    <line x1="140" y1="90" x2="140" y2="200" stroke="#efe8db" stroke-width="1.5" stroke-dasharray="4,4" />
    
    
    <path d="M55,210 C70,140 100,110 120,103" fill="none" stroke="#2a221c" stroke-width="1" opacity="0.5" />
    <path d="M225,210 C210,140 180,110 160,103" fill="none" stroke="#2a221c" stroke-width="1" opacity="0.5" />

    
    <path d="M10,70 L25,70 L25,320 L10,320" fill="none" stroke="#7a7067" stroke-width="1.5" stroke-dasharray="6,3" />
    
  </g>

  
  <g id="railyard-tower" transform="translate(480, 110)">
    
    <polygon points="110,360 130,360 150,380 90,380" fill="#d5ccbd" stroke="#2a221c" stroke-width="2" />
    
    
    <path d="M100,120 L120,60 L140,120 L130,360 L110,360 Z" fill="url(#hatch-sparse)" stroke="#2a221c" stroke-width="2.5" />
    
    
    <g stroke="#2a221c" stroke-width="1.2" opacity="0.8">
      <line x1="103" y1="140" x2="137" y2="180" />
      <line x1="137" y1="140" x2="103" y2="180" />
      
      <line x1="105" y1="200" x2="135" y2="240" />
      <line x1="135" y1="200" x2="105" y2="240" />

      <line x1="107" y1="260" x2="133" y2="300" />
      <line x1="133" y1="260" x2="107" y2="300" />
    </g>

    
    <rect x="90" y="110" width="60" height="15" fill="#efe8db" stroke="#2a221c" stroke-width="2" />

    
    <line x1="120" y1="110" x2="120" y2="20" stroke="#2a221c" stroke-width="3" />
    <line x1="120" y1="35" x2="105" y2="45" stroke="#2a221c" stroke-width="2" />
    <line x1="120" y1="65" x2="135" y2="75" stroke="#2a221c" stroke-width="2" />
    <line x1="120" y1="90" x2="108" y2="98" stroke="#2a221c" stroke-width="2" />

    
    <path d="M-120,280 C-40,320 20,180 120,50" fill="none" stroke="#661227" stroke-width="3.5" stroke-linecap="round" />
    
    <circle cx="120" cy="50" r="5" fill="#661227" />
    <circle cx="120" cy="50" r="9" fill="none" stroke="#661227" stroke-width="1.5" stroke-dasharray="2,2" />

    
    <path d="M70,10 L80,10 L80,370 L70,370" fill="none" stroke="#7a7067" stroke-width="1.5" stroke-dasharray="6,3" />
    
  </g>

  
  <g id="supermarket" transform="translate(820, 170)">
    
    <rect x="30" y="200" width="230" height="150" fill="#e3dbcc" stroke="#2a221c" stroke-width="2.5" />
    
    
    <polygon points="15,200 275,200 260,180 30,180" fill="#2a221c" stroke="#2a221c" stroke-width="1" />
    
    
    <rect x="50" y="230" width="50" height="90" fill="url(#hatch-dense)" stroke="#2a221c" stroke-width="1.5" />
    <rect x="120" y="230" width="50" height="90" fill="url(#hatch-dense)" stroke="#2a221c" stroke-width="1.5" />
    <rect x="190" y="230" width="50" height="90" fill="url(#hatch-dense)" stroke="#2a221c" stroke-width="1.5" />

    
    <g stroke="#661227" stroke-width="1.5" fill="none">
      <circle cx="75" cy="275" r="16" />
      <line x1="75" y1="250" x2="75" y2="256" />
      <line x1="75" y1="294" x2="75" y2="300" />

      <circle cx="145" cy="275" r="16" />
      <line x1="145" y1="250" x2="145" y2="256" />
      <line x1="145" y1="294" x2="145" y2="300" />

      <circle cx="215" cy="275" r="16" />
      <line x1="215" y1="250" x2="215" y2="256" />
      <line x1="215" y1="294" x2="215" y2="300" />
    </g>

    
    <g transform="translate(100, 75)">
      
      <line x1="45" y1="-75" x2="45" y2="10" stroke="#2a221c" stroke-width="2" />
      
      <path d="M15,10 C15,0 30,-5 45,-5 C60,-5 75,0 75,10 L85,65 C85,75 70,80 45,80 C20,80 5,75 5,65 Z" fill="#efe8db" stroke="#661227" stroke-width="2.5" />
      
      <line x1="20" y1="35" x2="70" y2="35" stroke="#661227" stroke-width="1.5" />
      <circle cx="45" cy="35" r="4" fill="#661227" />
    </g>

    
    <path d="M10,150 L20,150 L20,360 L10,360" fill="none" stroke="#7a7067" stroke-width="1.5" stroke-dasharray="6,3" />
    
  </g>

  
  <g id="arc-drone" transform="translate(370, 220)" opacity="0.85">
    
    <path d="M0,15 L40,0 L80,15 L60,25 L40,20 L20,25 Z" fill="#2a221c" stroke="#661227" stroke-width="1.5" />
    <line x1="20" y1="25" x2="0" y2="45" stroke="#2a221c" stroke-width="1.5" />
    <line x1="60" y1="25" x2="80" y2="45" stroke="#2a221c" stroke-width="1.5" />
    
    <circle cx="40" cy="15" r="3" fill="#661227" />
    
    
    <path d="M-50,40 C-20,20 -10,10 0,15" fill="none" stroke="#661227" stroke-width="1" stroke-dasharray="3,3" />
  </g>

  
  <g id="arc-drone-2" transform="translate(730, 140) scale(0.6)" opacity="0.6">
    <path d="M0,15 L40,0 L80,15 L60,25 L40,20 L20,25 Z" fill="#2a221c" />
    <circle cx="40" cy="15" r="3" fill="#661227" />
  </g>

  
  <path d="M0,480 C300,460 600,500 1200,470" fill="none" stroke="#2a221c" stroke-width="2.5" />
  <path d="M0,488 C300,468 600,508 1200,478" fill="none" stroke="#7a7067" stroke-width="1" />

  
  <path d="M260,340 C360,420 440,380 580,330 C680,290 760,380 850,350" fill="none" stroke="#661227" stroke-width="2" stroke-dasharray="8,6" opacity="0.75" />

  
  <rect x="25" y="25" width="1150" height="625" fill="none" stroke="#2a221c" stroke-width="3" />
  <rect x="33" y="33" width="1134" height="609" fill="none" stroke="#2a221c" stroke-width="1" />

  
  <g stroke="#2a221c" stroke-width="2">
    
    <line x1="20" y1="20" x2="50" y2="20" />
    <line x1="20" y1="20" x2="20" y2="50" />
    
    <line x1="1180" y1="20" x2="1150" y2="20" />
    <line x1="1180" y1="20" x2="1180" y2="50" />
    
    <line x1="20" y1="655" x2="50" y2="655" />
    <line x1="20" y1="655" x2="20" y2="625" />
    
    <line x1="1180" y1="655" x2="1150" y2="655" />
    <line x1="1180" y1="655" x2="1180" y2="625" />
  </g>

  
  <rect width="1200" height="675" filter="url(#paper-texture)" opacity="0.35" pointer-events="none" />
</svg>