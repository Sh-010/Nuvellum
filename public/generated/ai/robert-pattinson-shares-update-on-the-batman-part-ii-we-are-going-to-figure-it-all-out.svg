<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  
  <defs>
    
    <linearGradient id="paperBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5efe6"/>
      <stop offset="50%" stop-color="#efe8db"/>
      <stop offset="100%" stop-color="#e6ddd0"/>
    </linearGradient>

    
    <pattern id="subtleGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#2a221c" stroke-width="0.3" opacity="0.06"/>
    </pattern>

    
    <pattern id="hatchBurgundy" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#661227" stroke-width="1.5" opacity="0.8"/>
    </pattern>
    
    <pattern id="hatchCharcoal" width="10" height="10" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#2a221c" stroke-width="1" opacity="0.4"/>
    </pattern>

    
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#2a221c" flood-opacity="0.15"/>
    </filter>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#2a221c" flood-opacity="0.2"/>
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="url(#paperBg)"/>
  <rect width="1200" height="675" fill="url(#subtleGrid)"/>

  
  <rect x="40" y="40" width="1120" height="595" fill="none" stroke="#2a221c" stroke-width="1.5" opacity="0.25"/>
  <rect x="46" y="46" width="1108" height="583" fill="none" stroke="#2a221c" stroke-width="0.75" opacity="0.15"/>
  
  
  <g stroke="#2a221c" stroke-width="1" opacity="0.4">
    <line x1="32" y1="40" x2="40" y2="40"/> <line x1="40" y1="32" x2="40" y2="40"/>
    <line x1="1160" y1="40" x2="1168" y2="40"/> <line x1="1160" y1="32" x2="1160" y2="40"/>
    <line x1="32" y1="635" x2="40" y2="635"/> <line x1="40" y1="635" x2="40" y2="643"/>
    <line x1="1160" y1="635" x2="1168" y2="635"/> <line x1="1160" y1="635" x2="1160" y2="643"/>
  </g>

  
  <g opacity="0.2" stroke="#2a221c" fill="none" stroke-width="1">
    
    <line x1="200" y1="80" x2="200" y2="595" stroke-dasharray="4 4"/>
    <line x1="1000" y1="80" x2="1000" y2="595" stroke-dasharray="4 4"/>
    <line x1="200" y1="337" x2="1000" y2="337" stroke-dasharray="4 4"/>
    
    
    <path d="M 350 595 L 350 300 C 350 200, 450 150, 600 150 C 750 150, 850 200, 850 300 L 850 595"/>
    <path d="M 420 595 L 420 320 C 420 240, 490 200, 600 200 C 710 200, 780 240, 780 320 L 780 595"/>
    
    
    <circle cx="600" cy="337" r="220" stroke-dasharray="6 6"/>
    <circle cx="600" cy="337" r="140"/>
    <circle cx="600" cy="337" r="60"/>
    <line x1="380" y1="337" x2="820" y2="337"/>
    <line x1="600" y1="117" x2="600" y2="557"/>
  </g>

  
  
  
  <g filter="url(#dropShadow)">
    
    <path d="M 480 180 
             C 520 220, 560 210, 600 240 
             C 640 210, 680 220, 720 180
             C 760 210, 790 260, 780 340
             C 770 420, 720 490, 680 520
             L 640 550
             L 560 550
             L 520 520
             C 480 490, 430 420, 420 340
             C 410 260, 440 210, 480 180 Z" 
          fill="#2a221c"/>
  </g>

  
  <g filter="url(#softShadow)">
    
    <path d="M 500 210 
             C 530 240, 570 230, 600 255 
             C 630 230, 670 240, 700 210
             C 730 240, 755 290, 750 350
             C 740 420, 700 470, 660 500
             L 630 520
             L 570 520
             L 540 500
             C 500 470, 460 420, 450 350
             C 445 290, 470 240, 500 210 Z" 
          fill="url(#hatchBurgundy)"/>
  </g>

  
  <g>
    
    <path d="M 450 350 
             C 470 380, 520 400, 600 390 
             C 680 400, 730 380, 750 350
             C 740 310, 700 280, 600 290
             C 500 280, 460 310, 450 350 Z" 
          fill="#2a221c"/>
          
    
    <path d="M 525 332 C 550 332, 570 342, 575 347 C 565 348, 545 342, 525 338 Z" fill="#efe8db"/>
    <path d="M 675 332 C 650 332, 630 342, 625 347 C 635 348, 655 342, 675 338 Z" fill="#efe8db"/>
    
    
    <polygon points="600,310 590,370 610,370" fill="#2a221c"/>
    <line x1="600" y1="310" x2="600" y2="395" stroke="#efe8db" stroke-width="1.5" opacity="0.3"/>
  </g>

  
  
  <g>
    
    <rect x="582" y="240" width="8" height="220" fill="#efe8db" opacity="0.9" filter="url(#softShadow)"/>
    <rect x="582" y="240" width="8" height="220" fill="url(#hatchCharcoal)"/>
    
    
    <rect x="610" y="240" width="8" height="220" fill="#efe8db" opacity="0.9" filter="url(#softShadow)"/>
    <rect x="610" y="240" width="8" height="220" fill="url(#hatchCharcoal)"/>

    
    <line x1="530" y1="475" x2="582" y2="475" stroke="#661227" stroke-width="1.5"/>
    <line x1="618" y1="475" x2="670" y2="475" stroke="#661227" stroke-width="1.5"/>
    <circle cx="530" cy="475" r="3" fill="#661227"/>
    <circle cx="670" cy="475" r="3" fill="#661227"/>
  </g>

  
  <path d="M 400 60 L 600 150 L 800 60 Z" fill="#2a221c" opacity="0.05"/>

  
  <g stroke="#2a221c" stroke-width="1" opacity="0.35" stroke-dasharray="2 2">
    
    <line x1="120" y1="550" x2="1080" y2="550"/>
  </g>

  
  <g fill="#661227">
    <circle cx="200" cy="550" r="4"/>
    <circle cx="1000" cy="550" r="4"/>
    <circle cx="600" cy="150" r="4"/>
  </g>
  <g fill="#2a221c">
    <circle cx="600" cy="550" r="5"/>
  </g>

  
  <rect x="40" y="40" width="1120" height="595" fill="none" stroke="#2a221c" stroke-width="8" opacity="0.03"/>
</svg>