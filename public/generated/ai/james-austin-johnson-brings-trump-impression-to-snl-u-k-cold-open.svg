      <path d="M -20,-33 Q 5,-40 28,-25" fill="none" stroke="#2a221c" stroke-width="1.5" />
      
      
      <line x1="-15" y1="-8" x2="-5" y2="-12" stroke="#2a221c" stroke-width="2" /> 
      <line x1="5" y1="-8" x2="15" y2="-12" stroke="#2a221c" stroke-width="2" />  
      <path d="M -8,15 Q 5,22 18,15" fill="none" stroke="#2a221c" stroke-width="2" stroke-linecap="round" /> 
    </g>

    
    <path d="M 170,140 Q 220,130 205,170 Q 195,190 175,180" fill="none" stroke="#2a221c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 170,140 Q 220,130 205,170 Q 195,190 175,180" fill="none" stroke="#efe8db" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <circle cx="205" cy="170" r="8" fill="#efe8db" stroke="#2a221c" stroke-width="2" />
