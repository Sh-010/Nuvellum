<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  
  <defs>
    
    <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="matrix" values="
        0.3 0 0 0 0.93
        0 0.3 0 0 0.91
        0 0 0.3 0 0.85
        0 0 0 0.08 0" result="colormatrix" />
      <feComposite in="SourceGraphic" in2="colormatrix" operator="in" />
    </filter>

    
    <pattern id="hatch-dark" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="1.2" opacity="0.7" />
    </pattern>
    <pattern id="hatch-burgundy" width="6" height="6" patternTransform="rotate(-30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#661227" stroke-width="1" opacity="0.6" />
    </pattern>
    <pattern id="dot-texture" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="0.8" fill="#6c6156" opacity="0.4" />
    </pattern>
  </defs>

  
