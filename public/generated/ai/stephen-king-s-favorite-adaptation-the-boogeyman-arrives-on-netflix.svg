<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  
  <defs>
    
    <radialGradient id="paper-vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#f7f2ea" />
      <stop offset="60%" stop-color="#f3ecdf" />
      <stop offset="100%" stop-color="#e8decbe8" />
    </radialGradient>

    
    <pattern id="engrave-hatch" width="4" height="100" patternUnits="userSpaceOnUse">
      <line x1="2" y1="0" x2="2" y2="100" stroke="#2a221c" stroke-width="0.3" opacity="0.12" />
    </pattern>

    
    <pattern id="cross-hatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="8" x2="8" y2="0" stroke="#2a221c" stroke-width="0.4" opacity="0.2" />
      <line x1="0" y1="0" x2="8" y2="8" stroke="#2a221c" stroke-width="0.4" opacity="0.15" />
    </pattern>

    
    <linearGradient id="burgundy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a162e" />
      <stop offset="100%" stop-color="#550e1f" />
    </linearGradient>

    
    <linearGradient id="closet-light" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#dfcfb5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c9b596" stop-opacity="0.1" />
    </linearGradient>

    
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#2a221c" flood-opacity="0.25" />
    </filter>
  </defs>

  
