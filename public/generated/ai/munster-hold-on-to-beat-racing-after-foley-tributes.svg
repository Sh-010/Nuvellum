<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <radialGradient id="paperGrad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#f7f2ea" />
      <stop offset="100%" stop-color="#eae1d2" />
    </radialGradient>

    
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="70%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#332219" stop-opacity="0.12" />
    </radialGradient>

    
    <pattern id="hatchBurgundy" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#661227" stroke-width="1.5" />
    </pattern>
    <pattern id="hatchCharcoal" width="10" height="10" patternTransform="rotate(-30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#2a221c" stroke-width="1" />
    </pattern>
    <pattern id="crossHatch" width="8" height="8" patternTransform="rotate(60 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#4a3b32" stroke-width="0.8" />
      <line x1="0" y1="0" x2="8" y2="0" stroke="#4a3b32" stroke-width="0.4" />
    </pattern>
    <pattern id="dotShade" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.8" fill="#661227" />
    </pattern>

    
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#2a221c" flood-opacity="0.2" />
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="url(#paperGrad)" />
