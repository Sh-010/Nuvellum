        <line x1="-12" y1="0" x2="12" y2="0" stroke="#661227" stroke-width="1"/>
        <line x1="0" y1="-12" x2="0" y2="12" stroke="#661227" stroke-width="1"/>
        <circle cx="0" cy="0" r="14" fill="none" stroke="#661227" stroke-width="0.5" stroke-dasharray="2,2"/>
