<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5efe6"/>
      <stop offset="100%" stop-color="#ece4d4"/>
    </linearGradient>

    
    <linearGradient id="burgundyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a1a2e"/>
      <stop offset="100%" stop-color="#54101e"/>
    </linearGradient>

    
    <linearGradient id="charcoalGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a221c"/>
      <stop offset="100%" stop-color="#3d322b"/>
    </linearGradient>

    
    <linearGradient id="nebulaSlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#32404f"/>
      <stop offset="100%" stop-color="#1e2630"/>
    </linearGradient>

    
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a221c" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>

    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#2a221c" fill-opacity="0.15"/>
    </pattern>
  </defs>

  
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  
  <rect x="60" y="45" width="1080" height="585" fill="none" stroke="#2a221c" stroke-width="1" stroke-opacity="0.2"/>
  <rect x="68" y="53" width="1064" height="569" fill="none" stroke="#2a221c" stroke-width="0.5" stroke-opacity="0.1"/>

  
