      <path d="M 395 300 C 395 280, 405 260, 420 250 C 430 243, 440 245, 445 265" fill="none" stroke="#661227" stroke-width="1.75"/>
    </g>

    
    <g id="eroding-stars">
      
      <g transform="translate(330, 95)">
