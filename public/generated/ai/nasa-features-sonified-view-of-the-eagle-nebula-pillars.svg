        <line x1="-6" y1="0" x2="6" y2="0" stroke="#2a221c" stroke-width="0.75"/>
        <line x1="0" y1="-6" x2="0" y2="6" stroke="#2a221c" stroke-width="0.75"/>
      </g>
    </g>

    
    <g stroke="#661227" stroke-width="0.75" stroke-opacity="0.4" fill="none">
