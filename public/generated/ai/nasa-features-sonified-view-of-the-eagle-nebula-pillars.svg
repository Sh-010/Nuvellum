  <g stroke="#2a221c" stroke-width="1.5">
    
    <path d="M 60 75 L 60 60 L 75 60" fill="none"/>
    
    <path d="M 1140 75 L 1140 60 L 1125 60" fill="none"/>
    
    <path d="M 60 600 L 60 615 L 75 615" fill="none"/>
    
    <path d="M 1140 600 L 1140 615 L 1125 615" fill="none"/>
