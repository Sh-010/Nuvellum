      <path d="M 32 10 C 50 10, 45 -5, 35 -10 C 25 -10, 20 0, 32 10 Z" fill="#4d6b45" stroke="#2a221c" stroke-width="1.5"/>
      <path d="M 38 -15 C 50 -25, 40 -40, 30 -35 C 20 -30, 25 -20, 38 -15 Z" fill="#4d6b45" stroke="#2a221c" stroke-width="1.5"/>
    </g>

    
    <g stroke="#661227" stroke-width="1.5" opacity="0.6">
      
