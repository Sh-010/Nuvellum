      <line x1="-185" y1="80" x2="-165" y2="80"/>
      <line x1="-185" y1="-110" x2="-185" y2="80" stroke-dasharray="4,4"/>
      
      
      <line x1="165" y1="-110" x2="185" y2="-110"/>
      <line x1="165" y1="80" x2="185" y2="80"/>
      <line x1="185" y1="-110" x2="185" y2="80" stroke-dasharray="4,4"/>
    </g>

  </g>

  
  <g stroke="#2a221c" stroke-width="2" fill="none">
    <path d="M 72 72 L 96 72 M 72 72 L 72 96"/>
    <path d="M 1128 72 L 1104 72 M 1128 72 L 1128 96"/>
    <path d="M 72 603 L 96 603 M 72 603 L 72 579"/>
    <path d="M 1128 603 L 1104 603 M 1128 603 L 1128 579"/>
  </g>

</svg>