      <path d="M -40 15 C -20 5, 0 15, 20 10" fill="none" stroke="#2a221c" stroke-width="1" opacity="0.4"/>
      <path d="M 60 15 C 80 5, 100 15, 120 10" fill="none" stroke="#2a221c" stroke-width="1" opacity="0.4"/>
    </g>

    
    <g transform="translate(0, -20)" filter="url(#subtle-shadow)">
      
