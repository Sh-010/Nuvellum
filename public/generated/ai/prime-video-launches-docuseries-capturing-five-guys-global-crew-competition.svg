      <line x1="-120" y1="-12" x2="-100" y2="12" stroke="#211a16" stroke-width="3" stroke-linecap="round"/>
      <line x1="-70" y1="-12" x2="-50" y2="12" stroke="#211a16" stroke-width="3" stroke-linecap="round"/>
      <line x1="-20" y1="-12" x2="0" y2="12" stroke="#211a16" stroke-width="3" stroke-linecap="round"/>
      <line x1="30" y1="-12" x2="50" y2="12" stroke="#211a16" stroke-width="3" stroke-linecap="round"/>
      <line x1="80" y1="-12" x2="100" y2="12" stroke="#211a16" stroke-width="3" stroke-linecap="round"/>
    </g>

    
    <g transform="translate(0, 80)" filter="url(#subtle-shadow)">
      <path d="M -150 0 C -150 35, -70 45, 0 45 C 70 45, 150 35, 150 0 C 150 -10, 130 -15, 0 -15 C -130 -15, -150 -10, -150 0 Z" fill="#b85d30" stroke="#2a221c" stroke-width="2.5"/>
    </g>

    
    
    <g transform="translate(-240, -40)" filter="url(#subtle-shadow)">
