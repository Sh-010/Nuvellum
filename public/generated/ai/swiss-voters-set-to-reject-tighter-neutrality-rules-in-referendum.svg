<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#162238" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    
    <linearGradient id="sky-glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>

    
    <linearGradient id="swiss-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    
    <linearGradient id="metal-slate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    
    <filter id="deep-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="url(#bg-grad)" />
  <rect width="1200" height="675" fill="url(#sky-glow)" />

  
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="168" x2="1200" y2="168" />
    <line x1="0" y1="337" x2="1200" y2="337" />
    <line x1="0" y1="506" x2="1200" y2="506" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
  </g>

  
  <g fill="#1e293b" opacity="0.6">
    <path d="M0 500 L120 380 L240 440 L380 290 L520 420 L650 310 L780 430 L920 340 L1050 450 L1200 370 L1200 675 L0 675 Z" />
  </g>
  <g fill="#0f172a" opacity="0.8">
    <path d="M0 540 L180 430 L320 500 L460 380 L610 510 L740 400 L890 520 L1040 440 L1200 530 L1200 675 L0 675 Z" />
  </g>

  
  <polygon points="600,50 400,675 800,675" fill="#38bdf8" opacity="0.04" />

  
  <g filter="url(#deep-shadow)" transform="translate(0, -10)">
    
    
    <rect x="588" y="160" width="24" height="380" fill="url(#metal-slate)" rx="4" />
    <rect x="582" y="530" width="36" height="16" fill="url(#gold-accent)" rx="2" />
    <rect x="572" y="546" width="56" height="12" fill="url(#metal-slate)" rx="2" />

    
    <circle cx="600" cy="180" r="28" fill="url(#gold-accent)" />
    <circle cx="600" cy="180" r="16" fill="#0f172a" />

    
    
    <g transform="rotate(-7, 600, 180)">
      
      <path d="M 320 172 L 880 172 L 870 192 L 330 192 Z" fill="url(#metal-slate)" />
      
      
      <path d="M 360 172 L 600 140 L 840 172 Z" fill="#64748b" opacity="0.5" />
      
      
      <g>
        <line x1="340" y1="182" x2="340" y2="330" stroke="#94a3b8" stroke-width="4" />
        <line x1="360" y1="182" x2="380" y2="330" stroke="#94a3b8" stroke-width="2" />
        <line x1="320" y1="182" x2="300" y2="330" stroke="#94a3b8" stroke-width="2" />
        
        
        <path d="M 260 330 Q 340 370 420 330 L 400 320 Q 340 350 280 320 Z" fill="url(#metal-slate)" />
        
        
        <g transform="translate(310, 260)">
          <rect x="0" y="0" width="60" height="60" fill="#334155" stroke="#64748b" stroke-width="2" rx="4" />
          <line x1="0" y1="20" x2="60" y2="20" stroke="#64748b" stroke-width="2" />
          <circle cx="30" cy="20" r="6" fill="url(#gold-accent)" />
        </g>
      </g>

      
      <g>
        <line x1="860" y1="182" x2="860" y2="380" stroke="#94a3b8" stroke-width="4" />
        <line x1="840" y1="182" x2="820" y2="380" stroke="#94a3b8" stroke-width="2" />
        <line x1="880" y1="182" x2="900" y2="380" stroke="#94a3b8" stroke-width="2" />
        
        
        <path d="M 770 380 Q 860 435 950 380 L 930 368 Q 860 410 790 368 Z" fill="url(#metal-slate)" />

        
        <g transform="translate(820, 280)" filter="url(#deep-shadow)">
          <rect x="0" y="0" width="80" height="80" rx="16" fill="url(#swiss-red)" />
          
          <rect x="32" y="18" width="16" height="44" fill="#ffffff" rx="2" />
          <rect x="18" y="32" width="44" height="16" fill="#ffffff" rx="2" />
        </g>
      </g>
    </g>

  </g>

  
  
  <rect x="0" y="665" width="1200" height="10" fill="#334155" />

  
  <g transform="translate(350, 580)">
    
    <rect x="0" y="0" width="500" height="60" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    
    
    <g transform="translate(20, 20)">
      
      <rect x="0" y="0" width="460" height="12" rx="6" fill="#1e293b" />
      
      <rect x="0" y="0" width="326" height="12" rx="6" fill="url(#swiss-red)" />
      
      <rect x="330" y="0" width="130" height="12" rx="6" fill="#64748b" opacity="0.6" />
      
      
      <line x1="326" y1="-4" x2="326" y2="16" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" />
    </g>

    
    <g transform="translate(20, 48)" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">
      
      
    </g>
  </g>

  
  <rect x="0" y="0" width="1200" height="675" fill="none" stroke="#1e293b" stroke-width="8" opacity="0.5" />
</svg>