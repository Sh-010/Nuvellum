<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="40%" stop-color="#121b38"/>
      <stop offset="100%" stop-color="#1f1a24"/>
    </linearGradient>

    
    <radialGradient id="focalGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#3a506b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a90e2" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#d9534f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0.4"/>
    </linearGradient>

    
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="30%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#b7950b"/>
    </linearGradient>

    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#focalGlow)"/>

  
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  
  
  <g opacity="0.25">
    <rect x="80" y="80" width="45" height="520" fill="url(#pillarGrad)"/>
    <rect x="145" y="80" width="45" height="520" fill="url(#pillarGrad)"/>
    <rect x="210" y="80" width="45" height="520" fill="url(#pillarGrad)"/>
    
    <polygon points="60,80 275,80 290,50 45,50" fill="#334155"/>
    <rect x="40" y="40" width="250" height="15" fill="#475569"/>
  </g>

  
  <path d="M 300,120 Q 600,250 1200,180" fill="none" stroke="#64748b" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6,6"/>
  <path d="M 300,520 Q 750,380 1200,480" fill="none" stroke="#64748b" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6,6"/>

  
  
  <g filter="url(#shadow)">
    
    <path d="M 270,350 C 450,350 500,220 750,190 C 900,170 1050,110 1150,90" 
          fill="none" stroke="url(#pathGrad)" stroke-width="4" stroke-linecap="round"/>
          
    
    <path d="M 270,350 C 450,350 550,480 800,490 C 960,500 1080,570 1150,600" 
          fill="none" stroke="url(#pathGrad)" stroke-width="3" stroke-dasharray="10,6" stroke-linecap="round" opacity="0.7"/>

    
    <path d="M 270,350 C 400,350 500,350 680,350 C 850,350 950,320 1150,300" 
          fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-opacity="0.3"/>
  </g>

  
  <g opacity="0.85">
    
    <circle cx="950" cy="153" r="6" fill="#d9534f" filter="url(#shadow)"/>
    <circle cx="950" cy="153" r="16" fill="none" stroke="#d9534f" stroke-width="1" opacity="0.5"/>
    
    
    <circle cx="920" cy="495" r="6" fill="#d9534f" filter="url(#shadow)"/>
    <circle cx="920" cy="495" r="18" fill="none" stroke="#d9534f" stroke-width="1" opacity="0.4"/>

    
    <circle cx="1040" cy="315" r="4" fill="#4a90e2" opacity="0.7"/>
  </g>

  
  
  <g transform="translate(240, 260)" filter="url(#shadow)">
    
    <path d="M 30,-20 L 30,220" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3"/>

    
    
    <circle cx="30" cy="35" r="14" fill="#cbd5e1"/>
    
    <path d="M 14,130 C 14,75 16,65 30,65 C 44,65 46,75 46,130 L 58,180 L 2,180 Z" fill="#334155"/>
    
    <path d="M 22,65 L 30,80 L 38,65 Z" fill="#1e293b"/>

    
    <path d="M -20,10 C -20,-15 10,-30 30,-30 C 50,-30 80,-15 80,10 C 80,100 30,160 30,190 C 30,160 -20,100 -20,10 Z" 
          fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,4"/>
  </g>

  
  
  <g transform="translate(620, 220)" filter="url(#shadow)">
    
    <line x1="0" y1="0" x2="0" y2="120" stroke="#94a3b8" stroke-width="3"/>
    
    <polygon points="-30,120 30,120 15,107 -15,107" fill="#64748b"/>

    
    <line x1="-90" y1="30" x2="90" y2="10" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

    
    <line x1="-90" y1="30" x2="-90" y2="80" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M -115,80 Q -90,95 -65,80 Z" fill="#475569" stroke="#94a3b8" stroke-width="1"/>
    
    <rect x="-100" y="65" width="20" height="15" rx="2" fill="#e2e8f0" opacity="0.8"/>

    
    <line x1="90" y1="10" x2="105" y2="70" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 80,70 Q 105,85 130,70 Z" fill="#d9534f" opacity="0.8" stroke="#f87171" stroke-width="1"/>
  </g>

  
  
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#050811" stop-opacity="0.65"/>
  </radialGradient>
  <rect width="1200" height="675" fill="url(#vignette)" pointer-events="none"/>

</svg>