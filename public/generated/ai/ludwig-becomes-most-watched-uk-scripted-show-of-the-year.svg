<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="50%" stop-color="#141c2c"/>
      <stop offset="100%" stop-color="#1e1828"/>
    </linearGradient>

    
    <radialGradient id="spotlight" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3d2f4a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1b2234" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0c1017" stop-opacity="0"/>
    </radialGradient>

    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d061"/>
      <stop offset="50%" stop-color="#c99e32"/>
      <stop offset="100%" stop-color="#8a6316"/>
    </linearGradient>

    <linearGradient id="goldHighlight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1b8"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#6e5010"/>
    </linearGradient>

    
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2b4c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f1726" stop-opacity="0.95"/>
    </linearGradient>

    
    <linearGradient id="barPrimary" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#50b4ff"/>
      <stop offset="100%" stop-color="#1a5298"/>
    </linearGradient>

    <linearGradient id="barGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#72c4ff"/>
      <stop offset="100%" stop-color="#216bc5"/>
    </linearGradient>

    <linearGradient id="barMuted" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b4d66"/>
      <stop offset="100%" stop-color="#1e2836"/>
    </linearGradient>

    
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="url(#bgGradient)"/>
  <rect width="1200" height="675" fill="url(#spotlight)"/>

  
  <g opacity="0.15">
    <line x1="200" y1="0" x2="200" y2="675" stroke="#ffffff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="675" stroke="#ffffff" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="675" stroke="#ffffff" stroke-width="1"/>
    <rect x="50" y="50" width="300" height="500" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="450" y="80" width="300" height="450" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="850" y="30" width="300" height="550" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>

  
  <circle cx="360" cy="340" r="220" fill="#2d2242" opacity="0.6" filter="url(#glow)"/>
  <circle cx="360" cy="340" r="160" fill="#c99e32" opacity="0.1" filter="url(#glow)"/>

  
  
  
  <path d="M 40 560 L 680 560 L 740 640 L 0 640 Z" fill="#0f121a" stroke="#252f42" stroke-width="2"/>
  <path d="M 40 560 L 680 560 L 680 575 L 40 575 Z" fill="#182030"/>

  
  <polygon points="260,0 340,0 380,180 220,180" fill="#1b2436" opacity="0.7"/>
  <polygon points="280,180 320,180 340,320 260,320" fill="url(#goldGrad)" opacity="0.9"/>
  <ellipse cx="300" cy="320" rx="40" ry="15" fill="#f5d061" opacity="0.4" filter="url(#glow)"/>

  
  <g transform="translate(320, 300) rotate(-15)" filter="url(#dropShadow)">
    
    <circle cx="0" cy="0" r="140" fill="url(#screenGrad)" stroke="url(#goldHighlight)" stroke-width="12"/>
    <circle cx="0" cy="0" r="132" fill="#08101d" opacity="0.6"/>
    
    
    <g opacity="0.25" stroke="#50b4ff" stroke-width="1.5">
      <line x1="-120" y1="0" x2="120" y2="0"/>
      <line x1="0" y1="-120" x2="0" y2="120"/>
      <circle cx="0" cy="0" r="70" fill="none"/>
      <circle cx="0" cy="0" r="110" fill="none"/>
    </g>

    
    <g transform="translate(-20, -20)">
      
      <path d="M -30,-30 L 10,-30 C 15,-40 30,-40 35,-30 L 75,-30 L 75,10 C 65,15 65,30 75,35 L 75,75 L 35,75 C 30,65 15,65 10,75 L -30,75 Z" 
            fill="#1a365d" stroke="url(#goldGrad)" stroke-width="3" opacity="0.9"/>
      <circle cx="22" cy="22" r="12" fill="#0f1726" stroke="url(#goldGrad)" stroke-width="2"/>
    </g>

    <g transform="translate(10, 10) scale(0.6)">
      
      <path d="M -20,-20 L 20,-20 L 20,20 L -20,20 Z" fill="#2d3748" stroke="#50b4ff" stroke-width="3" opacity="0.8"/>
    </g>

    
    <path d="M -90 -70 C -40 -110 40 -100 80 -60 C 40 -85 -30 -80 -90 -70 Z" fill="#ffffff" opacity="0.3"/>

    
    <path d="M -90 90 L -210 210 C -225 225 -225 250 -210 265 C -195 280 -170 280 -155 265 L -35 145 Z" fill="url(#goldGrad)" stroke="#5e440e" stroke-width="3"/>
    
    <line x1="-130" y1="170" x2="-170" y2="210" stroke="#6e5010" stroke-width="4"/>
    <line x1="-145" y1="185" x2="-185" y2="225" stroke="#6e5010" stroke-width="4"/>
    <line x1="-160" y1="200" x2="-200" y2="240" stroke="#6e5010" stroke-width="4"/>
  </g>

  
  
  <g transform="translate(140, 520)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="32" fill="url(#goldGrad)" stroke="#4a340b" stroke-width="4"/>
    <circle cx="0" cy="0" r="26" fill="#121824"/>
    <polygon points="0,-12 4,2 -4,2" fill="#50b4ff"/>
    <polygon points="0,12 3,-2 -3,-2" fill="#c99e32"/>
    
    <rect x="-6" y="-38" width="12" height="8" rx="2" fill="url(#goldGrad)"/>
    <circle cx="0" cy="-42" r="6" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <path d="M 30 10 C 60 40 90 20 120 50" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6,4"/>
  </g>

  
  <g transform="translate(520, 480)" filter="url(#dropShadow)">
    <polygon points="-80,80 120,40 160,80 -40,120" fill="#1b2436" stroke="#2c3a52" stroke-width="1.5"/>
    <polygon points="-70,50 130,10 150,40 -50,80" fill="#243044" stroke="#354661" stroke-width="1.5"/>
    <polygon points="-60,20 140,-20 140,0 -60,40" fill="#e2e8f0" opacity="0.9"/>
    
    <circle cx="70" cy="0" r="18" fill="none" stroke="#b91c1c" stroke-width="3" opacity="0.8"/>
    <line x1="58" y1="-8" x2="82" y2="8" stroke="#b91c1c" stroke-width="2" opacity="0.8"/>
  </g>


  
  
  <g transform="translate(720, 90)">
    
    <rect x="0" y="0" width="420" height="520" rx="16" fill="#111722" fill-opacity="0.85" stroke="#2a3852" stroke-width="2" filter="url(#dropShadow)"/>
    
    
    <rect x="30" y="30" width="360" height="45" rx="8" fill="#1a2333" stroke="#324563" stroke-width="1"/>
    
    <rect x="45" y="42" width="22" height="21" rx="4" fill="url(#goldGrad)"/>
    <path d="M 50 52 L 55 57 L 63 47" fill="none" stroke="#0c1017" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <rect x="80" y="47" width="160" height="10" rx="3" fill="#ffffff" opacity="0.8"/>
    <rect x="320" y="47" width="50" height="10" rx="3" fill="#50b4ff" opacity="0.8"/>

    
    <g transform="translate(45, 110)">
      
      
      
    </g>

    
    <g transform="translate(45, 200)">
      
      
      <g transform="translate(0, 0)">
        
        
        
        <rect x="0" y="0" width="330" height="28" rx="6" fill="url(#barGlow)"/>
        
        <rect x="0" y="0" width="330" height="10" rx="4" fill="#ffffff" opacity="0.2"/>
      </g>

      
      <g transform="translate(0, 75)">
        
        
        
        <rect x="0" y="0" width="310" height="24" rx="5" fill="url(#barPrimary)" opacity="0.8"/>
      </g>

      
      <g transform="translate(0, 140)">
        
        
        
        <rect x="0" y="0" width="270" height="24" rx="5" fill="url(#barMuted)"/>
      </g>

      
      <g transform="translate(0, 205)">
        
        
        
        <rect x="0" y="0" width="60" height="24" rx="5" fill="#2d3748" stroke="#f5d061" stroke-width="1.5" stroke-dasharray="3,3"/>
        
      </g>

    </g>

    
    <line x1="45" y1="460" x2="375" y2="460" stroke="#222e42" stroke-width="1"/>
    <circle cx="55" cy="485" r="4" fill="#50b4ff"/>
    

  </g>

  
  <g transform="translate(640, 210) rotate(25)" filter="url(#dropShadow)">
    <path d="M 0 0 L 30 0 C 35 -10 50 -10 55 0 L 85 0 L 85 30 C 75 35 75 50 85 55 L 85 85 L 55 85 C 50 75 35 75 30 85 L 0 85 Z" 
          fill="url(#goldGrad)" opacity="0.95" stroke="#fff1b8" stroke-width="1.5"/>
    <circle cx="42" cy="42" r="14" fill="#0c1017" opacity="0.8"/>
  </g>

  <g transform="translate(560, 360) rotate(-40) scale(0.7)" filter="url(#dropShadow)">
    <path d="M 0 0 L 30 0 C 35 -10 50 -10 55 0 L 85 0 L 85 30 C 75 35 75 50 85 55 L 85 85 L 55 85 C 50 75 35 75 30 85 L 0 85 Z" 
          fill="#1b2a4a" stroke="#50b4ff" stroke-width="2" opacity="0.8"/>
  </g>

</svg>