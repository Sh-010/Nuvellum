    <circle cx="40" cy="18" r="15" fill="#e8dacb" stroke="#2a221c" stroke-width="2" />
    <path d="M 26 12 Q 35 6 48 12" fill="none" stroke="#2a221c" stroke-width="3" stroke-linecap="round" />

    
    <path d="M 60 65 Q 110 80 145 90" fill="none" stroke="#2a221c" stroke-width="8" stroke-linecap="round" />
    <path d="M 20 70 Q 70 105 100 125" fill="none" stroke="#2a221c" stroke-width="7" stroke-linecap="round" />
  </g>

  
  <polygon points="125,160 300,535 50,535" fill="#ffffff" fill-opacity="0.18" />
  <polygon points="125,160 450,535 250,535" fill="#ffffff" fill-opacity="0.1" />

  
  
  <rect x="0" y="0" width="50" height="675" fill="#2a221c" />
  <rect x="15" y="0" width="10" height="675" fill="#3a3028" />
  
  <line x1="50" y1="0" x2="50" y2="675" stroke="#661227" stroke-width="3" />

  
  <rect x="1150" y="0" width="50" height="675" fill="#2a221c" />
  <rect x="1175" y="0" width="10" height="675" fill="#3a3028" />
  <line x1="1150" y1="0" x2="1150" y2="675" stroke="#661227" stroke-width="3" />

  
  <g stroke="#2a221c" stroke-width="0.5" stroke-opacity="0.25">
    <line x1="150" y1="530" x2="180" y2="560" />
    <line x1="170" y1="530" x2="200" y2="560" />
    <line x1="190" y1="530" x2="220" y2="560" />

    <line x1="980" y1="530" x2="1010" y2="560" />
