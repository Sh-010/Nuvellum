  <line x1="710" y1="320" x2="1010" y2="320" stroke="#2a221c" stroke-width="1.5" />
  
  <polygon points="710,140 860,140 710,320" fill="#ffffff" fill-opacity="0.25" />
  <polygon points="860,320 1010,320 1010,500" fill="#ffffff" fill-opacity="0.15" />

  
  <rect x="70" y="160" width="110" height="400" fill="#d9cebf" stroke="#2a221c" stroke-width="2" />
