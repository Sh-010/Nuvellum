  <line x1="300" y1="560" x2="250" y2="605" stroke="#2a221c" stroke-width="0.5" stroke-opacity="0.15" />
  <line x1="600" y1="560" x2="600" y2="605" stroke="#2a221c" stroke-width="0.5" stroke-opacity="0.15" />
