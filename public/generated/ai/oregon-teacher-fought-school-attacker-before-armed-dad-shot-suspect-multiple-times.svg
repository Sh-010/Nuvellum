    <line x1="20" y1="120" x2="0" y2="210" stroke="#2a221c" stroke-width="4" />
    <line x1="120" y1="180" x2="110" y2="250" stroke="#2a221c" stroke-width="4" />
    <line x1="280" y1="110" x2="310" y2="190" stroke="#2a221c" stroke-width="4" />
    
    <rect x="240" y="60" width="50" height="35" rx="3" fill="#661227" stroke="#2a221c" stroke-width="1.5" transform="rotate(-15 240 60)" />
