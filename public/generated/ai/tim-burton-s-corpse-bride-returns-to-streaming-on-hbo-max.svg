      <path d="M -35 -60 Q 0 -75 35 -60" class="ink-stroke" />
      
      
      <line x1="-8" y1="-60" x2="-8" y2="-150" class="dead-blue-stroke" />
      <line x1="8" y1="-60" x2="8" y2="-150" class="dead-blue-stroke" />
      <line x1="-8" y1="-100" x2="8" y2="-100" class="dead-blue-stroke" />
      <line x1="-8" y1="-130" x2="8" y2="-130" class="dead-blue-stroke" />

      
      <path d="M -8 -150 C -15 -180, -30 -190, -45 -185" class="dead-blue-stroke" />
      <path d="M -3 -150 C -5 -190, -15 -210, -25 -215" class="dead-blue-stroke" />
      <path d="M 3 -150 C 5 -190, 5 -215, 5 -225" class="dead-blue-stroke" />
      <path d="M 8 -150 C 15 -190, 25 -210, 35 -205" class="dead-blue-stroke" />
      <path d="M 15 -150 C 25 -170, 35 -165, 45 -155" class="dead-blue-stroke" />

      
      <circle cx="5" cy="-210" r="6" class="burgundy-stroke" fill="#f3ecdf" />
      <circle cx="5" cy="-210" r="3" class="burgundy" />

      
      <circle cx="0" cy="-60" r="4" class="ink-dark" />
      <circle cx="0" cy="-150" r="3" class="ink-dark" />
    </g>
  </g>

  
  <g class="ink-dark" opacity="0.6">
    <rect x="58" y="58" width="8" height="12" rx="2" />
    <rect x="58" y="88" width="8" height="12" rx="2" />
    <rect x="58" y="118" width="8" height="12" rx="2" />
    <rect x="58" y="148" width="8" height="12" rx="2" />
    
    <rect x="1134" y="58" width="8" height="12" rx="2" />
    <rect x="1134" y="88" width="8" height="12" rx="2" />
    <rect x="1134" y="118" width="8" height="12" rx="2" />
    <rect x="1134" y="148" width="8" height="12" rx="2" />
  </g>

  
  <g id="accents">
    
    <g transform="translate(760, 260) rotate(-15)">
      <path d="M 0 0 C -20 -20, -30 0, -10 20 C -25 30, -15 45, 0 25 C 15 45, 25 30, 10 20 C 30 0, 20 -20, 0 0 Z" class="burgundy" />
      <path d="M 0 -5 L 0 30" class="ink-dark" stroke-width="1.5" />
      <circle cx="0" cy="-6" r="2" class="ink-dark" />
      <path d="M 0 -5 Q -8 -15 -12 -12" class="ink-stroke-fine" />
      <path d="M 0 -5 Q 8 -15 12 -12" class="ink-stroke-fine" />
    </g>

    <g transform="translate(980, 360) scale(0.7) rotate(20)">
      <path d="M 0 0 C -20 -20, -30 0, -10 20 C -25 30, -15 45, 0 25 C 15 45, 25 30, 10 20 C 30 0, 20 -20, 0 0 Z" class="dead-blue" stroke="#4f5f63" stroke-width="2" />
      <path d="M 0 -5 L 0 30" class="ink-dark" stroke-width="1.5" />
    </g>

    
    <path d="M 450 560 Q 530 540 600 565 Q 670 590 750 560" class="ink-stroke-fine" opacity="0.4" />
    <path d="M 480 580 Q 560 560 620 585 Q 700 610 780 575" class="ink-stroke-fine" opacity="0.3" />

    
    <g transform="translate(220, 180)">
      <line x1="0" y1="-40" x2="0" y2="0" class="ink-stroke" />
      <polygon points="-15,0 15,0 10,25 -10,25" class="stone-grey" stroke="#2a221c" stroke-width="2" />
      <path d="M -10 25 L 0 35 L 10 25 Z" class="ink-dark" />
      <rect x="-8" y="8" width="16" height="12" fill="#f3ecdf" stroke="#2a221c" stroke-width="1" />
    </g>

    
    <g transform="translate(680, 480)">
      <path d="M 0 40 Q 5 10 0 -20" class="dead-blue-stroke" />
      <circle cx="0" cy="-25" r="8" fill="#f3ecdf" stroke="#4f5f63" stroke-width="2" />
      <circle cx="0" cy="-25" r="3" class="burgundy" />
      <path d="M -10 -15 Q -15 0 0 10" class="dead-blue-stroke" />
    </g>
  </g>

  
  <line x1="100" y1="600" x2="1100" y2="600" class="burgundy-stroke" stroke-width="1.5" />
  <circle cx="100" cy="600" r="3" class="burgundy" />
  <circle cx="1100" cy="600" r="3" class="burgundy" />

</svg>