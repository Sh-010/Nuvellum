<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <style>
      .bg { fill: #f3ecdf; }
      .ink-dark { fill: #2a221c; }
      .ink-stroke { stroke: #2a221c; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ink-stroke-fine { stroke: #2a221c; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .burgundy { fill: #661227; }
      .burgundy-stroke { stroke: #661227; stroke-width: 2; fill: none; }
      .stone-grey { fill: #d5cebe; }
      .dead-blue { fill: #9bb0b6; }
      .dead-blue-stroke { stroke: #4f5f63; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .hatch { stroke: #2a221c; stroke-width: 0.75; opacity: 0.3; }
    </style>
    
    
    <pattern id="hatch-pat" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" class="hatch" />
    </pattern>
    <pattern id="dot-pat" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2a221c" opacity="0.15" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" class="bg" />
  <rect width="1200" height="675" fill="url(#dot-pat)" />

  
  <rect x="40" y="40" width="1120" height="595" fill="none" stroke="#2a221c" stroke-width="1.5" />
  <rect x="48" y="48" width="1104" height="579" fill="none" stroke="#2a221c" stroke-width="0.5" />

  
  <path d="M 600 48 L 600 627" stroke="#2a221c" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  
  <g id="living-world">
    
    <line x1="100" y1="520" x2="550" y2="520" class="ink-stroke" />
    
    
    <g class="ink-stroke">
      <line x1="120" y1="520" x2="120" y2="350" />
      <line x1="160" y1="520" x2="160" y2="350" />
      <line x1="200" y1="520" x2="200" y2="350" />
      <path d="M 120 350 Q 140 320 160 350 Q 180 320 200 350" />
      
      <line x1="450" y1="520" x2="450" y2="350" />
      <line x1="490" y1="520" x2="490" y2="350" />
      <line x1="530" y1="520" x2="530" y2="350" />
      <path d="M 450 350 Q 470 320 490 350 Q 510 320 530 350" />
    </g>

    
    <path d="M 325 520 C 325 450, 310 400, 280 340 C 265 310, 240 280, 210 260 C 250 270, 275 250, 290 220 C 270 200, 265 170, 280 140 C 310 180, 330 220, 340 260 C 360 210, 390 180, 430 150 C 410 190, 400 220, 400 260 C 430 290, 450 320, 450 360 C 400 370, 360 410, 345 520 Z" class="ink-dark" opacity="0.85" />
    
    
    <path d="M 100 220 L 100 120 Q 325 60 550 120 L 550 220" class="ink-stroke" fill="#e8dfd0" />
    <path d="M 120 200 L 120 130 Q 325 80 530 130 L 530 200" class="ink-stroke-fine" />
  </g>

  
  <g id="dead-world">
    
    <path d="M 650 520 Q 900 540 1100 520" class="ink-stroke" />

    
    <path d="M 875 520 C 875 440, 890 390, 920 330 C 935 300, 960 270, 990 250 C 950 260, 925 240, 910 210 C 930 190, 935 160, 920 130 C 890 170, 870 210, 860 250 C 840 200, 810 170, 770 140 C 790 180, 800 210, 800 250 C 770 280, 750 310, 750 350 C 800 360, 840 400, 855 520 Z" class="dead-blue" />
    <path d="M 875 520 C 875 440, 890 390, 920 330 C 935 300, 960 270, 990 250 C 950 260, 925 240, 910 210 C 930 190, 935 160, 920 130 C 890 170, 870 210, 860 250 C 840 200, 810 170, 770 140 C 790 180, 800 210, 800 250 C 770 280, 750 310, 750 350 C 800 360, 840 400, 855 520 Z" fill="url(#hatch-pat)" />
    <path d="M 875 520 C 875 440, 890 390, 920 330 C 935 300, 960 270, 990 250 C 950 260, 925 240, 910 210 C 930 190, 935 160, 920 130 C 890 170, 870 210, 860 250 C 840 200, 810 170, 770 140 C 790 180, 800 210, 800 250 C 770 280, 750 310, 750 350 C 800 360, 840 400, 855 520 Z" class="dead-blue-stroke" />

    
    <path d="M 650 220 L 650 120 Q 875 60 1100 120 L 1100 220" class="ink-stroke" fill="#e5edea" />
    <path d="M 670 200 L 670 130 Q 875 80 1080 130 L 1080 200" class="ink-stroke-fine" />
  </g>

  
  <g id="central-motif">
    
