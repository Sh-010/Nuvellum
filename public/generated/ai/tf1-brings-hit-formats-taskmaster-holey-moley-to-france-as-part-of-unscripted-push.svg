        <rect x="10" y="-8" width="85" height="16" rx="4" class="parchment" />
        <line x1="10" y1="0" x2="95" y2="0" class="thin-line" />
        
        <rect x="-95" y="-8" width="85" height="16" rx="4" class="parchment" />
        <line x1="-10" y1="0" x2="-95" y2="0" class="thin-line" />
