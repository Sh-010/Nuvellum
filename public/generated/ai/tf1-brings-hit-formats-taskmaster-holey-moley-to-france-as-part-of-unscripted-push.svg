<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <style>
      .paper-bg { fill: #f3ecdf; }
      .charcoal-ink { fill: #2a221c; stroke: #2a221c; }
      .burgundy-accent { fill: #661227; stroke: #661227; }
      .stone-grey { fill: #d4cfc5; stroke: #2a221c; stroke-width: 2; }
      .parchment { fill: #faf6ef; stroke: #2a221c; stroke-width: 2; }
      .hatch { stroke: #2a221c; stroke-width: 1; opacity: 0.4; }
      .thin-line { stroke: #2a221c; stroke-width: 1.5; fill: none; }
      .bold-line { stroke: #2a221c; stroke-width: 3; fill: none; }
      .gold-accent { fill: #c28e38; stroke: #2a221c; stroke-width: 2; }
    </style>
    
    <pattern id="dotgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#2a221c" opacity="0.1" />
    </pattern>
  </defs>

  
  <rect width="1200" height="675" class="paper-bg" />
  <rect width="1200" height="675" fill="url(#dotgrid)" />

  
  <rect x="40" y="40" width="1120" height="595" fill="none" stroke="#2a221c" stroke-width="1" opacity="0.3" />
  <rect x="48" y="48" width="1104" height="579" fill="none" stroke="#2a221c" stroke-width="2" />

  
  
  <g opacity="0.25" stroke="#2a221c" stroke-dasharray="6,6">
