      <line x1="0" y1="-50" x2="0" y2="55" stroke="#661227" stroke-width="2" />
      
      <g stroke="#2a221c" stroke-width="1" opacity="0.5">
        <line x1="-55" y1="-20" x2="-15" y2="-15" />
        <line x1="-55" y1="-10" x2="-20" y2="-5" />
        <line x1="-55" y1="0" x2="-15" y2="5" />
        <line x1="-55" y1="10" x2="-25" y2="15" />
        
        <line x1="15" y1="-15" x2="55" y2="-20" />
        <line x1="20" y1="-5" x2="55" y2="-10" />
        <line x1="15" y1="5" x2="55" y2="0" />
        <line x1="25" y1="15" x2="55" y2="10" />
      </g>
    </g>

    
    <path d="M 0 45 C 10 70, -20 90, -10 120 C -5 135, 15 130, 20 110" 
          fill="none" stroke="#661227" stroke-width="4" stroke-linecap="round" />

    
    <path d="M -90 -30 A 95 95 0 0 1 90 -30" fill="none" stroke="#661227" stroke-width="2" stroke-dasharray="4 4" opacity="0.7" />
  </g>

  
  <g id="mississippi-foliage" fill="#2a221c">
    
    <path d="M0 0 L 180 0 C 140 30, 110 70, 90 120 C 70 80, 40 40, 0 60 Z" opacity="0.85" />
    <path d="M40 0 C 35 40, 20 70, 0 90" fill="none" stroke="#2a221c" stroke-width="3" />
    <path d="M110 0 C 95 50, 70 90, 40 130 C 80 110, 110 80, 130 50 Z" opacity="0.6" />
    
    
    <path d="M 90 120 Q 85 150, 95 180 T 90 220" fill="none" stroke="#2a221c" stroke-width="1.5" opacity="0.5" />
    <path d="M 115 85 Q 110 120, 120 150 T 115 190" fill="none" stroke="#2a221c" stroke-width="1" opacity="0.4" />
    <path d="M 65 75 Q 60 110, 70 140" fill="none" stroke="#2a221c" stroke-width="1" opacity="0.4" />

    
    <path d="M1200 0 L 1020 0 C 1060 30, 1090 70, 1110 120 C 1130 80, 1160 40, 1200 60 Z" opacity="0.85" />
    <path d="M1160 0 C 1165 40, 1180 70, 1200 90" fill="none" stroke="#2a221c" stroke-width="3" />
    <path d="M1090 0 C 1105 50, 1130 90, 1160 130 C 1120 110, 1090 80, 1070 50 Z" opacity="0.6" />

    
    <path d="M 1110 120 Q 1115 160, 1105 190 T 1112 230" fill="none" stroke="#2a221c" stroke-width="1.5" opacity="0.5" />
    <path d="M 1135 85 Q 1140 120, 1130 160" fill="none" stroke="#2a221c" stroke-width="1" opacity="0.4" />
  </g>

  
  <g id="figures" transform="translate(0, 0)">
    
    <g transform="translate(480, 435) scale(0.65)" stroke="#2a221c" stroke-width="2" fill="#2a221c">
      
      <circle cx="0" cy="-60" r="10" />
      
      <path d="M -8 -45 L 8 -45 L 12 0 L -12 0 Z" />
      
      <line x1="-6" y1="0" x2="-18" y2="55" stroke-width="4" stroke-linecap="round" />
      <line x1="6" y1="0" x2="14" y2="50" stroke-width="4" stroke-linecap="round" />
      
      <line x1="-8" y1="-35" x2="-22" y2="-10" stroke-width="3.5" stroke-linecap="round" />
      <line x1="8" y1="-35" x2="20" y2="-15" stroke-width="3.5" stroke-linecap="round" />
    </g>

    
    <g transform="translate(525, 420) scale(0.55)" stroke="#2a221c" stroke-width="2" fill="#2a221c">
      
      <circle cx="0" cy="-55" r="9" />
      
      <path d="M -7 -40 L 7 -40 L 10 0 L -10 0 Z" />
      
      <line x1="-5" y1="0" x2="12" y2="45" stroke-width="3.5" stroke-linecap="round" />
      <line x1="5" y1="0" x2="-10" y2="48" stroke-width="3.5" stroke-linecap="round" />
      
      <line x1="-7" y1="-30" x2="-18" y2="-5" stroke-width="3" stroke-linecap="round" />
      <line x1="7" y1="-30" x2="16" y2="-10" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  
  <g id="editorial-borders" stroke="#2a221c" stroke-width="1.5">
    
    <rect x="24" y="24" width="1152" height="627" fill="none" opacity="0.3" />
    
    <rect x="30" y="30" width="1140" height="615" fill="none" opacity="0.7" />
    
    
    <line x1="20" y1="30" x2="40" y2="30" stroke-width="2" />
    <line x1="30" y1="20" x2="30" y2="40" stroke-width="2" />

    <line x1="1160" y1="30" x2="1180" y2="30" stroke-width="2" />
    <line x1="1170" y1="20" x2="1170" y2="40" stroke-width="2" />

    <line x1="20" y1="645" x2="40" y2="645" stroke-width="2" />
    <line x1="30" y1="635" x2="30" y2="655" stroke-width="2" />

    <line x1="1160" y1="645" x2="1180" y2="645" stroke-width="2" />
    <line x1="1170" y1="635" x2="1170" y2="655" stroke-width="2" />
  </g>

  
  <g id="burgundy-accents" stroke="#661227" stroke-width="3">
