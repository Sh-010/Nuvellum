      <line x1="81" y1="-81" x2="98" y2="-98" />
      <line x1="115" y1="0" x2="140" y2="0" />
      <line x1="81" y1="81" x2="98" y2="98" />
      <line x1="0" y1="115" x2="0" y2="140" />
      <line x1="-81" y1="81" x2="-98" y2="98" />
      <line x1="-115" y1="0" x2="-140" y2="0" />
      <line x1="-81" y1="-81" x2="-98" y2="-98" />
    </g>

    
    <g transform="translate(0, 10)">
      
