    <rect x="-6" y="20" width="12" height="55" fill="#2a221c"/>
    
    
    <line x1="-120" y1="20" x2="120" y2="20" stroke="#2a221c" stroke-width="4"/>
    <circle cx="0" cy="20" r="8" fill="#661227" stroke="#2a221c" stroke-width="2"/>

    
    <line x1="-120" y1="20" x2="-120" y2="70" stroke="#2a221c" stroke-width="1.5"/>
