    <line x1="0" y1="65" x2="320" y2="65" stroke="#8c7a6b" stroke-width="0.75" stroke-dasharray="4,4"/>
    <line x1="0" y1="95" x2="320" y2="95" stroke="#8c7a6b" stroke-width="0.75" stroke-dasharray="4,4"/>
    <line x1="0" y1="125" x2="320" y2="125" stroke="#8c7a6b" stroke-width="0.75" stroke-dasharray="4,4"/>
    <line x1="0" y1="155" x2="320" y2="155" stroke="#8c7a6b" stroke-width="0.75" stroke-dasharray="4,4"/>
    <line x1="90" y1="36" x2="90" y2="180" stroke="#2a221c" stroke-width="1"/>
    <line x1="220" y1="36" x2="220" y2="180" stroke="#2a221c" stroke-width="1"/>

    
    
