    <path d="M 1100 80 L 1100 100 M 1100 80 L 1080 80" fill="none"/>
    
    <path d="M 100 595 L 100 575 M 100 595 L 120 595" fill="none"/>
    
    <path d="M 1100 595 L 1100 575 M 1100 595 L 1080 595" fill="none"/>
  </g>

  
  <g transform="translate(600, 337)" opacity="0.25">
    <circle cx="0" cy="0" r="240" fill="none" stroke="#2a221c" stroke-width="1"/>
    <circle cx="0" cy="0" r="235" fill="none" stroke="#2a221c" stroke-width="0.5" stroke-dasharray="4,8"/>
    <line x1="-260" y1="0" x2="260" y2="0" stroke="#2a221c" stroke-width="1"/>
    <line x1="0" y1="-260" x2="0" y2="260" stroke="#2a221c" stroke-width="1"/>
  </g>

</svg>