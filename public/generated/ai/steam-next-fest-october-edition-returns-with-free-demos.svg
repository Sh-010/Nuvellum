  <circle cx="110" cy="530" r="2.5" fill="#661227" opacity="0.4"/>
  <circle cx="1090" cy="140" r="1.5" fill="#2a221c" opacity="0.5"/>
  <circle cx="1075" cy="148" r="3" fill="#661227" opacity="0.3"/>
</svg>