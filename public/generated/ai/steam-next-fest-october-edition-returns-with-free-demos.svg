      <path d="M 32 -5 L 32 5 L 28 4 L 28 -4 Z" fill="#661227"/>
      <path d="M -22 -22 L -15 -15 L -12 -18 L -19 -25 Z" fill="#661227"/>
      <path d="M 22 22 L 15 15 L 12 18 L 19 25 Z" fill="#661227"/>
      <path d="M 22 -22 L 15 -15 L 18 -12 L 25 -19 Z" fill="#661227"/>
      <path d="M -22 22 L -15 15 L -18 12 L -25 19 Z" fill="#661227"/>
