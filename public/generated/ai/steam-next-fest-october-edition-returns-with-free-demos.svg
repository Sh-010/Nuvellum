      <circle cx="0" cy="35" r="8" fill="#f7f2ea" stroke="#661227" stroke-width="1.5"/>
      <circle cx="130" cy="35" r="8" fill="#f7f2ea" stroke="#661227" stroke-width="1.5"/>
      
      <line x1="25" y1="35" x2="105" y2="35" stroke="#2a221c" stroke-width="1.5" stroke-dasharray="4 2"/>
