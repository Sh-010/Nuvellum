<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <radialGradient id="paperGrad" cx="600" cy="337" r="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7f2ea"/>
      <stop offset="100%" stop-color="#ede3d2"/>
    </radialGradient>
    
    
    <pattern id="hatchBurgundy" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#661227" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    <pattern id="hatchCharcoal" width="6" height="6" patternTransform="rotate(-30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2a221c" stroke-width="0.9" opacity="0.25"/>
    </pattern>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#7a6f63" opacity="0.25"/>
    </pattern>

    
    <filter id="paperShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#2a221c" flood-opacity="0.12"/>
    </filter>
    <filter id="subtleShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#2a221c" flood-opacity="0.08"/>
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="url(#paperGrad)"/>

  
  <g id="editorial-frame">
    
    <rect x="36" y="36" width="1128" height="603" fill="none" stroke="#2a221c" stroke-width="1.5" opacity="0.3"/>
    
    <rect x="44" y="44" width="1112" height="587" fill="none" stroke="#661227" stroke-width="0.75" opacity="0.4"/>
    
    
    <path d="M 28 36 L 44 36 M 36 28 L 36 44" stroke="#2a221c" stroke-width="1" opacity="0.5"/>
    <path d="M 1172 36 L 1156 36 M 1164 28 L 1164 44" stroke="#2a221c" stroke-width="1" opacity="0.5"/>
    <path d="M 28 639 L 44 639 M 36 647 L 36 631" stroke="#2a221c" stroke-width="1" opacity="0.5"/>
    <path d="M 1172 639 L 1156 639 M 1164 647 L 1164 631" stroke="#2a221c" stroke-width="1" opacity="0.5"/>
  </g>

  
  <rect x="80" y="80" width="1040" height="515" fill="url(#dotGrid)" opacity="0.6"/>

  
