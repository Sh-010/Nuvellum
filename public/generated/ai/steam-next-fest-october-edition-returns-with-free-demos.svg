    <g id="central-folio" filter="url(#paperShadow)">
      
      <path d="M 300 130 L 600 160 L 600 520 L 300 490 Z" fill="#fffdfa" stroke="#2a221c" stroke-width="2"/>
      
      <path d="M 600 160 L 900 130 L 900 490 L 600 520 Z" fill="#fffaf2" stroke="#2a221c" stroke-width="2"/>
      
      <path d="M 590 159 L 600 160 L 600 520 L 590 519 Z" fill="#2a221c" opacity="0.15"/>
