<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="40%" stop-color="#16223f" />
      <stop offset="70%" stop-color="#1f2438" />
      <stop offset="100%" stop-color="#111622" />
    </linearGradient>

    
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3654" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0e1422" stop-opacity="0.95" />
    </linearGradient>

    
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f3c68f" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#6082b6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#16223f" stop-opacity="0" />
    </linearGradient>

    
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#f9e076" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>

    
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  
  <rect width="1200" height="675" fill="url(#skyGrad)" />

  
  <polygon points="300,0 900,0 1150,675 50,675" fill="url(#lightBeam)" />

  
  <g opacity="0.35">
    
    <path d="M 150,420 Q 250,340 380,380 T 600,360 T 820,390 T 1050,370 L 1100,500 L 100,500 Z" fill="#1e2942" />
    <path d="M 250,340 L 280,450 M 380,380 L 410,470 M 500,350 L 520,460 M 600,360 L 610,480 M 720,375 L 730,465 M 820,390 L 830,480" stroke="#4a5d80" stroke-width="2" opacity="0.6" />
    
    
    <rect x="50" y="440" width="40" height="60" fill="#0f172a" />
    <polygon points="60,400 90,440 30,440" fill="#0f172a" /> 
    <rect x="110" y="420" width="60" height="80" fill="#0f172a" />
    <rect x="850" y="430" width="80" height="70" fill="#0f172a" />
    <rect x="960" y="390" width="50" height="110" fill="#0f172a" />
    <polygon points="985,350 1020,390 950,390" fill="#0f172a" />
  </g>

  
  
  <g filter="url(#dropShadow)">
    <ellipse cx="600" cy="520" rx="480" ry="110" fill="url(#tableGrad)" stroke="#415a77" stroke-width="3" />
    <ellipse cx="600" cy="520" rx="440" ry="90" fill="#0b1322" />
  </g>

  
  <g>
    
    <g transform="translate(380, 480) rotate(-12)">
      <rect x="0" y="0" width="110" height="75" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" />
      <line x1="15" y1="15" x2="85" y2="15" stroke="#475569" stroke-width="4" stroke-linecap="round" />
      <line x1="15" y1="30" x2="95" y2="30" stroke="#64748b" stroke-width="2" />
      <line x1="15" y1="42" x2="70" y2="42" stroke="#64748b" stroke-width="2" />
      <line x1="15" y1="54" x2="85" y2="54" stroke="#64748b" stroke-width="2" />
    </g>

    <g transform="translate(700, 470) rotate(8)">
      <rect x="0" y="0" width="120" height="85" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <rect x="15" y="15" width="90" height="55" rx="2" fill="#f8fafc" opacity="0.9" />
      
      <path d="M 30,35 Q 50,25 70,40 T 90,50" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />
      <circle cx="50" cy="33" r="4" fill="#dc2626" />
      <circle cx="70" cy="40" r="4" fill="#16a34a" />
    </g>

    
    <rect x="596" y="475" width="8" height="35" fill="#94a3b8" />
    <path d="M 585,475 Q 600,460 615,475" fill="none" stroke="#cbd5e1" stroke-width="3" />
    <ellipse cx="600" cy="475" rx="12" ry="5" fill="#475569" />

    <g transform="translate(520, 500)">
      <rect x="0" y="0" width="22" height="30" rx="3" fill="#cbd5e1" opacity="0.3" stroke="#ffffff" stroke-width="1" />
      <path d="M 4,8 L 18,8" stroke="#ffffff" stroke-width="1" opacity="0.5" />
    </g>
  </g>

  
  
  <g transform="translate(600, 260)" filter="url(#dropShadow)">
    
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#goldAccent)" stroke-width="6" opacity="0.85" />
    <circle cx="0" cy="0" r="125" fill="none" stroke="url(#goldAccent)" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.6" />

    
    <path d="M -90,20 C -70,60 -30,80 0,85 C 30,80 70,60 90,20" fill="none" stroke="url(#goldAccent)" stroke-width="4" stroke-linecap="round" />
    
    
    <path d="M -60,42 Q -75,30 -70,15 Q -55,30 -60,42 Z" fill="#d4af37" />
    <path d="M -35,62 Q -55,55 -55,38 Q -35,48 -35,62 Z" fill="#d4af37" />
    <path d="M -10,76 Q -30,75 -35,58 Q -10,65 -10,76 Z" fill="#d4af37" />

    
    <path d="M 60,42 Q 75,30 70,15 Q 55,30 60,42 Z" fill="#d4af37" />
    <path d="M 35,62 Q 55,55 55,38 Q 35,48 35,62 Z" fill="#d4af37" />
    <path d="M 10,76 Q 30,75 35,58 Q 10,65 10,76 Z" fill="#d4af37" />

    
    <path d="M 0,-65 L 18,-20 L 10,-20 L 25,35 L 5,35 L 5,50 L -5,50 L -5,35 L -25,35 L -10,-20 L -18,-20 Z" fill="url(#skyGrad)" stroke="url(#goldAccent)" stroke-width="2.5" stroke-linejoin="round" />
    
    
    <polygon points="-8,-65 8,-65 25,-180 -25,-180" fill="url(#lightBeam)" opacity="0.7" />
  </g>

  
  <g fill="#0b101b">
    
    <path d="M 120,675 L 130,560 Q 160,520 200,530 L 220,675 Z" />
    <circle cx="170" cy="495" r="32" />
    <path d="M 145,540 Q 170,510 195,540 Z" fill="#1e293b" /> 

    
    <path d="M 280,675 L 290,580 Q 330,550 370,570 L 390,675 Z" />
    <circle cx="335" cy="515" r="28" />

    
    <path d="M 1080,675 L 1070,560 Q 1030,520 990,530 L 970,675 Z" />
    <circle cx="1030" cy="495" r="32" />
    <path d="M 1055,540 Q 1030,510 1005,540 Z" fill="#1e293b" />

    
    <path d="M 920,675 L 910,580 Q 870,550 830,570 L 810,675 Z" />
    <circle cx="865" cy="515" r="28" />
  </g>

  
  <g opacity="0.6">
    <circle cx="450" cy="515" r="4" fill="#60a5fa" filter="url(#softGlow)" />
    <circle cx="750" cy="515" r="4" fill="#60a5fa" filter="url(#softGlow)" />
    <path d="M 450,515 Q 525,490 600,510 Q 675,490 750,515" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />
  </g>

  
  <rect x="0" y="0" width="1200" height="675" fill="none" stroke="#1e293b" stroke-width="12" opacity="0.3" />
</svg>